<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>拾光驿站 · 今日详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e1e2f;
            line-height: 1.5;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .daily-summary {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #1e1e2f;
            margin-bottom: 0.5rem;
        }
        .date {
            font-size: 0.85rem;
            color: #8e8e9e;
        }
        .easter-egg {
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-top: 0.5rem;
        }
        .section {
            margin: 2rem 0;
            border-top: 1px solid #f0f2f5;
            padding-top: 1.5rem;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: -0.2px;
            color: #1e1e2f;
            margin-bottom: 1rem;
            display: inline-block;
            border-bottom: 1px solid #e0e4e8;
            padding-bottom: 0.2rem;
        }
        .daily-song-item {
            margin: 1rem 0;
        }
        .song-name {
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }
        .song-artist, .song-album {
            font-size: 0.85rem;
            color: #5b5b6e;
        }
        .song-recommendation {
            font-size: 0.9rem;
            color: #7a7a8c;
            font-style: italic;
            margin-top: 0.3rem;
        }
        .play-icon {
            text-decoration: none;
            font-size: 1rem;
            color: #1e1e2f;
            margin-left: 0.3rem;
        }
        .play-icon:hover { color: #000; }
        .sentence-content {
            font-size: 1.1rem;
            line-height: 1.5;
            margin: 1rem 0;
            color: #2c3e50;
        }
        .sentence-from {
            font-size: 0.85rem;
            color: #8e8e9e;
            text-align: right;
        }
        .meaning, .ai-review, .zaobao-summary-text, .song-recommendation, .one-content-text {
            font-size: 0.9rem;
            color: #5b5b6e;
        }
        .article-title, .novel-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 0.5rem 0;
        }
        .article-desc, .novel-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #2c3e50;
        }
        .stats {
            font-size: 0.8rem;
            color: #b0b0c0;
            text-align: right;
            margin-top: 0.5rem;
        }
        .zaobao-item, .song-item, .one-article, .one-photo, .one-qa {
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #f0f2f5;
        }
        .zaobao-title, .song-name {
            font-weight: 500;
        }
        .fun-item {
            display: flex;
            gap: 0.8rem;
            margin: 1rem 0;
            align-items: flex-start;
        }
        .fun-icon { font-size: 1.2rem; }
        .fun-text { flex: 1; font-size: 0.9rem; color: #5b5b6e; }
        .novel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .speak-btn, .immerse-btn, .refresh-btn, .audio-play-btn, .answer-btn {
            background: none;
            border: 1px solid #e0e4e8;
            border-radius: 30px;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: inherit;
            color: #7a7a8c;
            transition: all 0.2s;
        }
        .speak-btn:hover, .immerse-btn:hover, .refresh-btn:hover, .audio-play-btn:hover, .answer-btn:hover {
            background: #f5f7f9;
            border-color: #cbd0d6;
            color: #1e1e2f;
        }
        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: #b0b0c0;
            border-top: 1px solid #f0f2f5;
            padding-top: 1.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #1e1e2f;
            text-decoration: none;
            border-bottom: 1px dotted #e0e4e8;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            margin: 1rem 0;
        }
        .links a {
            color: #1e1e2f;
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px dotted transparent;
        }
        .links a:hover {
            border-bottom-color: #1e1e2f;
        }
        .loader {
            text-align: center;
            padding: 2rem;
            color: #b0b0c0;
        }
        .error-message {
            text-align: center;
            color: #e74c3c;
            margin: 2rem 0;
        }
        .puzzle-answer {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #7a7a8c;
            display: none;
        }
        .thought-module, .trivia-module, .puzzle-module, .deep-review-module {
            margin: 1.5rem 0;
        }
        .question-text, .trivia-text, .deep-review-text {
            color: #5b5b6e;
        }
        .question-review {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #7a7a8c;
            font-style: italic;
        }
        .immerse-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .immerse-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .immerse-content {
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            background: #fff;
            border-radius: 24px;
            padding: 1.5rem;
            color: #1e1e2f;
            font-family: inherit;
            line-height: 1.6;
        }
        .close-immerse {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            color: white;
            z-index: 10001;
        }
        .close-immerse:hover {
            background: rgba(0,0,0,0.7);
        }
        @media (max-width: 600px) {
            .daily-summary { font-size: 1.3rem; }
            .thought-module, .trivia-module, .puzzle-module, .deep-review-module { margin: 1rem 0; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← 返回主页</a>
    <div class="hero">
        <div class="daily-summary" id="daily-summary">✨ 今日拾光</div>
        <div class="date" id="date"></div>
        <div class="easter-egg" id="easter-egg"></div>
    </div>

    <div id="loader" class="loader">⏳ 加载中...</div>
    <div id="content" style="display:none;"></div>

    <div class="footer">
        <div class="links">
            <a href="/history.html">📜 历史回顾</a>
            <a href="/songs.html">🎵 完整歌单</a>
        </div>
        <div>© 拾光驿站 · 每日诗意</div>
    </div>
</div>

<div id="immerse-modal" class="immerse-modal">
    <button class="close-immerse" id="close-immerse">✕ 退出</button>
    <div id="immerse-content" class="immerse-content"></div>
</div>

<script>
    // ==================== 辅助函数 ====================
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
    function countWords(text) { return (text.match(/[\u4e00-\u9fa5]/g)||[]).length + (text.match(/[a-zA-Z]+/g)||[]).length; }
    function formatStats(words) { return `${words} 字 · 约 ${Math.ceil(words/250)} 分钟阅读`; }
    const staticEasterEggs = [
        "🥚 今日彩蛋：再读一遍，或许会发现隐藏的温柔。",
        "🥚 今日彩蛋：时光不语，静待花开。",
        "🥚 今日彩蛋：每一篇小说都是平行宇宙的你。",
        "🥚 今日彩蛋：未知旋律里藏着昨天的故事。",
        "🥚 今日彩蛋：散落的诗行，是某人的心事。",
        "🥚 今日彩蛋：你正在阅读的，是宇宙送给你的礼物。",
        "🥚 今日彩蛋：此刻的宁静，胜过万语千言。",
        "🥚 今日彩蛋：读一段文字，饮一杯暖茶。"
    ];
    function getStaticEasterEgg(dateStr) {
        let hash = 0, seed = dateStr || new Date().toDateString();
        for (let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash) + seed.charCodeAt(i);
        return staticEasterEggs[Math.abs(hash) % staticEasterEggs.length];
    }
    function copyToClipboard(text) { navigator.clipboard.writeText(text).then(()=>alert('已复制')).catch(()=>alert('复制失败')); }
    function captureCard(element, filename) { if(typeof html2canvas==='undefined'){alert('截图库未加载');return;} html2canvas(element,{scale:2}).then(canvas=>{let a=document.createElement('a');a.download=filename;a.href=canvas.toDataURL();a.click();}).catch(err=>alert('截图失败')); }
    let currentUtterance=null;
    function speakText(text){ if(!window.speechSynthesis){alert('不支持语音朗读');return;} if(currentUtterance)window.speechSynthesis.cancel(); let utterance=new SpeechSynthesisUtterance(text); utterance.lang='zh-CN'; currentUtterance=utterance; window.speechSynthesis.speak(utterance); }
    function openImmerse(html){ let modal=document.getElementById('immerse-modal'); if(modal){ document.getElementById('immerse-content').innerHTML=html; modal.classList.add('active'); } }
    function closeImmerse(){ document.getElementById('immerse-modal').classList.remove('active'); }
    document.getElementById('close-immerse')?.addEventListener('click', closeImmerse);
    document.getElementById('immerse-modal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('immerse-modal')) closeImmerse(); });

    // ==================== 模块渲染函数 ====================
    function renderOneModule(oneData){
        let container=document.getElementById('one-content'), card=document.getElementById('one-card'), html='';
        if(oneData.article && oneData.article.content) html+=`<div class="one-article"><h3>📝 文章</h3><div class="one-title">${escapeHtml(oneData.article.title)}</div><div class="one-author">${escapeHtml(oneData.article.author||'')}</div><div class="one-content-text">${escapeHtml(oneData.article.content).replace(/\n/g,'<br>')}</div></div>`;
        if(oneData.photo && oneData.photo.image) html+=`<div class="one-photo"><h3>📷 摄影</h3><img src="${oneData.photo.image}" alt="${escapeHtml(oneData.photo.title||'')}" style="max-width:100%; border-radius:8px;"><div class="one-title">${escapeHtml(oneData.photo.title||'')}</div><div class="one-author">${escapeHtml(oneData.photo.author||'')}</div><div class="one-desc">${escapeHtml(oneData.photo.description||'').replace(/\n/g,'<br>')}</div></div>`;
        if(oneData.question && oneData.question.question) html+=`<div class="one-qa"><h3>💬 问答</h3><div class="one-question">${escapeHtml(oneData.question.question)}</div><div class="one-answer">${escapeHtml(oneData.question.answer||'').replace(/\n/g,'<br>')}</div>${oneData.question.author?`<div class="one-author">—— ${escapeHtml(oneData.question.author)}</div>`:''}</div>`;
        if(html){ container.innerHTML=html; card.style.display='block'; }
    }

    function renderNovels(novels){
        let container=document.getElementById('novels-container'), card=document.getElementById('novel-card'), html='';
        if(!novels.length){ container.innerHTML='<p>暂无小说</p>'; card.style.display='block'; return; }
        let fallbackReviews=['这篇小说像一杯温茶，慢慢品出人生滋味。','虚构的世界里，藏着真实的情感。','每一段文字都是时光的琥珀。','读完后，心里某个角落被轻轻触动。','故事虽短，余韵悠长。','适合在夜深人静时再读一遍。','像风一样轻，却留下痕迹。'];
        novels.forEach((n, idx) => {
            let title=n.title||'无题', content=(n.content||'').replace(/\\n/g,'\n'), paragraphs=content.split(/\n\s*\n/).filter(p=>p.trim());
            let stats=formatStats(countWords(paragraphs.join('\n\n')));
            let novelId = `novel-${idx}`;
            html+=`<div class="novel-item" id="${novelId}">
                <div class="novel-header">
                    <div class="novel-title">${escapeHtml(title)}</div>
                    <div>
                        <button class="speak-btn" data-text="${escapeHtml(paragraphs.join('\n\n'))}">🔊 朗读</button>
                        <button class="immerse-btn" data-novel-id="${novelId}">🔍 沉浸</button>
                    </div>
                </div>
                <div class="novel-content">${paragraphs.map(p=>`<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('')}</div>
                <div class="novel-stats">${stats}</div>
                <div class="ai-review">${escapeHtml(n.review||fallbackReviews[Math.floor(Math.random()*fallbackReviews.length)])}</div>
            </div>`;
        });
        container.innerHTML=html;
        card.style.display='block';
        document.querySelectorAll('.speak-btn').forEach(btn => btn.addEventListener('click', () => { const text = btn.getAttribute('data-text'); if(text) speakText(text); }));
        document.querySelectorAll('.immerse-btn').forEach(btn => btn.addEventListener('click', () => {
            const novelId = btn.getAttribute('data-novel-id');
            const novelDiv = document.getElementById(novelId);
            if(novelDiv){
                const titleElem = novelDiv.querySelector('.novel-title');
                const contentElem = novelDiv.querySelector('.novel-content');
                const statsElem = novelDiv.querySelector('.novel-stats');
                const title = titleElem ? titleElem.innerText : '';
                const contentHtml = contentElem ? contentElem.innerHTML : '';
                const stats = statsElem ? statsElem.innerText : '';
                const modalHtml = `<div style="font-size:1.2rem; margin-bottom:1rem;">${escapeHtml(title)}</div><div>${contentHtml}</div><div style="margin-top:1rem; font-size:0.8rem; color:#b0b0c0;">${stats}</div>`;
                openImmerse(modalHtml);
            }
        }));
    }

    // ==================== 数据加载 ====================
    fetch('/data/daily.json?t='+Date.now())
        .then(res => {
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        })
        .then(data => {
            document.getElementById('loader').style.display = 'none';
            const contentDiv = document.getElementById('content');
            contentDiv.style.display = 'block';
            contentDiv.innerHTML = `
                <!-- 每日一歌 -->
                <div id="song-card" class="section" style="display:none;"><div class="section-title">🎵 未知旋律</div><div id="daily-song"></div><div style="margin-top:0.5rem;"><a id="songs-link" href="#" class="links" style="font-size:0.85rem;">📀 查看完整歌单 →</a></div></div>
                <!-- 散落诗行 -->
                <div id="sentence-card" class="section" style="display:none;"><div class="section-title">💭 散落诗行</div><div class="sentence-content" id="sentence-content"></div><div class="sentence-from" id="sentence-from"></div><div class="meaning" id="sentence-meaning" style="margin-top:0.5rem;"></div><div style="display:flex; gap:0.5rem; margin-top:0.5rem;"><button class="refresh-btn" id="copy-sentence-btn">📋 复制</button><button class="refresh-btn" id="share-sentence-btn">📸 截图</button></div></div>
                <!-- 墨香盲盒 -->
                <div id="article-card" class="section" style="display:none;"><div class="section-title">📖 墨香盲盒</div><div class="article-title" id="article-title"></div><div class="article-desc" id="article-desc"></div><div class="article-author" id="article-author"></div><a id="article-link" href="#" target="_blank" style="display:inline-block; margin-top:0.5rem;">🔗 阅读全文</a><div class="meaning" id="article-meaning"></div><div class="stats" id="article-stats"></div></div>
                <!-- 早报 -->
                <div id="zaobao-card" class="section" style="display:none;"><div class="section-title">📰 每日早报</div><div id="zaobao-weiyu" class="zaobao-summary-text"></div><div><button id="zaobao-play-btn" class="audio-play-btn" style="display:none;">🔊 语音播报</button><audio id="zaobao-audio-player"></audio></div><div id="zaobao-list"></div><div id="zaobao-date" class="stats"></div></div>
                <!-- 每日一笑&毒鸡汤 -->
                <div id="fun-card" class="section" style="display:none;"><div class="section-title">😄 每日一笑 · 🥀 心灵毒鸡汤</div><div id="joke-content"></div><div id="soul-content"></div></div>
                <!-- ONE -->
                <div id="one-card" class="section" style="display:none;"><div class="section-title">📖 ONE · 一个</div><div id="one-content"></div></div>
                <!-- 小说 -->
                <div id="novel-card" class="section" style="display:none;"><div class="section-title">📚 虚构抽屉</div><div id="novels-container"></div></div>
                <!-- 新增深度思考模块 -->
                <div id="question-card" class="section thought-module" style="display:none;">
    <div class="section-title">💡 每日思考题</div>
    <div class="question-text" id="question-text"></div>
    <div class="question-answer" id="question-answer" style="margin-top: 0.5rem; font-size: 0.85rem; color: #7a7a8c; font-style: italic;"></div>
</div>
                <div id="trivia-card" class="section trivia-module" style="display:none;"><div class="section-title">📚 知识卡片</div><div class="trivia-text" id="trivia-text"></div></div>
                <div id="puzzle-card" class="section puzzle-module" style="display:none;"><div class="section-title">🤔 推理题</div><div class="puzzle-question" id="puzzle-question"></div><div class="puzzle-answer" id="puzzle-answer"></div><button id="puzzle-answer-btn" class="answer-btn" style="display:none;">🔍 显示答案</button></div>
                <div id="deep-review-card" class="section deep-review-module" style="display:none;"><div class="section-title">✨ 深度评语</div><div class="deep-review-text" id="deep-review-text"></div></div>
            `;

            // 基础数据
            document.getElementById('daily-summary').innerHTML = data.summary || '✨ 今日拾光';
            document.getElementById('date').innerHTML = data.date || '';
            const easter = data.easter || getStaticEasterEgg(data.date);
            document.getElementById('easter-egg').innerHTML = easter;

            // 每日一歌
            if(data.songs && data.songs.length){
                const card = document.getElementById('song-card');
                card.style.display = 'block';
                document.getElementById('songs-link').href = `/songs.html?date=${data.date}`;
                const s = data.songs[0];
                const playLink = s.id ? `https://music.163.com/#/song?id=${s.id}` : (s.name && s.artist ? `https://music.163.com/#/search/m/?s=${encodeURIComponent(s.name+' '+s.artist)}` : null);
                document.getElementById('daily-song').innerHTML = `
                    <div class="daily-song-item">
                        <div class="song-name">${escapeHtml(s.name)}${playLink?`<a href="${playLink}" target="_blank" class="play-icon">🎧</a>`:''}</div>
                        <div class="song-artist">${escapeHtml(s.artist)}</div>
                        <div class="song-album">${escapeHtml(s.album||'')}</div>
                        <div class="song-recommendation">${escapeHtml(s.recommendation||'')}</div>
                    </div>
                `;
            }

            // 散落诗行
            if(data.sentence){
                const card = document.getElementById('sentence-card');
                card.style.display = 'block';
                document.getElementById('sentence-content').innerHTML = `「${escapeHtml(data.sentence.content)}」`;
                document.getElementById('sentence-from').innerHTML = data.sentence.from ? `—— ${escapeHtml(data.sentence.from)}` : '';
                if(data.sentence.meaning){
                    document.getElementById('sentence-meaning').innerHTML = escapeHtml(data.sentence.meaning);
                    document.getElementById('sentence-meaning').style.display = 'block';
                }
                document.getElementById('copy-sentence-btn').onclick = () => copyToClipboard(data.sentence.content);
                document.getElementById('share-sentence-btn').onclick = () => captureCard(card, `拾光驿站_${data.date}.png`);
            }

            // 墨香盲盒
            if(data.article){
                const card = document.getElementById('article-card');
                card.style.display = 'block';
                document.getElementById('article-title').innerHTML = escapeHtml(data.article.title);
                const articleText = data.article.description || data.article.content || '';
                document.getElementById('article-desc').innerHTML = escapeHtml(articleText);
                document.getElementById('article-author').innerHTML = data.article.author ? `—— ${escapeHtml(data.article.author)}` : '';
                if(data.article.url) document.getElementById('article-link').href = data.article.url;
                else document.getElementById('article-link').style.display = 'none';
                if(data.article.meaning){
                    document.getElementById('article-meaning').innerHTML = escapeHtml(data.article.meaning);
                    document.getElementById('article-meaning').style.display = 'block';
                }
                document.getElementById('article-stats').innerHTML = formatStats(countWords(articleText));
            }

            // 早报
            if(data.zaobao && data.zaobao.news && data.zaobao.news.length){
                const card = document.getElementById('zaobao-card');
                card.style.display = 'block';
                document.getElementById('zaobao-weiyu').innerHTML = data.zaobao.weiyu ? escapeHtml(data.zaobao.weiyu) : (data.zaobao.summary ? escapeHtml(data.zaobao.summary) : '');
                const audio = data.zaobao.audio, btn = document.getElementById('zaobao-play-btn'), player = document.getElementById('zaobao-audio-player');
                if(audio && btn && player){
                    player.src = audio;
                    btn.style.display = 'inline-block';
                    btn.onclick = () => {
                        if(player.paused){
                            player.play();
                            btn.textContent = '⏸️ 暂停';
                        } else {
                            player.pause();
                            btn.textContent = '🔊 语音播报';
                        }
                    };
                    player.onended = () => btn.textContent = '🔊 语音播报';
                    player.onerror = () => btn.style.display = 'none';
                }
                const listDiv = document.getElementById('zaobao-list');
                const uniqueNews = [], seen = new Set();
                for(let item of data.zaobao.news){
                    if(!seen.has(item.title)){
                        seen.add(item.title);
                        uniqueNews.push(item);
                    }
                }
                listDiv.innerHTML = '';
                uniqueNews.slice(0,15).forEach(item => {
                    listDiv.innerHTML += `<div class="zaobao-item"><div><span class="zaobao-title">${escapeHtml(item.title)}</span><span class="zaobao-source">${escapeHtml(item.source||'')}</span></div><div class="zaobao-summary-text">${escapeHtml(item.summary||'')}</div></div>`;
                });
                if(data.zaobao.date) document.getElementById('zaobao-date').innerHTML = data.zaobao.date;
            }

            // 笑话&毒鸡汤
            if(data.soul || data.joke){
                const card = document.getElementById('fun-card');
                card.style.display = 'block';
                if(data.joke) document.getElementById('joke-content').innerHTML = `<div class="fun-item"><div class="fun-icon">😂</div><div class="fun-text">${escapeHtml(data.joke)}</div></div>`;
                if(data.soul) document.getElementById('soul-content').innerHTML = `<div class="fun-item"><div class="fun-icon">🥀</div><div class="fun-text">${escapeHtml(data.soul)}</div></div>`;
            }

            // ONE
            if(data.one) renderOneModule(data.one);
            // 小说
            if(data.novels && data.novels.length) renderNovels(data.novels);

            // 新增深度思考模块
            if (data.question) {
    document.getElementById('question-card').style.display = 'block';
    document.getElementById('question-text').innerHTML = escapeHtml(data.question);
    if (data.question_answer) {
        document.getElementById('question-answer').innerHTML = `🤖 AI 答：${escapeHtml(data.question_answer)}`;
    } else {
        document.getElementById('question-answer').style.display = 'none';
    }
}
            if(data.trivia){
                document.getElementById('trivia-card').style.display = 'block';
                document.getElementById('trivia-text').innerHTML = escapeHtml(data.trivia);
            }
            if(data.deep_review){
                document.getElementById('deep-review-card').style.display = 'block';
                document.getElementById('deep-review-text').innerHTML = escapeHtml(data.deep_review);
            }
            if(data.puzzle && data.puzzle.question){
                const puzzleCard = document.getElementById('puzzle-card');
                document.getElementById('puzzle-question').innerHTML = `🤔 推理题：${escapeHtml(data.puzzle.question)}`;
                if(data.puzzle.answer){
                    document.getElementById('puzzle-answer').innerHTML = `答案：${escapeHtml(data.puzzle.answer)}`;
                    const btn = document.getElementById('puzzle-answer-btn');
                    btn.style.display = 'inline-block';
                    btn.onclick = () => {
                        const answerDiv = document.getElementById('puzzle-answer');
                        if (answerDiv.style.display === 'none' || answerDiv.style.display === '') {
                            answerDiv.style.display = 'block';
                            btn.textContent = '🙈 隐藏答案';
                        } else {
                            answerDiv.style.display = 'none';
                            btn.textContent = '🔍 显示答案';
                        }
                    };
                }
                puzzleCard.style.display = 'block';
            }
        })
        .catch(err => {
            console.error('加载失败', err);
            document.getElementById('loader').innerHTML = `<div class="error-message">❌ 加载失败: ${err.message}<br>请检查网络或稍后重试</div>`;
        });
</script>
</body>
</html>

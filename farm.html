<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🌱 开心农场 - 阶段A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f5f0eb;
            --card: #ffffff;
            --text: #3d3929;
            --accent: #c0844e;
            --green: #6b8f71;
            --red: #c0392b;
            --blue: #5b7fbc;
            --pink: #d4869c;
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 30% 20%, rgba(139,158,123,0.1) 0%, transparent 60%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .app-container { width:100%; max-width:480px; display:flex; flex-direction:column; gap:20px; }
        .header {
            background: var(--card); border-radius: var(--radius); padding:12px 16px;
            display:flex; justify-content:space-between; align-items:center;
            box-shadow:0 2px 12px rgba(0,0,0,0.06); flex-wrap:wrap; gap:8px;
        }
        .user-info { display:flex; align-items:center; gap:8px; }
        .avatar {
            width:36px; height:36px; border-radius:50%; color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:1rem; flex-shrink:0;
        }
        .avatar.male { background: var(--blue); }
        .avatar.female { background: var(--pink); }
        .avatar.none { background: #aaa; }
        .username { font-weight:600; color:var(--text); font-size:0.9rem; }
        .level { font-size:0.7rem; color:#888; }
        .gold { font-weight:700; color:var(--accent); font-size:0.9rem; }
        .btn-icon {
            padding:6px 12px; background:#f0ede6; border:none; border-radius:20px;
            cursor:pointer; font-size:0.8rem; font-family:inherit; white-space:nowrap;
        }
        .farm-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .plot-card {
            background: var(--card); border-radius: var(--radius); padding:14px 8px;
            text-align:center; min-height:120px; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:4px;
            box-shadow:0 2px 8px rgba(0,0,0,0.05); cursor:pointer; transition:all 0.2s;
            position:relative; user-select:none;
        }
        .plot-card:active { transform:scale(0.96); background:#f9f6f0; }
        .plot-card.empty { border:2px dashed #d5cec0; color:#b0a590; }
        .plot-card.planted { border:2px solid #c5d5b0; }
        .plot-card.ready { border:2px solid #f0c040; animation:pulse 1.5s infinite; }
        @keyframes pulse {
            0%,100%{ box-shadow:0 0 0 0 rgba(240,192,64,0.4); }
            50%{ box-shadow:0 0 0 12px rgba(240,192,64,0); }
        }
        .plot-emoji { font-size:2rem; }
        .plot-status { font-size:0.7rem; color:#888; line-height:1.2; }
        .progress-bar { width:100%; height:4px; background:#e9ecef; border-radius:2px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--green); border-radius:2px; transition:width 1s linear; }
        .waterable { color:#1976d2; font-weight:600; }
        .watered { color:#e67e22; font-weight:600; }
        .unlock-section { text-align:center; margin-top:4px; }
        .btn-unlock {
            padding:10px 16px; background:#fdfcf9; border:2px dashed #d4b896;
            border-radius:12px; cursor:pointer; font-family:inherit; font-size:0.85rem;
            color:var(--accent); transition:all 0.2s;
        }
        .modal-overlay {
            display:none; position:fixed; top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.5); z-index:100; justify-content:center; align-items:center;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:#fff; border-radius:var(--radius); padding:20px;
            max-width:360px; width:90%; text-align:center; max-height:80vh; overflow-y:auto;
        }
        .modal h3 { margin-bottom:12px; color:var(--text); font-size:1.1rem; }
        .crop-options, .pet-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
        .crop-btn, .pet-btn {
            padding:12px; border:2px solid #e0d8cc; border-radius:12px; background:#fdfcf9;
            cursor:pointer; font-family:inherit; transition:all 0.2s; text-align:center;
        }
        .crop-btn:hover, .pet-btn:hover { border-color:var(--accent); background:#fef9f3; }
        .btn-close {
            padding:6px 20px; background:#e8e0d5; border:none; border-radius:20px;
            cursor:pointer; font-family:inherit; margin-top:8px; font-size:0.85rem;
        }
        .auth-form {
            background:var(--card); border-radius:var(--radius); padding:24px 20px;
            box-shadow:0 4px 20px rgba(0,0,0,0.08);
        }
        .auth-tabs {
            display:flex; margin-bottom:16px; border-radius:12px; overflow:hidden;
            border:1.5px solid #e0d8cc;
        }
        .auth-tab {
            flex:1; text-align:center; padding:8px; font-weight:600; cursor:pointer;
            background:#fdfcf9; transition:all 0.2s; font-family:inherit; font-size:0.9rem; border:none;
        }
        .auth-tab.active { background:var(--accent); color:#fff; }
        .form-group { margin-bottom:12px; }
        .form-group label { display:block; font-size:0.8rem; color:#666; margin-bottom:2px; }
        .form-group input {
            width:100%; padding:10px; border:1.5px solid #e0d8cc; border-radius:10px;
            font-size:0.9rem; font-family:inherit; outline:none;
        }
        .gender-selector { display:flex; gap:6px; flex-wrap:wrap; }
        .gender-option {
            flex:1; min-width:70px; padding:8px 4px; border:1.5px solid #ddd;
            border-radius:10px; text-align:center; cursor:pointer; background:#fff;
            font-size:0.8rem;
        }
        .gender-option input { display:none; }
        .gender-option:has(input:checked) { border-color:var(--accent); background:#fef9f3; }
        .gender-label { font-size:0.85rem; color:#888; }
        .gender-option:has(input:checked) .gender-label { color:var(--accent); font-weight:700; }
        .btn-primary {
            width:100%; padding:10px; background:var(--accent); color:#fff; border:none;
            border-radius:10px; font-size:0.95rem; font-weight:600; cursor:pointer;
        }
        .msg-error { color:var(--red); font-size:0.8rem; text-align:center; margin-top:8px; }
        .toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
            background:#3d3929; color:#fff; padding:10px 20px; border-radius:20px;
            font-size:0.85rem; z-index:200; pointer-events:none; opacity:0; transition:opacity 0.3s;
        }
        .toast.show { opacity:1; }
        .list-container { max-height:60vh; overflow-y:auto; text-align:left; }
        .list-item {
            display:flex; align-items:center; gap:10px; padding:10px 12px;
            border-bottom:1px solid #f0ede6;
        }
        .list-item .rank-span {
            font-weight:700; width:24px; text-align:center; display:inline-block;
        }
        .tag-friend { font-size:0.7rem; color:#888; background:#f0ede6; padding:2px 8px; border-radius:10px; }
        .tag-self { font-size:0.7rem; color:var(--accent); }
        .btn-small {
            padding:4px 10px; border:none; border-radius:12px; cursor:pointer; font-size:0.7rem; font-family:inherit;
        }
        .btn-accept { background:#6b8f71; color:#fff; }
        .btn-reject { background:#e0d8cc; color:#333; }
        .btn-explore { background:#1976d2; color:#fff; }
        .btn-adopt { background:var(--accent); color:#fff; }
        .item-row {
            display:flex; align-items:center; gap:8px; padding:6px 0;
        }
        .explore-timer { font-size:0.75rem; color:#1976d2; }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>
    <div class="toast" id="toast"></div>
    <script>
        (function() {
            // Supabase 初始化
            const SUPABASE_URL = 'https://siwacsnuminepetpxljh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpd2Fjc251bWluZXBldHB4bGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTcyMDAsImV4cCI6MjA5NDIzMzIwMH0.U4hMYHQiQr_LDLNbIR4yePDiJSIB1GNMb08InDasR9s';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // 全局状态
            const State = {
                currentUser: null,
                profile: null,
                farmPlots: [],
                friendIds: new Set(),
                friendProfiles: [],
                visitingFriend: null,
                visitingPlots: [],
                isSubmitting: false,
                pets: [],
                items: {} // { itemType: quantity }
            };

            // 常量
            const CROPS = {
                carrot:    { name:'胡萝卜', emoji:'🥕', seed:20, growth:8,  min:50, max:80 },
                tomato:    { name:'番茄',   emoji:'🍅', seed:40, growth:10, min:70, max:100 },
                strawberry:{ name:'草莓',   emoji:'🍓', seed:60, growth:12, min:100, max:140 },
                corn:      { name:'玉米',   emoji:'🌽', seed:80, growth:15, min:130, max:180 }
            };
            const PET_TYPES = {
                cat:    { name:'橘猫', emoji:'🐱', cost:50,  time:2,   bonus:'双倍物品10%' },
                dog:    { name:'柴犬', emoji:'🐶', cost:80,  time:3,   bonus:'缩短时间10%' },
                rabbit: { name:'兔子', emoji:'🐰', cost:30,  time:1.5, bonus:'额外随机物品10%' }
            };
            const ITEM_NAMES = {
                hair:'动物毛发', seed:'神秘种子', dew:'清水露珠', firefly:'萤火虫',
                ore:'矿石碎片', relic:'古代遗物', moonstone:'月光石', clover:'四叶草',
                feather:'精灵羽毛', scale:'龙鳞碎片', snowflake:'雪花结晶', sakura:'樱花花瓣'
            };
            const ITEM_EMOJI = {
                hair:'🧶', seed:'🌰', dew:'💧', firefly:'🪲',
                ore:'💎', relic:'🏺', moonstone:'🌙', clover:'🍀',
                feather:'🪶', scale:'🔮', snowflake:'❄️', sakura:'🌸'
            };
            const UNLOCK_REQUIREMENTS = [
                { items:{ hair:2, seed:2 }, friends:0 },
                { items:{ hair:3, seed:3 }, friends:0 },
                { items:{ seed:4, ore:2 }, friends:0 },
                { items:{ ore:3, relic:2 }, friends:0 },
                { items:{ ore:4, relic:3 }, friends:3 },
                { items:{ relic:5, feather:2 }, friends:5 },
                { items:{ feather:4, scale:2 }, friends:8 },
                { items:{ feather:5, scale:5 }, friends:10 }
            ];

            function showToast(msg, isError=false) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.style.background = isError ? '#c0392b' : '#3d3929';
                t.classList.add('show');
                clearTimeout(t._timeout);
                t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
            }
            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // 数据加载
            async function loadProfile() {
                let { data, error } = await supabase.from('profiles').select('*').eq('id', State.currentUser.id).maybeSingle();
                if (error) throw error;
                if (!data) {
                    const username = State.currentUser.user_metadata?.username || '农夫';
                    const gender = State.currentUser.user_metadata?.gender || 'none';
                    await supabase.from('profiles').insert({ id:State.currentUser.id, username, gender, gold:200, unlocked_plots:4 });
                    for (let i=0; i<4; i++) await supabase.from('farm_plots').insert({ owner_id:State.currentUser.id, plot_index:i });
                    const { data:newProfile } = await supabase.from('profiles').select('*').eq('id',State.currentUser.id).single();
                    State.profile = newProfile;
                } else {
                    State.profile = data;
                }
            }
            async function loadFarmPlots() {
                const { data, error } = await supabase.from('farm_plots').select('*').eq('owner_id', State.currentUser.id).order('plot_index');
                if (error) throw error;
                State.farmPlots = data || [];
                if (State.farmPlots.length === 0) {
                    for (let i=0; i<(State.profile?.unlocked_plots||4); i++) {
                        await supabase.from('farm_plots').insert({ owner_id:State.currentUser.id, plot_index:i });
                    }
                    const { data:newPlots } = await supabase.from('farm_plots').select('*').eq('owner_id',State.currentUser.id).order('plot_index');
                    State.farmPlots = newPlots || [];
                }
            }
            async function loadFriendData() {
                const { data: accepted } = await supabase.from('friendships')
                    .select('id, from_user, to_user, status')
                    .or(`from_user.eq.${State.currentUser.id},to_user.eq.${State.currentUser.id}`)
                    .eq('status', 'accepted');
                State.friendIds.clear();
                const friendIdSet = new Set();
                (accepted||[]).forEach(f => {
                    const fid = f.from_user === State.currentUser.id ? f.to_user : f.from_user;
                    friendIdSet.add(fid);
                });
                State.friendIds = friendIdSet;
                if (friendIdSet.size > 0) {
                    const ids = Array.from(friendIdSet);
                    const { data: profiles } = await supabase.from('profiles').select('id, username, gender, gold').in('id', ids);
                    State.friendProfiles = profiles || [];
                } else {
                    State.friendProfiles = [];
                }
            }
            async function loadPets() {
                const { data, error } = await supabase.from('pets').select('*').eq('owner_id', State.currentUser.id);
                if (error) throw error;
                State.pets = data || [];
                // 检查探险是否完成
                const now = new Date();
                for (let pet of State.pets) {
                    if (pet.exploring_until && new Date(pet.exploring_until) <= now) {
                        const rewards = await completeExploration(pet.id);
                        if (rewards) {
                            const rewardText = Object.entries(rewards).map(([item, qty]) => `${ITEM_EMOJI[item]}×${qty}`).join(' ');
                            showToast(`${pet.pet_name} 探险归来！获得 ${rewardText}`);
                        }
                    }
                }
            }
            async function loadItems() {
                const { data, error } = await supabase.from('player_items').select('*').eq('user_id', State.currentUser.id);
                if (error) throw error;
                State.items = {};
                (data||[]).forEach(d => { State.items[d.item_type] = d.quantity; });
            }

            // 认证
            async function signUp(email, password, username, gender) {
                const { data, error } = await supabase.auth.signUp({ email, password, options:{ data:{ username, gender } } });
                if (error) throw error;
                return data;
            }
            async function signIn(email, password) {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                return data;
            }
            async function signOut() {
                await supabase.auth.signOut();
                Object.assign(State, {
                    currentUser:null, profile:null, farmPlots:[], friendIds:new Set(), friendProfiles:[],
                    visitingFriend:null, visitingPlots:[], pets:[], items:{}
                });
                render();
            }

            // 农场操作
            async function plantCrop(plotIndex, cropType, growthMinutes) {
                const now = new Date().toISOString();
                const { data, error } = await supabase.from('farm_plots').update({
                    crop_type:cropType, planted_at:now, growth_minutes:growthMinutes, watered_at:null, stolen_count:0
                }).eq('owner_id', State.currentUser.id).eq('plot_index', plotIndex).select().single();
                if (error) throw error;
                return data;
            }
            async function waterPlot(ownerId, plotIndex) {
                const now = new Date().toISOString();
                const { data, error } = await supabase.from('farm_plots').update({ watered_at:now })
                    .eq('owner_id', ownerId).eq('plot_index', plotIndex).select().single();
                if (error) throw error;
                return data;
            }
            async function harvestPlot(plotIndex) {
                const plot = State.farmPlots.find(p => p.plot_index === plotIndex);
                if (!plot || !plot.crop_type) return null;
                const cropInfo = CROPS[plot.crop_type];
                const reward = cropInfo ? Math.floor(Math.random()*(cropInfo.max - cropInfo.min + 1)) + cropInfo.min : 50;
                const newGold = (State.profile.gold || 0) + reward;
                await supabase.from('profiles').update({ gold:newGold }).eq('id', State.currentUser.id);
                await supabase.from('farm_plots').update({
                    crop_type:null, planted_at:null, watered_at:null, stolen_count:0
                }).eq('owner_id', State.currentUser.id).eq('plot_index', plotIndex);
                State.profile.gold = newGold;
                return reward;
            }
            async function stealCrop(ownerId, plotIndex) {
                const { data: plot, error } = await supabase.from('farm_plots').select('*').eq('owner_id', ownerId).eq('plot_index', plotIndex).single();
                if (error || !plot || !plot.crop_type) throw new Error('无作物可偷');
                if (plot.stolen_count >= 2) throw new Error('已被偷光');
                const cropInfo = CROPS[plot.crop_type];
                const baseReward = Math.floor(Math.random()*(cropInfo.max - cropInfo.min + 1)) + cropInfo.min;
                const stealReward = Math.floor(baseReward * 0.4);
                const newGold = (State.profile.gold || 0) + stealReward;
                await supabase.from('profiles').update({ gold:newGold }).eq('id', State.currentUser.id);
                const { data: owner } = await supabase.from('profiles').select('gold').eq('id', ownerId).single();
                const ownerNewGold = (owner.gold || 0) - baseReward + (baseReward - stealReward);
                await supabase.from('profiles').update({ gold:ownerNewGold }).eq('id', ownerId);
                await supabase.from('farm_plots').update({ stolen_count: plot.stolen_count + 1 }).eq('owner_id', ownerId).eq('plot_index', plotIndex);
                State.profile.gold = newGold;
                return stealReward;
            }
            function getCropStatus(plot) {
                if (!plot.crop_type || !plot.planted_at) return { status:'empty' };
                const now = new Date();
                const planted = new Date(plot.planted_at);
                let growthMs = plot.growth_minutes * 60 * 1000;
                if (plot.watered_at) growthMs = Math.floor(growthMs * 0.7);
                const matureTime = new Date(planted.getTime() + growthMs);
                if (now >= matureTime) return { status:'ready', progress:100 };
                const elapsed = now - planted;
                const progress = Math.floor((elapsed / growthMs) * 100);
                const remaining = matureTime - now;
                const remainingMin = Math.ceil(remaining / 60000);
                let waterable = true;
                if (plot.watered_at) {
                    const lastWatered = new Date(plot.watered_at);
                    waterable = (now - lastWatered) >= 30*60*1000;
                }
                return { status:'growing', progress, remainingMin, waterable };
            }

            // 宠物操作
            async function adoptPet(petType) {
                const { data, error } = await supabase.from('pets').insert({
                    owner_id: State.currentUser.id,
                    pet_type: petType,
                    pet_name: PET_TYPES[petType].name
                }).select().single();
                if (error) throw error;
                State.pets.push(data);
                return data;
            }
            async function startExplore(petId) {
                const pet = State.pets.find(p => p.id === petId);
                if (!pet) return;
                if (pet.exploring_until && new Date(pet.exploring_until) > new Date()) {
                    showToast('宠物正在探险中'); return;
                }
                const petTypeInfo = PET_TYPES[pet.pet_type];
                if ((State.profile.gold || 0) < petTypeInfo.cost) {
                    showToast('金币不足！', true); return;
                }
                // 扣金币
                await supabase.from('profiles').update({ gold: State.profile.gold - petTypeInfo.cost }).eq('id', State.currentUser.id);
                const exploreUntil = new Date(Date.now() + petTypeInfo.time * 3600000).toISOString();
                await supabase.from('pets').update({ exploring_until: exploreUntil, last_explored_at: new Date().toISOString() }).eq('id', petId);
                pet.exploring_until = exploreUntil;
                State.profile.gold -= petTypeInfo.cost;
                showToast(`${pet.pet_name} 出发探险！花费🪙${petTypeInfo.cost}`);
                // 更新界面
                render();
            }
            async function completeExploration(petId) {
                const pet = State.pets.find(p => p.id === petId);
                if (!pet || !pet.exploring_until) return null;
                // 随机奖励
                const rewards = {};
                const pool = [];
                if (pet.pet_type === 'cat') pool.push('hair','hair','hair','seed','dew','firefly','ore','feather');
                else if (pet.pet_type === 'dog') pool.push('ore','ore','relic','dew','firefly','hair','seed','scale');
                else pool.push('seed','seed','hair','dew','firefly','ore','clover','feather');
                const count = Math.floor(Math.random()*2)+1;
                for (let i=0; i<count; i++) {
                    const item = pool[Math.floor(Math.random()*pool.length)];
                    rewards[item] = (rewards[item]||0)+1;
                }
                // 更新数据库
                await supabase.from('pets').update({ exploring_until: null, exp: (pet.exp||0)+30 }).eq('id', petId);
                pet.exploring_until = null;
                pet.exp = (pet.exp||0)+30;
                for (const [item, qty] of Object.entries(rewards)) {
                    await addItem(item, qty);
                }
                return rewards;
            }
            async function addItem(itemType, qty) {
                const current = State.items[itemType] || 0;
                const newQty = Math.max(0, current + qty);
                if (newQty === 0) {
                    await supabase.from('player_items').delete().eq('user_id', State.currentUser.id).eq('item_type', itemType);
                    delete State.items[itemType];
                } else {
                    await supabase.from('player_items').upsert({ user_id:State.currentUser.id, item_type:itemType, quantity:newQty }, { onConflict:'user_id,item_type' });
                    State.items[itemType] = newQty;
                }
            }

            // 地块解锁
            async function unlockPlot() {
                const unlocked = State.profile.unlocked_plots || 4;
                if (unlocked >= 12) return;
                const req = UNLOCK_REQUIREMENTS[unlocked - 4];
                // 检查材料
                for (const [item, needed] of Object.entries(req.items)) {
                    if ((State.items[item]||0) < needed) {
                        showToast(`需要 ${ITEM_EMOJI[item]}${ITEM_NAMES[item]}×${needed}`, true);
                        return;
                    }
                }
                if (State.friendIds.size < (req.friends||0)) {
                    showToast(`需要 ${req.friends} 个好友`, true);
                    return;
                }

                    reqArea.style.display = 'none';

                    const { data: allProfiles } = await supabase.from('profiles').select('id, username, gold, gender').order('gold', { ascending: false });

                    const friendIdSet = new Set();
                    const sentSet = new Set();
                    const received = [];
                    (friendships||[]).forEach(f => {
                        if (f.status === 'accepted') {
                            const fid = f.from_user === State.currentUser.id ? f.to_user : f.from_user;
                            friendIdSet.add(fid);
                        } else if (f.status === 'pending') {
                            if (f.from_user === State.currentUser.id) sentSet.add(f.to_user);
                            else received.push(f);
                        }
                    });
                    State.friendIds = friendIdSet;

                    if (received.length > 0 && mode === 'global') {
                        reqArea.style.display = 'block';

                            showToast('浇水成功！');
                        } catch (err) { showToast('浇水失败', true); }
                        finally { State.isSubmitting = false; document.getElementById('modalWater').classList.remove('active'); }
                    };
                    document.getElementById('farmGrid').onclick = (e) => {
                        const card = e.target.closest('.plot-card');
                        if (!card || State.isSubmitting) return;
                        const plotIndex = parseInt(card.dataset.plot);
                        const plot = State.farmPlots.find(p => p.plot_index === plotIndex);
                        const status = getCropStatus(plot);
                        if (status.status === 'empty') {
                            State.selectedPlotIndex = plotIndex;
                            document.getElementById('modalPlant').classList.add('active');
                            document.querySelectorAll('#modalPlant .crop-btn').forEach(btn => {
                                btn.onclick = async () => {
                                    const cropType = btn.dataset.crop;
                                    const growthTime = parseInt(btn.dataset.time);
                                    const seedPrice = parseInt(btn.dataset.price);
                                    if ((State.profile.gold||0) < seedPrice) { showToast('金币不足！', true); return; }
                                    State.isSubmitting = true;
                                    try {
                                        await supabase.from('profiles').update({ gold: State.profile.gold - seedPrice }).eq('id', State.currentUser.id);
                                        const updatedPlot = await plantCrop(plotIndex, cropType, growthTime);
                                        const idx = State.farmPlots.findIndex(p => p.plot_index === plotIndex);
                                        if (idx !== -1) State.farmPlots[idx] = updatedPlot;
                                        State.profile.gold -= seedPrice;
                                        Farm.updateGrid();
                                        showToast(`种下了${CROPS[cropType].name}！`);
                                    } catch (err) { showToast('种植失败', true); }
                                    finally { State.isSubmitting = false; document.getElementById('modalPlant').classList.remove('active'); }
                                };
                            });
                        } else if (status.status === 'ready') {
                            State.isSubmitting = true;
                            harvestPlot(plotIndex).then(reward => {
                                const idx = State.farmPlots.findIndex(p => p.plot_index === plotIndex);
                                if (idx !== -1) { State.farmPlots[idx] = { ...State.farmPlots[idx], crop_type:null, planted_at:null, watered_at:null }; }
                                Farm.updateGrid();
                                showToast(`收获成功！🪙${reward}`);
                            }).catch(() => showToast('收获失败', true))
                            .finally(() => { State.isSubmitting = false; });
                        } else {
                            State.selectedPlotIndex = plotIndex;
                            document.getElementById('waterPlotInfo').textContent = `${CROPS[plot.crop_type]?.name||'作物'} 正在生长，要浇水加速吗？`;
                            document.getElementById('modalWater').classList.add('active');
                        }
                    };
                },
                updateGrid() {
                    const unlocked = State.profile?.unlocked_plots || 4;
                    const plotsHTML = State.farmPlots.filter(p => p.plot_index < unlocked).map(p => Farm.plotHTML(p)).join('');
                    document.getElementById('farmGrid').innerHTML = plotsHTML;
                    document.querySelector('.gold').textContent = `🪙${State.profile?.gold||0}`;
                },
                openPets() {
                    document.getElementById('modalPets').classList.add('active');
                    const container = document.getElementById('petListContainer');
                    if (State.pets.length === 0) {
                        container.innerHTML = '<p>还没有宠物，领养一只吧！</p><button class="btn-primary" id="btnAdopt">领养宠物</button>';
                        document.getElementById('btnAdopt').onclick = () => {
                            document.getElementById('modalPets').classList.remove('active');
                            Farm.openAdopt();
                        };
                        return;
                    }
                    container.innerHTML = State.pets.map(p => {
                        const exploring = p.exploring_until && new Date(p.exploring_until) > new Date();
                        const remaining = exploring ? Math.ceil((new Date(p.exploring_until) - new Date())/60000) : 0;
                        return `<div class="list-item">
                            <span style="font-size:2rem;">${PET_TYPES[p.pet_type].emoji}</span>
                            <div style="flex:1;">
                                <div>${p.pet_name} Lv.${p.level}</div>
                                <div style="font-size:0.7rem;">EXP:${p.exp} | 探险${exploring ? `中(${remaining}分)` : '空闲'}</div>
                            </div>
                            <button class="btn-small btn-explore" data-pet-id="${p.id}" ${exploring?'disabled':''}>${exploring?'探险中':'探险'}</button>
                        </div>`;
                    }).join('');
                    container.querySelectorAll('.btn-explore').forEach(btn => {
                        btn.onclick = async () => {
                            const petId = parseInt(btn.dataset.petId);
                            try {
                                await startExplore(petId);
                                document.getElementById('modalPets').classList.remove('active');
                            } catch(e) { showToast(e.message||'探险失败', true); }
                        };
                    });
                },
                openAdopt() {
                    document.getElementById('modalPets').classList.add('active');
                    const container = document.getElementById('petListContainer');
                    container.innerHTML = '<h3>选择宠物</h3><div class="pet-options">' +
                        Object.entries(PET_TYPES).map(([key, info]) => `
                            <button class="pet-btn" data-pet="${key}">
                                <div style="font-size:2rem;">${info.emoji}</div>
                                <div>${info.name}</div>
                                <div style="font-size:0.7rem;">探险费🪙${info.cost} | ${info.time}小时</div>
                            </button>`).join('') + '</div><button class="btn-close" id="cancelAdopt">取消</button>';
                    document.getElementById('cancelAdopt').onclick = () => {
                        document.getElementById('modalPets').classList.remove('active');
                    };
                    container.querySelectorAll('.pet-btn').forEach(btn => {
                        btn.onclick = async () => {
                            const petType = btn.dataset.pet;
                            try {
                                await adoptPet(petType);
                                showToast('领养成功！');
                                document.getElementById('modalPets').classList.remove('active');
                                render();
                            } catch(e) { showToast('领养失败', true); }
                        };
                    });
                },
                openBackpack() {
                    document.getElementById('modalBackpack').classList.add('active');
                    const container = document.getElementById('itemListContainer');
                    const items = Object.entries(State.items);
                    if (items.length === 0) {
                        container.innerHTML = '<p>背包空空，派宠物探险收集材料吧！</p>';
                        return;
                    }
                    container.innerHTML = items.map(([type, qty]) => `
                        <div class="item-row">
                            <span>${ITEM_EMOJI[type]}</span>
                            <span style="flex:1;">${ITEM_NAMES[type]}</span>
                            <span>×${qty}</span>
                        </div>`).join('');
                },
                openFriendsList() {
                    document.getElementById('modalFriends').classList.add('active');
                    const container = document.getElementById('friendListContainer');
                    if (State.friendProfiles.length === 0) {
                        container.innerHTML = '<p>还没有好友，去排行榜添加吧！</p>';
                        return;
                    }
                    container.innerHTML = State.friendProfiles.map(f => `
                        <div class="list-item" data-friend-id="${f.id}">
                            <div class="avatar ${f.gender||'none'}" style="width:30px;height:30px;">${(f.username||'?')[0]}</div>
                            <span style="flex:1;">${escapeHTML(f.username||'匿名')}</span>
                            <span style="color:var(--accent);">🪙${f.gold||0}</span>
                        </div>`).join('');
                    container.querySelectorAll('.list-item').forEach(item => {
                        item.onclick = async () => {
                            const friendId = item.dataset.friendId;
                            const friend = State.friendProfiles.find(p => p.id === friendId);
                            if (friend) {
                                State.visitingFriend = friend;
                                const { data: plots } = await supabase.from('farm_plots').select('*').eq('owner_id', friendId).order('plot_index');
                                State.visitingPlots = plots || [];
                                document.getElementById('modalFriends').classList.remove('active');
                                render();
                            }
                        };
                    });
                }
            };

            let growthTimer;
            function startGrowthTimer() {
                if (growthTimer) clearInterval(growthTimer);
                growthTimer = setInterval(() => {
                    if (!State.visitingFriend && document.getElementById('farmGrid')) {
                        Farm.updateGrid();
                    }
                }, 30000);
            }

            async function init() {
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    State.currentUser = data.session.user;
                    try {
                        await loadProfile();
                        await loadFarmPlots();
                        await loadFriendData();
                        await loadPets();
                        await loadItems();
                    } catch(e) { console.error(e); }
                }
                render();
            }
            init();
        })();
    </script>
</body>
</html>

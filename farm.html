            function formatTime(iso){ if(!iso)return''; const d=new Date(iso),now=new Date(),diff=now-d,mins=Math.floor(diff/60000); if(mins<1)return'刚刚'; if(mins<60)return`${mins}分钟前`; const hours=Math.floor(mins/60); if(hours<24)return`${hours}小时前`; return`${Math.floor(hours/24)}天前`; }

            async function addItem(it,qty,userId){ const uid = userId || State.currentUser.id; const{data:row,error:re}=await supabase.from('player_items').select('quantity').eq('user_id',uid).eq('item_type',it).maybeSingle(); if(re)throw re; const cur=row?row.quantity:0,nq=Math.max(0,cur+qty); if(nq===0){ await supabase.from('player_items').delete().eq('user_id',uid).eq('item_type',it); if(!userId) delete State.items[it]; }else{ await supabase.from('player_items').upsert({user_id:uid,item_type:it,quantity:nq},{onConflict:'user_id,item_type'}); if(!userId) State.items[it]=nq; } }

            function getActiveSetEffects(){ const equipped=State.equipment.filter(e=>e.equipped_to!==null); const sets={}; for(const eq of equipped){ if(!eq.set_name)continue; if(!sets[eq.set_name])sets[eq.set_name]=[]; sets[eq.set_name].push(eq.slot); } const effects=[]; for(const[setName,slots]of Object.entries(sets)){ const count=slots.length; if(count>=2&&SET_BONUSES[setName]?.[2]){ effects.push({setName,level:2,bonus:SET_BONUSES[setName][2]}); } if(count>=3&&SET_BONUSES[setName]?.[3]){ effects.push({setName,level:3,bonus:SET_BONUSES[setName][3]}); } } return effects; }

            async function plantCrop(pi,ct,gm){ const now=new Date().toISOString(); const{data,error}=await supabase.from('farm_plots').update({crop_type:ct,planted_at:now,growth_minutes:gm,watered_at:null,stolen_count:0}).eq('owner_id',State.currentUser.id).eq('plot_index',pi).select().single(); if(error)throw error; addEventLog('plant',{crop:ct}); return data; }

            async function harvestPlot(pi){ const plot=State.farmPlots.find(p=>p.plot_index===pi); if(!plot||!plot.crop_type)return null; const ci=CROPS[plot.crop_type],baseReward=ci?Math.floor(Math.random()*(ci.max-ci.min+1))+ci.min:50; let reward=baseReward; const sets=getActiveSetEffects(); for(const eff of sets){ if(eff.bonus.harvest_gold) reward=Math.floor(reward*(1+eff.bonus.harvest_gold)); } const ng=(State.profile.gold||0)+reward; await supabase.from('profiles').update({gold:ng}).eq('id',State.currentUser.id); await supabase.from('farm_plots').update({crop_type:null,planted_at:null,watered_at:null,stolen_count:0}).eq('owner_id',State.currentUser.id).eq('plot_index',pi); State.profile.gold=ng; addEventLog('harvest',{crop:plot.crop_type,gold:reward}); return reward; }
            async function stealCrop(oi,pi){ const{data:plot,error}=await supabase.from('farm_plots').select('*').eq('owner_id',oi).eq('plot_index',pi).single(); if(error||!plot||!plot.crop_type)throw new Error('无作物可偷'); if(plot.stolen_count>=2)throw new Error('已被偷光'); const ci=CROPS[plot.crop_type],br=Math.floor(Math.random()*(ci.max-ci.min+1))+ci.min,sr=Math.floor(br*0.4),ng=(State.profile.gold||0)+sr; await supabase.from('profiles').update({gold:ng}).eq('id',State.currentUser.id); const{data:owner}=await supabase.from('profiles').select('gold,username').eq('id',oi).single(); const ong=(owner.gold||0)-br+(br-sr); await supabase.from('profiles').update({gold:ong}).eq('id',oi); await supabase.from('farm_plots').update({stolen_count:plot.stolen_count+1}).eq('owner_id',oi).eq('plot_index',pi); State.profile.gold=ng; addEventLog('steal_sent',{victim:owner.username,crop:plot.crop_type,gold:sr}); return sr; }
            function getCropStatus(plot){ if(!plot.crop_type||!plot.planted_at)return{status:'empty'}; const now=new Date(),planted=new Date(plot.planted_at); let gm=plot.growth_minutes*60*1000; if(plot.watered_at)gm=Math.floor(gm*0.7); const mt=new Date(planted.getTime()+gm); if(now>=mt)return{status:'ready',progress:100}; const el=now-planted,prog=Math.floor((el/gm)*100),rem=mt-now,remMin=Math.ceil(rem/60000); let wa=true; if(plot.watered_at){ const lw=new Date(plot.watered_at); wa=(now-lw)>=30*60*1000; } return{status:'growing',progress:prog,remainingMin:remMin,waterable:wa}; }

            async function adoptPet(pt){ const base=PET_TYPES[pt].baseAttr; const{data,error}=await supabase.from('pets').insert({owner_id:State.currentUser.id,pet_type:pt,pet_name:PET_TYPES[pt].name,level:1,exp:0,hp:base.hp,atk:base.atk,def:base.def,spd:base.spd,luk:base.luk,sta:base.sta,hunger:100,happiness:100}).select().single(); if(error)throw error; State.pets.push(data); addEventLog('adopt_pet',{pet:PET_TYPES[pt].name}); return data; }
            async function startExplore(pid,routeId){ const pet=State.pets.find(p=>p.id===pid); if(!pet)return; if(pet.exploring_until){ const now=new Date(); if(new Date(pet.exploring_until)>now){showToast('宠物正在探险中');return;}else{showToast('请先查看探险收获再出发！',true);return;} } const route=EXPLORE_ROUTES.find(r=>r.id===routeId); if(!route)return; if(pet.level<route.minLevel){showToast(`需要宠物Lv.${route.minLevel}`);return;} let cost=route.cost; const sets=getActiveSetEffects(); for(const eff of sets){ if(eff.bonus.explore_time) cost=Math.floor(cost*eff.bonus.explore_time); } if((State.profile.gold||0)<cost){showToast('金币不足！',true);return;} const staFactor=Math.max(0.2,1-(pet.sta||50)/100); let actualTime=Math.max(0.1,route.time*staFactor); for(const eff of sets){ if(eff.bonus.explore_time) actualTime=Math.floor(actualTime*eff.bonus.explore_time*10)/10; } await supabase.from('profiles').update({gold:State.profile.gold-cost}).eq('id',State.currentUser.id); const eu=new Date(Date.now()+actualTime*3600000).toISOString(); await supabase.from('pets').update({exploring_until:eu,last_explored_at:new Date().toISOString()}).eq('id',pid); pet.exploring_until=eu; pet.exploring_route=routeId; State.profile.gold-=cost; addEventLog('explore_start',{pet:pet.pet_name,route:route.name}); showToast(`${pet.pet_name} 前往${route.name}探险！花费🪙${cost} 预计${Math.round(actualTime*60)}分钟`); if(document.getElementById('modalPets')?.classList.contains('active')){Farm.openPets();}else{render();} }
            async function completeExploration(pid,silent=false){ const pet=State.pets.find(p=>p.id===pid); if(!pet||!pet.exploring_until)return null; const route=EXPLORE_ROUTES.find(r=>r.id===pet.exploring_route)||EXPLORE_ROUTES[0]; const rewards={}; const sets=getActiveSetEffects(); let oreBonus=0, rareProbBonus=0; for(const eff of sets){ if(eff.bonus.ore_bonus) oreBonus+=eff.bonus.ore_bonus; if(eff.bonus.rare_prob) rareProbBonus+=eff.bonus.rare_prob; } for(const[item,qty]of Object.entries(route.materials)){ let actualQty=Math.floor(qty*(0.8+Math.random()*0.4)); if(item==='ore') actualQty+=Math.floor(actualQty*oreBonus); if(actualQty>0)rewards[item]=(rewards[item]||0)+actualQty; } const lukBonus=(pet.luk||0)*0.01; if(Math.random()<(route.rareProb+lukBonus+rareProbBonus)){ rewards[route.rareItem]=(rewards[route.rareItem]||0)+1; } let eventTriggered=false; const eventProbBonus = sets.reduce((acc,eff)=>acc+(eff.bonus.event_prob||0),0); if(Math.random()<(route.eventProb+pet.spd*0.005+eventProbBonus)){ eventTriggered=true; if(route.eventReward==='gold50'){ State.profile.gold+=50; await supabase.from('profiles').update({gold:State.profile.gold}).eq('id',State.currentUser.id); }else if(route.eventReward==='extra_materials'){ for(const[item,qty]of Object.entries(route.materials)){ rewards[item]=(rewards[item]||0)+Math.floor(qty); } }else if(route.eventReward==='bonus_exp'){ pet.exp=(pet.exp||0)+200; } } const ne=(pet.exp||0)+(route.exp||30); let nl=pet.level||1; if(ne>=nl*100){ nl++; const base=PET_TYPES[pet.pet_type].baseAttr; const lf=nl-1; pet.hp=Math.floor(base.hp*(1+0.02*lf)); pet.atk=Math.floor(base.atk*(1+0.02*lf)); pet.def=Math.floor(base.def*(1+0.015*lf)); pet.spd=Math.floor(base.spd*(1+0.01*lf)); pet.luk=Math.floor(base.luk*(1+0.01*lf)); pet.sta=Math.floor(base.sta*(1+0.02*lf)); await supabase.from('pets').update({hp:pet.hp,atk:pet.atk,def:pet.def,spd:pet.spd,luk:pet.luk,sta:pet.sta}).eq('id',pid); } await supabase.from('pets').update({exploring_until:null,exp:ne,level:nl}).eq('id',pid); pet.exploring_until=null; pet.exp=ne; pet.level=nl; for(const[item,qty]of Object.entries(rewards)){await addItem(item,qty);} addEventLog('explore_complete',{pet:pet.pet_name,route:route.name,rewards,event:eventTriggered?route.eventName:null}); const learnProb=0.1+(pet.luk||0)*0.01+((route.rareProb>0.2)?0.05:0); if(Math.random()<learnProb&&State.petSkills.filter(s=>s.pet_id===pid).length<4){ const skillNames=Object.keys(LEARNABLE_SKILLS); const skillName=skillNames[Math.floor(Math.random()*skillNames.length)]; const skillInfo=LEARNABLE_SKILLS[skillName]; const freeSlot=[0,1,2,3].find(s=>!State.petSkills.some(ps=>ps.pet_id===pid&&ps.slot===s)); if(freeSlot!==undefined){ const{data:newSkill}=await supabase.from('pet_skills').insert({pet_id:pid,skill_name:skillName,skill_type:skillInfo.type,power:skillInfo.power,cooldown:skillInfo.cooldown,level:1,slot:freeSlot}).select().single(); if(newSkill){ State.petSkills.push(newSkill); addEventLog('skill_learn',{pet:pet.pet_name,skill:skillName}); if(!silent) showToast(`🎉 ${pet.pet_name} 学会了新技能：${skillName}！`); } } } if(!silent){ const rt=Object.entries(rewards).map(([item,qty])=>`${ITEM_EMOJI[item]}×${qty}`).join(' '); showToast(`${pet.pet_name} 探险归来！获得 ${rt}${eventTriggered?' (触发：'+route.eventName+')':''}`); } return rewards; }

            async function synthesizeEquipment(recipe){ for(const[item,need]of Object.entries(recipe.materials)){if((State.items[item]||0)<need){showToast(`材料不足：${ITEM_NAMES[item]}×${need}`,true);return;}} if((State.profile.gold||0)<recipe.cost){showToast('金币不足',true);return;} for(const[item,need]of Object.entries(recipe.materials)){await addItem(item,-need);} await supabase.from('profiles').update({gold:State.profile.gold-recipe.cost}).eq('id',State.currentUser.id); State.profile.gold-=recipe.cost; let q=recipe.quality;const rand=Math.random(); if(recipe.quality==='white'&&rand>0.7){q=rand>0.95?'blue':'white';}else if(recipe.quality==='blue'&&rand>0.75){q=rand>0.96?'purple':'blue';} const ab=q==='gold'?30:q==='purple'?20:q==='blue'?15:10; const db=recipe.slot==='armor'?(q==='gold'?20:q==='purple'?15:10):0; const lb=recipe.slot==='accessory'?(q==='gold'?15:10):0; const{data,error}=await supabase.from('equipment').insert({owner_id:State.currentUser.id,name:recipe.name,slot:recipe.slot,quality:q,set_name:recipe.set_name,atk_bonus:ab,def_bonus:db,luk_bonus:lb}).select().single(); if(error)throw error; State.equipment.push(data); addEventLog('synthesis',{name:data.name,quality:q}); showToast(`合成成功！获得 ${data.name} (${QUALITY_NAMES[q]})`); }
            async function enhanceEquipment(eid){ const equip=State.equipment.find(e=>e.id===eid);if(!equip)return;if(equip.enhance_level>=5){showToast('已达最高强化等级');return;} if(equip.equipped_to){showToast('请先卸下装备再强化');return;} const cost=(equip.enhance_level+1)*200;if((State.profile.gold||0)<cost){showToast('金币不足',true);return;} const probs=[0.95,0.85,0.7,0.55,0.35];const success=Math.random()<probs[equip.enhance_level]; await supabase.from('profiles').update({gold:State.profile.gold-cost}).eq('id',State.currentUser.id); State.profile.gold-=cost; const baseAtk=Math.round(equip.atk_bonus/Math.max(1,(1+equip.enhance_level*0.1))); const baseDef=Math.round(equip.def_bonus/Math.max(1,(1+equip.enhance_level*0.1))); const baseLuk=Math.round(equip.luk_bonus/Math.max(1,(1+equip.enhance_level*0.1))); if(success){ const nl=equip.enhance_level+1; const newAtk=equip.atk_bonus+Math.round(baseAtk*0.1); const newDef=equip.def_bonus+Math.round(baseDef*0.1); const newLuk=equip.luk_bonus+Math.round(baseLuk*0.1); await supabase.from('equipment').update({enhance_level:nl,atk_bonus:newAtk,def_bonus:newDef,luk_bonus:newLuk}).eq('id',eid); equip.enhance_level=nl; equip.atk_bonus=newAtk; equip.def_bonus=newDef; equip.luk_bonus=newLuk; showToast(`强化成功！+${nl}`); }else{ const nl=Math.max(0,equip.enhance_level-1); const newAtk=equip.atk_bonus-Math.round(baseAtk*0.1); const newDef=equip.def_bonus-Math.round(baseDef*0.1); const newLuk=equip.luk_bonus-Math.round(baseLuk*0.1); await supabase.from('equipment').update({enhance_level:nl,atk_bonus:Math.max(0,newAtk),def_bonus:Math.max(0,newDef),luk_bonus:Math.max(0,newLuk)}).eq('id',eid); equip.enhance_level=nl; equip.atk_bonus=Math.max(0,newAtk); equip.def_bonus=Math.max(0,newDef); equip.luk_bonus=Math.max(0,newLuk); showToast('强化失败，降级了...',true); } addEventLog('enhance',{name:equip.name,level:equip.enhance_level,success}); }
            async function equipToPet(eid,pid){ const equip=State.equipment.find(e=>e.id===eid),pet=State.pets.find(p=>p.id===pid);if(!equip||!pet)return; const alreadyEquipped = State.equipment.find(e=>e.equipped_to===pid && e.name===equip.name && e.id!==eid); if(alreadyEquipped){showToast(`宠物已装备了 ${equip.name}，不能重复穿戴！`,true);return;} await supabase.from('equipment').update({equipped_to:null}).eq('equipped_to',pid).eq('slot',equip.slot); await supabase.from('equipment').update({equipped_to:pid}).eq('id',eid); equip.equipped_to=pid; showToast(`已装备 ${equip.name}`); }

            async function unlockPlot(){ const ul=State.profile.unlocked_plots||4;if(ul>=12)return; const plotNum=ul+1; const k=plotNum; const goldCost=k*1000; if((State.profile.gold||0)<goldCost){showToast(`解锁第${plotNum}块需要金币 ${goldCost}，目前不足`,true);return;} const requiredMaterials=BASE_MATERIALS.slice(0,k); const missing=[]; for(const item of requiredMaterials){ const have=State.items[item]||0; if(have<k) missing.push(`${ITEM_EMOJI[item]}${ITEM_NAMES[item]}×${k-have}`); } if(missing.length>0){showToast(`材料不足：${missing.join('、')}`,true);return;} await supabase.from('profiles').update({gold:State.profile.gold-goldCost}).eq('id',State.currentUser.id); State.profile.gold-=goldCost; for(const item of requiredMaterials){await addItem(item,-k);} await supabase.from('profiles').update({unlocked_plots:ul+1}).eq('id',State.currentUser.id); await supabase.from('farm_plots').insert({owner_id:State.currentUser.id,plot_index:ul}); State.profile.unlocked_plots=ul+1; await loadFarmPlots(); addEventLog('plot_unlock',{plot:ul+1}); showToast(`解锁成功！获得第${ul+1}块农田`); render(); }

            function getPetBattleStats(pet){ const equip=State.equipment.filter(e=>e.equipped_to===pet.id); let atk=pet.atk,def=pet.def,spd=pet.spd,luk=pet.luk; equip.forEach(e=>{ atk+=e.atk_bonus; def+=e.def_bonus; spd+=e.spd_bonus; luk+=e.luk_bonus; }); return{...pet,atk,def,spd,luk,maxHp:pet.hp}; }
            function calculateDamage(at,df,isSkill=false){ const ak=at.atk,de=df.def; let dmg=Math.max(1,ak-de+Math.floor(Math.random()*10)); if(isSkill)dmg=Math.floor(dmg*1.3); return dmg; }
            function aiChooseAction(pet,opponent,skillCd){ const hpRatio=pet.currentHp/pet.maxHp; if(pet.pet_type==='dog'&&hpRatio<0.3&&skillCd<=0)return'skill'; if(hpRatio<0.3)return Math.random()<0.4?'defend':'attack'; if(hpRatio<0.6)return Math.random()<0.25?'skill':(Math.random()<0.5?'attack':'defend'); return Math.random()<0.2?'skill':(Math.random()<0.1?'defend':'attack'); }
            function logBattle(msg){ const time=new Date().toLocaleTimeString('zh-CN',{hour12:false}); State.battle.log.push({time,msg}); }
            function tickBuffs(buffs){ if(!buffs)return[]; return buffs.filter(buff=>{buff.duration--; return buff.duration>0;}); }
            function applyDOTs(myBuffs,oppBuffs,battle){ (oppBuffs||[]).forEach(buff=>{if(buff.type==='burn'){ const dmg=Math.floor(battle.opponentPet.maxHp*0.05); battle.opponentCurrentHp=Math.max(0,battle.opponentCurrentHp-dmg); logBattle(`🔥 灼烧伤害造成 ${dmg} 点伤害`); }}); (myBuffs||[]).forEach(buff=>{if(buff.type==='burn'){ const dmg=Math.floor(battle.myPet.maxHp*0.05); battle.myCurrentHp=Math.max(0,battle.myCurrentHp-dmg); logBattle(`🔥 你受到灼烧伤害 ${dmg} 点`); }}); }

            async function startBattle(myPetId,friendId){ if(State.isSubmitting)return;State.isSubmitting=true;try{ const{data:friend}=await supabase.from('profiles').select('id,username').eq('id',friendId).single();if(!friend)throw new Error('好友不存在'); const{data:fp}=await supabase.from('pets').select('*').eq('owner_id',friendId);if(!fp||fp.length===0)throw new Error('好友没有宠物'); const op=fp[Math.floor(Math.random()*fp.length)]; const myPet=getPetBattleStats(State.pets.find(p=>p.id===myPetId)); const oppPet=getPetBattleStats(op); const mySkills=State.petSkills.filter(s=>s.pet_id===myPetId); const cooldowns={}; mySkills.forEach(s=>cooldowns[s.id]=0); State.battle={ type:'pvp', myPet, opponentPet:oppPet, myCurrentHp:myPet.hp, opponentCurrentHp:oppPet.hp, log:[], friendId, friendName:friend.username, skillCooldowns:cooldowns, oppSkillCd:0, turn:0, mySkills, myDefend:false, myReflect:false, oppDefend:false, myBuffs:[], oppBuffs:[] }; render(); }catch(e){showToast(e.message||'战斗初始化失败',true);}finally{State.isSubmitting=false;} }
            async function startPvEBattle(monster){ if(State.isSubmitting)return; const myPet=getPetBattleStats(State.pets[0]); if(!myPet){showToast('请先领养宠物');return;} let bossHp=monster.hp||monster.maxHp; if(monster.isBoss&&State.bossStatus){ bossHp=State.bossStatus.current_hp; if(bossHp<=0){ showToast('BOSS已被击败！'); return; } } const myLevel=myPet.level||1; const scale=Math.min(1.5,Math.max(0.5,myLevel/(monster.maxLevel||1))); const oppPet={...monster,hp:bossHp,atk:Math.floor(monster.atk*scale),def:Math.floor(monster.def*scale),spd:monster.spd,maxHp:monster.maxHp||monster.hp,pet_name:monster.name,pet_type:'monster',skill:{name:'冲撞',cd:2}}; const mySkills=State.petSkills.filter(s=>s.pet_id===State.pets[0]?.id); const cooldowns={}; mySkills.forEach(s=>cooldowns[s.id]=0); State.battle={ type:'pve', myPet, opponentPet:oppPet, myCurrentHp:myPet.hp, opponentCurrentHp:oppPet.hp, log:[], monster, skillCooldowns:cooldowns, oppSkillCd:0, turn:0, mySkills, bossDamage:0, myDefend:false, myReflect:false, oppDefend:false, myBuffs:[], oppBuffs:[] }; render(); }

            function executeBattleAction(action,skillId=null){ if(!State.battle)return; const b=State.battle; let oppParalyzed = (b.oppBuffs || []).some(bf => bf.type === 'paralyze'); let dmg=0;
                if(action==='skill'&&skillId){ const skill=b.mySkills.find(s=>s.id===skillId); if(!skill)return; const cd=b.skillCooldowns[skillId]||0; if(cd>0){showToast('技能冷却中');return;} const skillInfo=LEARNABLE_SKILLS[skill.skill_name]; if(!skillInfo)return; b.skillCooldowns[skillId]=skill.cooldown;
                    if(skillInfo.type==='attack'||skillInfo.type==='special'){ let powerMult = skillInfo.power / 100; dmg=Math.floor(calculateDamage(b.myPet,b.opponentPet) * powerMult); b.opponentCurrentHp=Math.max(0,b.opponentCurrentHp-dmg); logBattle(`你的 ${b.myPet.pet_name} 使用【${skill.skill_name}】，造成 ${dmg} 点伤害`);
                        if(skill.skill_name==='烈焰爪击'){ b.oppBuffs = b.oppBuffs || []; b.oppBuffs.push({type:'burn',duration:3}); logBattle(`🔥 对手被灼烧，每回合失去5%HP`); }
                        if(skill.skill_name==='雷电冲击' && Math.random()<0.3){ b.oppBuffs = b.oppBuffs || []; b.oppBuffs.push({type:'paralyze',duration:2}); logBattle(`⚡ 对手麻痹，无法行动`); }
                        if(skill.skill_name==='生命汲取'){ const heal=Math.floor(dmg*0.3); b.myCurrentHp=Math.min(b.myPet.hp,b.myCurrentHp+heal); logBattle(`💚 汲取生命回复了 ${heal} 点HP`); }

                    }else if(skillInfo.type==='heal'){ if(skill.skill_name==='快速愈合'){ const heal=Math.floor(b.myPet.hp*(skillInfo.power/100)); b.myCurrentHp=Math.min(b.myPet.hp,b.myCurrentHp+heal); logBattle(`你的 ${b.myPet.pet_name} 使用【快速愈合】，回复 ${heal} 点HP`); } else { b.myCurrentHp=Math.min(b.myPet.hp,b.myCurrentHp+20); logBattle(`你的 ${b.myPet.pet_name} 使用【${skill.skill_name}】`); }
                    }else if(skillInfo.type==='defense'){ if(skill.skill_name==='铁壁防御'){ b.myDefend=true; b.myIronDef=true; logBattle(`你的 ${b.myPet.pet_name} 使用【铁壁防御】，本回合减伤60%`); } else if(skill.skill_name==='荆棘护甲'){ b.myReflect=true; b.myBuffs = b.myBuffs || []; b.myBuffs.push({type:'reflect',duration:2}); logBattle(`你的 ${b.myPet.pet_name} 使用【荆棘护甲】，反弹20%伤害持续2回合`); } else { b.myDefend=true; logBattle(`你的 ${b.myPet.pet_name} 使用【${skill.skill_name}】`); }
                    }else if(skillInfo.type==='support'){ if(skill.skill_name==='战吼'){ b.myBuffs = b.myBuffs || []; b.myBuffs.push({type:'attack_up',duration:1,value:0.5}); logBattle(`⚡ 下回合攻击力+50%`); } else if(skill.skill_name==='疾风步'){ b.myBuffs = b.myBuffs || []; b.myBuffs.push({type:'speed_up',duration:3}); logBattle(`💨 速度提升50%，持续3回合`); } else { logBattle(`你的 ${b.myPet.pet_name} 使用【${skill.skill_name}】`); }
                    }
                }else if(action==='attack'){ let atkMult = 1; (b.myBuffs||[]).forEach(bf=>{ if(bf.type==='attack_up') atkMult += bf.value; }); let baseDmg = calculateDamage(b.myPet,b.opponentPet); dmg = Math.floor(baseDmg * atkMult); b.opponentCurrentHp=Math.max(0,b.opponentCurrentHp-dmg); logBattle(`你的 ${b.myPet.pet_name} 攻击，造成 ${dmg} 点伤害`);
                }else if(action==='defend'){ logBattle('你选择防御'); b.myDefend=true; }

                if(b.type==='pve'&&b.monster&&b.monster.isBoss&&dmg>0){ b.bossDamage=(b.bossDamage||0)+dmg; const newBossHp=Math.max(0,(State.bossStatus?.current_hp||b.opponentPet.maxHp)-dmg); if(State.bossStatus) State.bossStatus.current_hp=newBossHp; supabase.from('boss_status').update({current_hp:newBossHp}).eq('id',1).then(()=>{}); }
                for(const key in b.skillCooldowns){ if(b.skillCooldowns[key]>0) b.skillCooldowns[key]--; } if(b.oppSkillCd>0) b.oppSkillCd--;

                    if(oppAction==='attack'){ let odmg = calculateDamage(b.opponentPet,b.myPet); if(b.myDefend){ if(b.myIronDef) odmg = Math.floor(odmg * 0.4); else odmg = Math.floor(odmg * 0.5); } b.myCurrentHp=Math.max(0,b.myCurrentHp-odmg); logBattle(`对手 ${b.opponentPet.pet_name} 攻击，造成 ${odmg} 点伤害`); const reflectBuff = (b.myBuffs||[]).find(bf=>bf.type==='reflect'); if(reflectBuff){ const reflectDmg = Math.floor(odmg*0.2); b.opponentCurrentHp = Math.max(0, b.opponentCurrentHp - reflectDmg); logBattle(`荆棘护甲反弹 ${reflectDmg} 点伤害`); }
                    }else if(oppAction==='defend'){ logBattle(`对手 ${b.opponentPet.pet_name} 防御`); b.oppDefend=true; }else{ b.oppSkillCd=PET_TYPES[b.opponentPet.pet_type]?.skill?.cd||2; let odmg = calculateDamage(b.opponentPet,b.myPet,true); if(b.myDefend){ if(b.myIronDef) odmg = Math.floor(odmg * 0.4); else odmg = Math.floor(odmg * 0.5); } b.myCurrentHp=Math.max(0,b.myCurrentHp-odmg); logBattle(`对手 ${b.opponentPet.pet_name} 使用技能，造成 ${odmg} 点伤害`); const reflectBuff = (b.myBuffs||[]).find(bf=>bf.type==='reflect'); if(reflectBuff){ const reflectDmg = Math.floor(odmg*0.2); b.opponentCurrentHp = Math.max(0, b.opponentCurrentHp - reflectDmg); logBattle(`荆棘护甲反弹 ${reflectDmg} 点伤害`); } }
                } else if (oppParalyzed) { logBattle(`对手因麻痹无法行动`); }
                b.myDefend=false; b.myIronDef=false; b.myReflect=false; b.oppDefend=false;

                render(); }

} ⚡${stats.spd} 🍀${stats.luk} 💪${p.sta}</div></div></div>${skillsHTML}<div style="margin-top:6px;">${btn}</div></div>`; }).join(''); c.querySelectorAll('.btn-explore').forEach(btn=>{ btn.onclick=async()=>{const pid=parseInt(btn.dataset.petId);document.getElementById('modalPets').classList.remove('active');Farm.openExplore(pid);}; }); c.querySelectorAll('.btn-view').forEach(btn=>{ btn.onclick=async()=>{const pid=parseInt(btn.dataset.petId);try{await completeExploration(pid,false);await loadPets();Farm.openPets();}catch(e){showToast(e.message||'查看失败',true);}}; }); }, openAdopt(){ document.getElementById('modalPets').classList.add('active'); const c=document.getElementById('petListContainer'); c.innerHTML='<h3>选择宠物</h3><div class="pet-options">'+Object.entries(PET_TYPES).map(([key,info])=>`<button class="pet-btn" data-pet="${key}"><div style="font-size:2rem;">${info.emoji}</div><div>${info.name}</div><div style="font-size:0.7rem;">探险费🪙${info.cost} | ${info.time}小时</div></button>`).join('')+'</div><button class="btn-close" id="cancelAdopt">取消</button>'; document.getElementById('cancelAdopt').onclick=()=>{document.getElementById('modalPets').classList.remove('active');}; c.querySelectorAll('.pet-btn').forEach(btn=>{btn.onclick=async()=>{const pt=btn.dataset.pet;try{await adoptPet(pt);showToast('领养成功！');document.getElementById('modalPets').classList.remove('active');render();}catch(e){showToast('领养失败',true);}};}); }, openExplore(petId=null){ const modal=document.getElementById('modalExplore'); if(!modal)return; modal.classList.add('active'); const c=document.getElementById('exploreListContainer'); const pet=petId?State.pets.find(p=>p.id===petId):State.pets[0]; if(!pet){c.innerHTML='<p>请先领养宠物</p>';return;} const staFactor=Math.max(0.2,1-(pet.sta||50)/100); c.innerHTML=`<div style="margin-bottom:12px;">当前宠物：🐾 #${pet.id} ${pet.pet_name} Lv.${pet.level} 🍀幸运${pet.luk} 💪体力${pet.sta}</div>`+EXPLORE_ROUTES.map(r=>{ const locked=pet.level<r.minLevel; const actualTime=Math.max(0.1,r.time*staFactor); return`<div class="route-card ${locked?'locked':''}" data-route-id="${r.id}" ${locked?'':'style="cursor:pointer"'}> <strong>${r.emoji} ${r.name}</strong> ⏱${Math.round(actualTime*60)}分钟 🪙${r.cost} <div style="font-size:0.75rem;">材料：${Object.entries(r.materials).map(([item,qty])=>`${ITEM_EMOJI[item]}×${qty}`).join(' ')}</div> <div style="font-size:0.7rem;color:#888;">稀有：${ITEM_EMOJI[r.rareItem]} ${ITEM_NAMES[r.rareItem]} (${Math.round((r.rareProb+pet.luk*0.01)*100)}%) | 事件：${r.eventName}</div> ${locked?`<div style="color:var(--red);">需要宠物Lv.${r.minLevel}</div>`:''} </div>`; }).join(''); c.querySelectorAll('.route-card:not(.locked)').forEach(card=>{ card.onclick=async()=>{ const routeId=card.dataset.routeId; await startExplore(pet.id,routeId); modal.classList.remove('active'); }; }); }, async openBackpack(){ document.getElementById('modalBackpack').classList.add('active'); await loadItems(); const c=document.getElementById('itemListContainer'); const items=Object.entries(State.items); let html=`<div class="item-row" style="background:#fef9f3; border-radius:10px; padding:10px; margin-bottom:8px; font-weight:600;"><span>🪙</span><span style="flex:1;">金币</span><span style="color:var(--accent);">${State.profile?.gold||0}</span></div>`; if(items.length===0){html+='<p>背包空空，派宠物探险收集材料吧！</p>';}else{html+=items.map(([type,qty])=>`<div class="item-row"><span>${ITEM_EMOJI[type]}</span><span style="flex:1;">${ITEM_NAMES[type]}</span><span>×${qty}</span></div>`).join('');} c.innerHTML=html; document.getElementById('btnRefreshBackpack').onclick=async()=>{ await loadItems(); Farm.openBackpack(); }; }, async openSynthesis(){ document.getElementById('modalSynthesis').classList.add('active'); await loadItems(); const c=document.getElementById('synthesisList'); c.innerHTML=SYNTHESIS_RECIPES.map((r,idx)=>{ const hasMaterials=Object.entries(r.materials).every(([item,need])=>(State.items[item]||0)>=need); const hasGold=(State.profile.gold||0)>=r.cost; const canCraft=hasMaterials&&hasGold; let btnClass='btn-synthesis', btnText='可合成'; if(!hasMaterials){ btnClass='btn-nomat'; btnText='材料不足'; }else if(!hasGold){ btnClass='btn-nogold'; btnText='金币不足'; } return`<div class="equipment-card"><strong>${r.name}</strong> <span class="set-badge">${r.set_name||'无'}</span> (${SLOT_NAMES[r.slot]}) - ${QUALITY_NAMES[r.quality]}<div style="font-size:0.8rem;">材料：${Object.entries(r.materials).map(([item,need])=>`${ITEM_EMOJI[item]}×${need}`).join(' ')}</div><div style="font-size:0.8rem;">费用：🪙${r.cost}</div><button class="${btnClass}" data-recipe-idx="${idx}" ${canCraft?'':'disabled'}>${btnText}</button></div>`;}).join(''); c.querySelectorAll('.btn-synthesis').forEach(btn=>{ btn.onclick=async()=>{const idx=parseInt(btn.dataset.recipeIdx);await synthesizeEquipment(SYNTHESIS_RECIPES[idx]);Farm.openSynthesis();}; }); document.getElementById('btnRefreshSynthesis').onclick=async()=>{ await loadItems(); Farm.openSynthesis(); }; }, openEquipment(){ document.getElementById('modalEquipment').classList.add('active'); const c=document.getElementById('equipmentList'); if(State.equipment.length===0){c.innerHTML='<p>还没有装备，去合成台打造吧！</p>';return;} c.innerHTML=State.equipment.map(e=>{const pn=e.equipped_to?State.pets.find(p=>p.id===e.equipped_to)?.pet_name:'未装备',qc=`quality-${e.quality}`; const canEnhance=!e.equipped_to&&e.enhance_level<5; return`<div class="equipment-card ${qc}"><strong>${e.name}</strong> <span class="set-badge">${e.set_name||'无'}</span> +${e.enhance_level} (${QUALITY_NAMES[e.quality]})<div>攻击+${e.atk_bonus} 防御+${e.def_bonus} 幸运+${e.luk_bonus}</div><div>装备于：#${e.equipped_to||'?'} ${pn}</div><div style="margin-top:6px;"><button class="btn-enhance" data-equip-id="${e.id}" ${canEnhance?'':'disabled'}>${canEnhance?'强化':(e.equipped_to?'卸下后强化':'已满级')}</button><button class="btn-equip" data-equip-id="${e.id}">装备</button><button class="btn-unequip" data-equip-id="${e.id}" ${!e.equipped_to?'disabled':''}>卸下</button></div></div>`;}).join(''); c.querySelectorAll('.btn-enhance:not([disabled])').forEach(btn=>{btn.onclick=async()=>{const eid=parseInt(btn.dataset.equipId);await enhanceEquipment(eid);Farm.openEquipment();};}); c.querySelectorAll('.btn-equip').forEach(btn=>{btn.onclick=async()=>{const eid=parseInt(btn.dataset.equipId);const petList=State.pets.map(p=>`<button class="btn-small" style="margin:2px;" data-pet-id="${p.id}">#${p.id} ${p.pet_name} Lv.${p.level}</button>`).join('');const overlay=document.createElement('div');overlay.className='modal-overlay active';overlay.innerHTML=`<div class="modal"><h3>选择宠物</h3>${petList}<button class="btn-close" id="cancelEquip">取消</button></div>`;document.body.appendChild(overlay);overlay.querySelector('#cancelEquip').onclick=()=>overlay.remove();overlay.querySelectorAll('.btn-small').forEach(pb=>{pb.onclick=async()=>{const pid=parseInt(pb.dataset.petId);await equipToPet(eid,pid);overlay.remove();Farm.openEquipment();};});};}); c.querySelectorAll('.btn-unequip').forEach(btn=>{btn.onclick=async()=>{const eid=parseInt(btn.dataset.equipId);await unequipFromPet(eid);Farm.openEquipment();};}); }, async openPvE(){ const modal=document.getElementById('modalPvE'); if(!modal){ render(); setTimeout(()=>Farm.openPvE(),100); return; } modal.classList.add('active'); const c=document.getElementById('pveListContainer'); const myPet=State.pets[0]; const myLevel=myPet?myPet.level:1; const available=MONSTERS.filter(m=>myLevel>=m.minLevel&&myLevel<=m.maxLevel+5); let html='';
                if(State.bossStatus){
                    const now=new Date();
                    const refreshesAt = State.bossStatus.refreshes_at ? new Date(State.bossStatus.refreshes_at) : null;
                    if(State.bossStatus.current_hp > 0){
                        if(new Date(State.bossStatus.expires_at) <= now){
                            const newExpires = new Date(Date.now() + 6*3600000).toISOString();
                            await supabase.from('boss_status').update({expires_at: newExpires}).eq('id',1);
                            State.bossStatus.expires_at = newExpires;
                        }
                        const remaining = Math.ceil((new Date(State.bossStatus.expires_at) - now)/3600000*10)/10;
                        html+=`<div class="boss-card"><strong>👹 ${State.bossStatus.monster_name}</strong> ${State.bossStatus.emoji||''}<div>HP: ${State.bossStatus.current_hp}/${State.bossStatus.max_hp}</div><div>剩余时间：${remaining}小时</div><button class="btn-small btn-fight" data-boss="true">挑战BOSS</button></div>`;
                    } else if(State.bossStatus.current_hp <= 0 && refreshesAt && refreshesAt > now){
                        const remaining = Math.ceil((refreshesAt - now)/60000);
                        html+=`<div class="boss-card"><strong>👹 ${State.bossStatus.monster_name}</strong> <div>状态：重生冷却中</div><div>预计重生：${remaining} 分钟后</div></div>`;
                    } else {
                        await refreshBoss();
                        const newRemaining = Math.ceil((new Date(State.bossStatus.expires_at) - new Date())/3600000*10)/10;
                        html+=`<div class="boss-card"><strong>👹 ${State.bossStatus.monster_name}</strong> ${State.bossStatus.emoji||''}<div>HP: ${State.bossStatus.current_hp}/${State.bossStatus.max_hp}</div><div>剩余时间：${newRemaining}小时</div><button class="btn-small btn-fight" data-boss="true">挑战BOSS</button></div>`;
                    }
                }
                const eliteAvailable=ELITE_MONSTERS.filter(m=>myLevel>=m.minLevel&&myLevel<=m.maxLevel+5);
                if(eliteAvailable.length>0&&Math.random()<0.15){ const elite=eliteAvailable[Math.floor(Math.random()*eliteAvailable.length)]; html+=`<div class="elite-card"><strong>✨ ${elite.name} (精英)</strong> ${elite.emoji}<div>Lv.${elite.minLevel}~${elite.maxLevel}</div><button class="btn-small btn-fight" data-elite='${JSON.stringify(elite)}'>挑战精英</button></div>`; }
                html+=available.map(m=>`<div class="list-item"><span>${m.emoji}</span><span style="flex:1;">${m.name} Lv.${m.minLevel}~${m.maxLevel}</span><button class="btn-small btn-fight" data-monster='${JSON.stringify(m)}'>挑战</button></div>`).join(''); c.innerHTML=html||'<p>暂无可挑战的怪物</p>';
                c.querySelectorAll('.btn-fight').forEach(btn=>{ btn.onclick=()=>{ if(btn.dataset.boss){ const boss={name:State.bossStatus.monster_name,emoji:State.bossStatus.emoji,hp:State.bossStatus.current_hp,maxHp:State.bossStatus.max_hp,atk:State.bossStatus.atk,def:State.bossStatus.def,spd:State.bossStatus.spd,rewards:State.bossStatus.rewards,isBoss:true}; startPvEBattle(boss); }else if(btn.dataset.elite){ const elite=JSON.parse(btn.dataset.elite); elite.isElite=true; startPvEBattle(elite); }else{ const mon=JSON.parse(btn.dataset.monster); startPvEBattle(mon); } modal.classList.remove('active'); }; }); }, async openEventLog(){ document.getElementById('modalEventLog').classList.add('active');await loadEventLog();document.getElementById('btnRefreshLog').onclick=async()=>{await loadEventLog();}; } };

            async function loadEventLog(){ const c=document.getElementById('eventLogContainer');c.innerHTML='<p>加载中...</p>'; const{data:logs,error}=await supabase.from('event_logs').select('*').eq('user_id',State.currentUser.id).order('created_at',{ascending:false}).limit(50); if(error){c.innerHTML='<p>加载失败</p>';return;} if(logs.length===0){c.innerHTML='<p>暂无事件记录。</p>';return;} c.innerHTML=logs.map(log=>{const time=formatTime(log.created_at),content=formatEventMessage(log);return`<div class="log-item"><div style="font-size:0.7rem;color:#888;">${time}</div><div>${content}</div></div>`;}).join(''); const{count}=await supabase.from('event_logs').select('*',{count:'exact',head:true}).eq('user_id',State.currentUser.id); if(count>200){const{data:oldLogs}=await supabase.from('event_logs').select('id').eq('user_id',State.currentUser.id).order('created_at',{ascending:true}).limit(count-200);const oldIds=oldLogs.map(l=>l.id);await supabase.from('event_logs').delete().in('id',oldIds).eq('user_id',State.currentUser.id);} }
            function formatEventMessage(log){ const d=log.event_data||{};switch(log.event_type){ case'plant':return`🌱 你种下了 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}`; case'harvest':return`🌾 你收获了 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}，获得 ${d.gold} 金币`; case'water_self':return`💧 你为自己的 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||'作物'} 浇了水`; case'water_sent':return`💧 你帮 👤 ${d.friend} 浇了水，双方各得5金币`; case'steal_sent':return`你偷了 👤 ${d.victim} 的 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}，获得 ${d.gold} 金币`; case'adopt_pet':return`🐾 你领养了一只 ${d.pet}`; case'explore_start':return`🗺️ ${d.pet} 前往${d.route}探险了`; case'explore_complete':{ const items=Object.entries(d.rewards||{}).map(([item,qty])=>`${ITEM_EMOJI[item]}×${qty}`).join(' '); const eventMsg=d.event?` · 触发事件：${d.event}`:''; return`🗺️ ${d.pet} 从${d.route}归来，获得 ${items}${eventMsg}`; } case'skill_learn':return`🎉 ${d.pet} 在探险中领悟了新技能【${d.skill}】！`; case'plot_unlock':return`🔓 你解锁了第 ${d.plot} 块农田！`; case'friend_accepted':return`🤝 你和 👤 ${d.friend} 成为了好友`; case'synthesis':return`🔧 你合成了 ${d.name} (${QUALITY_NAMES[d.quality]})`; case'enhance':return`⚔️ 装备 ${d.name} 强化${d.success?'成功':'失败'}，当前+${d.level}`; case'battle_win':return`⚔️ 你战胜了 👤 ${d.opponent}，获得 ${d.gold} 金币`; case'battle_lose':return`⚔️ 你败给了 👤 ${d.opponent}`; case'pve_win':return`🐉 你击败了 ${d.monster}，获得 🪙${d.gold} 和材料`; case'pve_lose':return`🐉 你被 ${d.monster} 击败了`; default:return'未知事件'; } }

            let growthTimer; function startGrowthTimer(){ if(growthTimer)clearInterval(growthTimer); growthTimer=setInterval(()=>{ if(!State.visitingFriend&&!State.battle&&document.getElementById('farmGrid')){ Farm.updateGrid(); } },30000); }

            async function init(){ const{data}=await supabase.auth.getSession(); if(data.session){ State.currentUser=data.session.user; try{ State.profile=(await supabase.from('profiles').select('*').eq('id',State.currentUser.id).single()).data; const localToken=localStorage.getItem('session_token'); if(State.profile.session_token&&State.profile.session_token!==localToken){ showToast('账号在其他设备登录，请重新登录',true);await signOut();return; } await loadFarmPlots();await loadFriendData();await loadPets();await loadItems();await loadEquipment();await loadBossStatus();await loadPetSkills(); }catch(e){console.error(e);} } render(); }
            init();
        })();
    </script>

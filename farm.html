            async function plantCrop(pi,ct,gm){ const now=new Date().toISOString(); const{data,error}=await supabase.from('farm_plots').update({crop_type:ct,planted_at:now,growth_minutes:gm,watered_at:null,stolen_count:0}).eq('owner_id',State.currentUser.id).eq('plot_index',pi).select().single(); if(error)throw error; addEventLog('plant',{crop:ct}); return data; }

            async function harvestPlot(pi){ const plot=State.farmPlots.find(p=>p.plot_index===pi); if(!plot||!plot.crop_type)return null; const ci=CROPS[plot.crop_type],reward=ci?Math.floor(Math.random()*(ci.max-ci.min+1))+ci.min:50,ng=(State.profile.gold||0)+reward; await supabase.from('profiles').update({gold:ng}).eq('id',State.currentUser.id); await supabase.from('farm_plots').update({crop_type:null,planted_at:null,watered_at:null,stolen_count:0}).eq('owner_id',State.currentUser.id).eq('plot_index',pi); State.profile.gold=ng; addEventLog('harvest',{crop:plot.crop_type,gold:reward}); return reward; }
            async function stealCrop(oi,pi){ const{data:plot,error}=await supabase.from('farm_plots').select('*').eq('owner_id',oi).eq('plot_index',pi).single(); if(error||!plot||!plot.crop_type)throw new Error('无作物可偷'); if(plot.stolen_count>=2)throw new Error('已被偷光'); const ci=CROPS[plot.crop_type],br=Math.floor(Math.random()*(ci.max-ci.min+1))+ci.min,sr=Math.floor(br*0.4),ng=(State.profile.gold||0)+sr; await supabase.from('profiles').update({gold:ng}).eq('id',State.currentUser.id); const{data:owner}=await supabase.from('profiles').select('gold,username').eq('id',oi).single(); const ong=(owner.gold||0)-br+(br-sr); await supabase.from('profiles').update({gold:ong}).eq('id',oi); await supabase.from('farm_plots').update({stolen_count:plot.stolen_count+1}).eq('owner_id',oi).eq('plot_index',pi); State.profile.gold=ng; addEventLog('steal_sent',{victim:owner.username,crop:plot.crop_type,gold:sr}); return sr; }
            function getCropStatus(plot){ if(!plot.crop_type||!plot.planted_at)return{status:'empty'}; const now=new Date(),planted=new Date(plot.planted_at); let gm=plot.growth_minutes*60*1000; if(plot.watered_at)gm=Math.floor(gm*0.7); const mt=new Date(planted.getTime()+gm); if(now>=mt)return{status:'ready',progress:100}; const el=now-planted,prog=Math.floor((el/gm)*100),rem=mt-now,remMin=Math.ceil(rem/60000); let wa=true; if(plot.watered_at){ const lw=new Date(plot.watered_at); wa=(now-lw)>=30*60*1000; } return{status:'growing',progress:prog,remainingMin:remMin,waterable:wa}; }

            async function adoptPet(pt){ const base=PET_TYPES[pt].baseAttr; const{data,error}=await supabase.from('pets').insert({owner_id:State.currentUser.id,pet_type:pt,pet_name:PET_TYPES[pt].name,level:1,exp:0,hp:base.hp,atk:base.atk,def:base.def,spd:base.spd,luk:base.luk,sta:base.sta,hunger:100,happiness:100}).select().single(); if(error)throw error; State.pets.push(data); addEventLog('adopt_pet',{pet:PET_TYPES[pt].name}); return data; }
            async function startExplore(pid){ const pet=State.pets.find(p=>p.id===pid); if(!pet)return; if(pet.exploring_until&&new Date(pet.exploring_until)>new Date()){showToast('宠物正在探险中');return;} const pti=PET_TYPES[pet.pet_type]; if((State.profile.gold||0)<pti.cost){showToast('金币不足！',true);return;} await supabase.from('profiles').update({gold:State.profile.gold-pti.cost}).eq('id',State.currentUser.id); const eu=new Date(Date.now()+pti.time*3600000).toISOString(); await supabase.from('pets').update({exploring_until:eu,last_explored_at:new Date().toISOString()}).eq('id',pid); pet.exploring_until=eu; State.profile.gold-=pti.cost; addEventLog('explore_start',{pet:pet.pet_name}); showToast(`${pet.pet_name} 出发探险！花费🪙${pti.cost}`); if(document.getElementById('modalPets')?.classList.contains('active')){Farm.openPets();}else{render();} }
            async function completeExploration(pid,silent=false){ const pet=State.pets.find(p=>p.id===pid); if(!pet||!pet.exploring_until)return null; const rewards={},pool=[]; if(pet.pet_type==='cat')pool.push('hair','hair','hair','seed','dew','firefly','ore','feather'); else if(pet.pet_type==='dog')pool.push('ore','ore','relic','dew','firefly','hair','seed','scale'); else pool.push('seed','seed','hair','dew','firefly','ore','clover','feather'); const count=Math.floor(Math.random()*2)+1; for(let i=0;i<count;i++){const item=pool[Math.floor(Math.random()*pool.length)];rewards[item]=(rewards[item]||0)+1;} const ne=(pet.exp||0)+30; let nl=pet.level||1; if(ne>=nl*100){ nl++; const base=PET_TYPES[pet.pet_type].baseAttr; const lf=nl-1; pet.hp=Math.floor(base.hp*(1+0.02*lf)); pet.atk=Math.floor(base.atk*(1+0.02*lf)); pet.def=Math.floor(base.def*(1+0.015*lf)); pet.spd=Math.floor(base.spd*(1+0.01*lf)); pet.luk=Math.floor(base.luk*(1+0.01*lf)); pet.sta=Math.floor(base.sta*(1+0.02*lf)); await supabase.from('pets').update({hp:pet.hp,atk:pet.atk,def:pet.def,spd:pet.spd,luk:pet.luk,sta:pet.sta}).eq('id',pid); } await supabase.from('pets').update({exploring_until:null,exp:ne,level:nl}).eq('id',pid); pet.exploring_until=null; pet.exp=ne; pet.level=nl; for(const[item,qty]of Object.entries(rewards)){await addItem(item,qty);} addEventLog('explore_complete',{pet:pet.pet_name,rewards}); if(!silent){const rt=Object.entries(rewards).map(([item,qty])=>`${ITEM_EMOJI[item]}×${qty}`).join(' ');showToast(`${pet.pet_name} 探险归来！获得 ${rt}`);} return rewards; }

            async function synthesizeEquipment(recipe){ for(const[item,need]of Object.entries(recipe.materials)){if((State.items[item]||0)<need){showToast(`材料不足：${ITEM_NAMES[item]}×${need}`,true);return;}} if((State.profile.gold||0)<recipe.cost){showToast('金币不足',true);return;} for(const[item,need]of Object.entries(recipe.materials)){await addItem(item,-need);} await supabase.from('profiles').update({gold:State.profile.gold-recipe.cost}).eq('id',State.currentUser.id); State.profile.gold-=recipe.cost; let q=recipe.quality;const rand=Math.random(); if(recipe.quality==='white'&&rand>0.7){q=rand>0.95?'blue':'white';}else if(recipe.quality==='blue'&&rand>0.75){q=rand>0.96?'purple':'blue';} const ab=q==='gold'?30:q==='purple'?20:q==='blue'?15:10; const db=recipe.slot==='armor'?(q==='gold'?20:q==='purple'?15:10):0; const lb=recipe.slot==='accessory'?(q==='gold'?15:10):0; const{data,error}=await supabase.from('equipment').insert({owner_id:State.currentUser.id,name:recipe.name,slot:recipe.slot,quality:q,atk_bonus:ab,def_bonus:db,luk_bonus:lb}).select().single(); if(error)throw error; State.equipment.push(data); addEventLog('synthesis',{name:data.name,quality:q}); showToast(`合成成功！获得 ${data.name} (${QUALITY_NAMES[q]})`); }
            async function enhanceEquipment(eid){ const equip=State.equipment.find(e=>e.id===eid);if(!equip)return;if(equip.enhance_level>=5){showToast('已达最高强化等级');return;} const cost=(equip.enhance_level+1)*200;if((State.profile.gold||0)<cost){showToast('金币不足',true);return;} const probs=[0.95,0.85,0.7,0.55,0.35];const success=Math.random()<probs[equip.enhance_level]; await supabase.from('profiles').update({gold:State.profile.gold-cost}).eq('id',State.currentUser.id); State.profile.gold-=cost; const baseAtk=Math.round(equip.atk_bonus/Math.max(1,(1+equip.enhance_level*0.1))); const baseDef=Math.round(equip.def_bonus/Math.max(1,(1+equip.enhance_level*0.1))); const baseLuk=Math.round(equip.luk_bonus/Math.max(1,(1+equip.enhance_level*0.1))); if(success){ const nl=equip.enhance_level+1; const newAtk=equip.atk_bonus+Math.round(baseAtk*0.1); const newDef=equip.def_bonus+Math.round(baseDef*0.1); const newLuk=equip.luk_bonus+Math.round(baseLuk*0.1); await supabase.from('equipment').update({enhance_level:nl,atk_bonus:newAtk,def_bonus:newDef,luk_bonus:newLuk}).eq('id',eid); equip.enhance_level=nl; equip.atk_bonus=newAtk; equip.def_bonus=newDef; equip.luk_bonus=newLuk; showToast(`强化成功！+${nl}`); }else{ const nl=Math.max(0,equip.enhance_level-1); const newAtk=equip.atk_bonus-Math.round(baseAtk*0.1); const newDef=equip.def_bonus-Math.round(baseDef*0.1); const newLuk=equip.luk_bonus-Math.round(baseLuk*0.1); await supabase.from('equipment').update({enhance_level:nl,atk_bonus:Math.max(0,newAtk),def_bonus:Math.max(0,newDef),luk_bonus:Math.max(0,newLuk)}).eq('id',eid); equip.enhance_level=nl; equip.atk_bonus=Math.max(0,newAtk); equip.def_bonus=Math.max(0,newDef); equip.luk_bonus=Math.max(0,newLuk); showToast('强化失败，降级了...',true); } addEventLog('enhance',{name:equip.name,level:equip.enhance_level,success}); }
            async function equipToPet(eid,pid){ const equip=State.equipment.find(e=>e.id===eid),pet=State.pets.find(p=>p.id===pid);if(!equip||!pet)return; await supabase.from('equipment').update({equipped_to:null}).eq('equipped_to',pid).eq('slot',equip.slot); await supabase.from('equipment').update({equipped_to:pid}).eq('id',eid); equip.equipped_to=pid; showToast(`已装备 ${equip.name}`); }
            async function unequipFromPet(eid){ await supabase.from('equipment').update({equipped_to:null}).eq('id',eid); const equip=State.equipment.find(e=>e.id===eid);if(equip)equip.equipped_to=null; showToast('已卸下装备'); }
            async function unlockPlot(){ const ul=State.profile.unlocked_plots||4;if(ul>=12)return;const req=UNLOCK_REQUIREMENTS[ul-4]; const missing=[]; for(const[item,need]of Object.entries(req.items)){if((State.items[item]||0)<need){missing.push(`${ITEM_EMOJI[item]}${ITEM_NAMES[item]}×${need}`);}} if(missing.length>0){showToast(`材料不足：${missing.join('、')}`,true);return;} if(State.friendIds.size<(req.friends||0)){showToast(`需要 ${req.friends} 个好友`,true);return;} for(const[item,need]of Object.entries(req.items)){await addItem(item,-need);} await supabase.from('profiles').update({unlocked_plots:ul+1}).eq('id',State.currentUser.id); await supabase.from('farm_plots').insert({owner_id:State.currentUser.id,plot_index:ul}); State.profile.unlocked_plots=ul+1;await loadFarmPlots(); addEventLog('plot_unlock',{plot:ul+1});showToast('解锁成功！获得新地块');render(); }

            function getPetBattleStats(pet){ const equip=State.equipment.filter(e=>e.equipped_to===pet.id); let atk=pet.atk,def=pet.def,spd=pet.spd,luk=pet.luk; equip.forEach(e=>{ atk+=e.atk_bonus; def+=e.def_bonus; spd+=e.spd_bonus; luk+=e.luk_bonus; }); return{...pet,atk,def,spd,luk,maxHp:pet.hp}; }
            function calculateDamage(at,df,isSkill=false){ const ak=at.atk,de=df.def; let dmg=Math.max(1,ak-de+Math.floor(Math.random()*10)); if(isSkill)dmg=Math.floor(dmg*1.3); return dmg; }
            function aiChooseAction(pet,opponent,skillCd){ const hpRatio=pet.currentHp/pet.maxHp; if(pet.pet_type==='dog'&&hpRatio<0.3&&skillCd<=0)return'skill'; if(hpRatio<0.3)return Math.random()<0.4?'defend':'attack'; if(hpRatio<0.6)return Math.random()<0.25?'skill':(Math.random()<0.5?'attack':'defend'); return Math.random()<0.2?'skill':(Math.random()<0.1?'defend':'attack'); }
            async function startBattle(myPetId,friendId){ if(State.isSubmitting)return;State.isSubmitting=true;try{ const{data:friend}=await supabase.from('profiles').select('id,username').eq('id',friendId).single();if(!friend)throw new Error('好友不存在'); const{data:fp}=await supabase.from('pets').select('*').eq('owner_id',friendId);if(!fp||fp.length===0)throw new Error('好友没有宠物'); const op=fp[Math.floor(Math.random()*fp.length)]; const myPet=getPetBattleStats(State.pets.find(p=>p.id===myPetId)); const oppPet=getPetBattleStats(op); State.battle={ type:'pvp', myPet:myPet, opponentPet:oppPet, myCurrentHp:myPet.hp, opponentCurrentHp:oppPet.hp, log:[], friendId:friendId, friendName:friend.username, mySkillCd:0, oppSkillCd:0, turn:0 }; render(); }catch(e){showToast(e.message||'战斗初始化失败',true);}finally{State.isSubmitting=false;} }
            async function startPvEBattle(monster){ if(State.isSubmitting)return; const myPet=getPetBattleStats(State.pets[0]); if(!myPet){showToast('请先领养宠物');return;} // 如果是BOSS，从数据库读取最新血量
            let bossHp=monster.hp||monster.maxHp; if(monster.isBoss&&State.bossStatus){ bossHp=State.bossStatus.current_hp; if(bossHp<=0){ showToast('BOSS已被击败！'); return; } } const myLevel=myPet.level||1; const scale=Math.min(1.5,Math.max(0.5,myLevel/(monster.maxLevel||1))); const oppPet={...monster,hp:Math.floor(bossHp*scale),atk:Math.floor(monster.atk*scale),def:Math.floor(monster.def*scale),spd:monster.spd,maxHp:Math.floor((monster.maxHp||monster.hp)*scale),pet_name:monster.name,pet_type:'monster',skill:{name:'冲撞',cd:2}}; State.battle={ type:'pve', myPet:myPet, opponentPet:oppPet, myCurrentHp:myPet.hp, opponentCurrentHp:oppPet.hp, log:[], monster:monster, mySkillCd:0, oppSkillCd:0, turn:0, bossDamage:0 }; render(); }
            async function executeBattleAction(action){ if(!State.battle)return; const b=State.battle; if(action==='attack'){ const dmg=calculateDamage(b.myPet,b.opponentPet); b.opponentCurrentHp=Math.max(0,b.opponentCurrentHp-dmg); b.log.push(`你的 ${b.myPet.pet_name} 攻击，造成 ${dmg} 点伤害`); if(b.type==='pve'&&b.monster.isBoss){ b.bossDamage=(b.bossDamage||0)+dmg; // 实时更新BOSS血量到数据库
                const newBossHp=Math.max(0,(State.bossStatus?.current_hp||b.opponentPet.maxHp)-dmg); State.bossStatus.current_hp=newBossHp; supabase.from('boss_status').update({current_hp:newBossHp}).eq('id',1).then(()=>{}); } } else if(action==='defend'){ b.log.push('你选择防御'); b.myDefend=true; } else if(action==='skill'){ if(b.mySkillCd>0){showToast('技能冷却中');return;} const skill=PET_TYPES[b.myPet.pet_type].skill; b.mySkillCd=skill.cd; if(b.myPet.pet_type==='cat'){ const d1=Math.floor(calculateDamage(b.myPet,b.opponentPet)*0.6); const d2=Math.floor(calculateDamage(b.myPet,b.opponentPet)*0.6); b.opponentCurrentHp=Math.max(0,b.opponentCurrentHp-d1-d2); b.log.push(`你的 ${b.myPet.pet_name} 使用【${skill.name}】，造成 ${d1}+${d2} 点伤害`); if(b.type==='pve'&&b.monster.isBoss){ const td=d1+d2; b.bossDamage=(b.bossDamage||0)+td; const newBossHp=Math.max(0,(State.bossStatus?.current_hp||b.opponentPet.maxHp)-td); State.bossStatus.current_hp=newBossHp; supabase.from('boss_status').update({current_hp:newBossHp}).eq('id',1).then(()=>{}); } }else if(b.myPet.pet_type==='dog'){ const heal=Math.floor(b.myPet.hp*0.2); b.myCurrentHp=Math.min(b.myPet.hp,b.myCurrentHp+heal); b.log.push(`你的 ${b.myPet.pet_name} 使用【${skill.name}】，回复 ${heal} 点HP`); }else{ const dmg=calculateDamage(b.myPet,b.opponentPet,true); b.opponentCurrentHp=Math.max(0,b.opponentCurrentHp-dmg); b.log.push(`你的 ${b.myPet.pet_name} 使用【${skill.name}】，造成 ${dmg} 点伤害`); if(b.type==='pve'&&b.monster.isBoss){ b.bossDamage=(b.bossDamage||0)+dmg; const newBossHp=Math.max(0,(State.bossStatus?.current_hp||b.opponentPet.maxHp)-dmg); State.bossStatus.current_hp=newBossHp; supabase.from('boss_status').update({current_hp:newBossHp}).eq('id',1).then(()=>{}); } } } if(b.mySkillCd>0)b.mySkillCd--; if(b.oppSkillCd>0)b.oppSkillCd--; if(b.opponentCurrentHp>0){ const oppPetForAi={...b.opponentPet,currentHp:b.opponentCurrentHp,maxHp:b.opponentPet.maxHp||b.opponentPet.hp}; const oppAction=aiChooseAction(oppPetForAi,b.myPet,b.oppSkillCd); if(oppAction==='attack'){ const dmg=calculateDamage(b.opponentPet,b.myPet); if(b.myDefend)dmg=Math.floor(dmg*0.5); b.myCurrentHp=Math.max(0,b.myCurrentHp-dmg); b.log.push(`对手 ${b.opponentPet.pet_name} 攻击，造成 ${dmg} 点伤害`); }else if(oppAction==='defend'){ b.log.push(`对手 ${b.opponentPet.pet_name} 防御`); b.oppDefend=true; }else{ b.oppSkillCd=PET_TYPES[b.opponentPet.pet_type]?.skill?.cd||2; const skill=PET_TYPES[b.opponentPet.pet_type]?.skill; if(b.opponentPet.pet_type==='dog'){ const heal=Math.floor(b.opponentPet.hp*0.2); b.opponentCurrentHp=Math.min(b.opponentPet.hp,b.opponentCurrentHp+heal); b.log.push(`对手 ${b.opponentPet.pet_name} 使用【${skill?.name}】，回复 ${heal} 点HP`); }else{ const dmg=calculateDamage(b.opponentPet,b.myPet,true); if(b.myDefend)dmg=Math.floor(dmg*0.5); b.myCurrentHp=Math.max(0,b.myCurrentHp-dmg); b.log.push(`对手 ${b.opponentPet.pet_name} 使用【${skill?.name}】，造成 ${dmg} 点伤害`); } } } b.myDefend=false; b.oppDefend=false; if(b.myCurrentHp<=0){ b.log.push('你输了！'); endBattle(false); }else if(b.opponentCurrentHp<=0){ b.log.push('你赢了！'); endBattle(true); } render(); }
            async function endBattle(won){ const b=State.battle;if(!b)return; if(b.type==='pvp'){ await supabase.from('battle_logs').insert({attacker_id:State.currentUser.id,defender_id:b.friendId,attacker_pet_id:b.myPet.id,defender_pet_id:b.opponentPet.id,winner_id:won?State.currentUser.id:b.friendId,battle_data:{log:b.log}}); if(won){ const gr=50+Math.floor(Math.random()*50); await supabase.from('profiles').update({gold:State.profile.gold+gr}).eq('id',State.currentUser.id); State.profile.gold+=gr; addEventLog('battle_win',{opponent:b.friendName,gold:gr}); showToast(`胜利！获得 🪙${gr}`); }else{ addEventLog('battle_lose',{opponent:b.friendName}); } }else if(b.type==='pve'){ if(won){ const mon=b.monster; const gr=mon.rewards.gold; await supabase.from('profiles').update({gold:State.profile.gold+gr}).eq('id',State.currentUser.id); State.profile.gold+=gr; if(mon.rewards.items){ for(const[item,prob]of Object.entries(mon.rewards.items)){ if(Math.random()<prob){ await addItem(item,1); } } } const pet=State.pets[0]; if(pet){ const ne=(pet.exp||0)+50; let nl=pet.level||1; if(ne>=nl*100){ nl++; const base=PET_TYPES[pet.pet_type].baseAttr; const lf=nl-1; pet.hp=Math.floor(base.hp*(1+0.02*lf)); pet.atk=Math.floor(base.atk*(1+0.02*lf)); pet.def=Math.floor(base.def*(1+0.015*lf)); pet.spd=Math.floor(base.spd*(1+0.01*lf)); pet.luk=Math.floor(base.luk*(1+0.01*lf)); pet.sta=Math.floor(base.sta*(1+0.02*lf)); await supabase.from('pets').update({hp:pet.hp,atk:pet.atk,def:pet.def,spd:pet.spd,luk:pet.luk,sta:pet.sta}).eq('id',pet.id); } await supabase.from('pets').update({exp:ne,level:nl}).eq('id',pet.id); pet.exp=ne; pet.level=nl; } addEventLog('pve_win',{monster:mon.name,gold:gr}); showToast(`击败 ${mon.name}！获得 🪙${gr} 和材料`); if(mon.isBoss){ await supabase.from('boss_participants').upsert({user_id:State.currentUser.id,damage_dealt:(b.bossDamage||0)},{onConflict:'user_id'}); const{data:participants}=await supabase.from('boss_participants').select('user_id,damage_dealt').order('damage_dealt',{as tById('modalWater').classList.remove('active');}}; document.getElementById('farmGrid').onclick=(e)=>{const card=e.target.closest('.plot-card');if(!card||State.isSubmitting)return;const pi=parseInt(card.dataset.plot),plot=State.farmPlots.find(p=>p.plot_index===pi),status=getCropStatus(plot);if(status.status==='empty'){State.selectedPlotIndex=pi;document.getElementById('modalPlant').classList.add('active');document.querySelectorAll('#modalPlant .crop-btn').forEach(btn=>{btn.onclick=async()=>{const ct=btn.dataset.crop,gt=parseInt(btn.dataset.time),sp=parseInt(btn.dataset.price);if((State.profile.gold||0)<sp){showToast('金币不足！',true);return;}State.isSubmitting=true;try{await supabase.from('profiles').update({gold:State.profile.gold-sp}).eq('id',State.currentUser.id);const up=await plantCrop(pi,ct,gt);const idx=State.farmPlots.findIndex(p=>p.plot_index===pi);if(idx!==-1)State.farmPlots[idx]=up;State.profile.gold-=sp;Farm.updateGrid();showToast(`种下了${CROPS[ct].name}！`);}catch(err){showToast('种植失败',true);}finally{State.isSubmitting=false;document.getElementById('modalPlant').classList.remove('active');}};});}else if(status.status==='ready'){State.isSubmitting=true;harvestPlot(pi).then(reward=>{const idx=State.farmPlots.findIndex(p=>p.plot_index===pi);if(idx!==-1){State.farmPlots[idx]={...State.farmPlots[idx],crop_type:null,planted_at:null,watered_at:null};}Farm.updateGrid();showToast(`收获成功！🪙${reward}`);}).catch(()=>showToast('收获失败',true)).finally(()=>{State.isSubmitting=false;});}else{State.selectedPlotIndex=pi;document.getElementById('waterPlotInfo').textContent=`${CROPS[plot.crop_type]?.name||'作物'} 正在生长，要浇水加速吗？`;document.getElementById('modalWater').classList.add('active');}}; }, updateGrid(){ const ul=State.profile?.unlocked_plots||4; document.getElementById('farmGrid').innerHTML=State.farmPlots.filter(p=>p.plot_index<ul).map(p=>Farm.plotHTML(p)).join(''); }, openFriendsList(){ document.getElementById('modalFriends').classList.add('active'); const c=document.getElementById('friendListContainer'); if(State.friendProfiles.length===0){c.innerHTML='<p>还没有好友，去排行榜添加吧！</p>';return;} c.innerHTML=State.friendProfiles.map(f=>`<div class="list-item" data-friend-id="${f.id}"><div class="avatar ${f.gender||'none'}" style="width:30px;height:30px;">${(f.username||'?')[0]}</div><span style="flex:1;">${escapeHTML(f.username||'匿名')}</span><span style="color:var(--accent);">🪙${f.gold||0}</span><button class="btn-small btn-fight" data-friend-id="${f.id}">切磋</button></div>`).join(''); c.querySelectorAll('.list-item').forEach(item=>{item.onclick=()=>{const fid=item.dataset.friendId,friend=State.friendProfiles.find(p=>p.id===fid);if(friend){State.visitingFriend=friend;supabase.from('farm_plots').select('*').eq('owner_id',fid).order('plot_index').then(({data})=>{State.visitingPlots=data||[];document.getElementById('modalFriends').classList.remove('active');render();});}};}); c.querySelectorAll('.btn-fight').forEach(btn=>{btn.onclick=(e)=>{e.stopPropagation();const fid=btn.dataset.friendId;if(State.pets.length===0){showToast('你没有可用的宠物');return;}const overlay=document.createElement('div');overlay.className='modal-overlay active';overlay.innerHTML=`<div class="modal"><h3>选择宠物切磋</h3>${State.pets.map(p=>`<button class="btn-small btn-adopt" style="margin:2px;" data-pet-id="${p.id}">#${p.id} ${p.pet_name} Lv.${p.level}</button>`).join('')}<button class="btn-close" id="cancelFight">取消</button></div>`;document.body.appendChild(overlay);overlay.querySelector('#cancelFight').onclick=()=>overlay.remove();overlay.querySelectorAll('.btn-adopt').forEach(pb=>{pb.onclick=async()=>{const pid=parseInt(pb.dataset.petId);overlay.remove();await startBattle(pid,fid);};});};}); }, openPets(){ document.getElementById('modalPets').classList.add('active'); const c=document.getElementById('petListContainer'); if(State.pets.length===0){c.innerHTML='<p>还没有宠物，领养一只吧！</p><button class="btn-primary" id="btnAdopt">领养宠物</button>';document.getElementById('btnAdopt').onclick=()=>{document.getElementById('modalPets').classList.remove('active');Farm.openAdopt();};return;} c.innerHTML=State.pets.map(p=>{const now=new Date(),exp=p.exploring_until&&new Date(p.exploring_until)>now,fin=p.exploring_until&&new Date(p.exploring_until)<=now;let btn='';if(fin)btn=`<button class="btn-small btn-view" data-pet-id="${p.id}">查看</button>`;else if(exp){const rem=Math.ceil((new Date(p.exploring_until)-now)/60000);btn=`<button class="btn-small" disabled>探险中(${rem}分)</button>`;}else btn=`<button class="btn-small btn-explore" data-pet-id="${p.id}">探险</button>`; const stats=getPetBattleStats(p); return`<div class="list-item"><span style="font-size:2rem;">${PET_TYPES[p.pet_type].emoji}</span><div style="flex:1;"><div>#${p.id} ${p.pet_name} Lv.${p.level}</div><div style="font-size:0.7rem;">EXP:${p.exp} | ❤${stats.hp} ⚔${stats.atk} 🛡${stats.def} ⚡${stats.spd} 🍀${stats.luk}</div></div>${btn}</div>`;}).join(''); c.querySelectorAll('.btn-explore').forEach(btn=>{btn.onclick=async()=>{const pid=parseInt(btn.dataset.petId);try{await startExplore(pid);}catch(e){showToast(e.message||'探险失败',true);}};}); c.querySelectorAll('.btn-view').forEach(btn=>{btn.onclick=async()=>{const pid=parseInt(btn.dataset.petId);try{await completeExploration(pid,false);await loadPets();Farm.openPets();}catch(e){showToast(e.message||'查看失败',true);}};}); }, openAdopt(){ document.getElementById('modalPets').classList.add('active'); const c=document.getElementById('petListContainer'); c.innerHTML='<h3>选择宠物</h3><div class="pet-options">'+Object.entries(PET_TYPES).map(([key,info])=>`<button class="pet-btn" data-pet="${key}"><div style="font-size:2rem;">${info.emoji}</div><div>${info.name}</div><div style="font-size:0.7rem;">探险费🪙${info.cost} | ${info.time}小时</div></button>`).join('')+'</div><button class="btn-close" id="cancelAdopt">取消</button>'; document.getElementById('cancelAdopt').onclick=()=>{document.getElementById('modalPets').classList.remove('active');}; c.querySelectorAll('.pet-btn').forEach(btn=>{btn.onclick=async()=>{const pt=btn.dataset.pet;try{await adoptPet(pt);showToast('领养成功！');document.getElementById('modalPets').classList.remove('active');render();}catch(e){showToast('领养失败',true);}};}); }, async openBackpack(){ document.getElementById('modalBackpack').classList.add('active'); await loadItems(); const c=document.getElementById('itemListContainer'); const items=Object.entries(State.items); let html=`<div class="item-row" style="background:#fef9f3; border-radius:10px; padding:10px; margin-bottom:8px; font-weight:600;"><span>🪙</span><span style="flex:1;">金币</span><span style="color:var(--accent);">${State.profile?.gold||0}</span></div>`; if(items.length===0){html+='<p>背包空空，派宠物探险收集材料吧！</p>';}else{html+=items.map(([type,qty])=>`<div class="item-row"><span>${ITEM_EMOJI[type]}</span><span style="flex:1;">${ITEM_NAMES[type]}</span><span>×${qty}</span></div>`).join('');} c.innerHTML=html; document.getElementById('btnRefreshBackpack').onclick=async()=>{ await loadItems(); Farm.openBackpack(); }; }, async openSynthesis(){ document.getElementById('modalSynthesis').classList.add('active'); await loadItems(); const c=document.getElementById('synthesisList'); c.innerHTML=SYNTHESIS_RECIPES.map((r,idx)=>{ const hasMaterials=Object.entries(r.materials).every(([item,need])=>(State.items[item]||0)>=need); const hasGold=(State.profile.gold||0)>=r.cost; const canCraft=hasMaterials&&hasGold; let btnClass='btn-synthesis', btnText='可合成'; if(!hasMaterials){ btnClass='btn-nomat'; btnText='材料不足'; }else if(!hasGold){ btnClass='btn-nogold'; btnText='金币不足'; } return`<div class="equipment-card"><strong>${r.name}</strong> (${SLOT_NAMES[r.slot]}) - ${QUALITY_NAMES[r.quality]}<div style="font-size:0.8rem;">材料：${Object.entries(r.materials).map(([item,need])=>`${ITEM_EMOJI[item]}×${need}`).join(' ')}</div><div style="font-size:0.8rem;">费用：🪙${r.cost}</div><button class="${btnClass}" data-recipe-idx="${idx}" ${canCraft?'':'disabled'}>${btnText}</button></div>`;}).join(''); c.querySelectorAll('.btn-synthesis').forEach(btn=>{ btn.onclick=async()=>{const idx=parseInt(btn.dataset.recipeIdx);await synthesizeEquipment(SYNTHESIS_RECIPES[idx]);Farm.openSynthesis();}; }); document.getElementById('btnRefreshSynthesis').onclick=async()=>{ await loadItems(); Farm.openSynthesis(); }; }, openEquipment(){ document.getElementById('modalEquipment').classList.add('active'); const c=document.getElementById('equipmentList'); if(State.equipment.length===0){c.innerHTML='<p>还没有装备，去合成台打造吧！</p>';return;} c.innerHTML=State.equipment.map(e=>{const pn=e.equipped_to?State.pets.find(p=>p.id===e.equipped_to)?.pet_name:'未装备',qc=`quality-${e.quality}`;return`<div class="equipment-card ${qc}"><strong>${e.name}</strong> +${e.enhance_level} (${QUALITY_NAMES[e.quality]})<div>攻击+${e.atk_bonus} 防御+${e.def_bonus} 幸运+${e.luk_bonus}</div><div>装备于：#${e.equipped_to||'?'} ${pn}</div><div style="margin-top:6px;"><button class="btn-enhance" data-equip-id="${e.id}">强化</button><button class="btn-equip" data-equip-id="${e.id}">装备</button><button class="btn-unequip" data-equip-id="${e.id}" ${!e.equipped_to?'disabled':''}>卸下</button></div></div>`;}).join(''); c.querySelectorAll('.btn-enhance').forEach(btn=>{btn.onclick=async()=>{const eid=parseInt(btn.dataset.equipId);await enhanceEquipment(eid);Farm.openEquipment();};}); c.querySelectorAll('.btn-equip').forEach(btn=>{btn.onclick=async()=>{const eid=parseInt(btn.dataset.equipId);const petList=State.pets.map(p=>`<button class="btn-small" style="margin:2px;" data-pet-id="${p.id}">#${p.id} ${p.pet_name} Lv.${p.level}</button>`).join('');const overlay=document.createElement('div');overlay.className='modal-overlay active';overlay.innerHTML=`<div class="modal"><h3>选择宠物</h3>${petList}<button class="btn-close" id="cancelEquip">取消</button></div>`;document.body.appendChild(overlay);overlay.querySelector('#cancelEquip').onclick=()=>overlay.remove();overlay.querySelectorAll('.btn-small').forEach(pb=>{pb.onclick=async()=>{const pid=parseInt(pb.dataset.petId);await equipToPe sStatus.current_hp,maxHp:State.bossStatus.max_hp,atk:State.bossStatus.atk,def:State.bossStatus.def,spd:State.bossStatus.spd,rewards:State.bossStatus.rewards,isBoss:true}; startPvEBattle(boss); }else if(btn.dataset.elite){ const elite=JSON.parse(btn.dataset.elite); elite.isElite=true; startPvEBattle(elite); }else{ const mon=JSON.parse(btn.dataset.monster); startPvEBattle(mon); } modal.classList.remove('active'); }; }); }, async openEventLog(){ document.getElementById('modalEventLog').classList.add('active');await loadEventLog();document.getElementById('btnRefreshLog').onclick=async()=>{await loadEventLog();}; } };

            async function loadEventLog(){ const c=document.getElementById('eventLogContainer');c.innerHTML='<p>加载中...</p>'; const{data:logs,error}=await supabase.from('event_logs').select('*').eq('user_id',State.currentUser.id).order('created_at',{ascending:false}).limit(50); if(error){c.innerHTML='<p>加载失败</p>';return;} if(logs.length===0){c.innerHTML='<p>暂无事件记录。</p>';return;} c.innerHTML=logs.map(log=>{const time=formatTime(log.created_at),content=formatEventMessage(log);return`<div class="log-item"><div style="font-size:0.7rem;color:#888;">${time}</div><div>${content}</div></div>`;}).join(''); const{count}=await supabase.from('event_logs').select('*',{count:'exact',head:true}).eq('user_id',State.currentUser.id); if(count>200){const{data:oldLogs}=await supabase.from('event_logs').select('id').eq('user_id',State.currentUser.id).order('created_at',{ascending:true}).limit(count-200);const oldIds=oldLogs.map(l=>l.id);await supabase.from('event_logs').delete().in('id',oldIds).eq('user_id',State.currentUser.id);} }
            function formatEventMessage(log){ const d=log.event_data||{};switch(log.event_type){ case'plant':return`🌱 你种下了 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}`; case'harvest':return`🌾 你收获了 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}，获得 ${d.gold} 金币`; case'water_self':return`💧 你为自己的 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||'作物'} 浇了水`; case'water_sent':return`💧 你帮 👤 ${d.friend} 浇了水，双方各得5金币`; case'steal_sent':return`你偷了 👤 ${d.victim} 的 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}，获得 ${d.gold} 金币`; case'adopt_pet':return`🐾 你领养了一只 ${d.pet}`; case'explore_start':return`🐾 ${d.pet} 出门探险了`; case'explore_complete':{const items=Object.entries(d.rewards||{}).map(([item,qty])=>`${ITEM_EMOJI[item]}×${qty}`).join(' ');return`🐾 ${d.pet} 探险归来，带回 ${items}`;} case'plot_unlock':return`🔓 你解锁了第 ${d.plot} 块农田！`; case'friend_accepted':return`🤝 你和 👤 ${d.friend} 成为了好友`; case'synthesis':return`🔧 你合成了 ${d.name} (${QUALITY_NAMES[d.quality]})`; case'enhance':return`⚔️ 装备 ${d.name} 强化${d.success?'成功':'失败'}，当前+${d.level}`; case'battle_win':return`⚔️ 你战胜了 👤 ${d.opponent}，获得 ${d.gold} 金币`; case'battle_lose':return`⚔️ 你败给了 👤 ${d.opponent}`; case'pve_win':return`🐉 你击败了 ${d.monster}，获得 🪙${d.gold} 和材料`; case'pve_lose':return`🐉 你被 ${d.monster} 击败了`; default:return'未知事件'; } }

            let growthTimer; function startGrowthTimer(){ if(growthTimer)clearInterval(growthTimer); growthTimer=setInterval(()=>{ if(!State.visitingFriend&&!State.battle&&document.getElementById('farmGrid')){ Farm.updateGrid(); } },30000); }

            async function init(){ const{data}=await supabase.auth.getSession(); if(data.session){ State.currentUser=data.session.user; try{ State.profile=(await supabase.from('profiles').select('*').eq('id',State.currentUser.id).single()).data; const localToken=localStorage.getItem('session_token'); if(State.profile.session_token&&State.profile.session_token!==localToken){ showToast('账号在其他设备登录，请重新登录',true);await signOut();return; } await loadFarmPlots();await loadFriendData();await loadPets();await loadItems();await loadEquipment();await loadBossStatus(); }catch(e){console.error(e);} } render(); }
            init();
        })();

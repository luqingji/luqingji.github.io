<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🌱 开心农场 - 阶段C</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f5f0eb; --card: #ffffff; --text: #3d3929; --accent: #c0844e;
            --green: #6b8f71; --red: #c0392b; --blue: #5b7fbc; --pink: #d4869c; --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
            background: var(--bg); background-image: radial-gradient(ellipse at 30% 20%, rgba(139,158,123,0.1) 0%, transparent 60%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .app-container { width:100%; max-width:480px; display:flex; flex-direction:column; gap:20px; }
        .header { background: var(--card); border-radius: var(--radius); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 12px rgba(0,0,0,0.06); flex-wrap:wrap; gap:8px; }
        .user-info { display:flex; align-items:center; gap:8px; }
        .avatar { width:36px; height:36px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; flex-shrink:0; }
        .avatar.male { background: var(--blue); }
        .avatar.female { background: var(--pink); }
        .avatar.none { background: #aaa; }
        .username { font-weight:600; color:var(--text); font-size:0.9rem; }
        .level { font-size:0.7rem; color:#888; }
        .gold { font-weight:700; color:var(--accent); font-size:0.9rem; }
        .btn-icon { padding:6px 12px; background:#f0ede6; border:none; border-radius:20px; cursor:pointer; font-size:0.8rem; font-family:inherit; white-space:nowrap; position: relative; }
        .btn-icon:hover::after { content: attr(title); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; white-space: nowrap; z-index: 10; }
        .farm-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .plot-card { background: var(--card); border-radius: var(--radius); padding:14px 8px; text-align:center; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; box-shadow:0 2px 8px rgba(0,0,0,0.05); cursor:pointer; transition:all 0.2s; position:relative; user-select:none; }
        .plot-card:active { transform:scale(0.96); background:#f9f6f0; }
        .plot-card.empty { border:2px dashed #d5cec0; color:#b0a590; }
        .plot-card.planted { border:2px solid #c5d5b0; }
        .plot-card.ready { border:2px solid #f0c040; animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(240,192,64,0.4); } 50%{ box-shadow:0 0 0 12px rgba(240,192,64,0); } }
        .plot-emoji { font-size:2rem; }
        .plot-status { font-size:0.7rem; color:#888; line-height:1.2; }
        .progress-bar { width:100%; height:4px; background:#e9ecef; border-radius:2px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--green); border-radius:2px; transition:width 1s linear; }
        .waterable { color:#1976d2; font-weight:600; }
        .watered { color:#e67e22; font-weight:600; }
        .unlock-section { text-align:center; margin-top:4px; }
        .btn-unlock { padding:10px 16px; background:#fdfcf9; border:2px dashed #d4b896; border-radius:12px; cursor:pointer; font-family:inherit; font-size:0.85rem; color:var(--accent); transition:all 0.2s; }
        .modal-overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.5); z-index:100; justify-content:center; align-items:center; }
        .modal-overlay.active { display:flex; }
        .modal { background:#fff; border-radius:var(--radius); padding:20px; max-width:360px; width:90%; text-align:center; max-height:80vh; overflow-y:auto; }
        .modal h3 { margin-bottom:12px; color:var(--text); font-size:1.1rem; }
        .crop-options, .pet-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
        .crop-btn, .pet-btn { padding:12px; border:2px solid #e0d8cc; border-radius:12px; background:#fdfcf9; cursor:pointer; font-family:inherit; transition:all 0.2s; text-align:center; }
        .crop-btn:hover, .pet-btn:hover { border-color:var(--accent); background:#fef9f3; }
        .btn-close { padding:6px 20px; background:#e8e0d5; border:none; border-radius:20px; cursor:pointer; font-family:inherit; margin-top:8px; font-size:0.85rem; }
        .auth-form { background:var(--card); border-radius:var(--radius); padding:24px 20px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
        .auth-tabs { display:flex; margin-bottom:16px; border-radius:12px; overflow:hidden; border:1.5px solid #e0d8cc; }
        .auth-tab { flex:1; text-align:center; padding:8px; font-weight:600; cursor:pointer; background:#fdfcf9; transition:all 0.2s; font-family:inherit; font-size:0.9rem; border:none; }
        .auth-tab.active { background:var(--accent); color:#fff; }
        .form-group { margin-bottom:12px; }
        .form-group label { display:block; font-size:0.8rem; color:#666; margin-bottom:2px; }
        .form-group input { width:100%; padding:10px; border:1.5px solid #e0d8cc; border-radius:10px; font-size:0.9rem; font-family:inherit; outline:none; }
        .gender-selector { display:flex; gap:6px; flex-wrap:wrap; }
        .gender-option { flex:1; min-width:70px; padding:8px 4px; border:1.5px solid #ddd; border-radius:10px; text-align:center; cursor:pointer; background:#fff; font-size:0.8rem; }
        .gender-option input { display:none; }
        .gender-option:has(input:checked) { border-color:var(--accent); background:#fef9f3; }
        .gender-label { font-size:0.85rem; color:#888; }
        .gender-option:has(input:checked) .gender-label { color:var(--accent); font-weight:700; }
        .btn-primary { width:100%; padding:10px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-size:0.95rem; font-weight:600; cursor:pointer; }
        .msg-error { color:var(--red); font-size:0.8rem; text-align:center; margin-top:8px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#3d3929; color:#fff; padding:10px 20px; border-radius:20px; font-size:0.85rem; z-index:200; pointer-events:none; opacity:0; transition:opacity 0.3s; }
        .toast.show { opacity:1; }
        .list-container { max-height:60vh; overflow-y:auto; text-align:left; }
        .list-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid #f0ede6; }
        .list-item .rank-span { font-weight:700; width:24px; text-align:center; display:inline-block; }
        .tag-friend { font-size:0.7rem; color:#888; background:#f0ede6; padding:2px 8px; border-radius:10px; }
        .tag-self { font-size:0.7rem; color:var(--accent); }
        .btn-small { padding:4px 10px; border:none; border-radius:12px; cursor:pointer; font-size:0.7rem; font-family:inherit; }
        .btn-accept { background:#6b8f71; color:#fff; }
        .btn-reject { background:#e0d8cc; color:#333; }
        .btn-explore { background:#1976d2; color:#fff; }
        .btn-adopt { background:var(--accent); color:#fff; }
        .btn-view { background:#e67e22; color:#fff; }
        .btn-fight { background:#c0392b; color:#fff; }
        .item-row { display:flex; align-items:center; gap:8px; padding:6px 0; }
        .log-item { text-align:left; padding:8px 12px; border-bottom:1px solid #f0ede6; }
        .equipment-card { background: #f9f6f0; border-radius: 12px; padding: 12px; margin: 8px 0; border-left: 4px solid var(--accent); }
        .quality-white { border-left-color: #ccc; }
        .quality-blue { border-left-color: #5b7fbc; }
        .quality-purple { border-left-color: #9b59b6; }
        .quality-gold { border-left-color: #f0c040; }
        .btn-synthesis { background: #8e44ad; color: #fff; border: none; border-radius: 20px; padding: 8px 16px; cursor: pointer; font-family: inherit; font-size:0.8rem; }
        .btn-enhance { background: #e67e22; color: #fff; border: none; border-radius: 20px; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size:0.7rem; margin-right:4px; }
        .btn-equip { background: #6ba3be; color: #fff; border: none; border-radius: 20px; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size:0.7rem; margin-right:4px; }
        .btn-unequip { background: #aaa; color: #fff; border: none; border-radius: 20px; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size:0.7rem; }
        .btn-refresh { background: #6c757d; color: #fff; border: none; border-radius: 20px; padding: 6px 16px; cursor: pointer; font-family: inherit; font-size:0.8rem; margin-bottom: 8px; }
        .battle-container { display:flex; justify-content:space-around; align-items:center; margin:16px 0; }
        .battle-pet { text-align:center; }
        .battle-hp { width:80px; height:10px; background:#e9ecef; border-radius:5px; margin:8px auto; }
        .battle-hp-fill { height:100%; background:var(--green); border-radius:5px; transition: width 0.3s; }
        .battle-log { background:#2d3436; color:#dfe6e9; border-radius:12px; padding:12px; height:120px; overflow-y:auto; font-size:0.8rem; margin:12px 0; text-align:left; }
        .battle-actions { display:flex; gap:8px; justify-content:center; }
        .battle-btn { padding:8px 16px; border:none; border-radius:20px; font-weight:600; cursor:pointer; font-family:inherit; font-size:0.8rem; }
        .battle-btn.attack { background:#e74c3c; color:#fff; }
        .battle-btn.defend { background:#3498db; color:#fff; }
        .battle-btn.skill { background:#f39c12; color:#fff; }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>
    <div class="toast" id="toast"></div>
    <script>
        (function() {
            // Supabase 初始化
            const SUPABASE_URL = 'https://siwacsnuminepetpxljh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpd2Fjc251bWluZXBldHB4bGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTcyMDAsImV4cCI6MjA5NDIzMzIwMH0.U4hMYHQiQr_LDLNbIR4yePDiJSIB1GNMb08InDasR9s';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // 全局状态
            const State = {
                currentUser: null, profile: null, farmPlots: [],
                friendIds: new Set(), friendProfiles: [],
                visitingFriend: null, visitingPlots: [],
                isSubmitting: false, pets: [], items: {}, equipment: [],
                battle: null
            };

            // 常量定义
            const CROPS = {
                carrot:    { name:'胡萝卜', emoji:'🥕', seed:20, growth:8,  min:50, max:80 },
                tomato:    { name:'番茄',   emoji:'🍅', seed:40, growth:10, min:70, max:100 },
                strawberry:{ name:'草莓',   emoji:'🍓', seed:60, growth:12, min:100, max:140 },
                corn:      { name:'玉米',   emoji:'🌽', seed:80, growth:15, min:130, max:180 }
            };
            const PET_TYPES = {
                cat:    { name:'橘猫', emoji:'🐱', cost:50,  time:2,   baseAttr:{hp:80, atk:18, def:5, spd:12, luk:8, sta:60}, skill:{name:'猫拳连击', cd:2} },
                dog:    { name:'柴犬', emoji:'🐶', cost:80,  time:3,   baseAttr:{hp:120, atk:12, def:10, spd:8, luk:5, sta:80}, skill:{name:'守护吠叫', cd:3} },
                rabbit: { name:'兔子', emoji:'🐰', cost:30,  time:1.5, baseAttr:{hp:60, atk:15, def:3, spd:18, luk:12, sta:40}, skill:{name:'电光一闪', cd:2} }
            };
            const ITEM_NAMES = {
                hair:'动物毛发', seed:'神秘种子', dew:'清水露珠', firefly:'萤火虫',
                ore:'矿石碎片', relic:'古代遗物', moonstone:'月光石', clover:'四叶草',
                feather:'精灵羽毛', scale:'龙鳞碎片', snowflake:'雪花结晶', sakura:'樱花花瓣'
            };
            const ITEM_EMOJI = {
                hair:'🧶', seed:'🌰', dew:'💧', firefly:'🪲',
                ore:'💎', relic:'🏺', moonstone:'🌙', clover:'🍀',
                feather:'🪶', scale:'🔮', snowflake:'❄️', sakura:'🌸'
            };
            const UNLOCK_REQUIREMENTS = [
                { items:{ hair:2, seed:2 }, friends:0 },
                { items:{ hair:3, seed:3 }, friends:0 },
                { items:{ seed:4, ore:2 }, friends:0 },
                { items:{ ore:3, relic:2 }, friends:0 },
                { items:{ ore:4, relic:3 }, friends:3 },
                { items:{ relic:5, feather:2 }, friends:5 },
                { items:{ feather:4, scale:2 }, friends:8 },
                { items:{ feather:5, scale:5 }, friends:10 }
            ];
            const SYNTHESIS_RECIPES = [
                { name:'锋利犬牙', slot:'weapon', quality:'white', materials:{ore:3, hair:2}, cost:200 },
                { name:'铁壳护甲', slot:'armor', quality:'white', materials:{ore:3, hair:2}, cost:200 },
                { name:'幸运铃铛', slot:'accessory', quality:'white', materials:{hair:2, clover:2}, cost:150 },
                { name:'烈焰犬牙', slot:'weapon', quality:'blue', materials:{ore:5, relic:2}, cost:500 },
                { name:'秘银护甲', slot:'armor', quality:'blue', materials:{ore:5, relic:2}, cost:500 },
                { name:'星光铃铛', slot:'accessory', quality:'blue', materials:{clover:4, moonstone:2}, cost:400 },
                { name:'龙焰犬牙', slot:'weapon', quality:'purple', materials:{relic:4, feather:2}, cost:1200 },
                { name:'传说犬牙', slot:'weapon', quality:'gold', materials:{scale:3, feather:3}, cost:3000 }
            ];

            // 工具函数
            function showToast(msg, isError=false) {
                const t = document.getElementById('toast');
                t.textContent = msg; t.style.background = isError ? '#c0392b' : '#3d3929';
                t.classList.add('show'); clearTimeout(t._timeout);
                t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
            }
            function escapeHTML(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
            function formatTime(iso) { if (!iso) return ''; const d = new Date(iso); const now = new Date(); const diff = now - d; const mins = Math.floor(diff / 60000); if (mins < 1) return '刚刚'; if (mins < 60) return `${mins}分钟前`; const hours = Math.floor(mins / 60); if (hours < 24) return `${hours}小时前`; return `${Math.floor(hours / 24)}天前`; }

            // 日志（只写自己）
            async function addEventLog(eventType, eventData) {
                try { await supabase.from('event_logs').insert({ user_id: State.currentUser.id, event_type: eventType, event_data: eventData }); } catch (e) { console.error('日志写入失败:', e); }
            }

            // 修复后的 addItem
            async function addItem(itemType, qty) {
                const { data: row, error: readError } = await supabase.from('player_items')
                    .select('quantity').eq('user_id', State.currentUser.id).eq('item_type', itemType).maybeSingle();
                if (readError) throw readError;
                const current = row ? row.quantity : 0;
                const newQty = Math.max(0, current + qty);
                if (newQty === 0) {
                    await supabase.from('player_items').delete().eq('user_id', State.currentUser.id).eq('item_type', itemType);
                    delete State.items[itemType];
                } else {
                    await supabase.from('player_items').upsert({ user_id: State.currentUser.id, item_type: itemType, quantity: newQty }, { onConflict: 'user_id,item_type' });
                    State.items[itemType] = newQty;
                }
            }

            // 数据加载
            async function loadProfile() {
                let { data, error } = await supabase.from('profiles').select('*').eq('id', State.currentUser.id).maybeSingle();
                if (error) throw error;
                if (!data) {
                    const username = State.currentUser.user_metadata?.username || '农夫';
                    const gender = State.currentUser.user_metadata?.gender || 'none';
                    await supabase.from('profiles').insert({ id:State.currentUser.id, username, gender, gold:200, unlocked_plots:4 });
                    for (let i=0; i<4; i++) await supabase.from('farm_plots').insert({ owner_id:State.currentUser.id, plot_index:i });
                    const { data:newProfile } = await supabase.from('profiles').select('*').eq('id',State.currentUser.id).single();
                    State.profile = newProfile;
                } else { State.profile = data; }
            }
            async function loadFarmPlots() {
                const { data, error } = await supabase.from('farm_plots').select('*').eq('owner_id', State.currentUser.id).order('plot_index');
                if (error) throw error; State.farmPlots = data || [];
                if (State.farmPlots.length === 0) {
                    for (let i=0; i<(State.profile?.unlocked_plots||4); i++) await supabase.from('farm_plots').insert({ owner_id:State.currentUser.id, plot_index:i });
                    const { data:newPlots } = await supabase.from('farm_plots').select('*').eq('owner_id',State.currentUser.id).order('plot_index');
                    State.farmPlots = newPlots || [];
                }
            }
            async function loadFriendData() {
                const { data: accepted } = await supabase.from('friendships')
                    .select('id, from_user, to_user, status')
                    .or(`from_user.eq.${State.currentUser.id},to_user.eq.${State.currentUser.id}`)
                    .eq('status', 'accepted');
                State.friendIds.clear(); const friendIdSet = new Set();
                (accepted||[]).forEach(f => {
                    const fid = f.from_user === State.currentUser.id ? f.to_user : f.from_user;
                    friendIdSet.add(fid);
                });
                State.friendIds = friendIdSet;
                if (friendIdSet.size > 0) {
                    const ids = Array.from(friendIdSet);
                    const { data: profiles } = await supabase.from('profiles').select('id, username, gender, gold').in('id', ids);
                    State.friendProfiles = profiles || [];
                } else { State.friendProfiles = []; }
            }
            async function loadPets() {
                const { data, error } = await supabase.from('pets').select('*').eq('owner_id', State.currentUser.id);
                if (error) throw error; State.pets = data || [];
                const now = new Date();
                for (let pet of State.pets) {
                    if (pet.exploring_until && new Date(pet.exploring_until) <= now) { await completeExploration(pet.id, true); }
                }
            }
            async function loadItems() {
                const { data, error } = await supabase.from('player_items').select('*').eq('user_id', State.currentUser.id);
                if (error) throw error; State.items = {};
                (data||[]).forEach(d => { State.items[d.item_type] = d.quantity; });
            }
            async function loadEquipment() {
                const { data, error } = await supabase.from('equipment').select('*').eq('owner_id', State.currentUser.id);
                if (error) throw error; State.equipment = data || [];
            }

            // 认证
            async function signUp(email, password, username, gender) {
                const { data, error } = await supabase.auth.signUp({ email, password, options:{ data:{ username, gender } } });
                if (error) throw error; return data;
            }
            async function signIn(email, password) {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                const token = crypto.randomUUID();
                await supabase.from('profiles').update({ session_token: token }).eq('id', data.user.id);
                localStorage.setItem('session_token', token);
                return data;
            }
            async function signOut() {
                await supabase.auth.signOut();
                localStorage.removeItem('session_token');
                Object.assign(State, { currentUser:null, profile:null, farmPlots:[], friendIds:new Set(), friendProfiles:[], visitingFriend:null, visitingPlots:[], pets:[], items:{}, equipment:[], battle:null });
                render();
            }

            // 农场操作
            async function plantCrop(plotIndex, cropType, growthMinutes) {
                const now = new Date().toISOString();
                const { data, error } = await supabase.from('farm_plots').update({
                    crop_type:cropType, planted_at:now, growth_minutes:growthMinutes, watered_at:null, stolen_count:0
                }).eq('owner_id', State.currentUser.id).eq('plot_index', plotIndex).select().single();
                if (error) throw error;
                addEventLog('plant', { crop: cropType });
                return data;
            }
            async function waterPlot(ownerId, plotIndex) {
                const now = new Date().toISOString();
                const { data, error } = await supabase.from('farm_plots').update({ watered_at:now })
                    .eq('owner_id', ownerId).eq('plot_index', plotIndex).select().single();
                if (error) throw error; return data;
            }
            async function harvestPlot(plotIndex) {
                const plot = State.farmPlots.find(p => p.plot_index === plotIndex);
                if (!plot || !plot.crop_type) return null;
                const cropInfo = CROPS[plot.crop_type];
                const reward = cropInfo ? Math.floor(Math.random()*(cropInfo.max - cropInfo.min + 1)) + cropInfo.min : 50;
                const newGold = (State.profile.gold || 0) + reward;
                await supabase.from('profiles').update({ gold:newGold }).eq('id', State.currentUser.id);
                await supabase.from('farm_plots').update({ crop_type:null, planted_at:null, watered_at:null, stolen_count:0 }).eq('owner_id', State.currentUser.id).eq('plot_index', plotIndex);
                State.profile.gold = newGold;
                addEventLog('harvest', { crop: plot.crop_type, gold: reward });
                return reward;
            }
            async function stealCrop(ownerId, plotIndex) {
                const { data: plot, error } = await supabase.from('farm_plots').select('*').eq('owner_id', ownerId).eq('plot_index', plotIndex).single();
                if (error || !plot || !plot.crop_type) throw new Error('无作物可偷');
                if (plot.stolen_count >= 2) throw new Error('已被偷光');
                const cropInfo = CROPS[plot.crop_type];
                const baseReward = Math.floor(Math.random()*(cropInfo.max - cropInfo.min + 1)) + cropInfo.min;
                const stealReward = Math.floor(baseReward * 0.4);
                const newGold = (State.profile.gold || 0) + stealReward;
                await supabase.from('profiles').update({ gold:newGold }).eq('id', State.currentUser.id);
                const { data: owner } = await supabase.from('profiles').select('gold, username').eq('id', ownerId).single();
                const ownerNewGold = (owner.gold || 0) - baseReward + (baseReward - stealReward);
                await supabase.from('profiles').update({ gold:ownerNewGold }).eq('id', ownerId);
                await supabase.from('farm_plots').update({ stolen_count: plot.stolen_count + 1 }).eq('owner_id', ownerId).eq('plot_index', plotIndex);
                State.profile.gold = newGold;
                addEventLog('steal_sent', { victim: owner.username, crop: plot.crop_type, gold: stealReward });
                return stealReward;
            }
            function getCropStatus(plot) {
                if (!plot.crop_type || !plot.planted_at) return { status:'empty' };
                const now = new Date(); const planted = new Date(plot.planted_at);
                let growthMs = plot.growth_minutes * 60 * 1000;
                if (plot.watered_at) growthMs = Math.floor(growthMs * 0.7);
                const matureTime = new Date(planted.getTime() + growthMs);
                if (now >= matureTime) return { status:'ready', progress:100 };
                const elapsed = now - planted; const progress = Math.floor((elapsed / growthMs) * 100);
                const remaining = matureTime - now; const remainingMin = Math.ceil(remaining / 60000);
                let waterable = true;
                if (plot.watered_at) { const lastWatered = new Date(plot.watered_at); waterable = (now - lastWatered) >= 30*60*1000; }
                return { status:'growing', progress, remainingMin, waterable };
            }

            // 宠物系统

                const base = PET_TYPES[petType].baseAttr;
                const { data, error } = await supabase.from('pets').insert({
                    owner_id: State.currentUser.id, pet_type: petType, pet_name: PET_TYPES[petType].name,
                    level:1, exp:0, hp:base.hp, atk:base.atk, def:base.def, spd:base.spd, luk:base.luk, sta:base.sta, hunger:100, happiness:100
                }).select().single();
                if (error) throw error; State.pets.push(data);
                addEventLog('adopt_pet', { pet: PET_TYPES[petType].name });
                return data;
            }
            async function startExplore(petId) {
                const pet = State.pets.find(p => p.id === petId);
                if (!pet) return;
                if (pet.exploring_until && new Date(pet.exploring_until) > new Date()) { showToast('宠物正在探险中'); return; }
                const petTypeInfo = PET_TYPES[pet.pet_type];
                if ((State.profile.gold || 0) < petTypeInfo.cost) { showToast('金币不足！', true); return; }
                await supabase.from('profiles').update({ gold: State.profile.gold - petTypeInfo.cost }).eq('id', State.currentUser.id);
                const exploreUntil = new Date(Date.now() + petTypeInfo.time * 3600000).toISOString();
                await supabase.from('pets').update({ exploring_until: exploreUntil, last_explored_at: new Date().toISOString() }).eq('id', petId);
                pet.exploring_until = exploreUntil; State.profile.gold -= petTypeInfo.cost;
                addEventLog('explore_start', { pet: pet.pet_name });
                showToast(`${pet.pet_name} 出发探险！花费🪙${petTypeInfo.cost}`);
                if (document.getElementById('modalPets')?.classList.contains('active')) { Farm.openPets(); } else { render(); }
            }
            async function completeExploration(petId, silent = false) {
                const pet = State.pets.find(p => p.id === petId);
                if (!pet || !pet.exploring_until) return null;
                const rewards = {}; const pool = [];
                if (pet.pet_type === 'cat') pool.push('hair','hair','hair','seed','dew','firefly','ore','feather');
                else if (pet.pet_type === 'dog') pool.push('ore','ore','relic','dew','firefly','hair','seed','scale');
                else pool.push('seed','seed','hair','dew','firefly','ore','clover','feather');
                const count = Math.floor(Math.random()*2)+1;
                for (let i=0; i<count; i++) { const item = pool[Math.floor(Math.random()*pool.length)]; rewards[item] = (rewards[item]||0)+1; }
                const newExp = (pet.exp||0) + 30; let newLevel = pet.level || 1;
                if (newExp >= newLevel * 100) { newLevel++; }
                await supabase.from('pets').update({ exploring_until: null, exp: newExp, level: newLevel }).eq('id', petId);
                pet.exploring_until = null; pet.exp = newExp; pet.level = newLevel;
                for (const [item, qty] of Object.entries(rewards)) { await addItem(item, qty); }
                addEventLog('explore_complete', { pet: pet.pet_name, rewards });
                if (!silent) { const rewardText = Object.entries(rewards).map(([item, qty]) => `${ITEM_EMOJI[item]}×${qty}`).join(' '); showToast(`${pet.pet_name} 探险归来！获得 ${rewardText}`); }
                return rewards;
            }

            // 装备系统
            async function synthesizeEquipment(recipe) {
                for (const [item, needed] of Object.entries(recipe.materials)) { if ((State.items[item]||0) < needed) { showToast(`材料不足：${ITEM_NAMES[item]}×${needed}`, true); return; } }
                if ((State.profile.gold||0) < recipe.cost) { showToast('金币不足', true); return; }
                for (const [item, needed] of Object.entries(recipe.materials)) { await addItem(item, -needed); }
                await supabase.from('profiles').update({ gold: State.profile.gold - recipe.cost }).eq('id', State.currentUser.id);
                State.profile.gold -= recipe.cost;
                let quality = recipe.quality; const rand = Math.random();
                if (recipe.quality === 'white' && rand > 0.7) { quality = rand > 0.95 ? 'blue' : 'white'; }
                else if (recipe.quality === 'blue' && rand > 0.75) { quality = rand > 0.96 ? 'purple' : 'blue'; }
                const atkBonus = quality === 'gold' ? 30 : quality === 'purple' ? 20 : quality === 'blue' ? 15 : 10;
                const defBonus = recipe.slot === 'armor' ? (quality === 'gold' ? 20 : quality === 'purple' ? 15 : 10) : 0;
                const lukBonus = recipe.slot === 'accessory' ? (quality === 'gold' ? 15 : 10) : 0;
                const { data, error } = await supabase.from('equipment').insert({ owner_id: State.currentUser.id, name: recipe.name, slot: recipe.slot, quality, atk_bonus: atkBonus, def_bonus: defBonus, luk_bonus: lukBonus }).select().single();
                if (error) throw error; State.equipment.push(data);
                addEventLog('synthesis', { name: data.name, quality }); showToast(`合成成功！获得 ${data.name} (${quality})`);
            }
            async function enhanceEquipment(equipId) {
                const equip = State.equipment.find(e => e.id === equipId); if (!equip) return;
                if (equip.enhance_level >= 5) { showToast('已达最高强化等级'); return; }
                const cost = (equip.enhance_level + 1) * 200;
                if ((State.profile.gold||0) < cost) { showToast('金币不足', true); return; }
                const probs = [0.95, 0.85, 0.7, 0.55, 0.35]; const success = Math.random() < probs[equip.enhance_level];
                await supabase.from('profiles').update({ gold: State.profile.gold - cost }).eq('id', State.currentUser.id);
                State.profile.gold -= cost;
                if (success) { const newLevel = equip.enhance_level + 1; await supabase.from('equipment').update({ enhance_level: newLevel }).eq('id', equipId); equip.enhance_level = newLevel; showToast(`强化成功！+${newLevel}`); }
                else { const newLevel = Math.max(0, equip.enhance_level - 1); await supabase.from('equipment').update({ enhance_level: newLevel }).eq('id', equipId); equip.enhance_level = newLevel; showToast('强化失败，降级了...', true); }
                addEventLog('enhance', { name: equip.name, level: equip.enhance_level, success });
            }

            // 地块解锁
            async function unlockPlot() {
                const unlocked = State.profile.unlocked_plots || 4; if (unlocked >= 12) return;
                const req = UNLOCK_REQUIREMENTS[unlocked - 4];
                for (const [item, needed] of Object.entries(req.items)) { if ((State.items[item]||0) < needed) { showToast(`需要 ${ITEM_EMOJI[item]}${ITEM_NAMES[item]}×${needed}`, true); return; } }

                for (const [item, needed] of Object.entries(req.items)) { await addItem(item, -needed); }
                await supabase.from('profiles').update({ unlocked_plots: unlocked+1 }).eq('id', State.currentUser.id);
                await supabase.from('farm_plots').insert({ owner_id:State.currentUser.id, plot_index: unlocked });

            // 战斗系统
            function calculateDamage(attacker, defender, isSkill = false) {
                const atk = attacker.atk + (attacker.equipAtk || 0);
                const def = defender.def + (defender.equipDef || 0);
                let damage = Math.max(1, atk - def + Math.floor(Math.random()*10));
                if (isSkill) damage = Math.floor(damage * 1.3);
                return damage;
            }
            async function startBattle(myPetId, friendId) {
                if (State.isSubmitting) return; State.isSubmitting = true;
                try {
                    const { data: friend } = await supabase.from('profiles').select('id, username').eq('id', friendId).single();
                    if (!friend) throw new Error('好友不存在');
                    const { data: friendPets } = await supabase.from('pets').select('*').eq('owner_id', friendId);
                    if (!friendPets || friendPets.length === 0) throw new Error('好友没有宠物');
                    const opponentPet = friendPets[Math.floor(Math.random() * friendPets.length)];
                    State.battle = {
                        myPet: { ...State.pets.find(p => p.id === myPetId) },
                        opponentPet: { ...opponentPet },
                        myCurrentHp: State.pets.find(p => p.id === myPetId).hp,
                        opponentCurrentHp: opponentPet.hp,
                        log: [], friendId: friendId, friendName: friend.username
                    };
                    render();
                } catch (e) { showToast(e.message || '战斗初始化失败', true); }
                finally { State.isSubmitting = false; }
            }
            function executeBattleAction(action) {
                if (!State.battle) return;
                const b = State.battle;
                // 执行回合
                if (action === 'attack') {
                    const dmg = calculateDamage(b.myPet, b.opponentPet);
                    b.opponentCurrentHp = Math.max(0, b.opponentCurrentHp - dmg);
                    b.log.push(`你的 ${b.myPet.pet_name} 攻击，造成 ${dmg} 点伤害`);
                } else if (action === 'defend') {
                    b.log.push('你选择防御');
                } else if (action === 'skill') {
                    const dmg = calculateDamage(b.myPet, b.opponentPet, true);
                    b.opponentCurrentHp = Math.max(0, b.opponentCurrentHp - dmg);
                    b.log.push(`你的 ${b.myPet.pet_name} 使用技能，造成 ${dmg} 点伤害`);
                }
                // 对手反击
                if (b.opponentCurrentHp > 0) {
                    const oppDmg = calculateDamage(b.opponentPet, b.myPet);
                    b.myCurrentHp = Math.max(0, b.myCurrentHp - oppDmg);
                    b.log.push(`对手 ${b.opponentPet.pet_name} 攻击，造成 ${oppDmg} 点伤害`);
                }
                // 胜负判定
                if (b.myCurrentHp <= 0) { b.log.push('你输了！'); endBattle(false); }
                else if (b.opponentCurrentHp <= 0) { b.log.push('你赢了！'); endBattle(true); }
                render();
            }
            async function endBattle(won) {
                const b = State.battle; if (!b) return;
                await supabase.from('battle_logs').insert({
                    attacker_id: State.currentUser.id, defender_id: b.friendId,
                    attacker_pet_id: b.myPet.id, defender_pet_id: b.opponentPet.id,
                    winner_id: won ? State.currentUser.id : b.friendId,
                    battle_data: { log: b.log }
                });
                if (won) {
                    const goldReward = 50 + Math.floor(Math.random()*50);
                    await supabase.from('profiles').update({ gold: State.profile.gold + goldReward }).eq('id', State.currentUser.id);
                    State.profile.gold += goldReward;
                    addEventLog('battle_win', { opponent: b.friendName, gold: goldReward });

                } else {
                    addEventLog('battle_lose', { opponent: b.friendName });
                }
                State.battle = null;
                await loadPets();
                render();
            }

                    });
                },
                async refresh(mode) {
                    const listEl = document.getElementById('leaderboardList');
                    const reqArea = document.getElementById('friendRequestsArea');
                    listEl.innerHTML = '<p style="text-align:center;color:#888;">加载中...</p>';
                    reqArea.style.display = 'none';
                    const { data: allProfiles } = await supabase.from('profiles').select('id, username, gold, gender').order('gold', { ascending: false });
                    const { data: friendships } = await supabase.from('friendships').select('id, from_user, to_user, status').or(`from_user.eq.${State.currentUser.id},to_user.eq.${State.currentUser.id}`);
                    const friendIdSet = new Set(); const sentSet = new Set(); const received = [];
                    (friendships||[]).forEach(f => {
                        if (f.status === 'accepted') { const fid = f.from_user === State.currentUser.id ? f.to_user : f.from_user; friendIdSet.add(fid); }
                        else if (f.status === 'pending') { if (f.from_user === State.currentUser.id) sentSet.add(f.to_user); else received.push(f); }
                    });
                    State.friendIds = friendIdSet;
                    if (received.length > 0 && mode === 'global') {
                        reqArea.style.display = 'block';
                        reqArea.innerHTML = '<strong>好友申请</strong>' + received.map(req => {
                            const sender = allProfiles?.find(p => p.id === req.from_user);
                            return `<div class="list-item" style="justify-content:space-between;"><span>${escapeHTML(sender?.username || '未知')}</span><div><button class="btn-small btn-accept" data-req-id="${req.id}" data-from="${req.from_user}">接受</button><button class="btn-small btn-reject" data-req-id="${req.id}">拒绝</button></div></div>`;
                        }).join('');
                        reqArea.querySelectorAll('.btn-accept').forEach(btn => {
                            btn.onclick = async () => {
                                const reqId = btn.dataset.reqId; const fromId = btn.dataset.from;
                                try { await supabase.from('friendships').update({ status:'accepted' }).eq('id', reqId); addEventLog('friend_accepted', { friend: allProfiles?.find(p=>p.id===fromId)?.username || '好友' }); showToast('已接受好友申请！'); await Leaderboard.refresh('global'); } catch (err) { showToast('操作失败', true); }
                            };
                        });
                        reqArea.querySelectorAll('.btn-reject').forEach(btn => {
                            btn.onclick = async () => { const reqId = btn.dataset.reqId; try { await supabase.from('friendships').delete().eq('id', reqId); showToast('已拒绝'); await Leaderboard.refresh('global'); } catch (err) { showToast('操作失败', true); } };
                        });
                    }
                    let ranked = allProfiles || [];
                    if (mode === 'friends') {
                        ranked = ranked.filter(p => friendIdSet.has(p.id));
                        if (!friendIdSet.has(State.currentUser.id) && State.profile) { ranked.push({ id:State.currentUser.id, username:State.profile.username, gold:State.profile.gold, gender:State.profile.gender }); ranked.sort((a, b) => (b.gold || 0) - (a.gold || 0)); }
                    }
                    listEl.innerHTML = ranked.map((p, idx) => {
                        const rank = idx + 1; const isMe = p.id === State.currentUser.id; const isFriend = friendIdSet.has(p.id); const isSent = sentSet.has(p.id);
                        let actionBtn = '';
                        if (isMe) actionBtn = '<span class="tag-self">（我）</span>';
                        else if (isFriend) actionBtn = '<span class="tag-friend">好友</span>';
                        else if (isSent) actionBtn = '<button class="btn-small" disabled style="background:#ccc;">已申请</button>';
                        else actionBtn = `<button class="btn-small btn-adopt" data-uid="${p.id}">+好友</button>`;
                        const genderClass = p.gender||'none'; const avatarLetter = (p.username||'?')[0];
                        const rankColor = rank <= 3 ? '#f0c040' : 'var(--accent)';
                        return `<div class="list-item"><span class="rank-span" style="color:${rankColor};">${rank}</span><div class="avatar ${genderClass}" style="width:30px;height:30px;">${avatarLetter}</div><span style="flex:1;">${escapeHTML(p.username||'匿名')}</span><span style="color:var(--accent);">🪙${p.gold||0}</span>${actionBtn}</div>`;
                    }).join('');
                    listEl.querySelectorAll('.btn-adopt:not([disabled])').forEach(btn => {
                        btn.onclick = async () => { const uid = btn.dataset.uid; try { await supabase.from('friendships').insert({ from_user:State.currentUser.id, to_user:uid }); showToast('好友申请已发送！'); await Leaderboard.refresh('global'); } catch (err) { showToast('发送失败', true); } };
                    });
                }
            };

            // 战斗界面
            const Battle = {
                render() {
                    const b = State.battle; if (!b) return '';
                    return `<div class="header"><div class="user-info"><span>⚔️ 对战 ${b.friendName}</span></div><button class="btn-icon" id="btnFlee">逃跑</button></div>
                    <div class="battle-container">
                        <div class="battle-pet"><div style="font-size:2rem;">${PET_TYPES[b.myPet.pet_type].emoji}</div><div>${b.myPet.pet_name}</div><div class="battle-hp"><div class="battle-hp-fill" style="width:${(b.myCurrentHp/b.myPet.hp*100)}%"></div></div><div>${b.myCurrentHp}/${b.myPet.hp}</div></div>
                        <div>VS</div>
                        <div class="battle-pet"><div style="font-size:2rem;">${PET_TYPES[b.opponentPet.pet_type].emoji}</div><div>${b.opponentPet.pet_name}</div><div class="battle-hp"><div class="battle-hp-fill" style="width:${(b.opponentCurrentHp/b.opponentPet.hp*100)}%"></div></div><div>${b.opponentCurrentHp}/${b.opponentPet.hp}</div></div>
                    </div>
                    <div class="battle-log">${b.log.map(l => `<div>${l}</div>`).join('')}</div>
                    <div class="battle-actions">
                        <button class="battle-btn attack" id="btnAttack">⚔️攻击</button>
                        <button class="battle-btn defend" id="btnDefend">🛡️防御</button>
                        <button class="battle-btn skill" id="btnSkill">🔥技能</button>
                    </div>`;
                },
                bindEvents() {
                    document.getElementById('btnAttack').onclick = () => executeBattleAction('attack');
                    document.getElementById('btnDefend').onclick = () => executeBattleAction('defend');
                    document.getElementById('btnSkill').onclick = () => executeBattleAction('skill');
                    document.getElementById('btnFlee').onclick = () => { State.battle = null; render(); };
                }
            };

            // 主界面
            const Farm = {
                render() {
                    const unlocked = State.profile?.unlocked_plots || 4;
                    const plotsHTML = State.farmPlots.filter(p => p.plot_index < unlocked).map(p => Farm.plotHTML(p)).join('');
                    const genderClass = State.profile?.gender || 'none';
                    return `
                    <div class="header">
                        <div class="user-info"><div class="avatar ${genderClass}">${(State.profile?.username||'农')[0]}</div><div><div class="username">${escapeHTML(State.profile?.username||'农夫')}</div><div class="level">地块${unlocked}/12 · 宠物${State.pets.length}只</div></div></div>
                        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                            <span class="gold">🪙${State.profile?.gold||0}</span>
                            <button class="btn-icon" id="btnLeaderboard" title="排行榜">🏆</button>
                            <button class="btn-icon" id="btnFriends" title="好友">👥</button>
                            <button class="btn-icon" id="btnPets" title="宠物">🐾</button>
                            <button class="btn-icon" id="btnBackpack" title="背包">🎒</button>
                            <button class="btn-icon" id="btnSynthesis" title="合成台">🔧</button>
                            <button class="btn-icon" id="btnEquipment" title="装备">⚔️</button>
                            <button class="btn-icon" id="btnEventLog" title="事件日志">📋</button>
                            <button class="btn-icon" id="btnLogout" title="退出登录">🚪</button>
                        </div>
                    </div>
                    <div class="farm-grid" id="farmGrid">${plotsHTML}</div>
                    ${unlocked < 12 ? `<div class="unlock-section"><button class="btn-unlock" id="btnUnlock">🔓 解锁地块 (${unlocked}/12)</button></div>` : '<p style="text-align:center;color:var(--accent);">🎉 所有地块已解锁！</p>'}
                    <!-- 种植弹窗 -->
                    <div class="modal-overlay" id="modalPlant">
                        <div class="modal"><h3>🌱 选择作物</h3><div class="crop-options">${Object.entries(CROPS).map(([key,info])=>`<button class="crop-btn" data-crop="${key}" data-time="${info.growth}" data-price="${info.seed}"><div style="font-size:2rem;">${info.emoji}</div><div>${info.name}</div><div style="font-size:0.7rem;">🪙${info.seed} ⏱${info.growth}分</div></button>`).join('')}</div><button class="btn-close" id="closePlantModal">取消</button></div>
                    </div>
                    <!-- 浇水弹窗 -->
                    <div class="modal-overlay" id="modalWater">
                        <div class="modal"><h3>💧 浇水</h3><p id="waterPlotInfo">要浇水吗？</p><button class="btn-water" id="confirmWater" style="background:#6ba3be;color:#fff;border:none;border-radius:20px;padding:8px 24px;">浇水（加速30%）</button><button class="btn-close" id="closeWaterModal">取消</button></div>
                    </div>
                    <!-- 宠物弹窗 -->
                    <div class="modal-overlay" id="modalPets">
                        <div class="modal" style="max-width:400px;"><h3>🐾 宠物</h3><div id="petListContainer" class="list-container"></div><button class="btn-close" id="closePetsModal">关闭</button></div>
                    </div>
                    <!-- 背包弹窗 -->
                    <div class="modal-overlay" id="modalBackpack">
                        <div class="modal" style="max-width:400px;"><h3>🎒 背包</h3><div id="itemListContainer" class="list-container"></div><button class="btn-close" id="closeBackpackModal">关闭</button></div>
                    </div>
                    <!-- 合成台弹窗 -->
                    <div class="modal-overlay" id="modalSynthesis">
                        <div class="modal" style="max-width:400px;"><h3>🔧 合成台</h3><div id="synthesisList" class="list-container"></div><button class="btn-close" id="closeSynthesisModal">关闭</button></div>
                    </div>
                    <!-- 装备弹窗 -->
                    <div class="modal-overlay" id="modalEquipment">
                        <div class="modal" style="max-width:400px;"><h3>⚔️ 装备</h3><div id="equipmentList" class="list-container"></div><button class="btn-close" id="closeEquipmentModal">关闭</button></div>
                    </div>
                    <!-- 日志弹窗 -->
                    <div class="modal-overlay" id="modalEventLog">
                        <div class="modal" style="max-width:400px;"><h3>📋 事件日志</h3><button class="btn-refresh" id="btnRefreshLog">🔄 刷新</button><div id="eventLogContainer" class="list-container" style="max-height:60vh;overflow-y:auto;"></div><button class="btn-close" id="closeEventLogModal">关闭</button></div>
                    </div>
                    <!-- 好友弹窗 -->
                    <div class="modal-overlay" id="modalFriends">
                        <div class="modal" style="max-width:400px;"><h3>👥 好友</h3><div id="friendListContainer" class="list-container"></div><button class="btn-close" id="closeFriendsModal">关闭</button></div>
                    </div>
                    <!-- 排行榜弹窗 -->
                    <div class="modal-overlay" id="modalLeaderboard">
                        <div class="modal" style="max-width:400px;">
                            <div style="display:flex;gap:6px;margin-bottom:12px;"><button class="auth-tab active" data-lb-tab="global">全服排行</button><button class="auth-tab" data-lb-tab="friends">好友排行</button></div>
                            <div class="friend-requests" id="friendRequestsArea" style="display:none;"></div>
                            <div class="list-container" id="leaderboardList"></div>
                            <button class="btn-close" id="closeLeaderboardModal">关闭</button>
                        </div>
                    </div>`;
                },
                plotHTML(plot) {
                    const status = getCropStatus(plot);
                    let emoji, statusText, progressBar='', cardClass='';
                    if (status.status === 'empty') { emoji = '🌾'; statusText = '空地'; cardClass = 'empty'; }
                    else if (status.status === 'ready') { emoji = CROPS[plot.crop_type]?.emoji || '🌱'; statusText = '✨可收获'; cardClass = 'ready'; }
                    else {
                        emoji = CROPS[plot.crop_type]?.emoji || '🌱';
                        const waterHint = status.waterable ? '可浇水💧' : '加速中🔥';
                        const waterClass = status.waterable ? 'waterable' : 'watered';
                        statusText = `<span class="${waterClass}">${waterHint}</span> 剩${status.remainingMin}分`;
                        cardClass = 'planted';
                        progressBar = `<div class="progress-bar"><div class="progress-fill" style="width:${status.progress}%"></div></div>`;
                    }
                    return `<div class="plot-card ${cardClass}" data-plot="${plot.plot_index}">
                        <div class="plot-emoji">${emoji}</div>
                        <div style="font-size:0.8rem;">${CROPS[plot.crop_type]?.name||'空地'}</div>
                        <div class="plot-status">${statusText}</div>${progressBar}
                    </div>`;
                },
                bindEvents() {
                    document.getElementById('btnLogout').onclick = signOut;
                    document.getElementById('btnLeaderboard').onclick = () => Leaderboard.open();
                    document.getElementById('btnFriends').onclick = () => Farm.openFriendsList();
                    document.getElementById('btnPets').onclick = () => Farm.openPets();
                    document.getElementById('btnBackpack').onclick = () => Farm.openBackpack();
                    document.getElementById('btnSynthesis').onclick = () => Farm.openSynthesis();
                    document.getElementById('btnEquipment').onclick = () => Farm.openEquipment();
                    document.getElementById('btnEventLog').onclick = () => Farm.openEventLog();
                    document.getElementById('closePlantModal').onclick = () => document.getElementById('modalPlant').classList.remove('active');
                    document.getElementById('closeWaterModal').onclick = () => document.getElementById('modalWater').classList.remove('active');
                    document.getElementById('closePetsModal').onclick = () => document.getElementById('modalPets').classList.remove('active');
                    document.getElementById('closeBackpackModal').onclick = () => document.getElementById('modalBackpack').classList.remove('active');
                    document.getElementById('closeSynthesisModal').onclick = () => document.getElementById('modalSynthesis').classList.remove('active');
                    document.getElementById('closeEquipmentModal').onclick = () => document.getElementById('modalEquipment').classList.remove('active');
                    document.getElementById('closeEventLogModal').onclick = () => document.getElementById('modalEventLog').classList.remove('active');
                    document.getElementById('closeFriendsModal').onclick = () => document.getElementById('modalFriends').classList.remove('active');
                    document.getElementById('closeLeaderboardModal').onclick = () => document.getElementById('modalLeaderboard').classList.remove('active');
                    document.getElementById('btnUnlock')?.addEventListener('click', async () => { if (State.isSubmitting) return; State.isSubmitting = true; try { await unlockPlot(); } catch(e) { showToast(e.message||'解锁失败', true); } finally { State.isSubmitting = false; } });
                    document.getElementById('confirmWater').onclick = async () => { /* ... 浇水逻辑 ... */ };
                    document.getElementById('farmGrid').onclick = (e) => { /* ... 农田点击逻辑 ... */ };
                },
                updateGrid() {
                    const unlocked = State.profile?.unlocked_plots || 4;
                    const plotsHTML = State.farmPlots.filter(p => p.plot_index < unlocked).map(p => Farm.plotHTML(p)).join('');
                    document.getElementById('farmGrid').innerHTML = plotsHTML;
                    document.querySelector('.gold').textContent = `🪙${State.profile?.gold||0}`;
                },
                openFriendsList() {
                    document.getElementById('modalFriends').classList.add('active');
                    const container = document.getElementById('friendListContainer');
                    if (State.friendProfiles.length === 0) { container.innerHTML = '<p>还没有好友，去排行榜添加吧！</p>'; return; }
                    container.innerHTML = State.friendProfiles.map(f => `
                        <div class="list-item" data-friend-id="${f.id}">
                            <div class="avatar ${f.gender||'none'}" style="width:30px;height:30px;">${(f.username||'?')[0]}</div>
                            <span style="flex:1;">${escapeHTML(f.username||'匿名')}</span>
                            <span style="color:var(--accent);">🪙${f.gold||0}</span>
                            <button class="btn-small btn-fight" data-friend-id="${f.id}">切磋</button>
                        </div>`).join('');
                    container.querySelectorAll('.list-item').forEach(item => {
                        item.onclick = () => {
                            const friendId = item.dataset.friendId;
                            const friend = State.friendProfiles.find(p => p.id === friendId);
                            if (friend) {
                                State.visitingFriend = friend;
                                supabase.from('farm_plots').select('*').eq('owner_id', friendId).order('plot_index').then(({data}) => { State.visitingPlots = data || []; document.getElementById('modalFriends').classList.remove('active'); render(); });
                            }
                        };
                    });
                    container.querySelectorAll('.btn-fight').forEach(btn => {
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            const friendId = btn.dataset.friendId;
                            if (State.pets.length === 0) { showToast('你没有可用的宠物'); return; }
                            // 弹出宠物选择列表
                            const overlay = document.createElement('div');
                            overlay.className = 'modal-overlay active';
                            overlay.innerHTML = `<div class="modal"><h3>选择宠物切磋</h3>${State.pets.map(p => `<button class="btn-small btn-adopt" style="margin:2px;" data-pet-id="${p.id}">${p.pet_name} Lv.${p.level}</button>`).join('')}<button class="btn-close" id="cancelFight">取消</button></div>`;
                            document.body.appendChild(overlay);
                            overlay.querySelector('#cancelFight').onclick = () => overlay.remove();
                            overlay.querySelectorAll('.btn-adopt').forEach(petBtn => {
                                petBtn.onclick = async () => {
                                    const petId = parseInt(petBtn.dataset.petId);
                                    overlay.remove();
                                    await startBattle(petId, friendId);
                                };
                            });
                        };
                    });
                },
                openPets() { /* ... 同之前版本 ... */ },
                openBackpack() { /* ... */ },
                openSynthesis() { /* ... */ },
                openEquipment() { /* ... */ },
                openEventLog() { /* ... */ }
            };

            let growthTimer;
            function startGrowthTimer() {
                if (growthTimer) clearInterval(growthTimer);
                growthTimer = setInterval(() => {
                    if (!State.visitingFriend && !State.battle && document.getElementById('farmGrid')) { Farm.updateGrid(); }
                }, 30000);
            }

            // 启动
            async function init() {
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    State.currentUser = data.session.user;
                    try {
                        State.profile = (await supabase.from('profiles').select('*').eq('id', State.currentUser.id).single()).data;
                        const localToken = localStorage.getItem('session_token');
                        if (State.profile.session_token && State.profile.session_token !== localToken) { showToast('账号在其他设备登录，请重新登录', true); await signOut(); return; }
                        await loadFarmPlots(); await loadFriendData(); await loadPets(); await loadItems(); await loadEquipment();
                    } catch(e) { console.error(e); }
                }
                render();
            }
            init();
        })();
    </script>
</body>
</html>

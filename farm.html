<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🌱 我的农场 - 基础种菜</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f5f0eb;
            --card: #ffffff;
            --text: #3d3929;
            --accent: #c0844e;
            --green: #6b8f71;
            --red: #c0392b;
            --blue: #5b7fbc;
            --pink: #d4869c;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 30% 20%, rgba(139, 158, 123, 0.1) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 头部 */
        .header {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .avatar.male { background: var(--blue); }
        .avatar.female { background: var(--pink); }
        .avatar.none { background: #aaa; }

        .username {
            font-weight: 600;
            color: var(--text);
        }

        .level {
            font-size: 0.75rem;
            color: #888;
        }

        .gold {
            font-weight: 700;
            color: var(--accent);
        }

        .btn-icon {
            padding: 8px 16px;
            background: #e8e0d5;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            white-space: nowrap;
        }

        /* 农田网格 */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .plot-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 10px;
            text-align: center;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            user-select: none;
        }

        .plot-card:active {
            transform: scale(0.96);
            background: #f9f6f0;
        }

        .plot-card.empty {
            border: 2px dashed #d5cec0;
            color: #b0a590;
        }

        .plot-card.planted {
            border: 2px solid #c5d5b0;
        }

        .plot-card.ready {
            border: 2px solid #f0c040;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(240, 192, 64, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(240, 192, 64, 0); }
        }

        .plot-emoji {
            font-size: 2.5rem;
        }

        .plot-status {
            font-size: 0.75rem;
            color: #888;
            line-height: 1.3;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 3px;
            transition: width 1s linear;
        }

        /* 解锁地块按钮 */
        .unlock-section {
            text-align: center;
            margin-top: 4px;
        }

        .btn-unlock {
            padding: 12px 20px;
            background: #fdfcf9;
            border: 2px dashed #d4b896;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--accent);
            transition: all 0.2s;
        }

        .btn-unlock:hover {
            background: #fef9f3;
            border-color: var(--accent);
        }

        /* 弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 24px;
            max-width: 360px;
            width: 90%;
            text-align: center;
        }

        .modal h3 {
            margin-bottom: 16px;
            color: var(--text);
        }

        .crop-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .crop-btn {
            padding: 14px;
            border: 2px solid #e0d8cc;
            border-radius: 12px;
            background: #fdfcf9;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .crop-btn:hover {
            border-color: var(--accent);
            background: #fef9f3;
        }

        .crop-btn .crop-emoji {
            font-size: 2rem;
        }

        .crop-btn .crop-name {
            font-weight: 600;
            margin: 4px 0;
        }

        .crop-btn .crop-time {
            font-size: 0.75rem;
            color: #888;
        }

        .btn-close {
            padding: 8px 24px;
            background: #e8e0d5;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
        }

        /* 注册表单 */
        .auth-form {
            background: var(--card);
            border-radius: var(--radius);
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .auth-form h1 {
            text-align: center;
            margin-bottom: 6px;
            color: var(--text);
        }

        .auth-form .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e0d8cc;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        /* 性别选择器 */
        .gender-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .gender-option {
            flex: 1;
            min-width: 80px;
            padding: 10px 6px;
            border: 1.5px solid #e0d8cc;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fdfcf9;
            position: relative;
        }

        .gender-option input {
            display: none;
        }

        .gender-option:has(input:checked) {
            border-color: var(--accent);
            background: #fef9f3;
        }

        .gender-label {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }

        .gender-option:has(input:checked) .gender-label {
            color: var(--accent);
            font-weight: 700;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #a06b3a;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 8px;
            font-family: inherit;
        }

        .msg-error {
            color: var(--red);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 8px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #3d3929;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="app"></div>
    <div class="toast" id="toast"></div>

    <script>
        // ===================== Supabase 配置 =====================
        const SUPABASE_URL = 'https://siwacsnuminepetpxljh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpd2Fjc251bWluZXBldHB4bGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTcyMDAsImV4cCI6MjA5NDIzMzIwMH0.U4hMYHQiQr_LDLNbIR4yePDiJSIB1GNMb08InDasR9s';

        // 初始化客户端，变量名改为 supabaseClient，避免与全局 supabase 冲突
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===================== 全局状态 =====================
        let currentUser = null;
        let profile = null;
        let farmPlots = [];
        let selectedPlotIndex = null;

        // ===================== 工具函数 =====================
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ===================== 认证相关 =====================
        async function signUp(email, password, username, gender) {
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: { username, gender }
                }
            });
            if (error) throw error;
            return data;
        }

        async function signIn(email, password) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            return data;
        }

        async function signOut() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            profile = null;
            farmPlots = [];
            render();
        }

        // ===================== 数据加载 =====================
        async function loadProfile() {
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();
            if (error) throw error;
            profile = data;
        }

        async function loadFarmPlots() {
            const { data, error } = await supabaseClient
                .from('farm_plots')
                .select('*')
                .eq('owner_id', currentUser.id)
                .order('plot_index');
            if (error) throw error;
            farmPlots = data || [];
        }

        // ===================== 农场操作 =====================
        async function plantCrop(plotIndex, cropType, growthMinutes) {
            const now = new Date().toISOString();
            const { error } = await supabaseClient
                .from('farm_plots')
                .update({
                    crop_type: cropType,
                    planted_at: now,
                    growth_minutes: growthMinutes,
                    watered_at: null,
                    stolen_count: 0
                })
                .eq('owner_id', currentUser.id)
                .eq('plot_index', plotIndex);
            if (error) throw error;
        }

        async function waterPlot(plotIndex) {
            const now = new Date().toISOString();
            const { error } = await supabaseClient
                .from('farm_plots')
                .update({ watered_at: now })
                .eq('owner_id', currentUser.id)
                .eq('plot_index', plotIndex);
            if (error) throw error;
        }

        async function harvestPlot(plotIndex) {
            const plot = farmPlots.find(p => p.plot_index === plotIndex);
            if (!plot || !plot.crop_type) return;

            const reward = 50 + Math.floor(Math.random() * 30);

            const { error: profileError } = await supabaseClient
                .from('profiles')
                .update({ gold: (profile.gold || 0) + reward })
                .eq('id', currentUser.id);
            if (profileError) throw profileError;

            const { error: plotError } = await supabaseClient
                .from('farm_plots')
                .update({
                    crop_type: null,
                    planted_at: null,
                    watered_at: null,
                    stolen_count: 0
                })
                .eq('owner_id', currentUser.id)
                .eq('plot_index', plotIndex);
            if (plotError) throw plotError;

            profile.gold = (profile.gold || 0) + reward;
            return reward;
        }

        // ===================== 计算作物状态 =====================
        function getCropStatus(plot) {
            if (!plot.crop_type || !plot.planted_at) return { status: 'empty' };

            const now = new Date();
            const planted = new Date(plot.planted_at);
            const growthMs = plot.growth_minutes * 60 * 1000;
            const matureTime = new Date(planted.getTime() + growthMs);

            if (now >= matureTime) {
                return { status: 'ready', progress: 100 };
            } else {
                const elapsed = now - planted;
                const progress = Math.floor((elapsed / growthMs) * 100);
                const remaining = matureTime - now;
                const remainingMin = Math.ceil(remaining / 60000);
                return { status: 'growing', progress, remainingMin };
            }
        }

        function getCropEmoji(cropType) {
            const map = {
                'tomato': '🍅',
                'carrot': '🥕',
                'corn': '🌽',
                'strawberry': '🍓',
                'pumpkin': '🎃',
                'sunflower': '🌻'
            };
            return map[cropType] || '🌱';
        }

        function getCropName(cropType) {
            const map = {
                'tomato': '番茄',
                'carrot': '胡萝卜',
                'corn': '玉米',
                'strawberry': '草莓',
                'pumpkin': '南瓜',
                'sunflower': '向日葵'
            };
            return map[cropType] || cropType;
        }

        // ===================== 渲染 =====================
        function render() {
            const app = document.getElementById('app');

            if (!currentUser) {
                app.innerHTML = renderAuthForm();
                bindAuthEvents();
            } else {
                app.innerHTML = renderFarm();
                bindFarmEvents();
                startGrowthTimer();
            }
        }

        function renderAuthForm() {
            return `
                <div class="auth-form" id="authForm">
                    <h1>🌱 开心农场</h1>
                    <p class="subtitle">种菜 · 偷菜 · 养宠物</p>
                    <div class="form-group">
                        <label>昵称</label>
                        <input type="text" id="authUsername" placeholder="请输入昵称" maxlength="12">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="authEmail" placeholder="请输入邮箱">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="authPassword" placeholder="请输入密码（至少6位）">
                    </div>
                    <div class="form-group">
                        <label>性别（选填）</label>
                        <div class="gender-selector">
                            <label class="gender-option">
                                <input type="radio" name="gender" value="male">
                                <span class="gender-label">👨‍🌾 男士</span>
                            </label>
                            <label class="gender-option">
                                <input type="radio" name="gender" value="female">
                                <span class="gender-label">👩‍🌾 女士</span>
                            </label>
                            <label class="gender-option">
                                <input type="radio" name="gender" value="none" checked>
                                <span class="gender-label">🤫 不透露</span>
                            </label>
                        </div>
                    </div>
                    <button class="btn-primary" id="btnSignUp">注册并进入农场</button>
                    <p style="text-align:center;margin-top:12px;font-size:0.9rem;color:#888;">
                        已有账号？<button class="btn-link" id="btnSwitchToLogin">立即登录</button>
                    </p>
                    <p class="msg-error" id="authError"></p>
                </div>
            `;
        }

        function renderFarm() {
            const unlocked = profile?.unlocked_plots || 4;
            const plotsToShow = farmPlots.filter(p => p.plot_index < unlocked);

            const plotsHTML = plotsToShow.map(plot => {
                const status = getCropStatus(plot);
                let emoji, statusText, progressBar = '',
                    cardClass = '';

                if (status.status === 'empty') {
                    emoji = '🌾';
                    statusText = '空地';
                    cardClass = 'empty';
                } else if (status.status === 'ready') {
                    emoji = getCropEmoji(plot.crop_type);
                    statusText = '✨ 可收获';
                    cardClass = 'ready';
                } else {
                    emoji = getCropEmoji(plot.crop_type);
                    statusText = `生长中 · 剩${status.remainingMin}分钟`;
                    cardClass = 'planted';
                    progressBar = `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${status.progress}%"></div>
                        </div>
                    `;
                }

                return `
                    <div class="plot-card ${cardClass}" data-plot="${plot.plot_index}">
                        <div class="plot-emoji">${emoji}</div>
                        <div style="font-weight:600;font-size:0.85rem;">${getCropName(plot.crop_type) || '空地'}</div>
                        <div class="plot-status">${statusText}</div>
                        ${progressBar}
                    </div>
                `;
            }).join('');

            const genderClass = profile?.gender || 'none';
            const avatarLetter = (profile?.username || '农')[0];

            return `
                <div class="header">
                    <div class="user-info">
                        <div class="avatar ${genderClass}">${avatarLetter}</div>
                        <div>
                            <div class="username">${profile?.username || '农夫'}</div>
                            <div class="level">Lv.1 · 新手农夫</div>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="gold">🪙 ${profile?.gold || 0}</span>
                        <button class="btn-icon" id="btnFriends" style="background:#fdfcf9; border:1px solid #e0d8cc;">👥 好友</button>
                        <button class="btn-icon" id="btnLogout">退出</button>
                    </div>
                </div>
                <div class="farm-grid">
                    ${plotsHTML}
                </div>
                ${unlocked < 12 ? `
                <div class="unlock-section">
                    <button class="btn-unlock" id="btnUnlock">
                        🔓 解锁新地块 (当前${unlocked}/12)
                    </button>
                </div>` : ''}
                <!-- 播种弹窗 -->
                <div class="modal-overlay" id="modalPlant">
                    <div class="modal">
                        <h3>🌱 选择要种植的作物</h3>
                        <div class="crop-options">
                            <button class="crop-btn" data-crop="tomato" data-time="10">
                                <div class="crop-emoji">🍅</div>
                                <div class="crop-name">番茄</div>
                                <div class="crop-time">⏱ 10分钟</div>
                            </button>
                            <button class="crop-btn" data-crop="carrot" data-time="8">
                                <div class="crop-emoji">🥕</div>
                                <div class="crop-name">胡萝卜</div>
                                <div class="crop-time">⏱ 8分钟</div>
                            </button>
                            <button class="crop-btn" data-crop="corn" data-time="15">
                                <div class="crop-emoji">🌽</div>
                                <div class="crop-name">玉米</div>
                                <div class="crop-time">⏱ 15分钟</div>
                            </button>
                            <button class="crop-btn" data-crop="strawberry" data-time="12">
                                <div class="crop-emoji">🍓</div>
                                <div class="crop-name">草莓</div>
                                <div class="crop-time">⏱ 12分钟</div>
                            </button>
                        </div>
                        <button class="btn-close" onclick="closePlantModal()">取消</button>
                    </div>
                </div>
            `;
        }

        // ===================== 事件绑定 =====================
        function bindAuthEvents() {
            document.getElementById('btnSignUp').addEventListener('click', async () => {
                const username = document.getElementById('authUsername').value.trim();
                const email = document.getElementById('authEmail').value.trim();
                const password = document.getElementById('authPassword').value;
                const genderEl = document.querySelector('input[name="gender"]:checked');
                const gender = genderEl ? genderEl.value : 'none';
                const errorEl = document.getElementById('authError');

                if (!username || !email || !password) {
                    errorEl.textContent = '请填写所有必填字段';
                    return;
                }
                if (password.length < 6) {
                    errorEl.textContent = '密码至少6位';
                    return;
                }

                try {
                    errorEl.textContent = '';
                    const result = await signUp(email, password, username, gender);

                    if (result.user) {
                        currentUser = result.user;
                        showToast('注册成功！🎉');
                        await new Promise(r => setTimeout(r, 1500));
                        await loadProfile();
                        await loadFarmPlots();
                        render();
                    }
                } catch (err) {
                    errorEl.textContent = err.message || '注册失败';
                }
            });

            document.getElementById('btnSwitchToLogin').addEventListener('click', async () => {
                const email = document.getElementById('authEmail').value.trim();
                const password = document.getElementById('authPassword').value;
                const errorEl = document.getElementById('authError');

                if (!email || !password) {
                    errorEl.textContent = '请输入邮箱和密码';
                    return;
                }

                try {
                    errorEl.textContent = '';
                    const result = await signIn(email, password);
                    currentUser = result.user;
                    await loadProfile();
                    await loadFarmPlots();
                    render();
                    showToast(`欢迎回来，${profile?.username || '农夫'}！`);
                } catch (err) {
                    errorEl.textContent = err.message || '登录失败';
                }
            });
        }

        function bindFarmEvents() {
            document.getElementById('btnLogout').addEventListener('click', signOut);

            // 好友按钮（占位）
            const btnFriends = document.getElementById('btnFriends');
            if (btnFriends) {
                btnFriends.addEventListener('click', () => showToast('好友系统开发中，敬请期待！'));
            }

            // 解锁地块按钮
            const btnUnlock = document.getElementById('btnUnlock');
            if (btnUnlock) {
                btnUnlock.addEventListener('click', () => {
                    showToast(`解锁功能开发中。当前解锁 ${profile?.unlocked_plots || 4} 块，最多12块`);
                });
            }

            // 地块点击
            document.querySelectorAll('.plot-card').forEach(card => {
                card.addEventListener('click', function() {
                    const plotIndex = parseInt(this.getAttribute('data-plot'));
                    const plot = farmPlots.find(p => p.plot_index === plotIndex);
                    const status = getCropStatus(plot);

                    if (status.status === 'empty') {
                        selectedPlotIndex = plotIndex;
                        document.getElementById('modalPlant').classList.add('active');
                        bindPlantEvents();
                    } else if (status.status === 'ready') {
                        harvestAndRefresh(plotIndex);
                    } else {
                        waterAndRefresh(plotIndex);
                    }
                });
            });
        }

        function bindPlantEvents() {
            document.querySelectorAll('#modalPlant .crop-btn').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const cropType = this.getAttribute('data-crop');
                    const growthTime = parseInt(this.getAttribute('data-time'));

                    try {
                        await plantCrop(selectedPlotIndex, cropType, growthTime);
                        await loadFarmPlots();
                        closePlantModal();
                        render();
                        showToast(`种下了${getCropName(cropType)}！🌱`);
                    } catch (err) {
                        showToast('种植失败: ' + err.message);
                    }
                });
            });
        }

        async function harvestAndRefresh(plotIndex) {
            try {
                const reward = await harvestPlot(plotIndex);
                await loadFarmPlots();
                render();
                showToast(`收获成功！获得 🪙${reward} 金币`);
            } catch (err) {
                showToast('收获失败: ' + err.message);
            }
        }

        async function waterAndRefresh(plotIndex) {
            const plot = farmPlots.find(p => p.plot_index === plotIndex);
            const lastWatered = plot.watered_at ? new Date(plot.watered_at) : null;
            const now = new Date();

            if (lastWatered && (now - lastWatered) < 30 * 60 * 1000) {
                showToast('30分钟内已经浇过水了～');
                return;
            }

            try {
                await waterPlot(plotIndex);
                await loadFarmPlots();
                render();
                showToast('浇水成功！💧');
            } catch (err) {
                showToast('浇水失败: ' + err.message);
            }
        }

        function closePlantModal() {
            document.getElementById('modalPlant').classList.remove('active');
        }

        // ===================== 定时刷新生长进度 =====================
        let growthTimer = null;

        function startGrowthTimer() {
            if (growthTimer) clearInterval(growthTimer);
            growthTimer = setInterval(() => {
                const hasGrowing = farmPlots.some(p => {
                    const s = getCropStatus(p);
                    return s.status === 'growing' || s.status === 'ready';
                });
                if (hasGrowing) {
                    const app = document.getElementById('app');
                    app.innerHTML = renderFarm();
                    bindFarmEvents();
                }
            }, 30000);
        }

        // ===================== 初始化 =====================
        async function init() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                currentUser = data.session.user;
                try {
                    await loadProfile();
                    await loadFarmPlots();
                } catch (e) {
                    console.error('加载数据失败:', e);
                }
            }
            render();
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🌱 开心农场 v4.0 大丰收版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ==================== 第 1 块：HTML头部 + CSS变量与基础样式 ==================== */
        :root {
            --bg: #f5f0eb;
            --card: #ffffff;
            --text: #3d3929;
            --accent: #c0844e;
            --green: #6b8f71;
            --red: #c0392b;
            --blue: #5b7fbc;
            --pink: #d4869c;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --gap-xs: 4px;
            --gap-sm: 8px;
            --gap-md: 12px;
            --gap-lg: 16px;
            --gap-xl: 20px;
            --font-xs: 0.65rem;
            --font-sm: 0.75rem;
            --font-md: 0.85rem;
            --font-lg: 0.95rem;
            --font-xl: 1.1rem;
            --modal-width: 380px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 30% 20%, rgba(139,158,123,0.1) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }
        .app-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--gap-xl);
            padding: var(--gap-md);
        }
		        /* ==================== 第 2 块：CSS样式（布局、卡片、按钮等） ==================== */
        .header {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: var(--gap-md) var(--gap-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            flex-wrap: wrap;
            gap: var(--gap-sm);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .avatar.male { background: var(--blue); }
        .avatar.female { background: var(--pink); }
        .avatar.none { background: #aaa; }
        .username {
            font-weight: 600;
            color: var(--text);
            font-size: var(--font-md);
        }
        .level {
            font-size: var(--font-xs);
            color: #888;
        }
        .btn-icon {
            padding: 6px 12px;
            background: #f0ede6;
            border: none;
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-size: var(--font-sm);
            font-family: inherit;
            white-space: nowrap;
            position: relative;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }
        .btn-icon:active {
            transform: scale(0.95);
        }
        .btn-icon:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: var(--font-xs);
            white-space: nowrap;
            z-index: 10;
        }
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: var(--gap-md);
        }
        .plot-card {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 14px 8px;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--gap-xs);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
            user-select: none;
        }
        .plot-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        .plot-card:active {
            transform: scale(0.96);
            background: #f9f6f0;
        }
        .plot-card.empty {
            border: 2px dashed #d5cec0;
            color: #b0a590;
        }
        .plot-card.planted {
            border: 2px solid #c5d5b0;
        }
        .plot-card.ready {
            border: 2px solid #f0c040;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(240,192,64,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(240,192,64,0); }
        }
        .plot-emoji { font-size: 2rem; }
        .plot-status {
            font-size: var(--font-xs);
            color: #888;
            line-height: 1.2;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 2px;
            transition: width 1s linear;
        }
        .waterable { color: #1976d2; font-weight: 600; }
        .watered { color: #e67e22; font-weight: 600; }
        .nickname {
            display: inline-block;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
        }
		        /* ==================== 第 3 块：CSS样式（弹窗、表单、按钮、战斗、装备等） ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: var(--gap-xl);
            max-width: min(var(--modal-width), 90vw);
            width: 90%;
            text-align: center;
            max-height: 75vh;
            overflow-y: auto;
            scrollbar-width: thin;
            position: relative;
        }
        .modal h3 {
            margin-bottom: var(--gap-md);
            color: var(--text);
            font-size: var(--font-xl);
        }
        .crop-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--gap-sm);
            margin-bottom: var(--gap-md);
        }
        .crop-btn {
            padding: 10px 4px;
            border: 2px solid #e0d8cc;
            border-radius: var(--radius-md);
            background: #fdfcf9;
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition-fast);
            text-align: center;
            font-size: var(--font-md);
        }
        .crop-btn:hover {
            border-color: var(--accent);
            background: #fef9f3;
        }
        .crop-btn.locked {
            opacity: 0.4;
            filter: grayscale(1);
            cursor: not-allowed;
            background: #eee;
        }
        .btn-close {
            position: absolute;
            top: var(--gap-sm);
            right: var(--gap-md);
            padding: 6px 12px;
            background: #e8e0d5;
            border: none;
            border-radius: var(--radius-xl);
            cursor: pointer;
            font-family: inherit;
            font-size: var(--font-md);
            z-index: 10;
            transition: transform var(--transition-fast);
        }
        .btn-close:active { transform: scale(0.95); }
        .auth-form {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 24px var(--gap-xl);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: var(--gap-lg);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1.5px solid #e0d8cc;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: var(--gap-sm);
            font-weight: 600;
            cursor: pointer;
            background: #fdfcf9;
            transition: all var(--transition-fast);
            font-family: inherit;
            font-size: var(--font-md);
            border: none;
        }
        .auth-tab.active {
            background: var(--accent);
            color: #fff;
        }
        .form-group { margin-bottom: var(--gap-md); }
        .form-group label {
            display: block;
            font-size: var(--font-sm);
            color: #666;
            margin-bottom: 2px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #e0d8cc;
            border-radius: 10px;
            font-size: var(--font-md);
            font-family: inherit;
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: var(--font-lg);
            font-weight: 600;
            cursor: pointer;
            transition: opacity var(--transition-fast);
        }
        .btn-primary:active { opacity: 0.85; }
        .msg-error {
            color: var(--red);
            font-size: var(--font-sm);
            text-align: center;
            margin-top: var(--gap-sm);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #3d3929;
            color: #fff;
            padding: 10px 20px;
            border-radius: var(--radius-xl);
            font-size: var(--font-md);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .list-container {
            max-height: 60vh;
            overflow-y: auto;
            text-align: left;
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px var(--gap-md);
            border-bottom: 1px solid #f0ede6;
        }
        .order-card {
            background: #fef9f3;
            border-radius: var(--radius-md);
            padding: var(--gap-md);
            margin: var(--gap-sm) 0;
            border: 1px solid var(--accent);
            text-align: left;
        }
        .quality-common { color: #888; }
        .quality-good { color: #27ae60; }
        .quality-rare { color: #9b59b6; }
        .quality-legend { color: #f0c040; font-weight: 700; }
        .tag-friend {
            font-size: var(--font-xs);
            color: #888;
            background: #f0ede6;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .tag-self { font-size: var(--font-xs); color: var(--accent); }
        .btn-small {
            padding: 4px 10px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--font-xs);
            font-family: inherit;
        }
        .btn-accept { background: #6b8f71; color: #fff; }
        .btn-reject { background: #e0d8cc; color: #333; }
        .btn-explore { background: #1976d2; color: #fff; }
        .btn-adopt { background: var(--accent); color: #fff; }
        .btn-view { background: #e67e22; color: #fff; }
        .btn-fight { background: #c0392b; color: #fff; }
        .btn-craft { background: #27ae60; color: #fff; }
        .btn-nomat { background: #aaa; color: #fff; }
        .btn-nogold { background: #e67e22; color: #fff; }
        .btn-decompose { background: #e74c3c; color: #fff; }
        .btn-sell { background: #f39c12; color: #fff; }
        .item-row {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            padding: 6px 0;
        }
        .log-item {
            text-align: left;
            padding: var(--gap-sm) var(--gap-md);
            border-bottom: 1px solid #f0ede6;
        }
        .equipment-card {
            background: #f9f6f0;
            border-radius: var(--radius-md);
            padding: var(--gap-md);
            margin: var(--gap-sm) 0;
            border-left: 4px solid var(--accent);
        }
        .quality-white { border-left-color: #ccc; }
        .quality-blue { border-left-color: #5b7fbc; }
        .quality-purple { border-left-color: #9b59b6; }
        .quality-gold { border-left-color: #f0c040; }
        .btn-synthesis {
            background: #8e44ad;
            color: #fff;
            border: none;
            border-radius: var(--radius-xl);
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: var(--font-sm);
        }
        .btn-enhance {
            background: #e67e22;
            color: #fff;
            border: none;
            border-radius: var(--radius-xl);
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: var(--font-xs);
            margin-right: var(--gap-xs);
        }
        .btn-enhance:disabled { background: #ccc; cursor: not-allowed; }
        .btn-equip {
            background: #6ba3be;
            color: #fff;
            border: none;
            border-radius: var(--radius-xl);
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: var(--font-xs);
            margin-right: var(--gap-xs);
        }
        .btn-unequip {
            background: #aaa;
            color: #fff;
            border: none;
            border-radius: var(--radius-xl);
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: var(--font-xs);
        }
        .btn-refresh {
            background: #6c757d;
            color: #fff;
            border: none;
            border-radius: var(--radius-xl);
            padding: 6px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: var(--font-sm);
            margin-bottom: var(--gap-sm);
        }
        .battle-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: var(--gap-lg) 0;
        }
        .battle-pet { text-align: center; }
        .battle-hp {
            width: 80px;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            margin: var(--gap-sm) auto;
        }
        .battle-hp-fill {
            height: 100%;
            background: var(--green);
            border-radius: 5px;
            transition: width 0.3s;
        }
        .battle-log {
            background: #2d3436;
            color: #dfe6e9;
            border-radius: var(--radius-md);
            padding: var(--gap-md);
            height: 120px;
            overflow-y: auto;
            font-size: var(--font-sm);
            margin: var(--gap-md) 0;
            text-align: left;
            display: flex;
            flex-direction: column-reverse;
        }
        .battle-actions {
            display: flex;
            gap: var(--gap-sm);
            justify-content: center;
            flex-wrap: wrap;
        }
        .battle-btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-xl);
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: var(--font-sm);
        }
        .battle-btn.attack { background: #e74c3c; color: #fff; }
        .battle-btn.defend { background: #3498db; color: #fff; }
        .battle-btn.skill { background: #f39c12; color: #fff; }
        .battle-btn:disabled { opacity: 0.5; }
        .boss-card {
            background: linear-gradient(135deg, #fef9f3, #fdf0e0);
            border-radius: var(--radius-lg);
            padding: var(--gap-lg);
            margin: var(--gap-md) 0;
            border: 2px solid #f0c040;
        }
        .elite-card {
            background: linear-gradient(135deg, #f5f0ff, #ede0f5);
            border-radius: var(--radius-lg);
            padding: var(--gap-md);
            margin: var(--gap-sm) 0;
            border: 2px solid #9b59b6;
        }
        .route-card {
            background: #f9f6f0;
            border-radius: var(--radius-md);
            padding: var(--gap-md);
            margin: var(--gap-sm) 0;
            border-left: 4px solid #1976d2;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .route-card:hover {
            background: #eef4ff;
            border-left-color: #0d47a1;
        }
        .route-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-left-color: #ccc;
        }
        .skill-card {
            background: #f9f6f0;
            border-radius: var(--radius-md);
            padding: 10px;
            margin: var(--gap-xs) 0;
            font-size: var(--font-sm);
        }
        .skill-attack { border-left: 3px solid #e74c3c; }
        .skill-heal { border-left: 3px solid #27ae60; }
        .skill-defense { border-left: 3px solid #3498db; }
        .skill-support { border-left: 3px solid #f39c12; }
        .skill-special { border-left: 3px solid #9b59b6; }
        .pet-detail-card {
            background: #fefdf9;
            border-radius: var(--radius-md);
            padding: var(--gap-md);
            margin: 6px 0;
        }
        .buff-tag {
            display: inline-block;
            background: #f39c12;
            color: #fff;
            border-radius: 10px;
            padding: 1px 6px;
            font-size: var(--font-xs);
            margin-left: var(--gap-xs);
        }
        .set-badge {
            display: inline-block;
            background: #6c5ce7;
            color: #fff;
            border-radius: var(--radius-sm);
            padding: 1px 5px;
            font-size: 0.6rem;
            margin-left: var(--gap-xs);
        }
        .set-info-row {
            font-size: var(--font-xs);
            color: #6c5ce7;
            margin: 2px 0;
        }
        .stat-row { font-size: var(--font-xs); color: #666; }
        .stat-bonus { color: #27ae60; font-weight: 600; }
    </style>
</head>

            function formatTime(iso) {
                if (!iso) return '';
                const d = new Date(iso), now = new Date(), diff = now - d, mins = Math.floor(diff / 60000);
                if (mins < 1) return '刚刚';
                if (mins < 60) return `${mins}分钟前`;
                const hours = Math.floor(mins / 60);
                if (hours < 24) return `${hours}小时前`;
                return `${Math.floor(hours / 24)}天前`;
            }
            async function addEventLog(et, ed) {

                catch (e) { console.error('日志写入失败:', e); }
            }
            async function addItem(it, qty, userId) {
                const uid = userId || State.currentUser.id;
                if (qty < 0) {
                    const { data: row, error: re } = await supabase.from('player_items')
                        .select('quantity').eq('user_id', uid).eq('item_type', it).maybeSingle();
                    if (re) throw re;
                    const cur = row ? row.quantity : 0;
                    const nq = Math.max(0, cur + qty);
                    if (nq === 0) {
                        await supabase.from('player_items').delete().eq('user_id', uid).eq('item_type', it);
                        if (!userId) delete State.items[it];
                    } else {
                        await supabase.from('player_items').upsert({ user_id: uid, item_type: it, quantity: nq }, { onConflict: 'user_id,item_type' });
                        if (!userId) State.items[it] = nq;
                    }
                    return;
                }
                // 增加物品：使用 RPC 原子操作
                const { error } = await supabase.rpc('add_item_quantity', { p_user_id: uid, p_item_type: it, p_qty: qty });
                if (error) {
                    console.warn('RPC失败，使用备用方案:', error.message);
                    const { data: row } = await supabase.from('player_items')
                        .select('quantity').eq('user_id', uid).eq('item_type', it).maybeSingle();
                    const cur = row ? row.quantity : 0;
                    const nq = cur + qty;
                    await supabase.from('player_items').upsert({ user_id: uid, item_type: it, quantity: nq }, { onConflict: 'user_id,item_type' });
                    if (!userId) State.items[it] = nq;
                } else {
                    if (!userId) State.items[it] = (State.items[it] || 0) + qty;
                }
            }
            function getActiveSetEffects() {
                const equipped = State.equipment.filter(e => e.equipped_to !== null);
                const sets = {};
                for (const eq of equipped) {
                    if (!eq.set_name) continue;
                    if (!sets[eq.set_name]) sets[eq.set_name] = [];
                    sets[eq.set_name].push(eq.slot);
                }
                const effects = [];
                for (const [setName, slots] of Object.entries(sets)) {
                    const count = slots.length;
                    if (count >= 2 && SET_BONUSES[setName]?.[2]) effects.push({ setName, level: 2, bonus: SET_BONUSES[setName][2] });
                    if (count >= 3 && SET_BONUSES[setName]?.[3]) effects.push({ setName, level: 3, bonus: SET_BONUSES[setName][3] });
                }
                return effects;
            }
            function getPetBattleStats(pet) {
                const equip = State.equipment.filter(e => e.equipped_to === pet.id);
                let atk = pet.atk, def = pet.def, spd = pet.spd, luk = pet.luk;
                equip.forEach(e => { atk += e.atk_bonus; def += e.def_bonus; spd += e.spd_bonus; luk += e.luk_bonus; });
                return { ...pet, atk, def, spd, luk, maxHp: pet.hp };
            }
            function calculateDamage(at, df, isSkill = false) {
                const ak = at.atk, de = df.def;
                let dmg = Math.max(1, ak - de + Math.floor(Math.random() * 10));
                if (isSkill) dmg = Math.floor(dmg * 1.3);
                return dmg;
            }
            function aiChooseAction(pet, opponent, skillCd) {
                const hpRatio = pet.currentHp / pet.maxHp;
                if (pet.pet_type === 'dog' && hpRatio < 0.3 && skillCd <= 0) return 'skill';
                if (hpRatio < 0.3) return Math.random() < 0.4 ? 'defend' : 'attack';
                if (hpRatio < 0.6) return Math.random() < 0.25 ? 'skill' : (Math.random() < 0.5 ? 'attack' : 'defend');
                return Math.random() < 0.2 ? 'skill' : (Math.random() < 0.1 ? 'defend' : 'attack');

            async function completeExploration(pid, silent = false) {

                overlay.querySelector('#closeHelpModal').onclick = () => overlay.remove();

            async function loadEventLog() {
                const c = document.getElementById('eventLogContainer');
                c.innerHTML = '<p>加载中...</p>';
                const { data: logs, error } = await supabase.from('event_logs').select('*').eq('user_id', State.currentUser.id).order('created_at', { ascending: false }).limit(50);
                if (error) { c.innerHTML = '<p>加载失败</p>'; return; }
                if (logs.length === 0) { c.innerHTML = '<p>暂无事件记录。</p>'; return; }
                c.innerHTML = logs.map(log => { const time = formatTime(log.created_at), content = formatEventMessage(log); return `<div class="log-item"><div style="font-size:0.7rem;color:#888;">${time}</div><div>${content}</div></div>`; }).join('');
                const { count } = await supabase.from('event_logs').select('*', { count: 'exact', head: true }).eq('user_id', State.currentUser.id);
                if (count > MAX_LOG_COUNT) {
                    const { data: oldLogs } = await supabase.from('event_logs').select('id').eq('user_id', State.currentUser.id).order('created_at', { ascending: true }).limit(count - MAX_LOG_COUNT);
                    const oldIds = oldLogs.map(l => l.id);
                    await supabase.from('event_logs').delete().in('id', oldIds).eq('user_id', State.currentUser.id);
                }
            }
            function formatEventMessage(log) {
                const d = log.event_data || {};
                switch (log.event_type) {
                    case 'plant': return `🌱 你种下了 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}`;
                    case 'harvest': { const qName = d.quality ? QUALITIES[d.quality]?.name || d.quality : ''; return `🌾 你收获了 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}，获得 ${d.gold} 金币${qName ? '（'+qName+'）' : ''}`; }
                    case 'water_self': return `💧 你为自己的 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||'作物'} 浇了水`;
                    case 'water_sent': return `💧 你帮 👤 ${d.friend} 浇了水，双方各得5金币`;
                    case 'steal_sent': return `你偷了 👤 ${d.victim} 的 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}，获得 ${d.gold} 金币`;
                    case 'adopt_pet': return `🐾 你领养了一只 ${d.pet}`;
                    case 'explore_start': return `🗺️ ${d.pet} 前往${d.route}探险了`;
                    case 'explore_complete': { const items = Object.entries(d.rewards||{}).map(([item,qty]) => `${ITEM_EMOJI[item]||'📦'}×${qty}`).join(' '); const eventMsg = d.event ? ` · 触发事件：${d.event}` : ''; return `🗺️ ${d.pet} 从${d.route}归来，获得 ${items}${eventMsg}`; }
                    case 'skill_learn': return `🎉 ${d.pet} 学会了新技能【${d.skill}】！`;
                    case 'skill_upgrade': return `⬆️ ${d.pet} 的【${d.skill}】升级至 Lv.${d.level}`;
                    case 'skill_replace': return `🔄 ${d.pet} 遗忘了【${d.old_skill}】，学会了【${d.new_skill}】`;
                    case 'plot_unlock': return `🔓 你解锁了第 ${d.plot} 块农田！`;
                    case 'friend_accepted': return `🤝 你和 👤 ${d.friend} 成为了好友`;
                    case 'synthesis': return `🔧 你合成了 ${d.name} (${QUALITY_NAMES[d.quality]})`;
                    case 'enhance': return `⚔️ 装备 ${d.name} 强化${d.success?'成功':'失败'}，当前+${d.level}`;
                    case 'decompose': return `♻️ 你分解了 ${d.name}，材料已返还`;
                    case 'sell_equipment': return `💰 你出售了 ${d.name}，获得 ${d.price} 金币`;
                    case 'battle_win': return `⚔️ 你战胜了 👤 ${d.opponent}，获得 ${d.gold} 金币`;
                    case 'battle_lose': return `⚔️ 你败给了 👤 ${d.opponent}`;
                    case 'pve_win': return `🐉 你击败了 ${d.monster}，获得 🪙${d.gold} 和材料`;
                    case 'pve_lose': return `🐉 你被 ${d.monster} 击败了`;
                    default: return '未知事件';
                }
            }
			// ==================== 第 25 块：全局定时器 + 初始化 + 启动 + 闭合标签 ====================
            let growthTimer;
            function startGrowthTimer() {
                if (growthTimer) clearInterval(growthTimer);
                growthTimer = setInterval(() => {
                    if (!State.visitingFriend && !State.battle && document.getElementById('farmGrid')) {
                        Farm.updateGrid();
                    }
                }, 30000);
            }

            async function init() {
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    State.currentUser = data.session.user;
                    try {
                        State.profile = (await supabase.from('profiles').select('*').eq('id', State.currentUser.id).single()).data;
                        const localToken = localStorage.getItem('session_token');
                        if (State.profile.session_token && State.profile.session_token !== localToken) {
                            showToast('账号在其他设备登录，请重新登录', true);
                            await signOut();
                            return;
                        }
                        // 启动 Realtime 订阅，监听 session_token 变化
                        State.profileChannel = supabase
                            .channel('profile-changes')
                            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${State.currentUser.id}` },
                                (payload) => {
                                    const newToken = payload.new.session_token;
                                    const localT = localStorage.getItem('session_token');
                                    if (newToken && newToken !== localT) {
                                        showToast('账号在其他设备登录，请重新登录', true);
                                        signOut();
                                    }
                                }
                            )
                            .subscribe();

                        await loadFarmPlots();
                        await loadFriendData();
                        await loadPets();
                        await loadItems();
                        await loadEquipment();
                        await loadBossStatus();
                        await loadPetSkills();
                        generateOrders();
                    } catch (e) { console.error(e); }
                }
                render();
            }

            init();

        })();
    </script>

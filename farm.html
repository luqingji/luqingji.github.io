            font-family: inherit;

            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);

            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: var(--font-xs);

            transition: all var(--transition-normal);
            position: relative;
            user-select: none;

function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date(), diff = now - d, mins = Math.floor(diff / 60000);
    if (mins < 1) return '刚刚';
    if (mins < 60) return `${mins}分钟前`;

async function addItem(it, qty, userId) {
    const uid = userId || State.currentUser.id;
    if (qty < 0) {
        const { data: row, error: re } = await supabase.from('player_items')
            .select('quantity').eq('user_id', uid).eq('item_type', it).maybeSingle();
        if (re) throw re;
        const cur = row ? row.quantity : 0;
        const nq = Math.max(0, cur + qty);
        if (nq === 0) {
            await supabase.from('player_items').delete().eq('user_id', uid).eq('item_type', it);
            if (!userId) delete State.items[it];
        } else {
            await supabase.from('player_items').upsert({ user_id: uid, item_type: it, quantity: nq }, { onConflict: 'user_id,item_type' });
            if (!userId) State.items[it] = nq;
        }
        return;
    }
    const { error } = await supabase.rpc('add_item_quantity', { p_user_id: uid, p_item_type: it, p_qty: qty });
    if (error) {
        console.warn('RPC失败，使用备用方案:', error.message);
        const { data: row } = await supabase.from('player_items')
            .select('quantity').eq('user_id', uid).eq('item_type', it).maybeSingle();
        const cur = row ? row.quantity : 0;
        const nq = cur + qty;
        await supabase.from('player_items').upsert({ user_id: uid, item_type: it, quantity: nq }, { onConflict: 'user_id,item_type' });
        if (!userId) State.items[it] = nq;
    } else {
        if (!userId) State.items[it] = (State.items[it] || 0) + qty;
    }
}
function getActiveSetEffects() {
    const equipped = State.equipment.filter(e => e.equipped_to !== null);
    const sets = {};
    for (const eq of equipped) {
        if (!eq.set_name) continue;
        if (!sets[eq.set_name]) sets[eq.set_name] = [];
        sets[eq.set_name].push(eq.slot);
    }
    const effects = [];
    for (const [setName, slots] of Object.entries(sets)) {
        const count = slots.length;
        if (count >= 2 && SET_BONUSES[setName]?.[2]) effects.push({ setName, level: 2, bonus: SET_BONUSES[setName][2] });
        if (count >= 3 && SET_BONUSES[setName]?.[3]) effects.push({ setName, level: 3, bonus: SET_BONUSES[setName][3] });
    }
    return effects;
}

// 修复版：浅拷贝保护原始 pet 对象，避免多次调用时数值累积
function getPetBattleStats(pet) {
    pet = { ...pet };
    const equip = State.equipment.filter(e => e.equipped_to === pet.id);
    let atk = pet.atk, def = pet.def, spd = pet.spd, luk = pet.luk, hp = pet.hp, sta = pet.sta;
    equip.forEach(e => { atk += e.atk_bonus; def += e.def_bonus; spd += e.spd_bonus; luk += e.luk_bonus; });
    if (pet.nature) {
        const nature = PET_NATURES.find(n => n.id === pet.nature);
        if (nature) {
            if (nature.atk_bonus) atk = Math.floor(atk * (1 + nature.atk_bonus));
            if (nature.def_bonus) def = Math.floor(def * (1 + nature.def_bonus));
            if (nature.spd_bonus) spd = Math.floor(spd * (1 + nature.spd_bonus));
            if (nature.luk_bonus) luk = Math.floor(luk * (1 + nature.luk_bonus));
            if (nature.hp_bonus) hp = Math.floor(hp * (1 + nature.hp_bonus));
            if (nature.sta_bonus) sta = Math.floor(sta * (1 + nature.sta_bonus));
            if (nature.atk_penalty) atk = Math.floor(atk * (1 + nature.atk_penalty));
            if (nature.def_penalty) def = Math.floor(def * (1 + nature.def_penalty));
            if (nature.spd_penalty) spd = Math.floor(spd * (1 + nature.spd_penalty));
            if (nature.luk_penalty) luk = Math.floor(luk * (1 + nature.luk_penalty));
            if (nature.hp_penalty) hp = Math.floor(hp * (1 + nature.hp_penalty));
            if (nature.sta_penalty) sta = Math.floor(sta * (1 + nature.sta_penalty));
        }
    }
    const passiveId = State.passiveSkills?.[pet.id];
    if (passiveId && PASSIVE_SKILLS[passiveId]) {
        const passive = PASSIVE_SKILLS[passiveId];
        if (passive.atk_bonus && !passive.atk_type) atk = Math.floor(atk * (1 + passive.atk_bonus));
        if (passive.def_bonus && typeof passive.def_bonus === 'number') def = Math.floor(def * (1 + passive.def_bonus));
        if (passive.spd_bonus && typeof passive.spd_bonus === 'number') spd = Math.floor(spd * (1 + passive.spd_bonus));
        if (passive.hp_penalty) hp = Math.floor(hp * (1 - passive.hp_penalty));
        if (passive.def_penalty && typeof passive.def_penalty === 'number') def = Math.floor(def * (1 - passive.def_penalty));
        if (passive.spd_penalty && typeof passive.spd_penalty === 'number') spd = Math.floor(spd * (1 - passive.spd_penalty));
    }
    return { ...pet, atk, def, spd, luk, hp, sta, maxHp: hp };
}

function calculateDamage(at, df, isSkill = false, skillElement = null, atPassive = null, dfPassive = null, skillType = null) {
    let ak = at.atk, de = df.def;
    let elementMult = 1;
    if (skillElement && dfPassive) {
        const dfPassiveData = PASSIVE_SKILLS[dfPassive];
        if (dfPassiveData?.def_penalty?.[skillElement]) {
            elementMult += dfPassiveData.def_penalty[skillElement];
        }
    }
    if (skillElement && atPassive) {
        const atPassiveData = PASSIVE_SKILLS[atPassive];
        if (atPassiveData?.atk_type === skillElement && atPassiveData?.atk_bonus) {
            elementMult += atPassiveData.atk_bonus;
        }
    }
    let dmg = Math.max(1, ak - de + Math.floor(Math.random() * 10));
    dmg = Math.floor(dmg * elementMult);
    if (isSkill) dmg = Math.floor(dmg * 1.3);
    if (dfPassive === 'iron') {
        if (skillType === 'special') {
            dmg = Math.floor(dmg * 1.1);
        } else {
            dmg = Math.floor(dmg * 0.85);
        }
    }
    return dmg;
}

// 怪物AI修复版：减少防御倾向，增加攻击兜底
function monsterAI(battle) {
    const skills = battle.opponentSkills || [];
    const energy = battle.opponentEnergy || 0;
    const skillCd = battle.oppSkillCooldowns || {};
    const hpRatio = battle.opponentCurrentHp / (battle.opponentPet.hp || battle.opponentPet.maxHp || 1);
    const playerHpRatio = battle.myCurrentHp / (battle.myPet.hp || battle.myPet.maxHp || 1);

    if (hpRatio < 0.25 && skills.some(s => {
        const sd = ACTIVE_SKILLS[s];
        return sd?.type === 'heal' && energy >= (sd.energy || 0) && !(skillCd[s] > 0);
    })) {
        const healSkill = skills.find(s => {
            const sd = ACTIVE_SKILLS[s];
            return sd?.type === 'heal' && energy >= (sd.energy || 0) && !(skillCd[s] > 0);
        });
        if (healSkill) return 'skill:' + healSkill;
    }

    if (energy >= 5 && skills.some(s => {
        const sd = ACTIVE_SKILLS[s];
        return (sd?.paralyze_chance || sd?.bind_chance || sd?.skip_chance) && !(skillCd[s] > 0) && energy >= (sd.energy || 0);
    })) {
        const controlSkill = skills.find(s => {
            const sd = ACTIVE_SKILLS[s];
            return (sd?.paralyze_chance || sd?.bind_chance || sd?.skip_chance) && !(skillCd[s] > 0) && energy >= (sd.energy || 0);
        });
        if (controlSkill) return 'skill:' + controlSkill;
    }

    if (skills.some(s => {
        const sd = ACTIVE_SKILLS[s];
        return sd?.type === 'attack' && energy >= (sd.energy || 0) && !(skillCd[s] > 0);
    })) {
        const bestSkill = skills.filter(s => {
            const sd = ACTIVE_SKILLS[s];
            return sd?.type === 'attack' && energy >= (sd.energy || 0) && !(skillCd[s] > 0);
        }).sort((a, b) => (ACTIVE_SKILLS[b]?.power || 100) - (ACTIVE_SKILLS[a]?.power || 100))[0];
        if (bestSkill) return 'skill:' + bestSkill;
    }

    if (energy >= 4 && skills.some(s => {
        const sd = ACTIVE_SKILLS[s];
        return (sd?.type === 'special' || sd?.type === 'defense') && energy >= (sd.energy || 0) && !(skillCd[s] > 0);
    })) {
        const specSkill = skills.find(s => {
            const sd = ACTIVE_SKILLS[s];
            return (sd?.type === 'special' || sd?.type === 'defense') && energy >= (sd.energy || 0) && !(skillCd[s] > 0);
        });
        if (specSkill) return 'skill:' + specSkill;
    }

    return 'attack';
}

// 改造后的 logBattle：全局序号 + 回合编号 + 先后手标记
function logBattle(msg) {
    const b = State.battle;
    if (!b) return;
    const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    const turn = b.turn || 1;

    let order = '';
    if (msg.includes('你的 ') || msg.includes('你选择') || msg.includes('你使用')) {
        const mySpd = getRealTimeSpeed(b.myPet, b.myBuffs);
        const oppSpd = getRealTimeSpeed(b.opponentPet, b.oppBuffs);
        order = mySpd >= oppSpd ? '(先手) ' : '(后手) ';
    } else if (msg.includes('对手 ') || msg.includes('BOSS') || msg.includes('怪物')) {
        const mySpd = getRealTimeSpeed(b.myPet, b.myBuffs);
        const oppSpd = getRealTimeSpeed(b.opponentPet, b.oppBuffs);
        order = oppSpd > mySpd ? '(先手) ' : '(后手) ';
    }

    logIndex++;
    b.log.push({ time, msg: `[#${logIndex}] [第${turn}回合]${order}${msg}`, idx: logIndex });
}

function applyDOTs(myBuffs, oppBuffs, battle) {
    (oppBuffs || []).forEach(buff => {
        if (buff.type === 'burn') {
            const dmg = Math.max(1, Math.floor(battle.opponentCurrentHp * 0.05));
            battle.opponentCurrentHp = Math.max(0, battle.opponentCurrentHp - dmg);
            logBattle(`🔥 灼烧伤害造成 ${dmg} 点伤害`);
        }
        if (buff.type === 'poison') {
            const dmg = Math.max(1, Math.floor(battle.opponentCurrentHp * 0.05));
            battle.opponentCurrentHp = Math.max(0, battle.opponentCurrentHp - dmg);
            logBattle(`☠️ 中毒伤害造成 ${dmg} 点伤害`);
        }
        if (buff.type === 'curse') {
            const dmg = Math.max(1, Math.floor(battle.opponentCurrentHp * 0.05));
            battle.opponentCurrentHp = Math.max(0, battle.opponentCurrentHp - dmg);
            logBattle(`👁️ 诅咒伤害造成 ${dmg} 点伤害`);
        }
    });
    (myBuffs || []).forEach(buff => {
        if (buff.type === 'burn') {
            const dmg = Math.max(1, Math.floor(battle.myCurrentHp * 0.05));
            battle.myCurrentHp = Math.max(0, battle.myCurrentHp - dmg);
            logBattle(`🔥 你受到灼烧伤害 ${dmg} 点`);
        }
        if (buff.type === 'poison') {
            const dmg = Math.max(1, Math.floor(battle.myCurrentHp * 0.05));
            battle.myCurrentHp = Math.max(0, battle.myCurrentHp - dmg);
            logBattle(`☠️ 你受到中毒伤害 ${dmg} 点`);
        }
        if (buff.type === 'curse') {
            const dmg = Math.max(1, Math.floor(battle.myCurrentHp * 0.05));
            battle.myCurrentHp = Math.max(0, battle.myCurrentHp - dmg);
            logBattle(`👁️ 你受到诅咒伤害 ${dmg} 点`);
        }
    });
}
function applyPassiveEffects(battle) {
    const myPassiveId = State.passiveSkills?.[battle.myPet.id];
    if (myPassiveId === 'regen') {
        const heal = Math.max(1, Math.floor(battle.myPet.hp * 0.03));
        battle.myCurrentHp = Math.min(battle.myPet.hp, battle.myCurrentHp + heal);
        logBattle(`❤️ 再生回复了 ${heal} 点HP`);
    }
    if (myPassiveId === 'unyielding') {
        const hpRatio = battle.myCurrentHp / battle.myPet.hp;
        if (hpRatio < 0.2) {
            battle.myBuffs = battle.myBuffs || [];
            if (!battle.myBuffs.some(b => b.type === 'unyielding')) {
                battle.myBuffs.push({ type: 'unyielding', duration: 99, value: 0.5 });
                logBattle(`💪 不屈：防御力+50%！`);
            }
        }
    }
}
function calculateQuality() {
    const rand = Math.random();
    let cum = 0;
    for (const [q, data] of Object.entries(QUALITIES)) {
        cum += data.prob;
        if (rand < cum) return q;
    }
    return 'common';
}
function hasSeed(cropKey) {
    return State.items && State.items['seed_' + cropKey] && State.items['seed_' + cropKey] > 0;
}
async function synthesizeProduct(recipe) {
    for (const [item, need] of Object.entries(recipe.materials)) {
        if ((State.items[item] || 0) < need) { showToast(`材料不足：${ITEM_NAMES[item]||item}×${need}`, true); return; }
    }
    if ((State.profile.gold || 0) < (recipe.cost || 0)) { showToast('金币不足', true); return; }
    for (const [item, need] of Object.entries(recipe.materials)) { await addItem(item, -need); }
    if (recipe.cost) {
        await supabase.from('profiles').update({ gold: State.profile.gold - recipe.cost }).eq('id', State.currentUser.id);
        State.profile.gold -= recipe.cost;
    }
    if (recipe.time) {
        const finishAt = new Date(Date.now() + recipe.time * 60000).toISOString();
        State.processingTasks.push({ id: Date.now(), name: recipe.name, icon: recipe.icon, finishAt });
        showToast(`开始加工 ${recipe.icon} ${recipe.name}，预计${recipe.time}分钟后完成`);
    } else {
        await addItem(recipe.name, 1);
        showToast(`合成成功！获得 ${recipe.icon} ${recipe.name}`);
    }
}

function generateOrders() {
    const today = new Date().toDateString();
    // 如果今天还没刷新过，或者订单为空，则重新生成
    if (State.lastOrderDate !== today || !State.orders || State.orders.length === 0) {
        State.lastOrderDate = today;
        State.orders = [];
        const possible = Object.keys(CROPS).filter(k => hasSeed(k) || CROPS[k].unlock === '初始');
        if (possible.length === 0) {
            const initCrops = Object.keys(CROPS).filter(k => CROPS[k].unlock === '初始');
            for (let i = 0; i < 3; i++) {
                const cropKey = initCrops[Math.floor(Math.random() * initCrops.length)];
                State.orders.push({ crop: cropKey, amount: Math.floor(Math.random() * 3) + 1, rewardGold: 100 + Math.floor(Math.random() * 200), rewardTicket: Math.floor(Math.random() * 2) + 1 });
            }
        } else {
            for (let i = 0; i < 3; i++) {
                const cropKey = possible[Math.floor(Math.random() * possible.length)];
                State.orders.push({ crop: cropKey, amount: Math.floor(Math.random() * 3) + 1, rewardGold: 100 + Math.floor(Math.random() * 200), rewardTicket: Math.floor(Math.random() * 2) + 1 });
            }
        }
    }
}

                let reward = baseReward;
                const sets = getActiveSetEffects();

                const ng = (State.profile.gold || 0) + reward;
                await supabase.from('profiles').update({ gold: ng }).eq('id', State.currentUser.id);

            async function startExplore(pid, routeId) {
                const pet = State.pets.find(p => p.id === pid);
                if (!pet) return;
                if (pet.exploring_until) {
                    const now = new Date();
                    if (new Date(pet.exploring_until) > now) { showToast('宠物正在探险中'); return; }
                    else { showToast('请先查看探险收获再出发！', true); return; }
                }
                const route = EXPLORE_ROUTES.find(r => r.id === routeId);
                if (!route) return;
                if (pet.level < route.minLevel) { showToast(`需要宠物Lv.${route.minLevel}`); return; }
                let cost = route.cost;
                const sets = getActiveSetEffects();
                for (const eff of sets) { if (eff.bonus.explore_time) cost = Math.floor(cost * eff.bonus.explore_time); }
                if ((State.profile.gold || 0) < cost) { showToast('金币不足！', true); return; }
                // 驻扎宠物去探险时自动取消驻扎

                }
                const staFactor = Math.max(0.2, 1 - (pet.sta || 50) / 100);
                let actualTime = Math.max(0.1, route.time * staFactor);
                for (const eff of sets) { if (eff.bonus.explore_time) actualTime = Math.floor(actualTime * eff.bonus.explore_time * 10) / 10; }
                await supabase.from('profiles').update({ gold: State.profile.gold - cost }).eq('id', State.currentUser.id);
                const eu = new Date(Date.now() + actualTime * 3600000).toISOString();
                await supabase.from('pets').update({ exploring_until: eu, last_explored_at: new Date().toISOString() }).eq('id', pid);
                pet.exploring_until = eu; pet.exploring_route = routeId;
                State.profile.gold -= cost;
                addEventLog('explore_start', { pet: pet.pet_name, route: route.name });
                showToast(`${pet.pet_name} 前往${route.name}探险！花费🪙${cost} 预计${Math.round(actualTime * 60)}分钟`);

            async function completeExploration(pid, silent = false) {
                const pet = State.pets.find(p => p.id === pid);
                if (!pet || !pet.exploring_until) return null;
                const route = EXPLORE_ROUTES.find(r => r.id === pet.exploring_route) || EXPLORE_ROUTES[0];
                const rewards = {};
                const sets = getActiveSetEffects();
                let oreBonus = 0, rareProbBonus = 0;
                for (const eff of sets) { if (eff.bonus.ore_bonus) oreBonus += eff.bonus.ore_bonus; if (eff.bonus.rare_prob) rareProbBonus += eff.bonus.rare_prob; }
                for (const [item, qty] of Object.entries(route.materials)) {
                    let actualQty = Math.floor(qty * (0.8 + Math.random() * 0.4));
                    if (item === 'ore') actualQty += Math.floor(actualQty * oreBonus);
                    if (actualQty > 0) rewards[item] = (rewards[item] || 0) + actualQty;
                }
                const lukBonus = (pet.luk || 0) * 0.01;
                if (Math.random() < (route.rareProb + lukBonus + rareProbBonus)) { rewards[route.rareItem] = (rewards[route.rareItem] || 0) + 1; }
                const seedDropRoutes = {
                    grassland: ['seed_potato','seed_cabbage','seed_peanut'],
                    forest: ['seed_sunflower','seed_chrysanthemum','seed_clover'],
                    mine: ['seed_mushroom','seed_bamboo','seed_pepper'],
                    ruins: ['seed_grape','seed_orange','seed_apple'],
                    night: ['seed_rose','seed_lily','seed_sakura'],
                    dragon: ['seed_pineapple','seed_mango','seed_blueberry','seed_watermelon']
                };
                if (seedDropRoutes[route.id] && Math.random() < 0.15) {

function executeBattleAction(action, skillId = null) {
    if (!State.battle) return; const b = State.battle;

        if (b.activePotion === 'potion_hp') return 0.3;
        return 0;
    };
    // 药剂效果：暴击率+15%
    const getPotionCritBonus = () => {
        if (b.activePotion === 'potion_crit') return 0.15;
        return 0;
    };

    const playerAct = () => {
        let dmg = 0;
        const potionAtk = getPotionAtkBonus();
        const potionCrit = getPotionCritBonus();
        
        if (action === 'skill' && skillId) {
            const skill = b.mySkills.find(s => s.id === skillId);

                let effAtk = { ...b.myPet, atk: Math.floor(b.myPet.atk * (1 + potionAtk)) };

                dmg = calculateDamage(effAtk, effDef, true, element, myPassiveId, oppPassiveId, skillData.type);
                dmg = Math.floor(dmg * powerMult);

                if (skillData.bind_chance && Math.random() < skillData.bind_chance) {

                    b.oppBuffs.push({ type: 'bind', duration: 2 });  // 修复：改为2回合，确保能持续到下一回合
                    logBattle(`🌿 对手被束缚`);
                }
                if (skillData.poison) {
                    b.oppBuffs = b.oppBuffs || [];
                    b.oppBuffs.push({ type: 'poison', duration: skillData.poison_duration || 3 });
                    logBattle(`☠️ 对手中毒了`);
                }
                if (skillData.drain) {
                    const heal = Math.floor(dmg * skillData.drain);
                    b.myCurrentHp = Math.min(b.myPet.hp, b.myCurrentHp + heal);
                    logBattle(`💚 生命汲取回复了 ${heal} 点HP`);
                }
                if (skillData.chain_chance && Math.random() < skillData.chain_chance) {
                    const chainDmg = Math.floor(dmg * 0.5);
                    b.opponentCurrentHp = Math.max(0, b.opponentCurrentHp - chainDmg);
                    logBattle(`⚡ 连锁闪电额外造成 ${chainDmg} 点伤害`);
                }
                if (skillData.recoil) {
                    const recoilDmg = Math.floor(dmg * skillData.recoil);
                    b.myCurrentHp = Math.max(0, b.myCurrentHp - recoilDmg);
                    logBattle(`💔 反伤受到 ${recoilDmg} 点伤害`);
                }
                if (skillData.self_debuff) {
                    b.myBuffs = b.myBuffs || [];
                    b.myBuffs.push({ type: 'self_atk_down', duration: skillData.self_debuff.duration || 2, value: skillData.self_debuff.atk || 0 });
                    logBattle(`⚠️ 自身攻击力下降`);
                }
            } else if (skillData.type === 'heal') {
                if (skillData.heal_percent) {
                    const heal = Math.floor(b.myPet.hp * skillData.heal_percent);
                    b.myCurrentHp = Math.min(b.myPet.hp, b.myCurrentHp + heal);
                    logBattle(`你的 ${b.myPet.pet_name} 使用【${skillData.name}】，回复 ${heal} 点HP`);
                }
                if (skillData.cure === 'burn') {
                    b.myBuffs = (b.myBuffs || []).filter(bf => bf.type !== 'burn');
                    logBattle(`💧 灼烧被解除了`);
                }
                if (skillData.cure_all) {
                    b.myBuffs = [];
                    logBattle(`✨ 所有负面状态被净化`);
                }
                if (skillData.energy_bonus) {
                    b.myEnergy = Math.min(MAX_ENERGY, (b.myEnergy || 0) + Math.floor(MAX_ENERGY * skillData.energy_bonus));
                    logBattle(`⚡ 能量上限提升`);
                }
                if (skillData.hp_cost) {
                    const cost = Math.floor(b.myCurrentHp * skillData.hp_cost);
                    b.myCurrentHp = Math.max(0, b.myCurrentHp - cost);
                    if (skillData.energy_gain) {
                        b.myEnergy = Math.min(MAX_ENERGY, (b.myEnergy || 0) + Math.floor(MAX_ENERGY * skillData.energy_gain));
                        logBattle(`🌑 消耗${cost}HP，回复了大量能量`);
                    }
                }
            } else if (skillData.type === 'defense') {
                if (skillData.invincible) {
                    b.myBuffs = b.myBuffs || [];
                    b.myBuffs.push({ type: 'invincible', duration: 1 });
                    if (skillData.skip_next) b.myBuffs.push({ type: 'skip_next', duration: 1 });
                    logBattle(`❄️ 寒冰屏障：本回合无敌！`);
                }
                if (skillData.reflect_magic) {
                    b.myBuffs = b.myBuffs || [];
                    b.myBuffs.push({ type: 'reflect_magic', duration: skillData.duration || 2, value: skillData.reflect_magic });
                    logBattle(`⚡ 电磁护盾：反弹魔法伤害${Math.round(skillData.reflect_magic*100)}%`);
                }
            } else if (skillData.type === 'special') {
                if (skillData.curse_duration) {
                    b.oppBuffs = b.oppBuffs || [];
                    b.oppBuffs.push({ type: 'curse', duration: skillData.curse_duration, value: skillData.curse_dmg || 0.05 });
                    logBattle(`👁️ 对手被诅咒了`);
                }
                if (skillData.skip_chance && Math.random() < skillData.skip_chance) {
                    b.oppBuffs = b.oppBuffs || [];
                    b.oppBuffs.push({ type: 'skip_next', duration: 1 });
                    logBattle(`😱 对手陷入恐惧`);
                }
            }
        } else if (action === 'attack') {
            const myPassiveId = State.passiveSkills?.[b.myPet.id];
            const oppPassiveId = b.type === 'pve' ? null : State.passiveSkills?.[b.opponentPet.id];
            let effAtk = { ...b.myPet, atk: Math.floor(b.myPet.atk * (1 + potionAtk)) };
            dmg = calculateDamage(effAtk, b.opponentPet, false, null, myPassiveId, oppPassiveId, null);
            if (Math.random() < potionCrit) dmg = Math.floor(dmg * 1.5);
            b.opponentCurrentHp = Math.max(0, b.opponentCurrentHp - dmg);
            b.myEnergy = Math.min(MAX_ENERGY, (b.myEnergy || 0) + ATTACK_ENERGY_GAIN);
            logBattle(`你的 ${b.myPet.pet_name} 攻击，造成 ${dmg} 点伤害 ⚡+1`);
        } else if (action === 'defend') {
            b.myEnergy = Math.min(MAX_ENERGY, (b.myEnergy || 0) + DEFEND_ENERGY_GAIN);
            logBattle(`你选择防御 ⚡+1`);
            b.myDefend = true;
        }

        if (b.type === 'pve' && b.monster && b.monster.isBoss && dmg > 0) {
            b.bossDamage = (b.bossDamage || 0) + dmg;
            const newBossHp = Math.max(0, (State.bossStatus?.current_hp || b.opponentPet.maxHp) - dmg);
            if (State.bossStatus) State.bossStatus.current_hp = newBossHp;
            supabase.from('boss_status').update({ current_hp: newBossHp }).eq('id', 1).then(() => { });
        }
        for (const key in b.skillCooldowns) { if (b.skillCooldowns[key] > 0) b.skillCooldowns[key]--; }
    };

    const monsterAct = () => {
        if (oppSkip) {
            logBattle(`对手因恐惧跳过回合`);
            b.oppBuffs = (b.oppBuffs || []).filter(bf => bf.type !== 'skip_next');
        } else if (oppParalyzed) {
            logBattle(`对手因麻痹无法行动`);
        } else if (oppBound) {
            logBattle(`对手因束缚无法攻击`);
            b.oppBuffs = (b.oppBuffs || []).filter(bf => bf.type !== 'bind');
        } else {
            const aiResult = monsterAI(b);
            const myPassiveId = State.passiveSkills?.[b.myPet.id];
            const oppPassiveId = b.type === 'pve' ? null : State.passiveSkills?.[b.opponentPet.id];
            const isInvincible = (b.myBuffs || []).some(bf => bf.type === 'invincible');
            const potionDef = getPotionDefBonus();
            let effMyPet = { ...b.myPet, def: Math.floor(b.myPet.def * (1 + potionDef)) };
            
            if (aiResult === 'attack') {
                let odmg = calculateDamage(b.opponentPet, effMyPet, false, null, oppPassiveId, myPassiveId, null);
                if (b.myDefend) odmg = Math.floor(odmg * 0.5);
                if (isInvincible) odmg = 0;
                if (b.affixes?.some(a => a.id === 'vampire')) {
                    const lifesteal = Math.max(1, Math.floor(odmg * 0.15));
                    b.opponentCurrentHp = Math.min(b.opponentPet.hp || b.opponentPet.maxHp, b.opponentCurrentHp + lifesteal);
                    logBattle(`🧛 吸血鬼吸取了 ${lifesteal} 点HP`);
                }
                b.myCurrentHp = Math.max(0, b.myCurrentHp - odmg);
                b.oppEnergy = Math.min(MAX_ENERGY, (b.oppEnergy || 0) + ATTACK_ENERGY_GAIN);
                logBattle(`对手 ${b.opponentPet.pet_name} 攻击，造成 ${odmg} 点伤害`);
            } else if (aiResult === 'defend') {
                b.oppEnergy = Math.min(MAX_ENERGY, (b.oppEnergy || 0) + DEFEND_ENERGY_GAIN);
                logBattle(`对手 ${b.opponentPet.pet_name} 防御 ⚡+1`);
                b.oppDefend = true;
            } else if (aiResult && aiResult.startsWith('skill:')) {
                const skillName = aiResult.split(':')[1];
                const skillData = ACTIVE_SKILLS[skillName];
                if (skillData && (b.oppEnergy || 0) >= (skillData.energy || 0)) {
                    b.oppEnergy = Math.max(0, (b.oppEnergy || 0) - (skillData.energy || 0));
                    const oppSkillCd = skillData.cooldown || 2;
                    b.oppSkillCooldowns[skillName] = oppSkillCd;
                    if (skillData.type === 'attack' || skillData.type === 'special') {
                        let odmg = calculateDamage(b.opponentPet, effMyPet, true, skillData.element, oppPassiveId, myPassiveId, skillData.type);
                        odmg = Math.floor(odmg * (skillData.power || 100) / 100);
                        if (b.myDefend) odmg = Math.floor(odmg * 0.5);
                        if (isInvincible) odmg = 0;
                        b.myCurrentHp = Math.max(0, b.myCurrentHp - odmg);
                        logBattle(`对手 使用【${skillData.name}】，造成 ${odmg} 点伤害`);
                        const reflectMagicBuff = (b.myBuffs || []).find(bf => bf.type === 'reflect_magic');
                        if (reflectMagicBuff && skillData.type === 'special') {
                            const reflectMagicDmg = Math.floor(odmg * (reflectMagicBuff.value || 0.3));
                            b.opponentCurrentHp = Math.max(0, b.opponentCurrentHp - reflectMagicDmg);
                            logBattle(`⚡ 电磁护盾反弹 ${reflectMagicDmg} 点魔法伤害`);
                        }
                        if (skillData.burn) { b.myBuffs = b.myBuffs || []; b.myBuffs.push({ type: 'burn', duration: 3 }); logBattle(`🔥 你被灼烧了`); }
                        if (skillData.paralyze_chance && Math.random() < skillData.paralyze_chance) { b.myBuffs = b.myBuffs || []; b.myBuffs.push({ type: 'paralyze', duration: 2 }); logBattle(`⚡ 你被麻痹了`); }
                        if (skillData.poison) { b.myBuffs = b.myBuffs || []; b.myBuffs.push({ type: 'poison', duration: skillData.poison_duration || 3 }); logBattle(`☠️ 你中毒了`); }
                        if (skillData.bind_chance && Math.random() < skillData.bind_chance) { 
                            b.myBuffs = b.myBuffs || []; 
                            b.myBuffs.push({ type: 'bind', duration: 2 });  // 修复：改为2回合
                            logBattle(`🌿 你被束缚了`); 
                        }
                    } else if (skillData.type === 'heal' && skillData.heal_percent) {
                        const heal = Math.floor((b.opponentPet.hp || b.opponentPet.maxHp) * skillData.heal_percent);
                        b.opponentCurrentHp = Math.min((b.opponentPet.hp || b.opponentPet.maxHp), b.opponentCurrentHp + heal);
                        logBattle(`对手 使用【${skillData.name}】，回复 ${heal} 点HP`);
                    } else if (skillData.invincible) {
                        b.oppBuffs = b.oppBuffs || [];
                        b.oppBuffs.push({ type: 'invincible', duration: 1 });
                        logBattle(`对手 使用【${skillData.name}】，本回合无敌`);
                    } else if (skillData.curse_duration) {
                        b.myBuffs = b.myBuffs || [];
                        b.myBuffs.push({ type: 'curse', duration: skillData.curse_duration, value: skillData.curse_dmg || 0.05 });
                        logBattle(`对手 使用【${skillData.name}】，你被诅咒了`);
                    }
                }
            }
        }
    };

    if (myParalyzed) {
        showToast('你被麻痹了，本回合无法行动！');
        logBattle(`你被麻痹，跳过行动`);
        b.myBuffs = tickBuffs(b.myBuffs.filter(bf => bf.type === 'paralyze' ? bf.duration <= 1 : true));
    } else if (myBound) {
        showToast('你被束缚了，本回合无法攻击！');
        logBattle(`你被束缚，跳过行动`);
        b.myBuffs = (b.myBuffs || []).filter(bf => bf.type !== 'bind');
    } else if (mySkip) {
        showToast('你陷入恐惧，跳过本回合！');
        logBattle(`你因恐惧跳过回合`);
        b.myBuffs = (b.myBuffs || []).filter(bf => bf.type !== 'skip_next');
    }

    const mySpd = getMySpd() + Math.floor(getMySpd() * (b.activePotion === 'potion_spd' ? 0.2 : 0));
    const oppSpd = getOppSpd();

    if (mySpd >= oppSpd) {
        if (!myParalyzed && !myBound && !mySkip) playerAct();
        if (b.opponentCurrentHp > 0) monsterAct();
    } else {
        if (b.opponentCurrentHp > 0) monsterAct();
        if (!myParalyzed && !myBound && !mySkip && b.myCurrentHp > 0) playerAct();
    }

    if (b.activePotion === 'potion_hp') {
        const hpBonus = Math.floor(b.myPet.hp * 0.3);
        b.myCurrentHp = Math.min(b.myPet.hp, b.myCurrentHp + hpBonus);
        b.activePotion = null;
    }

    b.myEnergy = Math.min(MAX_ENERGY, (b.myEnergy || 0) + ENERGY_PER_TURN);
    b.oppEnergy = Math.min(MAX_ENERGY, (b.oppEnergy || 0) + ENERGY_PER_TURN);
    
    for (const key in b.oppSkillCooldowns) { if (b.oppSkillCooldowns[key] > 0) b.oppSkillCooldowns[key]--; }

    b.myDefend = false; b.oppDefend = false;
    applyPassiveEffects(b);
    applyDOTs(b.myBuffs, b.oppBuffs, b);
    b.myBuffs = tickBuffs(b.myBuffs); b.oppBuffs = tickBuffs(b.oppBuffs);
    // 不再强制清理 bind 状态，让 tickBuffs 自然消耗
    b.myBuffs = (b.myBuffs || []).filter(bf => bf.type !== 'invincible' && bf.type !== 'skip_next');
    b.oppBuffs = (b.oppBuffs || []).filter(bf => bf.type !== 'invincible' && bf.type !== 'skip_next');
    
    if (b.opponentCurrentHp <= 0 && b.affixes?.some(a => a.id === 'bomb')) {
        const bombDmg = Math.floor((b.opponentPet.hp || b.opponentPet.maxHp) * 0.3);
        b.myCurrentHp = Math.max(0, b.myCurrentHp - bombDmg);
        logBattle(`💥 自爆造成 ${bombDmg} 点伤害`);
    }
    
    if (b.myCurrentHp <= 0) { logBattle('你输了！'); endBattle(false); return; }
    if (b.opponentCurrentHp <= 0) { logBattle('你赢了！'); endBattle(true); return; }
    
    b.turn++;
    render();
}

Farm.openSynthesis = async function() {
    document.getElementById('modalSynthesis').classList.add('active');
    await loadItems();
    const showSynth = (type) => {
        const c = document.getElementById('synthesisList');
        let recipes = [];
        if (type === 'equipment') recipes = SYNTHESIS_RECIPES;
        else if (type === 'food') recipes = SYNTHESIS_FOOD;
        else if (type === 'potion') recipes = SYNTHESIS_POTIONS;
        if (recipes.length === 0) { c.innerHTML = '<p>暂无配方</p>'; return; }
        c.innerHTML = recipes.map((r, idx) => {
            const hasMaterials = Object.entries(r.materials).every(([item, need]) => (State.items[item] || 0) >= need);
            const hasGold = (State.profile.gold || 0) >= (r.cost || 0);
            const canCraft = hasMaterials && hasGold;
            let btnClass = 'btn-synthesis', btnText = '可合成';
            if (!hasMaterials) { btnClass = 'btn-nomat'; btnText = '材料不足'; }
            else if (!hasGold) { btnClass = 'btn-nogold'; btnText = '金币不足'; }
            const setBadge = r.set_name ? `<span class="set-badge">${r.set_name}</span>` : '';
            const slotName = r.slot ? `(${SLOT_NAMES[r.slot]})` : '';
            const qualityName = r.quality ? ` - ${QUALITY_NAMES[r.quality]}` : '';
            const timeText = r.time ? ` ⏳${r.time}分钟` : '';
            return `<div class="equipment-card"><strong>${r.icon||''} ${r.name}</strong> ${setBadge} ${slotName}${qualityName}${timeText}<div style="font-size:0.8rem;">材料：${Object.entries(r.materials).map(([item, need]) => `${ITEM_EMOJI[item]||'📦'}×${need}`).join(' ')}</div>${r.cost ? `<div style="font-size:0.8rem;">费用：🪙${r.cost}</div>` : ''}<button class="${btnClass}" data-recipe-idx="${idx}" data-type="${type}" ${canCraft?'':'disabled'}>${btnText}</button></div>`;
        }).join('');
        c.querySelectorAll('.btn-synthesis').forEach(btn => {
            btn.onclick = async () => {
                const idx = parseInt(btn.dataset.recipeIdx);
                const stype = btn.dataset.type;
                let recipe;
                if (stype === 'equipment') recipe = SYNTHESIS_RECIPES[idx];
                else if (stype === 'food') recipe = SYNTHESIS_FOOD[idx];
                else if (stype === 'potion') recipe = SYNTHESIS_POTIONS[idx];
                if (!recipe) return;
                if (stype === 'equipment') await synthesizeEquipment(recipe);
                else await synthesizeProduct(recipe);
                Farm.openSynthesis();
            };
        });
    };
    showSynth('equipment');
    document.querySelectorAll('#synthTypeTabs .auth-tab').forEach(tab => {
        tab.onclick = async () => {
            document.querySelectorAll('#synthTypeTabs .auth-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            await loadItems();  // 切换标签时实时刷新库存
            showSynth(tab.dataset.stype);
        };
    });
};

Farm.openPvE = async function() {
    await loadItems();       // 刷新自动战斗券库存
    await loadBossStatus();  // 刷新Boss状态
    const mapId = State.selectedMapId || 'grassland';
    const mapData = PVE_MAPS.find(m => m.id === mapId);
    if (!mapData) return;
    
    const modal = document.getElementById('modalPvE');
    if (!modal) { render(); setTimeout(() => Farm.openPvE(), 100); return; }
    modal.classList.add('active');
    const c = document.getElementById('pveListContainer');
    
    let html = '';
    
    if (mapData.isBoss) {
        if (State.bossStatus) {
            const now = new Date();
            const refreshesAt = State.bossStatus.refreshes_at ? new Date(State.bossStatus.refreshes_at) : null;
            if (State.bossStatus.current_hp > 0) {
                if (new Date(State.bossStatus.expires_at) <= now) {
                    const newExpires = new Date(Date.now() + BOSS_EXPIRE_HOURS * 3600000).toISOString();
                    await supabase.from('boss_status').update({ expires_at: newExpires }).eq('id', 1);
                    State.bossStatus.expires_at = newExpires;
                }
                const remaining = Math.ceil((new Date(State.bossStatus.expires_at) - now) / 3600000 * 10) / 10;
                html += `<div class="boss-card"><strong>👹 ${State.bossStatus.monster_name}</strong> ${State.bossStatus.emoji||''}<div>HP: ${State.bossStatus.current_hp}/${State.bossStatus.max_hp}</div><div>剩余时间：${remaining}小时</div><button class="btn-small btn-fight" data-boss="true">挑战BOSS</button></div>`;
            } else if (State.bossStatus.current_hp <= 0 && refreshesAt && refreshesAt > now) {
                const remaining = Math.ceil((refreshesAt - now) / 60000);
                html += `<div class="boss-card"><strong>👹 ${State.bossStatus.monster_name}</strong> <div>状态：重生冷却中</div><div>预计重生：${remaining} 分钟后</div></div>`;
            } else {
                await refreshBoss();
                const newRemaining = Math.ceil((new Date(State.bossStatus.expires_at) - new Date()) / 3600000 * 10) / 10;
                html += `<div class="boss-card"><strong>👹 ${State.bossStatus.monster_name}</strong> ${State.bossStatus.emoji||''}<div>HP: ${State.bossStatus.current_hp}/${State.bossStatus.max_hp}</div><div>剩余时间：${newRemaining}小时</div><button class="btn-small btn-fight" data-boss="true">挑战BOSS</button></div>`;
            }
        }
        html += `<button class="btn-icon" id="btnBackToMaps" style="margin-top:8px;">← 返回地图</button>`;
        c.innerHTML = html;
        if (document.getElementById('btnBackToMaps')) {
            document.getElementById('btnBackToMaps').onclick = () => { modal.classList.remove('active'); Farm.openPvEMap(); };
        }
        c.querySelectorAll('.btn-fight').forEach(btn => { btn.onclick = () => { const boss = { name: State.bossStatus.monster_name, emoji: State.bossStatus.emoji, hp: State.bossStatus.current_hp, maxHp: State.bossStatus.max_hp, atk: State.bossStatus.atk, def: State.bossStatus.def, spd: State.bossStatus.spd, rewards: State.bossStatus.rewards, isBoss: true, skills: ['fire_storm','fire_burn'] }; State.monsterAffixes = []; startPvEBattle(boss); modal.classList.remove('active'); }; });
        return;
    }
    
    const availableMonsters = mapData.monsterIds.map(getMonsterByName).filter(Boolean);
    const availableElites = mapData.eliteIds.map(getMonsterByName).filter(Boolean);
    
    const shuffled = [...availableMonsters].sort(() => Math.random() - 0.5).slice(0, Math.min(4, availableMonsters.length));
    
    State.monsterAffixes = [];
    shuffled.forEach(m => {
        const affixCount = Math.random() < 0.3 ? 2 : (Math.random() < 0.5 ? 1 : 0);
        const affixes = [];
        if (affixCount > 0) {
            const shuffledAffixes = [...MONSTER_AFFIXES].sort(() => Math.random() - 0.5);
            for (let i = 0; i < affixCount; i++) affixes.push(shuffledAffixes[i]);
        }
        if (affixes.length > 0) {
            const affixNames = affixes.map(a => `<span style="font-size:0.7rem;background:${a.color};color:#fff;border-radius:4px;padding:1px 4px;margin:0 2px;">${a.name}</span>`).join('');
            html += `<div class="list-item"><span>${m.emoji}</span><span style="flex:1;">${m.name} Lv.${m.minLevel}~${m.maxLevel}<br>${affixNames}</span><button class="btn-small btn-fight" data-monster='${JSON.stringify(m)}' data-affixes='${JSON.stringify(affixes.map(a=>a.id))}'>挑战</button></div>`;
        } else {
            html += `<div class="list-item"><span>${m.emoji}</span><span style="flex:1;">${m.name} Lv.${m.minLevel}~${m.maxLevel}</span><button class="btn-small btn-fight" data-monster='${JSON.stringify(m)}' data-affixes='[]'>挑战</button></div>`;
        }
    });
    
    availableElites.forEach(elite => {
        html += `<div class="elite-card"><strong>✨ ${elite.name} (精英)</strong> ${elite.emoji}<div>Lv.${elite.minLevel}~${elite.maxLevel}</div><button class="btn-small btn-fight" data-elite='${JSON.stringify(elite)}'>挑战精英</button></div>`;
    });
    
    const myTickets = State.items['auto_battle_ticket'] || 0;
    html += `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-icon" id="btnBackToMaps">← 返回地图</button>
        <button class="btn-small btn-fight" id="btnAutoBattle" style="background:#8e44ad;color:#fff;">⚔️ 自动战斗 (🎫${myTickets})</button>
    </div>`;
    
    c.innerHTML = html || '<p>暂无可挑战的怪物</p>';
    
    if (html) {
        if (document.getElementById('btnBackToMaps')) {
            document.getElementById('btnBackToMaps').onclick = () => { modal.classList.remove('active'); Farm.openPvEMap(); };
        }
        c.querySelectorAll('.btn-fight').forEach(btn => { btn.onclick = () => { if (btn.dataset.elite) { const elite = JSON.parse(btn.dataset.elite); elite.isElite = true; State.monsterAffixes = []; startPvEBattle(elite); } else { const mon = JSON.parse(btn.dataset.monster); const affixes = JSON.parse(btn.dataset.affixes || '[]'); State.monsterAffixes = affixes.map(id => MONSTER_AFFIXES.find(a => a.id === id)).filter(Boolean); startPvEBattle(mon); } modal.classList.remove('active'); }; });
        const autoBtn = document.getElementById('btnAutoBattle');
        if (autoBtn) {
            autoBtn.onclick = () => { modal.classList.remove('active'); Farm.openAutoBattle(); };
        }
    }
};

Farm.openMail = async function() {
    document.getElementById('modalMail').classList.add('active');
    const c = document.getElementById('mailListContainer');
    
    const showMailTab = async (type) => {
        if (type === 'inbox') {
            await loadMails();
            if (State.mails.length === 0) { c.innerHTML = '<p>收件箱为空</p>'; return; }
            c.innerHTML = State.mails.map((m, idx) => {
                const items = m.items && typeof m.items === 'object' ? Object.entries(m.items).filter(([k,v]) => v > 0).map(([k,v]) => `${ITEM_EMOJI[k]||'📦'} ${ITEM_NAMES[k]||k} ×${v}`).join(', ') : '';
                return `<div class="order-card" style="background:${m.is_read ? '#fff' : '#fef9f3'};">
                    <div style="font-weight:600;">${m.is_read ? '' : '🔵 '}${m.title}</div>
                    <div style="font-size:0.8rem;color:#888;">发件人：${escapeHTML(m.sender_name||'系统')}</div>
                    ${m.content ? `<div style="font-size:0.8rem;margin:4px 0;">${escapeHTML(m.content)}</div>` : ''}
                    ${items ? `<div style="font-size:0.8rem;color:#27ae60;">附件：${items}</div>` : ''}
                    <div style="margin-top:6px;">
                        ${!m.is_claimed && m.items && Object.keys(m.items).some(k => m.items[k] > 0) 
                            ? `<button class="btn-small btn-accept" data-mail-idx="${idx}">领取附件</button>` 
                            : (m.is_claimed ? '<span style="color:#888;">已领取</span>' : '')}
                    </div>
                </div>`;
            }).join('');
            for (const m of State.mails) { 
                if (!m.is_read) { m.is_read = true; supabase.from('mail').update({ is_read: true }).eq('id', m.id).then(() => {}); }
            }
            c.querySelectorAll('.btn-accept').forEach(btn => { btn.onclick = async () => { 
                const idx = parseInt(btn.dataset.mailIdx); const mail = State.mails[idx]; 
                if (!mail || mail.is_claimed) return; 
                try { 
                    if (mail.items) { for (const [item, qty] of Object.entries(mail.items)) { if (qty > 0) await addItem(item, qty); } }
                    mail.is_claimed = true; 
                    await supabase.from('mail').update({ is_claimed: true }).eq('id', mail.id); 
                    showToast('附件已领取！'); 
                    Farm.openMail(); 
                } catch (e) { showToast('领取失败', true); } 
            }; });
        } else if (type === 'outbox') {
            const { data: sentMails, error } = await supabase.from('mail').select('*').eq('sender_id', State.currentUser.id).order('created_at', { ascending: false }).limit(20);
            if (error) { c.innerHTML = '<p>加载失败</p>'; return; }
            if (sentMails.length === 0) { c.innerHTML = '<p>发件箱为空</p>'; return; }
            c.innerHTML = sentMails.map(m => {
                const items = m.items && typeof m.items === 'object' ? Object.entries(m.items).filter(([k,v]) => v > 0).map(([k,v]) => `${ITEM_EMOJI[k]||'📦'} ${ITEM_NAMES[k]||k} ×${v}`).join(', ') : '';
                return `<div class="order-card">
                    <div style="font-weight:600;">${m.title}</div>
                    <div style="font-size:0.8rem;color:#888;">收件人：${escapeHTML(m.receiver_name||'未知')}</div>
                    ${m.content ? `<div style="font-size:0.8rem;margin:4px 0;">${escapeHTML(m.content)}</div>` : ''}
                    ${items ? `<div style="font-size:0.8rem;">附件：${items}</div>` : ''}
                    <div style="font-size:0.7rem;color:#aaa;">${formatTime(m.created_at)}</div>
                </div>`;
            }).join('');
        } else if (type === 'compose') {
            c.innerHTML = `
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.85rem;">收件人昵称</label>
                    <input type="text" id="mailReceiverName" placeholder="输入好友昵称" style="width:100%;padding:8px;border:1px solid #e0d8cc;border-radius:8px;margin-top:4px;">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.85rem;">主题</label>
                    <input type="text" id="mailTitle" placeholder="邮件主题" style="width:100%;padding:8px;border:1px solid #e0d8cc;border-radius:8px;margin-top:4px;">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.85rem;">正文</label>
                    <textarea id="mailContent" placeholder="想说的话..." style="width:100%;padding:8px;border:1px solid #e0d8cc;border-radius:8px;margin-top:4px;height:80px;"></textarea>
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.85rem;">附件（可选，每行一个：物品ID 数量）</label>
                    <textarea id="mailItems" placeholder="例如：&#10;hair 3&#10;seed 2" style="width:100%;padding:8px;border:1px solid #e0d8cc;border-radius:8px;margin-top:4px;height:60px;"></textarea>
                </div>
                <button class="btn-primary" id="btnSendMail">发送邮件</button>
            `;
            document.getElementById('btnSendMail').onclick = async () => {
                const receiverName = document.getElementById('mailReceiverName').value.trim();
                const title = document.getElementById('mailTitle').value.trim();
                const content = document.getElementById('mailContent').value.trim();
                const itemsText = document.getElementById('mailItems').value.trim();
                if (!receiverName || !title) { showToast('收件人和主题不能为空', true); return; }
                
                const { data: receiverProfile } = await supabase.from('profiles').select('id,username').eq('username', receiverName).maybeSingle();
                if (!receiverProfile) { showToast('找不到该昵称的用户', true); return; }
                
                let items = {};
                if (itemsText) {
                    const lines = itemsText.split('\n').filter(l => l.trim());
                    for (const line of lines) {
                        const [itemKey, qtyStr] = line.trim().split(/\s+/);
                        if (itemKey && qtyStr && ITEM_NAMES[itemKey]) {
                            const need = parseInt(qtyStr);
                            if ((State.items[itemKey] || 0) < need) { showToast(`你背包里的 ${ITEM_NAMES[itemKey]} 不足`, true); return; }
                            items[itemKey] = (items[itemKey] || 0) + need;
                        }
                    }
                }
                
                for (const [item, qty] of Object.entries(items)) {
                    await addItem(item, -qty);
                }
                
                const mailData = {
                    receiver_id: receiverProfile.id,
                    receiver_name: receiverProfile.username,
                    sender_id: State.currentUser.id,
                    sender_name: State.profile.username,
                    title: title,
                    content: content,
                    items: items,
                    is_read: false,
                    is_claimed: false
                };
                
                const { error } = await supabase.from('mail').insert(mailData);
                if (error) { showToast('发送失败', true); return; }
                showToast(`邮件已发送给 ${receiverName}！`);
                showMailTab('inbox');
            };
        }
    };
    
    showMailTab('inbox');
    document.querySelectorAll('#mailTypeTabs .auth-tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('#mailTypeTabs .auth-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            showMailTab(tab.dataset.mtype);
        };
    });
};

Farm.startAutoBattle = async function(petId) {
    const mapId = State.selectedMapId || 'grassland';
    const mapData = PVE_MAPS.find(m => m.id === mapId);
    if (!mapData || mapData.isBoss) { showToast('自动战斗不支持BOSS地图', true); return; }
    
    const availableMonsters = mapData.monsterIds.map(getMonsterByName).filter(Boolean);
    if (availableMonsters.length === 0) { showToast('当前地图没有可自动战斗的怪物', true); return; }
    
    const myTickets = State.items['auto_battle_ticket'] || 0;
    if (myTickets <= 0) { showToast('自动战斗券不足', true); return; }
    
    const battleCount = Math.min(30, myTickets);
    showToast(`开始自动战斗 ×${battleCount} 场，每场消耗 🎫×1`);
    
    let totalGold = 0;
    let totalExp = 0;
    let totalItems = {};
    let wins = 0;
    let losses = 0;
    let levelUps = 0;
    
    const pet = State.pets.find(p => p.id === petId);
    if (!pet) return;
    
    for (let i = 0; i < battleCount; i++) {
        // 原子保护：每场战斗前扣一张券，避免一次性扣券导致中断损失
        await addItem('auto_battle_ticket', -1);
        
        const monster = availableMonsters[Math.floor(Math.random() * availableMonsters.length)];
        const myStats = getPetBattleStats(pet);
        const oppStats = { ...monster, hp: monster.hp, atk: monster.atk, def: monster.def, spd: monster.spd, maxHp: monster.hp };
        
        let affixes = [];
        if (Math.random() < 0.5) {
            const shuffled = [...MONSTER_AFFIXES].sort(() => Math.random() - 0.5);
            affixes = shuffled.slice(0, Math.random() < 0.3 ? 2 : 1);
        }
        for (const a of affixes) {
            if (a.effect.hp_mult) oppStats.hp = Math.floor(oppStats.hp * a.effect.hp_mult);
            if (a.effect.atk_mult) oppStats.atk = Math.floor(oppStats.atk * a.effect.atk_mult);
            if (a.effect.def_mult) oppStats.def = Math.floor(oppStats.def * a.effect.def_mult);
            if (a.effect.spd_mult) oppStats.spd = Math.floor(oppStats.spd * a.effect.spd_mult);
        }
        
        const myPower = myStats.atk * 2 + myStats.def + myStats.spd + myStats.hp * 0.5;
        const oppPower = oppStats.atk * 2 + oppStats.def + oppStats.spd + oppStats.hp * 0.5;
        const winChance = myPower / (myPower + oppPower) * 0.9 + 0.05;
        const won = Math.random() < winChance;
        
        if (won) {
            wins++;
            const goldReward = Math.floor(monster.rewards.gold * (0.8 + Math.random() * 0.4));
            totalGold += goldReward;
            totalExp += 50;
            
            if (monster.rewards.items) {
                for (const [item, prob] of Object.entries(monster.rewards.items)) {
                    if (Math.random() < prob) {
                        totalItems[item] = (totalItems[item] || 0) + 1;
                    }
                }
            }
            
            if (Math.random() < 0.05) {
                const allBookKeys = Object.keys(ACTIVE_SKILLS).map(k => 'book_' + k);
                const randBook = allBookKeys[Math.floor(Math.random() * allBookKeys.length)];
                totalItems[randBook] = (totalItems[randBook] || 0) + 1;
            }
            
            if (pet && (pet.level || 0) < PET_MAX_LEVEL) {
                const ne = (pet.exp || 0) + 50;
                pet.exp = ne;
                let nl = pet.level || 1;
                while (ne >= nl * 100 + nl * nl * 15 && nl < PET_MAX_LEVEL) {
                    nl++;
                    levelUps++;
                    const base = PET_TYPES[pet.pet_type].baseAttr;
                    pet.hp = Math.floor(base.hp * (1 + 0.02 * (nl - 1)));
                    pet.atk = Math.floor(base.atk * (1 + 0.02 * (nl - 1)));
                    pet.def = Math.floor(base.def * (1 + 0.015 * (nl - 1)));
                    pet.spd = Math.floor(base.spd * (1 + 0.01 * (nl - 1)));
                    pet.luk = Math.floor(base.luk * (1 + 0.01 * (nl - 1)));
                    pet.sta = Math.floor(base.sta * (1 + 0.02 * (nl - 1)));
                }
                if (nl !== pet.level) {
                    pet.level = nl;
                }
            }
            
            if (!State.monsterLog[monster.name]) State.monsterLog[monster.name] = { kills: 0, affixes: [] };
            State.monsterLog[monster.name].kills++;
            if (affixes.length > 0) {
                for (const a of affixes) {
                    if (!State.monsterLog[monster.name].affixes.includes(a.id)) {
                        State.monsterLog[monster.name].affixes.push(a.id);
                    }
                }
            }
        } else {
            losses++;
        }
    }
    
    if (totalGold > 0) {
        State.profile.gold += totalGold;
        await supabase.from('profiles').update({ gold: State.profile.gold }).eq('id', State.currentUser.id);
    }
    for (const [item, qty] of Object.entries(totalItems)) {
        await addItem(item, qty);
    }
    if (pet.exp !== undefined) {
        await supabase.from('pets').update({ 
            level: pet.level, exp: pet.exp,
            hp: pet.hp, atk: pet.atk, def: pet.def, spd: pet.spd, luk: pet.luk, sta: pet.sta
        }).eq('id', pet.id);
    }
    
    addEventLog('auto_battle', { map: mapData.name, wins, losses, gold: totalGold, items: totalItems });
    
    const itemsStr = Object.entries(totalItems).map(([k, v]) => `${ITEM_EMOJI[k]||'📦'} ${ITEM_NAMES[k]||k} ×${v}`).join('，');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay active';
    overlay.innerHTML = `
        <div class="modal" style="max-width:380px;">
            <h3>⚔️ 自动战斗结束</h3>
            <div style="text-align:left;padding:10px;">
                <div>🗺️ 地图：${mapData.name}</div>
                <div>🐾 出战：${pet.pet_name} Lv.${pet.level}</div>
                <div>✅ 胜利：${wins} 场 | ❌ 失败：${losses} 场</div>
                <div>🪙 金币：+${totalGold}</div>
                ${levelUps > 0 ? `<div style="color:#f0c040;">⬆️ 升级了 ${levelUps} 次！当前 Lv.${pet.level}</div>` : ''}
                ${itemsStr ? `<div style="margin-top:4px;">🎁 获得物品：${itemsStr}</div>` : '<div>未获得额外物品</div>'}
            </div>
            <button class="btn-primary" id="btnAutoResultConfirm">确定</button>
        </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#btnAutoResultConfirm').onclick = () => { overlay.remove(); loadPets().then(() => render()); };
};

// ==================== 技能书使用（修复被动key映射 + 替换原子性 + 防重复学习 + 库存实时刷新） ====================
Farm.openSkillBook = async function(bookKey) {
    // 实时刷新库存，防止连续学习时出现“幽灵库存”
    await loadItems();
    const qty = State.items[bookKey] || 0;
    if (qty <= 0) { showToast('没有该技能书'); return; }
    const isPassive = bookKey.startsWith('book_passive_');
    let skillId = isPassive ? bookKey.replace('book_passive_', '') : bookKey.replace('book_', '');
    
    // 被动技能书key映射表
    if (isPassive) {
        const PASSIVE_BOOK_TO_SKILL = {
            'fire': 'fire_soul', 'water': 'water_soul', 'grass': 'grass_soul',
            'thunder': 'thunder_soul', 'dark': 'dark_soul', 'light': 'light_soul',
            'brave': 'brave', 'tough': 'tough', 'swift': 'swift',
            'iron': 'iron', 'wise': 'wise', 'regen': 'regen',
            'unyield': 'unyielding', 'focus': 'focus', 'lucky': 'lucky'
        };
        if (PASSIVE_BOOK_TO_SKILL[skillId]) {
            skillId = PASSIVE_BOOK_TO_SKILL[skillId];
        }
    }
    
    const skillData = isPassive ? PASSIVE_SKILLS[skillId] : ACTIVE_SKILLS[skillId];
    if (!skillData) { showToast('未知技能书'); return; }
    if (State.pets.length === 0) { showToast('请先领养宠物'); return; }
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay active';
    overlay.innerHTML = `
        <div class="modal" style="max-width:400px;text-align:left;">
            <h3>📕 使用技能书</h3>
            <div style="margin-bottom:8px;"><strong>${skillData.name}</strong>：${skillData.desc}</div>
            <div style="font-weight:600;margin:8px 0;">选择宠物学习：</div>
            <div id="skillBookPetList"></div>
            <button class="btn-close" id="closeSkillBook">×</button>
        </div>
    `;
    document.body.appendChild(overlay);
    const petList = overlay.querySelector('#skillBookPetList');
    petList.innerHTML = State.pets.map(p => {
        if (isPassive) {
            const currentPassive = State.passiveSkills?.[p.id];
            const currentName = currentPassive ? PASSIVE_SKILLS[currentPassive]?.name : '无';
            return `<div class="list-item" style="cursor:pointer;justify-content:space-between;" data-pet-id="${p.id}"><span>${PET_TYPES[p.pet_type]?.emoji||'🐾'} #${p.id} ${p.pet_name}</span><span style="font-size:0.7rem;">当前被动：${currentName}</span></div>`;
        } else {
            const currentSkills = State.petSkills.filter(s => s.pet_id === p.id);
            const skillNames = currentSkills.map(s => {
                const sd = ACTIVE_SKILLS[s.skill_name];
                return sd ? sd.name : s.skill_name;
            }).join(', ') || '暂无技能';
            const hasSlot = currentSkills.length < 4;
            return `<div class="list-item" style="cursor:pointer;justify-content:space-between;" data-pet-id="${p.id}"><span>${PET_TYPES[p.pet_type]?.emoji||'🐾'} #${p.id} ${p.pet_name}</span><span style="font-size:0.7rem;">${hasSlot ? `空位${4-currentSkills.length}个` : '技能已满'}</span><span style="font-size:0.65rem;color:#888;">${skillNames}</span></div>`;
        }
    }).join('');
    overlay.querySelector('#closeSkillBook').onclick = () => overlay.remove();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    petList.querySelectorAll('.list-item').forEach(item => {
        item.onclick = async () => {
            const pid = parseInt(item.dataset.petId);
            if (isPassive) {
                try {
                    await addItem(bookKey, -1);
                    State.passiveSkills[pid] = skillId;
                    await supabase.from('pets').update({ passive_skill: skillId }).eq('id', pid);
                    showToast(`${State.pets.find(p=>p.id===pid)?.pet_name} 习得被动：${skillData.name}！`);
                    overlay.remove();
                } catch (e) { showToast('学习失败', true); }
            } else {
                const currentSkills = State.petSkills.filter(s => s.pet_id === pid);
                // 防止重复学习相同技能
                if (currentSkills.some(s => s.skill_name === skillId)) {
                    showToast('该宠物已学会此技能！', true);
                    return;
                }
                if (currentSkills.length < 4) {
                    try {
                        await addItem(bookKey, -1);
                        const freeSlot = [0,1,2,3].find(s => !currentSkills.some(cs => cs.slot === s));
                        const { data: newSkill, error: insertError } = await supabase.from('pet_skills').insert({
                            pet_id: pid, skill_name: skillId, skill_type: skillData.type,
                            power: skillData.power || 100, cooldown: skillData.cooldown || 3, level: 1, slot: freeSlot
                        }).select().single();
                        if (insertError || !newSkill) {
                            await addItem(bookKey, 1); // 退还技能书
                            showToast('学习失败，技能书已退还', true);
                            return;
                        }
                        State.petSkills.push(newSkill);
                        showToast(`习得主动技能：${skillData.name}！`);
                        overlay.remove();
                    } catch (e) { 
                        await addItem(bookKey, 1);
                        showToast('学习失败，技能书已退还', true); 
                    }
                } else {
                    overlay.innerHTML = `
                        <div class="modal" style="max-width:400px;text-align:left;">
                            <h3>🔄 替换技能</h3>
                            <div style="margin-bottom:8px;">学习 <strong>${skillData.name}</strong>，请选择要替换的技能：</div>
                            <div id="replaceSkillList">${currentSkills.map(s => {
                                const sd = ACTIVE_SKILLS[s.skill_name];
                                return `<div class="list-item" style="cursor:pointer;" data-skill-id="${s.id}"><span>📜 ${sd?.name||s.skill_name} Lv.${s.level}</span></div>`;
                            }).join('')}</div>
                            <button class="btn-close" id="backSkillBook">← 返回</button>
                        </div>
                    `;
                    overlay.querySelector('#backSkillBook').onclick = () => { overlay.remove(); Farm.openSkillBook(bookKey); };
                    overlay.querySelectorAll('#replaceSkillList .list-item').forEach(sItem => {
                        sItem.onclick = async () => {
                            const oldSkillId = parseInt(sItem.dataset.skillId);
                            try {
                                await addItem(bookKey, -1);
                                const oldSkill = currentSkills.find(s => s.id === oldSkillId);
                                // 先插入新技能
                                const { data: newSkill, error: insertError } = await supabase.from('pet_skills').insert({
                                    pet_id: pid, skill_name: skillId, skill_type: skillData.type,
                                    power: skillData.power || 100, cooldown: skillData.cooldown || 3, level: 1, slot: oldSkill?.slot || 0
                                }).select().single();
                                if (insertError || !newSkill) {
                                    await addItem(bookKey, 1); // 退还技能书
                                    showToast('替换失败，技能书已退还', true);
                                    return;
                                }
                                // 插入成功，再删除旧技能
                                await supabase.from('pet_skills').delete().eq('id', oldSkillId);
                                State.petSkills = State.petSkills.filter(s => s.id !== oldSkillId);
                                State.petSkills.push(newSkill);
                                showToast(`替换成功！习得 ${skillData.name}`);
                                overlay.remove();
                            } catch (e) { 
                                await addItem(bookKey, 1);
                                showToast('替换失败，技能书已退还', true); 
                            }
                        };
                    });
                }
            }
        };
    });
};

async function loadEventLog() {
    const c = document.getElementById('eventLogContainer');
    c.innerHTML = '<p>加载中...</p>';
    const { data: logs, error } = await supabase.from('event_logs').select('*').eq('user_id', State.currentUser.id).order('created_at', { ascending: false }).limit(50);
    if (error) { c.innerHTML = '<p>加载失败</p>'; return; }
    if (logs.length === 0) { c.innerHTML = '<p>暂无事件记录。</p>'; return; }
    c.innerHTML = logs.map(log => { const time = formatTime(log.created_at), content = formatEventMessage(log); return `<div class="log-item"><div style="font-size:0.7rem;color:#888;">${time}</div><div>${content}</div></div>`; }).join('');
    const { count } = await supabase.from('event_logs').select('*', { count: 'exact', head: true }).eq('user_id', State.currentUser.id);
    if (count > MAX_LOG_COUNT) {
        const { data: oldLogs } = await supabase.from('event_logs').select('id').eq('user_id', State.currentUser.id).order('created_at', { ascending: true }).limit(count - MAX_LOG_COUNT);
        const oldIds = oldLogs.map(l => l.id);
        await supabase.from('event_logs').delete().in('id', oldIds).eq('user_id', State.currentUser.id);
    }
}
function formatEventMessage(log) {
    const d = log.event_data || {};
    switch (log.event_type) {
        case 'plant': return `🌱 你种下了 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}`;
        case 'harvest': { const qName = d.quality ? QUALITIES[d.quality]?.name || d.quality : ''; return `🌾 你收获了 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}，获得 ${d.gold} 金币${qName ? '（'+qName+'）' : ''}`; }
        case 'water_self': return `💧 你为自己的 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||'作物'} 浇了水`;
        case 'water_sent': return `💧 你帮 👤 ${d.friend} 浇了水，双方各得5金币`;
        case 'steal_sent': return `你偷了 👤 ${d.victim} 的 ${CROPS[d.crop]?.emoji||''}${CROPS[d.crop]?.name||d.crop}，获得 ${d.gold} 金币`;
        case 'adopt_pet': return `🐾 你领养了一只 ${d.pet}（性格${d.nature||'?'}，被动${d.passive||'?'}）`;
        case 'explore_start': return `🗺️ ${d.pet} 前往${d.route}探险了`;
        case 'explore_complete': { const items = Object.entries(d.rewards||{}).map(([item,qty]) => `${ITEM_EMOJI[item]||'📦'}×${qty}`).join(' '); const eventMsg = d.event ? ` · 触发事件：${d.event}` : ''; return `🗺️ ${d.pet} 从${d.route}归来，获得 ${items}${eventMsg}`; }
        case 'plot_unlock': return `🔓 你解锁了第 ${d.plot} 块农田！`;
        case 'friend_accepted': return `🤝 你和 👤 ${d.friend} 成为了好友`;
        case 'synthesis': return `🔧 你合成了 ${d.name} (${QUALITY_NAMES[d.quality]})`;
        case 'enhance': return `⚔️ 装备 ${d.name} 强化${d.success?'成功':'失败'}，当前+${d.level}`;
        case 'decompose': return `♻️ 你分解了 ${d.name}，材料已返还`;
        case 'sell_equipment': return `💰 你出售了 ${d.name}，获得 ${d.price} 金币`;
        case 'battle_win': return `⚔️ 你战胜了 👤 ${d.opponent}，获得 ${d.gold} 金币`;
        case 'battle_lose': return `⚔️ 你败给了 👤 ${d.opponent}`;
        case 'pve_win': return `🐉 你击败了 ${d.monster}，获得 🪙${d.gold} 和材料`;
        case 'pve_lose': return `🐉 你被 ${d.monster} 击败了`;
        case 'auto_battle': return `⚔️ 自动战斗完成：胜利${d.wins}场，获得🪙${d.gold}`;
        default: return '未知事件';
    }
}

async function init() {
    const { data } = await supabase.auth.getSession();
    if (data.session) {
        State.currentUser = data.session.user;
        try {
            State.profile = (await supabase.from('profiles').select('*').eq('id', State.currentUser.id).single()).data;
            const localToken = localStorage.getItem('session_token');
            if (State.profile.session_token && State.profile.session_token !== localToken) {
                showToast('账号在其他设备登录，请重新登录', true);
                await signOut();
                return;
            }
            State.profileChannel = supabase
                .channel('profile-changes')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${State.currentUser.id}` },
                    (payload) => {
                        const newToken = payload.new.session_token;
                        const localT = localStorage.getItem('session_token');
                        if (newToken && newToken !== localT) {
                            showToast('账号在其他设备登录，请重新登录', true);
                            signOut();
                        }
                    }
                )
                .subscribe();

            await loadFarmPlots();
            await loadFriendData();
            await loadPets();
            await loadItems();
            await loadEquipment();
            await loadBossStatus();
            await loadPetSkills();
            await loadPassiveSkills();
            await loadMails();
            await loadProcessingTasks();
            await checkNewMails();
            generateOrders();
            startProcessingTimer();
            startMailCheckTimer();  // 新增：启动邮件红点定时检测
        } catch (e) { console.error(e); }
    }
    render();
}

init();

})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 家庭教育控制台</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶部导航 ===== */
        .header {
            background: #2c3e50;
            color: #fff;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .header h1 span {
            color: #f39c12;
        }
        .header .hint {
            font-size: 13px;
            color: #b0b8c0;
        }
        .header .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .header .actions button {
            background: #f39c12;
            border: none;
            color: #2c3e50;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .header .actions button:hover {
            background: #e67e22;
        }
        .header .actions button.print-btn {
            background: #3498db;
            color: #fff;
        }
        .header .actions button.print-btn:hover {
            background: #2980b9;
        }

        /* ===== 主体布局 ===== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 左侧卡片列表 ===== */
        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid #e9edf2;
            padding: 16px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar .section-title {
            font-size: 12px;
            color: #95a5a6;
            padding: 8px 20px 4px 20px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .sidebar .card-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 20px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
            font-family: inherit;
        }
        .sidebar .card-btn:hover {
            background: #f5f7fa;
        }
        .sidebar .card-btn.active {
            background: #ebf5fb;
            border-left-color: #3498db;
            font-weight: 600;
        }
        .sidebar .card-btn .icon {
            font-size: 20px;
            width: 30px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar .card-btn .badge {
            margin-left: auto;
            font-size: 11px;
            background: #ecf0f1;
            padding: 0 10px;
            border-radius: 12px;
            color: #7f8c8d;
            white-space: nowrap;
        }
        .sidebar .card-btn .badge.preview {
            background: #3498db;
            color: #fff;
        }
        .sidebar .card-btn .badge.ready {
            background: #27ae60;
            color: #fff;
        }

        /* ===== 右侧预览区 ===== */
        .preview {
            flex: 1;
            background: #f5f7fa;
            padding: 16px 24px;
            overflow-y: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .preview iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: none;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }

        /* ===== 滚动条美化 ===== */
        .sidebar::-webkit-scrollbar,
        .preview::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #d0d7dd;
            border-radius: 4px;
        }
        .preview::-webkit-scrollbar-thumb {
            background: #d0d7dd;
            border-radius: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .sidebar {
                width: 200px;
            }
            .sidebar .card-btn {
                padding: 10px 14px;
                font-size: 13px;
            }
            .header h1 {
                font-size: 17px;
            }
            .preview {
                padding: 12px;
            }
            .header .hint {
                display: none;
            }
        }
        @media (max-width: 500px) {
            .main {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 170px;
                border-right: none;
                border-bottom: 1px solid #e9edf2;
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 8px 12px;
                gap: 6px;
            }
            .sidebar .section-title {
                display: none;
            }
            .sidebar .card-btn {
                flex-shrink: 0;
                width: auto;
                padding: 8px 16px;
                border-left: none;
                border-bottom: 3px solid transparent;
                border-radius: 6px;
                font-size: 13px;
            }
            .sidebar .card-btn .badge {
                display: none;
            }
            .sidebar .card-btn.active {
                border-bottom-color: #3498db;
                background: #ebf5fb;
            }
            .preview {
                padding: 10px;
            }
            .preview iframe {
                min-height: 400px;
            }
            .header .actions button {
                font-size: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>

        // ============================================================
        // 打印功能
        // ============================================================
        function printCurrentCard() {
            const frame = document.getElementById('previewFrame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            const content = doc.documentElement.outerHTML;
            const win = window.open('', '_blank', 'width=1000,height=800');
            win.document.write('<!DOCTYPE html><html>' + content + '</html>');
            win.document.close();
            win.focus();
            win.print();
        }

name: Merge ONE Articles

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run merge script
        run: |
          cd scripts
          python merge_one_articles.py
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/one_articles.json one_archive.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Merge ONE articles for 2026-04"
          git push

name: Backfill ONE Articles

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backfill script
        run: python scripts/backfill_one_articles.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/one_articles.json one_archive.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Backfill historical ONE articles"
          git push
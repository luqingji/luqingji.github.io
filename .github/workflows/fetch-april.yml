name: Fetch April ONE Articles

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Run fetch script
        run: python scripts/fetch_and_merge_april.py
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/one_articles.json one_archive.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Add April ONE articles"
          git push
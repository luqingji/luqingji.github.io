name: Regenerate ONE Archive

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run generate script
        run: python scripts/generate_one_archive.py
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add one_archive.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Regenerate archive with only existing history"
          git push

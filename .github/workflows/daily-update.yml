name: Daily Update

on:
  schedule:
    - cron: '0 23 * * *'   # 每天 UTC 23:00（北京时间 7:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run crawler
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ALAPI_TOKEN: ${{ secrets.ALAPI_TOKEN }}
        run: python scripts/crawler.py

      - name: Generate history index
        run: python scripts/generate_index.py

      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p static/css static/js
          git add data/ static/ .nojekyll index.html daily.html detail.html history.html songs.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily update: $(date +'%Y-%m-%d')"
          git push

      - name: Notify failure
        if: failure()
        run: echo "Crawler failed. Check logs."

name: Daily Update

on:
  schedule:
    - cron: '0 23 * * *'   # 每天 UTC 23:00（北京时间 7:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run crawler
        id: crawler
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ALAPI_TOKEN: ${{ secrets.ALAPI_TOKEN }}
        run: |
          python scripts/crawler.py
          if [ $? -eq 0 ] && [ -f data/daily.json ]; then
            echo "CRAWLER_SUCCESS=true" >> $GITHUB_ENV
            echo "SUMMARY=$(jq -r '.summary' data/daily.json)" >> $GITHUB_ENV
            echo "ARTICLE_TITLE=$(jq -r '.article.title' data/daily.json)" >> $GITHUB_ENV
            echo "QUESTION=$(jq -r '.question' data/daily.json)" >> $GITHUB_ENV
            echo "DATE=$(jq -r '.date' data/daily.json)" >> $GITHUB_ENV
          else
            echo "CRAWLER_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Generate history index
        run: python scripts/generate_index.py

      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p static/css static/js
          git add data/ static/ .nojekyll index.html daily.html detail.html history.html songs.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily update: $(date +'%Y-%m-%d')"
          git push

      - name: Send success notification to DingTalk
        if: success() && env.CRAWLER_SUCCESS == 'true'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SUMMARY: ${{ env.SUMMARY }}
          ARTICLE_TITLE: ${{ env.ARTICLE_TITLE }}
          QUESTION: ${{ env.QUESTION }}
          DATE: ${{ env.DATE }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ] || [ -z "$DINGTALK_SECRET" ]; then
            echo "钉钉配置缺失，跳过通知"
            exit 0
          fi
          timestamp="$(( $(date +%s) * 1000 ))"
          sign=$(printf "$timestamp\n$DINGTALK_SECRET" | openssl dgst -hmac -sha256 -binary | base64 -w 0)
          # 消息文本中必须包含“拾光驿站”关键词
          TEXT=$(cat <<EOF
          ## 📮 拾光驿站 · 每日报告

          **日期**：$DATE

          ## 📝 每日总结
          > $SUMMARY

          ---

          ## 📊 今日统计
          - **📖 文章**：$ARTICLE_TITLE
          - **🎵 歌单**：今日推荐6首歌曲
          - **📚 小说**：今日更新3篇小说
          - **💬 思考题**：$QUESTION

          ---

          > ✨ 拾光驿站，美好的一天从诗意与思考开始。
          > [点击查看详情](https://${{ github.repository_owner }}.github.io)
          EOF
          )
          # 使用 jq 转义文本
          TEXT_JSON=$(echo "$TEXT" | jq -Rsa .)
          PAYLOAD=$(jq -n --arg text "$TEXT_JSON" '{
            msgtype: "markdown",
            markdown: {
              title: "📮 拾光驿站 · 每日报告",
              text: $text
            },
            at: {
              isAtAll: false
            }
          }')
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"timestamp\":$timestamp,\"sign\":\"$sign\",\"msg\":$PAYLOAD}" \
            $DINGTALK_WEBHOOK

      - name: Send failure notification to DingTalk
        if: failure() || env.CRAWLER_SUCCESS == 'false'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          if [ -z "$DINGTALK_WEBHOOK" ] || [ -z "$DINGTALK_SECRET" ]; then
            echo "钉钉配置缺失，跳过通知"
            exit 0
          fi
          timestamp="$(( $(date +%s) * 1000 ))"
          sign=$(printf "$timestamp\n$DINGTALK_SECRET" | openssl dgst -hmac -sha256 -binary | base64 -w 0)
          MESSAGE=$(cat <<EOF
          {
            "msgtype": "markdown",
            "markdown": {
              "title": "❌ 拾光驿站 · 更新失败",
              "text": "## ❌ 拾光驿站 · 每日更新失败\n\n爬虫运行出现问题，请检查 [GitHub Actions 日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})。"
            },
            "at": {
              "isAtAll": false
            }
          }
          EOF
          )
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"timestamp\":$timestamp,\"sign\":\"$sign\",\"msg\":$MESSAGE}" \
            $DINGTALK_WEBHOOK

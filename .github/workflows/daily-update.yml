name: Daily Update

on:
  schedule:
    - cron: '0 23 * * *'   # 每天 UTC 23:00（北京时间 7:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run crawler
        id: crawler
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ALAPI_TOKEN: ${{ secrets.ALAPI_TOKEN }}
        run: |
          python scripts/crawler.py
          if [ $? -eq 0 ] && [ -f data/daily.json ]; then
            # 使用 heredoc 避免特殊字符问题
            summary=$(jq -r '.summary' data/daily.json | tr -d '\n\r')
            article_title=$(jq -r '.article.title' data/daily.json | tr -d '\n\r')
            question=$(jq -r '.question' data/daily.json | tr -d '\n\r')
            date=$(jq -r '.date' data/daily.json | tr -d '\n\r')
            echo "CRAWLER_SUCCESS=true" >> $GITHUB_ENV
            echo "SUMMARY<<EOF" >> $GITHUB_ENV
            echo "$summary" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "ARTICLE_TITLE<<EOF" >> $GITHUB_ENV
            echo "$article_title" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "QUESTION<<EOF" >> $GITHUB_ENV
            echo "$question" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "DATE=$date" >> $GITHUB_ENV
          else
            echo "CRAWLER_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Generate history index
        run: python scripts/generate_index.py

      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p static/css static/js
          git add data/ static/ .nojekyll index.html daily.html detail.html history.html songs.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily update: $(date +'%Y-%m-%d')"
          git push

      - name: Send success notification to DingTalk
        if: success() && env.CRAWLER_SUCCESS == 'true'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SUMMARY: ${{ env.SUMMARY }}
          ARTICLE_TITLE: ${{ env.ARTICLE_TITLE }}
          QUESTION: ${{ env.QUESTION }}
          DATE: ${{ env.DATE }}
        run: python scripts/dingtalk.py success

      - name: Send failure notification to DingTalk
        if: failure() || env.CRAWLER_SUCCESS == 'false'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python scripts/dingtalk.py failure
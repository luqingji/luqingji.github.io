name: Daily Update

on:
  schedule:
    - cron: '18 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run crawler
        id: crawler
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ALAPI_TOKEN: ${{ secrets.ALAPI_TOKEN }}
        run: |
          python scripts/crawler.py
          if [ $? -eq 0 ] && [ -f data/daily.json ]; then
            echo "CRAWLER_SUCCESS=true" >> $GITHUB_ENV
            echo "SUMMARY=$(jq -r '.summary' data/daily.json)" >> $GITHUB_ENV
            echo "ARTICLE_TITLE=$(jq -r '.article.title' data/daily.json)" >> $GITHUB_ENV
            echo "DATE=$(jq -r '.date' data/daily.json)" >> $GITHUB_ENV
          else
            echo "CRAWLER_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Generate history index
        run: python scripts/generate_index.py

      - name: Generate one archive page
        run: python scripts/generate_one_archive.py

      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p static/css static/js
          git add data/ static/ .nojekyll index.html daily.html detail.html history.html songs.html one_archive.html photos.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily update: $(date +'%Y-%m-%d')"
          git push

      - name: Send success notification to DingTalk
        if: success() && env.CRAWLER_SUCCESS == 'true'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SUMMARY: ${{ env.SUMMARY }}
          ARTICLE_TITLE: ${{ env.ARTICLE_TITLE }}
          DATE: ${{ env.DATE }}
        run: python scripts/dingtalk.py success

      - name: Send failure notification to DingTalk
        if: failure() || env.CRAWLER_SUCCESS == 'false'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python scripts/dingtalk.py failure

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260505">
    <title>隅 · 安静角落 · 历史回顾</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1e1e2f;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 500;
        }
        .back-today {
            color: #1e1e2f;
            text-decoration: none;
            border-bottom: 1px dotted #e0e4e8;
        }
        .subtitle {
            text-align: center;
            color: #8e8e9e;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .year-group { margin-bottom: 1.5rem; }
        .year-title {
            font-size: 1.4rem;
            font-weight: 500;
            color: #1e1e2f;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 0.2rem;
            margin-bottom: 0.5rem;
        }
        .month-group { margin-left: 1rem; margin-bottom: 1rem; }
        .month-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: #5b5b6e;
            margin-bottom: 0.5rem;
        }
        .month-count {
            font-size: 0.8rem;
            font-weight: normal;
            color: #b0b0c0;
        }
        .day-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-left: 1rem;
        }
        .day-card {
            display: inline-block;
            background: none;
            border: 1px solid #e0e4e8;
            border-radius: 30px;
            padding: 0.4rem 1rem;
            text-decoration: none;
            color: #1e1e2f;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .day-card:hover {
            background: #f5f7f9;
            border-color: #cbd0d6;
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #b0b0c0;
            border-top: 1px solid #f0f2f5;
            padding-top: 1.5rem;
        }
        .loader {
            text-align: center;
            padding: 2rem;
            color: #b0b0c0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="history-header">
        <h1>🗂️ 隅 · 安静角落 · 历史回顾</h1>
        <a href="/" class="back-today">← 返回今日</a>
    </div>
    <div class="subtitle">点击日期查看当天的完整内容</div>
    <div id="loader" class="loader">📅 加载中...</div>
    <div id="timeline" style="display:none;"></div>
    <div class="footer">
        <a href="/" style="color:#1e1e2f; text-decoration:none; border-bottom:1px dotted #e0e4e8;">🏠 首页</a>
        <span style="margin:0 0.5rem">·</span>
        <a href="/songs.html" style="color:#1e1e2f; text-decoration:none; border-bottom:1px dotted #e0e4e8;">🎵 歌单</a>
    </div>
</div>
<script>
    fetch('/data/history/index.json?t='+Date.now()).then(res=>res.json()).then(dates=>{
        document.getElementById('loader').style.display='none';
        let timeline=document.getElementById('timeline');
        timeline.style.display='block';
        let grouped={};
        dates.forEach(d=>{
            let [y,m,day]=d.split('-');
            if(!grouped[y]) grouped[y]={};
            if(!grouped[y][m]) grouped[y][m]=[];
            grouped[y][m].push({day,full:d});
        });
        for(let y of Object.keys(grouped).sort().reverse()){
            let yearDiv=document.createElement('div'); yearDiv.className='year-group';
            yearDiv.innerHTML=`<div class="year-title">${y} 年</div>`;
            for(let m of Object.keys(grouped[y]).sort().reverse()){
                let monthDiv=document.createElement('div'); monthDiv.className='month-group';
                let days=grouped[y][m];
                monthDiv.innerHTML=`<div class="month-title">${m} 月 <span class="month-count">（共${days.length}天）</span></div>`;
                let dayList=document.createElement('div'); dayList.className='day-list';
                days.sort((a,b)=>parseInt(b.day)-parseInt(a.day)).forEach(d=>{
                    let a=document.createElement('a'); a.className='day-card'; a.href=`/detail.html?date=${d.full}`; a.textContent=`${d.day} 日`;
                    dayList.appendChild(a);
                });
                monthDiv.appendChild(dayList); yearDiv.appendChild(monthDiv);
            }
            timeline.appendChild(yearDiv);
        }
    }).catch(err=>{ document.getElementById('loader').innerHTML='加载失败，请刷新'; console.error(err); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>拾光驿站 · 精选文摘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e1e2f;
            line-height: 1.5;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #8e8e9e;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .year-group {
            margin-bottom: 2rem;
        }
        .year-title {
            font-size: 1.6rem;
            font-weight: 500;
            color: #1e1e2f;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 0.3rem;
            margin-bottom: 1rem;
        }
        .month-group {
            margin-left: 1rem;
            margin-bottom: 1.2rem;
        }
        .month-title {
            font-size: 1.2rem;
            font-weight: 500;
            color: #5b5b6e;
            margin-bottom: 0.5rem;
        }
        .article-list {
            list-style: none;
            margin-left: 1rem;
        }
        .article-item {
            margin-bottom: 0.6rem;
        }
        .article-link {
            color: #1e1e2f;
            text-decoration: none;
            border-bottom: 1px dotted #e0e4e8;
            transition: border-color 0.2s;
            font-size: 0.95rem;
        }
        .article-link:hover {
            border-bottom-color: #1e1e2f;
        }
        .article-date {
            color: #8e8e9e;
            font-size: 0.8rem;
            margin-right: 0.8rem;
        }
        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: #b0b0c0;
            border-top: 1px solid #f0f2f5;
            padding-top: 1.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #1e1e2f;
            text-decoration: none;
            border-bottom: 1px dotted #e0e4e8;
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .year-title { font-size: 1.4rem; }
            .month-title { font-size: 1rem; }
            .article-link { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← 返回主页</a>

        <div class="month-group">
            <div class="month-title">04 月</div>
            <ul class="article-list">

            </ul>
        </div>
    </div>

        <a href="/" style="color:#1e1e2f; text-decoration:none; border-bottom:1px dotted #e0e4e8;">🏠 拾光驿站</a>
        <span style="margin:0 0.5rem">·</span>
        <a href="/history.html" style="color:#1e1e2f; text-decoration:none; border-bottom:1px dotted #e0e4e8;">📜 历史回顾</a>
    </div>
</div>
</body>
</html>

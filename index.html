<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日拾光 · 诗与歌的相遇</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=LXGW+WenKai&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(145deg, #f9f3e8 0%, #d9e2f0 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #2c3e50;
            transition: background 0.3s, color 0.3s;
        }
        /* 暗色模式 */
        body.dark-mode {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            color: #e0e0e0;
        }
        body.dark-mode .card {
            background: rgba(30,40,50,0.85);
            border-color: rgba(255,255,255,0.1);
            color: #e0e0e0;
        }
        body.dark-mode .card h2 { color: #b0c4de; border-left-color: #4f9da6; }
        body.dark-mode .song-comment { background: rgba(100,80,70,0.5); color: #f0b27a; }
        body.dark-mode .sentence-content { color: #f0f0f0; }
        body.dark-mode .sentence-from { color: #a0b0c0; }
        body.dark-mode .article-title, body.dark-mode .novel-title { color: #d0e0f0; }
        body.dark-mode .article-desc, body.dark-mode .novel-content { color: #ccc; }
        body.dark-mode .meaning { background: rgba(50,70,90,0.7); color: #e0e0e0; border-left-color: #4f9da6; }
        body.dark-mode .footer { background: rgba(20,30,40,0.5); color: #aaa; }
        body.dark-mode .back-link { color: #4f9da6; }
        body.dark-mode .day-card { background: rgba(40,50,60,0.7); color: #e0e0e0; border-color: rgba(255,255,255,0.1); }
        body.dark-mode .day-card:hover { background: rgba(60,80,100,0.9); }
        body.dark-mode .stats { color: #9aaebf; border-top-color: rgba(255,255,255,0.1); }
        body.dark-mode .theme-toggle { background: rgba(0,0,0,0.5); color: #eee; }

        .container { max-width: 750px; margin: 0 auto; position: relative; }
        .hero { text-align: center; margin-bottom: 2.5rem; position: relative; }
        .hero h1 {
            font-family: "LXGW WenKai", cursive;
            font-size: 2.8rem;
            font-weight: 400;
            color: #1e2f3f;
            margin-bottom: 0.5rem;
        }
        body.dark-mode .hero h1 { color: #d0e0f0; }
        .hero .date {
            display: inline-block;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            font-size: 0.95rem;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 20px 35px -8px rgba(0,20,30,0.15);
            border: 1px solid rgba(255,255,255,0.5);
            transition: transform 0.25s ease, background 0.3s;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .card:hover { transform: translateY(-5px); }
        .card h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            border-left: 5px solid #4f9da6;
            padding-left: 0.5rem;
            color: #1e3c43;
        }
        .song-container {
            display: flex;
            gap: 1.8rem;
            align-items: center;
        }
        .song-cover {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 12px 25px -8px rgba(0,0,0,0.2);
        }
        .song-info h3 { font-size: 1.8rem; font-weight: 600; }
        .song-info .artist { font-size: 1.2rem; color: #4f5e6b; }
        .song-info .album { font-size: 1rem; color: #6b7c8b; }
        .song-comment {
            font-style: italic;
            color: #bf6f5a;
            background: rgba(255,235,220,0.7);
            padding: 0.8rem 1rem;
            border-radius: 20px;
            margin-top: 1rem;
        }
        .sentence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .sentence-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            transition: background 0.2s;
            color: inherit;
        }
        .action-btn:hover {
            background: rgba(0,0,0,0.1);
        }
        body.dark-mode .action-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .sentence-content {
            font-size: 1.7rem;
            font-family: "LXGW WenKai", cursive;
            text-align: center;
            margin-bottom: 0.8rem;
        }
        .sentence-from {
            text-align: right;
            color: #6f8a9c;
            font-size: 1.1rem;
        }
        .article-title { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
        .article-desc { color: #2c3e50; line-height: 1.8; }
        .article-author { text-align: right; color: #6b7c8b; }

        /* 小说卡片样式 */
        .novel-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #1e3c43;
            border-left: 4px solid #bf6f5a;
            padding-left: 1rem;
        }
        .novel-content {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #2c3e50;
            text-align: justify;
        }
        .novel-content p {
            margin-bottom: 1.2em;
            text-indent: 2em;
        }
        .novel-content p:last-child { margin-bottom: 0; }

        .stats {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: right;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 0.8rem;
        }

        .meaning {
            display: none;
            margin-top: 1.5rem;
            background: rgba(225,240,250,0.7);
            padding: 1.2rem 1.5rem;
            border-radius: 24px;
            font-style: italic;
            color: #1e3c43;
            border-left: 4px solid #4f9da6;
        }
        .footer {
            text-align: center;
            color: #5d737e;
            font-size: 0.9rem;
            margin-top: 2.5rem;
            padding: 1rem;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border-radius: 50px;
        }
        .loader {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #4f9da6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 回到顶部按钮 */
        .go-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
            color: white;
            font-size: 1.5rem;
            border: none;
        }
        .go-top.visible { opacity: 1; }
        .go-top:hover { background: rgba(0,0,0,0.7); }
        body.dark-mode .go-top { background: rgba(255,255,255,0.2); color: #ccc; }

        /* 暗色模式切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.8); }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2.2rem; }
            .card { padding: 1.5rem; }
            .song-container { flex-direction: column; text-align: center; }
            .song-cover { width: 150px; height: 150px; }
            .sentence-content { font-size: 1.4rem; }
            .novel-title { font-size: 1.8rem; }
            .novel-content { font-size: 1rem; }
            .theme-toggle { top: 10px; right: 10px; padding: 5px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <!-- 暗色模式切换按钮 -->
    <button class="theme-toggle" id="theme-toggle">🌙 暗色模式</button>
    <!-- 回到顶部按钮 -->
    <div class="go-top" id="go-top">↑</div>
    <div class="toast" id="toast">已复制</div>

    <div class="container">
        <div class="hero">
            <h1>✨ 每日拾光 · 诗与歌的相遇</h1>
            <div class="date" id="date"></div>
        </div>
        <div id="loader" class="loader"></div>

        <!-- 每日一曲 -->
        <div class="card" id="song-card" style="display: none;">
            <h2>🎵 每日一曲</h2>
            <div class="song-container">
                <img class="song-cover" id="song-cover" src="" alt="封面" onerror="this.src='https://via.placeholder.com/300x300?text=🎵'">
                <div class="song-info">
                    <h3 id="song-title"></h3>
                    <div class="artist" id="song-artist"></div>
                    <div class="album" id="song-album"></div>
                    <div class="song-comment" id="song-comment"></div>
                </div>
            </div>
            <div class="meaning" id="song-meaning"></div>
        </div>

        <!-- 每日一句 -->
        <div class="card" id="sentence-card" style="display: none;">
            <div class="sentence-header">
                <h2>💭 每日一句</h2>
                <div class="sentence-actions">
                    <button class="action-btn" id="copy-sentence-btn" title="复制句子">📋</button>
                    <button class="action-btn" id="share-sentence-btn" title="生成图片">📸</button>
                </div>
            </div>
            <div class="sentence-content" id="sentence-content"></div>
            <div class="sentence-from" id="sentence-from"></div>
            <div class="meaning" id="sentence-meaning"></div>
        </div>

        <!-- 每日一文 -->
        <div class="card" id="article-card" style="display: none;">
            <h2>📖 每日一文</h2>
            <div class="article-title" id="article-title"></div>
            <div class="article-desc" id="article-desc"></div>
            <div class="article-author" id="article-author"></div>
            <a id="article-link" href="#" target="_blank" style="display: inline-block; margin-top: 1rem; color: #4f9da6; text-decoration: none;">🔗 阅读全文</a>
            <div class="meaning" id="article-meaning"></div>
            <div class="stats" id="article-stats"></div>
        </div>

        <!-- 每日一小说 -->
        <div class="card" id="novel-card" style="display: none;">
            <h2>📖 每日一小说 · 拾光</h2>
            <div class="novel-title" id="novel-title"></div>
            <div class="novel-content" id="novel-content"></div>
            <div class="stats" id="novel-stats"></div>
        </div>

        <div class="footer">
            <div id="update-time"></div>
            <a href="/history.html" style="color: #4f9da6; text-decoration: none; margin-top: 0.5rem; display: inline-block;">📜 查看历史时间轴</a>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 随机渐变背景 ====================
            const gradients = [
                "linear-gradient(145deg, #f9f3e8 0%, #d9e2f0 100%)",
                "linear-gradient(135deg, #e8f0f5 0%, #d0e0e8 100%)",
                "linear-gradient(145deg, #f5efe9 0%, #e0d8cf 100%)",
                "linear-gradient(135deg, #fdf8ed 0%, #eae3d5 100%)",
                "linear-gradient(145deg, #f2e9e1 0%, #dcd3c6 100%)",
                "linear-gradient(135deg, #ebf0f5 0%, #cbdbe0 100%)"
            ];
            const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];
            document.body.style.background = randomGradient;

            // ==================== 暗色模式 ====================
            const themeToggle = document.getElementById('theme-toggle');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '☀️ 亮色模式';
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeToggle.innerHTML = isDark ? '☀️ 亮色模式' : '🌙 暗色模式';
            });

            // ==================== 回到顶部按钮 ====================
            const goTopBtn = document.getElementById('go-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    goTopBtn.classList.add('visible');
                } else {
                    goTopBtn.classList.remove('visible');
                }
            });
            goTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ==================== 复制功能 ====================
            function copyToClipboard(text) {
                navigator.clipboard.writeText(text).then(() => {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                }).catch(() => alert('复制失败'));
            }

            // ==================== 生成图片功能 ====================
            function captureCard(element, filename = '每日拾光.png') {
                if (!element) {
                    alert('无法截取内容');
                    return;
                }
                // 临时隐藏可能干扰截图的操作按钮（可选，但为了美观，可以保留）
                html2canvas(element, {
                    scale: 2,
                    backgroundColor: null,
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    console.error(err);
                    alert('生成图片失败，请重试');
                });
            }

            // ==================== 字数统计函数 ====================
            function countWords(text) {
                const chinese = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
                const english = (text.match(/[a-zA-Z]+/g) || []).length;
                return chinese + english;
            }
            function formatStats(words) {
                const minutes = Math.ceil(words / 250);
                return `${words} 字 · 约 ${minutes} 分钟阅读`;
            }

            // ==================== 加载数据 ====================
            fetch('/data/daily.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('date').textContent = data.date || '今日';
                    if (data.updated_at) {
                        document.getElementById('update-time').textContent = `更新于 ${new Date(data.updated_at).toLocaleString('zh-CN')}`;
                    }

                    // 每日一曲
                    if (data.song) {
                        document.getElementById('song-card').style.display = 'block';
                        document.getElementById('song-cover').src = data.song.cover || 'https://via.placeholder.com/300x300?text=🎵';
                        document.getElementById('song-title').textContent = data.song.name || '';
                        document.getElementById('song-artist').textContent = data.song.artist ? `歌手 · ${data.song.artist}` : '';
                        document.getElementById('song-album').textContent = data.song.album ? `专辑 · ${data.song.album}` : '';
                        if (data.song.comment?.content) {
                            document.getElementById('song-comment').textContent = `“${data.song.comment.content}” —— ${data.song.comment.user || ''}`;
                        }
                        if (data.song.meaning) {
                            document.getElementById('song-meaning').textContent = data.song.meaning;
                            document.getElementById('song-meaning').style.display = 'block';
                        }
                    }

                    // 每日一句
                    if (data.sentence) {
                        document.getElementById('sentence-card').style.display = 'block';
                        const sentenceText = data.sentence.content || '';
                        document.getElementById('sentence-content').textContent = sentenceText;
                        document.getElementById('sentence-from').textContent = data.sentence.from ? `—— ${data.sentence.from}` : '';
                        if (data.sentence.meaning) {
                            document.getElementById('sentence-meaning').textContent = data.sentence.meaning;
                            document.getElementById('sentence-meaning').style.display = 'block';
                        }
                        // 复制按钮
                        const copyBtn = document.getElementById('copy-sentence-btn');
                        copyBtn.onclick = () => copyToClipboard(sentenceText);
                        // 生成图片按钮
                        const shareBtn = document.getElementById('share-sentence-btn');
                        const cardElement = document.getElementById('sentence-card');
                        shareBtn.onclick = () => captureCard(cardElement, `每日拾光_${data.date || '今日'}.png`);
                    }

                    // 每日一文
                    if (data.article) {
                        document.getElementById('article-card').style.display = 'block';
                        document.getElementById('article-title').textContent = data.article.title || '';
                        let articleText = data.article.description || data.article.content || '';
                        document.getElementById('article-desc').textContent = articleText;
                        document.getElementById('article-author').textContent = data.article.author ? `—— ${data.article.author}` : '';
                        if (data.article.url) {
                            document.getElementById('article-link').href = data.article.url;
                        } else {
                            document.getElementById('article-link').style.display = 'none';
                        }
                        if (data.article.meaning) {
                            document.getElementById('article-meaning').textContent = data.article.meaning;
                            document.getElementById('article-meaning').style.display = 'block';
                        }
                        const articleWords = countWords(articleText);
                        document.getElementById('article-stats').textContent = formatStats(articleWords);
                    }

                    // 每日一小说
                    if (data.novel) {
                        document.getElementById('novel-card').style.display = 'block';
                        document.getElementById('novel-title').textContent = data.novel.title || '';
                        const content = data.novel.content || '';
                        const paragraphs = content.split(/\n\s*\n/);
                        const htmlContent = paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
                        document.getElementById('novel-content').innerHTML = htmlContent;
                        const novelWords = countWords(content);
                        document.getElementById('novel-stats').textContent = formatStats(novelWords);
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loader').style.display = 'none';
                    document.body.innerHTML += '<p style="text-align:center; color:#bf6f5a;">数据加载失败</p>';
                });
        })();
    </script>
</body>
</html>

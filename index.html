<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>拾光驿站 · 诗与歌的相遇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e1e2f;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        .daily-summary {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
        }
        .date {
            font-size: 0.85rem;
            color: #8e8e9e;
            margin-bottom: 0.5rem;
        }
        .easter-egg {
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .links a {
            color: #1e1e2f;
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px dotted transparent;
            transition: border-color 0.2s;
        }
        .links a:hover {
            border-bottom-color: #1e1e2f;
        }
        .stats {
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f2f5;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #b0b0c0;
        }
        @media (max-width: 600px) {
            .daily-summary { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="daily-summary" id="daily-summary">✨ 今日拾光</div>
    <div class="date" id="date"></div>
    <div class="easter-egg" id="easter-egg"></div>

    <div class="links">
        <a href="/detail.html?type=songs">🎵 完整歌单</a>
        <a href="/detail.html?type=zaobao">📰 每日早报</a>
        <a href="/detail.html?type=one">📖 ONE · 一个</a>
        <a href="/detail.html?type=novels">📚 虚构抽屉</a>
        <a href="/history.html">📜 历史回顾</a>
    </div>

    <div class="stats" id="stats-info"></div>
    <div class="footer">© 拾光驿站 · 每日诗意</div>
</div>

<script>
    // 获取当日数据并填充
    fetch('/data/daily.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
            document.getElementById('daily-summary').textContent = data.summary || '今日拾光';
            document.getElementById('date').textContent = data.date || '今日';
            // 彩蛋基于日期
            const getEasterEgg = (dateStr) => {
                const eggs = ['✨ 今日彩蛋：再读一遍，或许会发现隐藏的温柔。','🍂 今日彩蛋：时光不语，静待花开。','📖 今日彩蛋：每一篇小说都是平行宇宙的你。','🎵 今日彩蛋：未知旋律里藏着昨天的故事。','💭 今日彩蛋：散落的诗行，是某人的心事。','🌟 今日彩蛋：你正在阅读的，是宇宙送给你的礼物。','🌙 今日彩蛋：此刻的宁静，胜过万语千言。','☕ 今日彩蛋：读一段文字，饮一杯暖茶。'];
                let hash = 0, seed = dateStr || new Date().toDateString();
                for(let i=0;i<seed.length;i++) hash = ((hash<<5)-hash)+seed.charCodeAt(i);
                return eggs[Math.abs(hash)%eggs.length];
            };
            document.getElementById('easter-egg').textContent = getEasterEgg(data.date);
        })
        .catch(err => console.error('加载失败', err));

    // 加载统计信息
    fetch('/data/stats.json?t=' + Date.now())
        .then(res => res.json())
        .then(stats => {
            const info = `📊 已运行 ${stats.total_days||0} 天 · 推荐 ${stats.total_songs||0} 首歌 · 收录 ${stats.total_articles||0} 篇文章 · 创作 ${stats.total_novels||0} 篇小说 · 总字数 ${(stats.total_words/10000||0).toFixed(1)} 万`;
            document.getElementById('stats-info').innerHTML = info;
        })
        .catch(e => console.warn('统计加载失败', e));
</script>
</body>
</html>

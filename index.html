<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>拾光驿站 · 简洁主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e1e2f;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        .daily-summary {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: #1e1e2f;
        }
        .date, .easter-egg {
            font-size: 0.85rem;
            color: #8e8e9e;
        }
        .easter-egg {
            margin-top: 0.2rem;
            margin-bottom: 1rem;
        }
        .stats {
            font-size: 0.85rem;
            color: #5b5b6e;
            margin: 2rem 0;
            padding: 0.8rem 0;
            border-top: 1px solid #f0f2f5;
            border-bottom: 1px solid #f0f2f5;
            display: inline-block;
            width: 100%;
            text-align: center;
        }
        .thought-module {
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #5b5b6e;
            font-style: italic;
        }
        .trivia-module {
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #5b5b6e;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0 1rem;
        }
        .links a {
            color: #1e1e2f;
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px dotted #e0e4e8;
            padding-bottom: 0.2rem;
            transition: border-color 0.2s;
        }
        .links a:hover {
            border-bottom-color: #1e1e2f;
        }
        .footer {
            font-size: 0.75rem;
            color: #b0b0c0;
            margin-top: 2.5rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f2f5;
        }
        @media (max-width: 480px) {
            .daily-summary { font-size: 1.5rem; }
            .stats { font-size: 0.75rem; margin: 1.5rem 0; }
            .links a { font-size: 0.9rem; gap: 1.2rem; }
            .thought-module, .trivia-module { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="daily-summary" class="daily-summary">✨ 今日拾光</div>
    <div id="date" class="date"></div>
    <div id="easter-egg" class="easter-egg"></div>

    <div id="stats" class="stats"></div>

    <!-- 新增思考题和冷知识 -->
    <div id="question-card" class="thought-module" style="display:none;"></div>
    <div id="trivia-card" class="trivia-module" style="display:none;"></div>

    <div class="links">
        <a href="/daily.html">📖 今日详情</a>
        <a href="/history.html">📜 历史回顾</a>
        <a href="/songs.html">🎵 完整歌单</a>
    </div>

    <div class="footer">
        <div id="update-time"></div>
        <div>© 拾光驿站 · 每日诗意</div>
    </div>
</div>

<script>
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
    const staticEasterEggs = [
        "✨ 今日彩蛋：再读一遍，或许会发现隐藏的温柔。",
        "🍂 今日彩蛋：时光不语，静待花开。",
        "📖 今日彩蛋：每一篇小说都是平行宇宙的你。",
        "🎵 今日彩蛋：未知旋律里藏着昨天的故事。",
        "💭 今日彩蛋：散落的诗行，是某人的心事。",
        "🌟 今日彩蛋：你正在阅读的，是宇宙送给你的礼物。",
        "🌙 今日彩蛋：此刻的宁静，胜过万语千言。",
        "☕ 今日彩蛋：读一段文字，饮一杯暖茶。"
    ];
    function getStaticEasterEgg(dateStr) {
        let hash = 0, seed = dateStr || new Date().toDateString();
        for (let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash) + seed.charCodeAt(i);
        return staticEasterEggs[Math.abs(hash) % staticEasterEggs.length];
    }

    async function loadHomeData() {
        try {
            const res = await fetch('/data/daily.json?t=' + Date.now());
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            document.getElementById('daily-summary').innerHTML = data.summary || '✨ 今日拾光';
            document.getElementById('date').innerHTML = data.date || '';
            const easter = data.easter || getStaticEasterEgg(data.date);
            document.getElementById('easter-egg').innerHTML = easter;
            if (data.updated_at) {
                const beijingTime = new Date(data.updated_at).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
                document.getElementById('update-time').innerHTML = `更新于 ${beijingTime}`;
            }

            // 新增：思考题和冷知识
            if (data.question) {
                const qDiv = document.getElementById('question-card');
                qDiv.innerHTML = `💡 思考题：${escapeHtml(data.question)}`;
                qDiv.style.display = 'block';
            }
            if (data.trivia) {
                const tDiv = document.getElementById('trivia-card');
                tDiv.innerHTML = `📚 冷知识：${escapeHtml(data.trivia)}`;
                tDiv.style.display = 'block';
            }
        } catch (err) {
            console.error('加载每日数据失败', err);
            document.getElementById('daily-summary').innerHTML = '✨ 今日拾光';
            document.getElementById('date').innerHTML = '';
            document.getElementById('easter-egg').innerHTML = getStaticEasterEgg();
        }

        try {
            const statsRes = await fetch('/data/stats.json?t=' + Date.now());
            if (statsRes.ok) {
                const stats = await statsRes.json();
                const statsText = `📊 已运行 ${stats.total_days||0} 天 · 推荐 ${stats.total_songs||0} 首歌 · 收录 ${stats.total_articles||0} 篇文章 · 创作 ${stats.total_novels||0} 篇小说 · 总字数 ${(stats.total_words/10000||0).toFixed(1)} 万`;
                document.getElementById('stats').innerHTML = statsText;
            } else {
                document.getElementById('stats').innerHTML = '📊 统计加载中...';
            }
        } catch (err) {
            console.warn('统计加载失败', err);
            document.getElementById('stats').innerHTML = '📊 统计暂不可用';
        }
    }

    loadHomeData();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <!-- PWA 配置开始 -->
    <link rel="manifest" href="/manifest.json">

    <!-- PWA 配置结束 -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e1e2f;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .daily-summary {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: #1e1e2f;
        }
        .easter-egg {
            font-size: 0.85rem;
            background: linear-gradient(135deg, #e67e22, #f1c40f, #2ecc71);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0.5rem 0 0.2rem;
            line-height: 1.4;
        }
        .stats {
            font-size: 0.85rem;
            color: #5b5b6e;
            margin: 1.5rem 0 1rem;
            padding: 0.8rem 0;
            border-top: 1px solid #f0f2f5;
            border-bottom: 1px solid #f0f2f5;
            display: inline-block;
            width: 100%;
            text-align: center;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin: 1.5rem 0 1rem;
        }
        .links a {
            color: #1e1e2f;
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px dotted #e0e4e8;
            padding-bottom: 0.2rem;
            transition: border-color 0.2s;
        }
        .links a:hover {
            border-bottom-color: #1e1e2f;
        }
        .footer {
            font-size: 0.75rem;
            color: #b0b0c0;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f2f5;
        }
        @media (max-width: 480px) {
            .daily-summary { font-size: 1.5rem; }
            .stats { font-size: 0.75rem; margin: 1rem 0; }
            .links a { font-size: 0.85rem; gap: 1rem; }
            .easter-egg { font-size: 0.8rem; }
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="container">
    <div id="daily-summary" class="daily-summary">隅 · 安静角落</div>
    <div id="easter-egg" class="easter-egg"></div>
    <div class="links">
        <a href="/daily.html">📖 今日内容</a>
        <a href="/daily.html#zaobao">📰 每日早报</a>
        <!--<a href="/daily.html#one">📖 ONE·一个</a>-->

        <a href="/photos.html">📷 光·影集</a>
        <a href="/farm.html">🌱 我的农场</a> 
        <a href="/farm-vue.html">🌱测试</a> 
        <a href="/guestbook.html">💬 留言板</a>
    </div>
    <div id="stats" class="stats"></div>
    <div class="footer">
        <div id="update-time"></div>
        <div>© 隅 · 安静角落 · 此心安处</div>
    </div>
</div>

<script>
    // ==================== 注册 Service Worker ====================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
                .then(function(reg) {
                    console.log('Service Worker 注册成功', reg.scope);
                })
                .catch(function(err) {
                    console.log('Service Worker 注册失败', err);
                });
        });
    }

    // ==================== 鼠标交互特效（仅保留鼠标生成粒子） ====================
    (function() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = []; // 只存放鼠标临时粒子

        // 颜色配置
        const lightDotColors = [
            'rgba(180, 210, 255, 0.5)',
            'rgba(200, 220, 250, 0.45)',
            'rgba(140, 190, 250, 0.4)',
            'rgba(220, 235, 255, 0.55)'
        ];
        const darkDotColors = [
            'rgba(100, 150, 220, 0.25)',
            'rgba(120, 160, 230, 0.2)',
            'rgba(80, 130, 210, 0.18)',
            'rgba(150, 180, 240, 0.22)'
        ];
        const lightHeartColor = 'rgba(255, 100, 120, 0.65)';
        const darkHeartColor = 'rgba(230, 80, 100, 0.5)';

        // 鼠标追踪
        let mouseX = null, mouseY = null;
        let lastSpawnTime = 0;
        const SPAWN_INTERVAL = 180; // 毫秒

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // 绘制心形路径
        function drawHeart(ctx, x, y, size) {
            const s = size * 0.6;
            ctx.beginPath();
            ctx.moveTo(x, y + s * 0.3);
            ctx.bezierCurveTo(x, y - s * 0.2, x - s, y - s * 0.2, x - s, y + s * 0.3);
            ctx.bezierCurveTo(x - s, y + s * 0.7, x, y + s, x, y + s * 1.2);
            ctx.bezierCurveTo(x, y + s, x + s, y + s * 0.7, x + s, y + s * 0.3);
            ctx.bezierCurveTo(x + s, y - s * 0.2, x, y - s * 0.2, x, y + s * 0.3);
            ctx.closePath();
        }

        // 临时粒子（鼠标生成）
        class MouseParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = mouseX + (Math.random() - 0.5) * 40;
                this.y = mouseY + (Math.random() - 0.5) * 20;
                this.type = Math.random() < 0.4 ? 'heart' : 'dot';
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = - (Math.random() * 0.4 + 0.2);
                this.opacity = 0.5 + Math.random() * 0.4;
                this.decay = 0.008 + Math.random() * 0.012;
                this.size = this.type === 'heart'
                    ? Math.random() * 7 + 5   // 8-12 爱心
                    : Math.random() * 4 + 2;  // 2-6 光点
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= this.decay;
                if (this.opacity <= 0 || this.y < -20 || this.x < -20 || this.x > canvas.width + 20) {
                    return false; // 标记移除
                }
                return true;
            }

            draw(ctx, isDark) {
                ctx.globalAlpha = this.opacity;
                if (this.type === 'heart') {
                    ctx.fillStyle = isDark ? darkHeartColor : lightHeartColor;
                    ctx.shadowColor = isDark ? 'rgba(200, 60, 80, 0.25)' : 'rgba(255, 90, 110, 0.4)';
                    ctx.shadowBlur = 8;
                    drawHeart(ctx, this.x, this.y, this.size);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    const dotColors = isDark ? darkDotColors : lightDotColors;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = dotColors[Math.floor(Math.random() * dotColors.length)];
                    ctx.shadowColor = isDark ? 'rgba(80, 140, 220, 0.2)' : 'rgba(120, 160, 255, 0.35)';
                    ctx.shadowBlur = 7;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = 1.0;
            }
        }

        // 鼠标移动时生成粒子
        function spawnParticles() {
            const now = Date.now();
            if (mouseX === null || mouseY === null) return;
            if (now - lastSpawnTime < SPAWN_INTERVAL) return;
            lastSpawnTime = now;

            const count = 2 + Math.floor(Math.random() * 4); // 2~5 个
            for (let i = 0; i < count; i++) {
                particles.push(new MouseParticle());
            }
        }

        // 动画主循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isDark = document.body.classList.contains('dark-mode') ||
                          window.matchMedia('(prefers-color-scheme: dark)').matches;

            // 更新并过滤掉失效粒子
            particles = particles.filter(p => p.update());

            // 绘制所有粒子
            for (let p of particles) {
                p.draw(ctx, isDark);
            }

            // 根据鼠标位置生成新粒子
            spawnParticles();

            requestAnimationFrame(animate);
        }

        // 鼠标事件
        function onMouseMove(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
        }
        function onMouseLeave() {
            mouseX = null;
            mouseY = null;
        }

        // 监听暗色模式切换（保持同步）
        const observer = new MutationObserver(() => {});
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

        // 启动
        resizeCanvas();
        animate();

        window.addEventListener('resize', () => {
            resizeCanvas();
            // 清空所有现有粒子（避免尺寸错位）
            particles = [];
        });

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseleave', onMouseLeave);
    })();

    // ==================== 原有数据加载 ====================
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
    const staticEasterEggs = [
        "🥚 今日彩蛋：再读一遍，或许会发现隐藏的温柔。",
        "🥚 今日彩蛋：时光不语，静待花开。",
        "🥚 今日彩蛋：每一段文字都是时光的琥珀。",
        "🥚 今日彩蛋：未知旋律里藏着昨天的故事。",
        "🥚 今日彩蛋：散落的诗行，是某人的心事。",
        "🥚 今日彩蛋：你正在阅读的，是宇宙送给你的礼物。",
        "🥚 今日彩蛋：此刻的宁静，胜过万语千言。",
        "🥚 今日彩蛋：读一段文字，饮一杯暖茶。"
    ];
    function getStaticEasterEgg(dateStr) {
        let hash = 0, seed = dateStr || new Date().toDateString();
        for (let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash) + seed.charCodeAt(i);
        return staticEasterEggs[Math.abs(hash) % staticEasterEggs.length];
    }

    async function loadHomeData() {
        try {
            const res = await fetch('/data/daily.json?t=' + Date.now());
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            document.getElementById('daily-summary').innerHTML = data.summary || '隅 · 安静角落';
            const easter = data.easter || getStaticEasterEgg(data.date);
            document.getElementById('easter-egg').innerHTML = easter;
            if (data.updated_at) {
                const beijingTime = new Date(data.updated_at).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
                document.getElementById('update-time').innerHTML = `更新于 ${beijingTime}`;
            }
        } catch (err) {
            console.error('加载每日数据失败', err);
            document.getElementById('daily-summary').innerHTML = '隅 · 安静角落';
            document.getElementById('easter-egg').innerHTML = getStaticEasterEgg();
        }

        try {
            const statsRes = await fetch('/data/stats.json?t=' + Date.now());
            if (statsRes.ok) {
                const stats = await statsRes.json();
                const statsText = `📊 已运行 ${stats.total_days||0} 天 · 推荐 ${stats.total_songs||0} 首歌 · 收录 ${stats.total_articles||0} 篇文章 · 总字数 ${(stats.total_words/10000||0).toFixed(1)} 万`;
                document.getElementById('stats').innerHTML = statsText;
            } else {
                document.getElementById('stats').innerHTML = '📊 统计加载中...';
            }
        } catch (err) {
            console.warn('统计加载失败', err);
            document.getElementById('stats').innerHTML = '📊 统计暂不可用';
        }
    }

    loadHomeData();
</script>
</body>
</html>

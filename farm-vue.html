<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>啾啾数学花园 · 最终修复版</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #fef9e7; --gold: #f1c40f; --jade: #6b8e4e; --red: #e74c3c; --wood: #8b5a2b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "STKaiti", sans-serif;
      background: #2c3e50;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
    }
    #app {
      width: 420px; max-width: 100%; background: var(--bg); border-radius: 30px; overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; height: 95vh; max-height: 850px; position: relative;
    }
    .top-bar {
      background: linear-gradient(180deg, #ffd700 0%, #f0b800 100%); color: #3e2723;
      padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; border-bottom: 3px solid #e6a800; font-weight: bold;
    }
    .main { flex: 1; overflow-y: auto; padding: 12px; background: #fef9e7; }
    .btn {
      background: linear-gradient(180deg, #f1c40f, #d4ac0d); border: none; color: #2c3e50;
      padding: 10px 18px; border-radius: 25px; font-weight: bold; font-size: 17px; cursor: pointer;
      margin: 6px 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.1s; display: inline-block;
    }
    .btn:active { transform: translateY(2px); box-shadow: none; }
    .btn.red { background: linear-gradient(180deg, #e74c3c, #c0392b); color: white; }
    .btn.jade { background: linear-gradient(180deg, #8fbc8f, #5a7d5a); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .card {
      background: rgba(255,255,250,0.95); border: 2px solid #f1c40f; border-radius: 20px;
      padding: 14px; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center; z-index: 200;
    }
    .modal-content {
      width: 90%; max-width: 380px; background: #fffef5; border-radius: 30px; padding: 20px;
      max-height: 80vh; overflow-y: auto; text-align: center;
    }
    .correct-modal-content { background: #fef9e7; border: 3px solid #27ae60; }
    .option-btn {
      background: #fdebd0; border: 2px solid #f1c40f; border-radius: 15px; padding: 12px;
      font-size: 22px; margin: 5px; cursor: pointer; transition: 0.1s; display: block; width: 80%;
      margin-left: auto; margin-right: auto;
    }
    .option-btn:active { background: #f1c40f; color: white; }
    .toast {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #f1c40f; padding: 8px 20px; border-radius: 20px;
      z-index: 300; animation: fadeInOut 2s ease;
    }
    @keyframes fadeInOut {
      0%{opacity:0;transform:translateX(-50%) translateY(-10px);}
      10%{opacity:1;transform:translateX(-50%) translateY(0);}
      90%{opacity:1;} 100%{opacity:0;}
    }
    .grade-selector {
      display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0;
    }
    .grade-selector button {
      background: #fff; border: 1px solid #ccc; border-radius: 50%; width: 30px; height: 30px;
      font-size: 18px; cursor: pointer;
    }
    .grade-selector button:disabled { opacity: 0.4; cursor: not-allowed; }
    .garden-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .garden-item {
      background: #e8f5e9; border-radius: 20px; padding: 15px; text-align: center;
      cursor: pointer; transition: 0.2s; border: 2px solid #a5d6a7;
    }
    .garden-item:active { background: #c8e6c9; }
    .plant-icon { font-size: 45px; }
    .progress-bar { height: 8px; background: #ddd; border-radius: 4px; margin: 5px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #66bb6a; transition: width 0.3s; }
    .solution-box {
      background: #f0f8e8; border-radius: 15px; padding: 12px; margin: 15px 0;
      font-size: 16px; text-align: left; line-height: 1.6;
    }
    .encourage-text { font-size: 24px; font-weight: bold; color: #27ae60; margin: 10px 0; }
    .exam-question {
      background: #fff; border: 2px solid #ddd; border-radius: 15px; padding: 12px; margin-bottom: 12px;
    }
    .exam-question.correct { border-color: #27ae60; background: #f0fff0; }
    .exam-question.wrong { border-color: #e74c3c; background: #fff0f0; }
    .result-box { text-align: center; padding: 20px; }
    .result-grade { font-size: 40px; margin: 10px 0; }
  </style>
</head>
<body>
<div id="app">
  <div v-if="!vueReady" style="text-align:center;padding:50px;color:#e74c3c;">
    ⚠️ 正在加载组件，请稍候...<br>
    <small style="color:#888;">如果长时间无反应，请检查网络连接后刷新页面</small>
  </div>
  <template v-if="vueReady">
    <div v-if="toast.show" class="toast">{{ toast.message }}</div>
    <div class="top-bar">
      <span>🌟 {{ stars }}</span>
      <span style="font-weight: bold; font-size: 18px;">{{ gradeNames[currentGrade] }}</span>
      <span>🌱 Lv.{{ gardenLevel }}</span>
    </div>
    <div class="main">
      <div class="grade-selector" v-if="view !== 'exam' || !examStarted">
        <button @click="prevGrade" :disabled="currentGrade <= 0">◀</button>
        <span style="font-size: 16px;">{{ gradeNames[currentGrade] }}</span>
        <button @click="nextGrade" :disabled="currentGrade >= gradeNames.length-1">▶</button>
      </div>

      <!-- 花园视图 -->
      <div v-if="view === 'garden'">
        <div class="garden-grid">
          <div class="garden-item" @click="openGame('arithmetic')">
            <div class="plant-icon">🌻</div><strong>算术花田</strong>
            <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.arithmetic+'%'}"></div></div>
          </div>
          <div class="garden-item" @click="openGame('geometry')">
            <div class="plant-icon">🌳</div><strong>图形树屋</strong>
            <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.geometry+'%'}"></div></div>
          </div>
          <div class="garden-item" @click="openGame('fraction')">
            <div class="plant-icon">🍕</div><strong>分数厨房</strong>
            <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.fraction+'%'}"></div></div>
          </div>
          <div class="garden-item" @click="openGame('word')">
            <div class="plant-icon">📚</div><strong>应用小岛</strong>
            <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.word+'%'}"></div></div>
          </div>
          <div class="garden-item" @click="openGame('logic')">
            <div class="plant-icon">🧩</div><strong>逻辑密室</strong>
            <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.logic+'%'}"></div></div>
          </div>
          <div class="garden-item" @click="openGame('measure')">
            <div class="plant-icon">📏</div><strong>度量工坊</strong>
            <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.measure+'%'}"></div></div>
          </div>
        </div>
        <div style="text-align:center; margin-top: 15px;">
          <button class="btn" @click="startExam" style="font-size: 20px; padding: 12px 30px;">📝 进入考试</button>
          <button class="btn" @click="printExam" style="font-size: 20px; padding: 12px 30px;">🖨️ 打印试卷</button>
        </div>
      </div>

      <!-- 游戏视图 -->
      <div v-if="view === 'game'">
        <button class="btn" @click="view='garden'">← 回花园</button>
        <h3 style="text-align: center;">{{ gameTitle }}</h3>
        <div v-if="!question" style="text-align: center; padding: 20px;">
          <p>点击下方按钮开始挑战吧！</p>
          <button class="btn" @click="generateQuestion">出题！</button>
        </div>
        <div v-else class="card" style="text-align: center;">
          <div style="font-size: 22px; margin-bottom: 15px; line-height: 1.6; color: #4a2c1a;">{{ question.text }}</div>
          <div v-if="question.image" style="font-size: 50px; margin: 10px;">{{ question.image }}</div>
          <div v-if="question.type === 'choice'">
            <button class="option-btn" v-for="opt in question.options" :key="opt" @click="answer(opt)">{{ opt }}</button>
          </div>
          <div v-if="question.type === 'input'">
            <input v-model="userInput" type="text" style="font-size:24px;width:140px;text-align:center;padding:8px;"
                   @keyup.enter="answer(userInput)" placeholder="?">
            <button class="btn" @click="answer(userInput)">确定</button>
          </div>
          <p v-if="feedback" style="margin-top:12px;font-weight:bold;">{{ feedback }}</p>
        </div>
      </div>

      <!-- 考试视图 -->
      <div v-if="view === 'exam'">
        <button class="btn" @click="view='garden'; resetExam()">← 退出考试</button>
        <h3 style="text-align: center;">📝 综合考试 ({{ gradeNames[currentGrade] }})</h3>
        <div v-if="!examStarted" style="text-align: center; padding: 20px;">
          <p>即将生成一套综合试卷，涵盖多种题型。</p>
          <p>题目数量：10 题</p>
          <button class="btn" @click="beginExam" style="font-size: 20px;">开始考试</button>
          <button class="btn" @click="printExam" style="font-size: 20px;">🖨️ 打印试卷</button>
        </div>
        <div v-else>
          <div v-if="!examSubmitted">
            <div v-for="(q, idx) in examQuestions" :key="idx" class="exam-question">
              <div style="font-weight: bold; margin-bottom: 6px;">{{ idx+1 }}. {{ q.text }}</div>
              <div v-if="q.image" style="font-size: 40px; text-align: center;">{{ q.image }}</div>
              <div v-if="q.type === 'choice'">
                <div v-for="opt in q.options" :key="opt" style="margin: 4px 0;">
                  <label style="display: flex; align-items: center; cursor: pointer; font-size: 18px;">
                    <input type="radio" :name="'q'+idx" :value="opt" v-model="examAnswers[idx]" style="margin-right: 8px; transform: scale(1.3);">
                    {{ opt }}
                  </label>
                </div>
              </div>
              <div v-if="q.type === 'input'">
                <input v-model="examAnswers[idx]" type="text" style="font-size:20px;width:100px;text-align:center;padding:4px;" placeholder="?">
              </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
              <button class="btn" @click="submitExam" style="font-size: 20px; padding: 12px 30px;">交卷</button>
            </div>
          </div>
          <div v-else class="result-box">
            <div style="font-size: 60px;">🏆</div>
            <div class="result-grade">{{ examGrade }}</div>
            <p>正确 {{ examCorrect }} / {{ examQuestions.length }}</p>
            <p>得分 {{ examScore }} 分</p>
            <div v-for="(q, idx) in examQuestions" :key="idx" class="exam-question" :class="examResults[idx] ? 'correct' : 'wrong'">
              <div style="font-weight: bold;">{{ idx+1 }}. {{ q.text }} {{ examResults[idx] ? '✅' : '❌' }}</div>
              <div v-if="!examResults[idx]" style="margin-top: 4px; color: #e74c3c;">
                你的答案：{{ examAnswers[idx] || '未填' }} | 正确答案：{{ q.answer }}
              </div>
              <div class="solution-box" style="margin-top: 8px; font-size: 14px;">
                <strong>🧠 思路：</strong>{{ q.solution }}
              </div>
            </div>
            <button class="btn" @click="view='garden'; resetExam()" style="margin-top: 15px;">返回花园</button>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;background:#fff8e7;border-top:3px solid #f1c40f;">
      <button @click="view='garden'" style="flex:1;padding:14px;border:none;background:transparent;font-size:20px;cursor:pointer;">🏡 花园</button>
    </div>

    <div v-if="showCorrectModal" class="modal" @click.self="closeCorrectModal">
      <div class="modal-content correct-modal-content">
        <div style="font-size: 60px;">🎉</div>
        <div class="encourage-text">{{ encourageText }}</div>
        <div class="solution-box">
          <strong>🧠 解题思路：</strong><br>
          {{ currentSolution }}
        </div>
        <button class="btn" @click="closeCorrectModal" :disabled="modalClosing" style="font-size: 20px; margin-top: 10px;">
          {{ modalClosing ? '稍等...' : '下一题 ➡️' }}
        </button>
      </div>
    </div>
  </template>
</div>

<script>
(function() {
  if (typeof Vue === 'undefined') {
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:50px;color:#e74c3c;">⚠️ Vue 加载失败，请检查网络连接后刷新页面</div>';
    return;
  }

  const { createApp, ref, reactive, computed, watch } = Vue;

  createApp({
    setup() {
      const vueReady = ref(true);
      const STARS_PER_LEVEL = 30;
      const PROGRESS_PER_CORRECT = 25;
      const MAX_PROGRESS = 100;
      const LEVEL_UP_BONUS = 3;

      const gradeNames = ['幼儿园', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级'];
      const currentGrade = ref(0);
      function prevGrade() { if (currentGrade.value > 0) currentGrade.value--; }
      function nextGrade() { if (currentGrade.value < gradeNames.length-1) currentGrade.value++; }

      const stars = ref(0);
      const gardenLevel = computed(function() { return Math.floor(stars.value / STARS_PER_LEVEL) + 1; });
      const toast = reactive({ show: false, message: '' });
      function showToast(msg) { toast.message = msg; toast.show = true; setTimeout(function() { toast.show = false; }, 2000); }

      const plantProgress = reactive({
        arithmetic: 0, geometry: 0, fraction: 0,
        word: 0, logic: 0, measure: 0
      });

      const view = ref('garden');
      const currentGame = ref('');
      const gameTitle = computed(function() {
        var map = {
          arithmetic: '算术花田', geometry: '图形树屋', fraction: '分数厨房',
          word: '应用小岛', logic: '逻辑密室', measure: '度量工坊'
        };
        return map[currentGame.value] || '';
      });

      function openGame(gameType) {
        currentGame.value = gameType;
        view.value = 'game';
        question.value = null;
        feedback.value = '';
        userInput.value = '';
        showCorrectModal.value = false;
        modalClosing.value = false;
        generateQuestion();
      }

      const question = ref(null);
      const feedback = ref('');
      const userInput = ref('');
      const showCorrectModal = ref(false);
      const encourageText = ref('');
      const currentSolution = ref('');
      const modalClosing = ref(false);

      const examStarted = ref(false);
      const examQuestions = ref([]);
      const examAnswers = ref([]);
      const examSubmitted = ref(false);
      const examResults = ref([]);
      const examCorrect = ref(0);
      const examScore = ref(0);
      const examGrade = computed(function() {
        var pct = examCorrect.value / examQuestions.value.length;
        if (pct === 1) return '🌟🌟🌟 满分达人！';
        if (pct >= 0.8) return '🌟🌟 非常优秀！';
        if (pct >= 0.6) return '🌟 继续加油！';
        return '💪 多多练习哦！';
      });

      function resetExam() {
        examStarted.value = false;
        examQuestions.value = [];
        examAnswers.value = [];
        examSubmitted.value = false;
        examResults.value = [];
        examCorrect.value = 0;
        examScore.value = 0;
      }

      function startExam() {
        resetExam();
        view.value = 'exam';
      }

      function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function pick(arr) { return arr[rand(0, arr.length-1)]; }
      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
      }
      function shuffleUnique(arr) {
        var unique = [];
        var seen = {};
        for (var i = 0; i < arr.length; i++) {
          if (!seen[arr[i]]) { seen[arr[i]] = true; unique.push(arr[i]); }
        }
        return shuffle(unique);
      }
      function fib(n) {
        if (n <= 0) return 0;
        if (n <= 2) return 1;
        var a = 1, b = 1;
        for (var i = 3; i <= n; i++) { var c = a + b; a = b; b = c; }
        return b;
      }

      function normalizeAnswer(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/\s+/g, '').toLowerCase();
      }

      function isAnswerCorrect(userAnswer, correctAnswer) {
        var userStr = normalizeAnswer(userAnswer);
        var correctStr = normalizeAnswer(String(correctAnswer));
        if (userStr === correctStr) return true;
        var numUser = parseFloat(userStr);
        var numCorrect = parseFloat(correctStr);
        if (!isNaN(numUser) && !isNaN(numCorrect) && Math.abs(numUser - numCorrect) < 0.001) return true;
        return false;
      }

      var generators = {};

      // 算术
      generators.arithmetic = [];
      generators.arithmetic[0] = [
        function() {
          var e = ['🐶','🐱','🐰','🐸','🐼','🐨','🐯','🦁','🐮','🐷'];
          var c = rand(1, e.length);
          var animals = e.slice(0, c).join(' ');
          return {
            text: '🌿 森林里来了一群小动物，你瞧：' + animals + '。数一数，一共有几只小可爱呀？',
            image: animals, type: 'choice', answer: String(c),
            solution: '小动物们排成一排，我们挨个点数，一共是 ' + c + ' 只。',
            options: shuffleUnique([c, c+1, c-1].filter(function(n){return n>0 && n <= e.length;}).map(String))
          };
        },
        function() {
          var a = rand(2,5), b = rand(2,5);
          var answer;
          if (a > b) answer = '苹果';
          else if (a < b) answer = '橘子';
          else answer = '一样多';
          var solution = '苹果有 ' + a + ' 个，橘子有 ' + b + ' 个。';
          if (a > b) solution += '苹果比橘子多，所以选"苹果"。';
          else if (a < b) solution += '橘子比苹果多，所以选"橘子"。';
          else solution += '两边一样多，所以选"一样多"。';
          return {
            text: '🍎 桌子上有 ' + '🍎'.repeat(a) + '，旁边还有 ' + '🍊'.repeat(b) + '。苹果和橘子，谁的数量更多呢？',
            type: 'choice', answer: answer, solution: solution, options: ['苹果','橘子','一样多']
          };
        },
        function() {
          var a = rand(2,6);
          return {
            text: '🔢 数字宝宝 ' + a + ' 正在排队，排在它后面的下一个数字是谁呢？',
            type: 'choice', answer: String(a+1),
            solution: '数数的时候，' + a + ' 的后面紧跟着就是 ' + (a+1) + '。',
            options: shuffleUnique([a-1, a+1, a+2].filter(function(n){return n>0;}).map(String))
          };
        }
      ];
      generators.arithmetic[1] = [
        function() {
          var a = rand(1,10), b = rand(1,10);
          return {
            text: '🐦 树上有 ' + a + ' 只小鸟，又飞来了 ' + b + ' 只。现在树上共有几只小鸟呢？',
            type: 'choice', answer: String(a+b),
            solution: '原来有 ' + a + ' 只，加上飞来的 ' + b + ' 只，算式是 ' + a + '+' + b + '=' + (a+b) + '。',
            options: shuffleUnique([a+b, a+b+1, a+b-1].filter(function(n){return n>=0;}).map(String))
          };
        },
        function() {
          var a = rand(5,20), b = rand(1,a);
          return {
            text: '🍬 小明有 ' + a + ' 颗糖，他分给了小红 ' + b + ' 颗。小明还剩几颗糖？',
            type: 'choice', answer: String(a-b),
            solution: '从 ' + a + ' 里拿走 ' + b + '，用减法：' + a + '-' + b + '=' + (a-b) + '。',
            options: shuffleUnique([a-b, a-b+1, a-b-1].filter(function(n){return n>=0;}).map(String))
          };
        },
        function() {
          var a = rand(1,9), b = rand(1,9);
          var ans = a > b ? '>' : (a < b ? '<' : '=');
          return {
            text: '⚖️ 比较一下：' + a + ' 和 ' + b + '，中间应该填什么符号呢？',
            type: 'choice', answer: ans,
            solution: (a > b ? a + ' 大于 ' + b : a < b ? a + ' 小于 ' + b : '两个数一样大') + '，所以填"' + ans + '"。',
            options: ['>','<','=']
          };
        }
      ];
      generators.arithmetic[2] = [
        function() {
          var a = rand(1,9), b = rand(1,9);
          return {
            text: '🌸 花坛里每排放 ' + a + ' 盆花，一共种了 ' + b + ' 排。总共有多少盆花呢？',
            type: 'choice', answer: String(a*b),
            solution: '每排 ' + a + ' 盆，有 ' + b + ' 排，就是 ' + b + ' 个 ' + a + ' 相加，用乘法：' + a + '×' + b + '=' + (a*b) + '。',
            options: shuffleUnique([a*b, a*b+a, a*b-a].filter(function(n){return n>=0;}).map(String))
          };
        },
        function() {

          return { text: '📊 班级有 ' + total + ' 人，其中 ' + part + ' 人是女生，女生占全班的百分之几？', type: 'input', answer: (part/total*100).toFixed(0) + '%', solution: '用女生人数除以总人数再乘以100%：' + part + ' ÷ ' + total + ' × 100% = ' + (part/total*100).toFixed(0) + '%。' };
        }
      ];
      generators.word[6] = [
        function() {
          var a = rand(2,6), b = rand(2,6);
          return { text: '⚖️ 解比例：3 : 4 = ' + a + ' : x，求 x。', type: 'input', answer: (a*4/3).toFixed(1), solution: '比例式内项积等于外项积：4 × ' + a + ' = 3 × x，所以 x = (4×' + a + ')/3 ≈ ' + (a*4/3).toFixed(1) + '。' };
        },
        function() {
          var a = rand(2,6), b = rand(2,6);
          var k = rand(5,15);
          var totalMoney = (a+b)*k;
          var maxRatio = Math.max(a, b);
          var maxShare = k * maxRatio;
          return { text: '💰 将 ' + totalMoney + ' 元按 ' + a + ':' + b + ' 的比例分给两人，较大的一份是多少元？', type: 'input', answer: String(maxShare), solution: '总份数 = ' + a + '+' + b + '=' + (a+b) + '，每份 ' + k + ' 元，较大比例是 ' + maxRatio + '，所以大份 = ' + maxRatio + '×' + k + ' = ' + maxShare + ' 元。' };
        }
      ];

      // 逻辑密室
      generators.logic = [];
      generators.logic[0] = [
        function() {
          var start = rand(1, 6), step = rand(1, 4);
          var first = start, second = start + step, third = second + step, next = third + step;
          return { text: '🔢 数字小精灵们排着队：' + first + '、' + second + '、' + third + '，接下来应该是谁呢？', type: 'input', answer: String(next), solution: '规律是每次增加 ' + step + '。' + third + ' + ' + step + ' = ' + next + '。' };
        },
        function() {
          var a = rand(2,5);
          return { text: '△ 神秘符号 △ 加上它自己等于 ' + (a*2) + '，那么 △ 是多少？', type: 'input', answer: String(a), solution: '因为 △ + △ = ' + (a*2) + '，所以 △ = ' + (a*2) + ' ÷ 2 = ' + a + '。' };
        }
      ];
      generators.logic[1] = [
        function() {
          var a = rand(2,9), b = rand(2,9);
          return { text: '⭐ 如果 ☆ = ' + a + '，那么 ☆ + ' + b + ' 等于多少呢？', type: 'input', answer: String(a+b), solution: '直接把 ☆ 的值代入：' + a + ' + ' + b + ' = ' + (a+b) + '。' };
        },
        function() {
          var a = rand(2,9);
          return { text: '□ + □ = ' + (a*2) + '，□ 代表同一个数，它应该是多少？', type: 'input', answer: String(a), solution: '因为两个相同的数相加等于 ' + (a*2) + '，所以这个数就是 ' + (a*2) + ' ÷ 2 = ' + a + '。' };
        }
      ];
      generators.logic[2] = [
        function() {
          var a = rand(2,9);
          return { text: '○ × ○ = ' + (a*a) + '，○ 代表哪个数字呢？', type: 'input', answer: String(a), solution: '一个数乘自己等于 ' + (a*a) + '，这个数就是 ' + a + '，因为 ' + a + ' × ' + a + ' = ' + (a*a) + '。' };
        },
        function() {
          var a = rand(2,6), b = rand(2,6);
          return { text: '如果 A = ' + a + '，B = ' + b + '，那么 A + B 等于多少？', type: 'input', answer: String(a+b), solution: '直接把 A 和 B 的值加起来：' + a + ' + ' + b + ' = ' + (a+b) + '。' };
        }
      ];
      generators.logic[3] = [
        function() {
          var a = rand(2,5), b = rand(2,5);
          return { text: '🐔🐰 鸡兔同笼，共有 ' + (a+b) + ' 个头，' + (a*2 + b*4) + ' 只脚。请问兔子有几只？', type: 'input', answer: String(b), solution: '假设全是鸡，脚数少 ' + (a*2 + b*4 - (a+b)*2) + ' 只，每只兔比鸡多2只脚，所以兔子 = ' + b + ' 只。' };
        },
        function() {
          var age = rand(5,12);
          return { text: '👨‍👦 小明今年 ' + age + ' 岁，爸爸的年龄是小明的 3 倍还多 5 岁。爸爸多少岁？', type: 'input', answer: String(age*3+5), solution: '爸爸年龄 = 小明年龄 × 3 + 5 = ' + age + ' × 3 + 5 = ' + (age*3+5) + ' 岁。' };
        }
      ];
      generators.logic[4] = [
        function() {
          var a = rand(2,6);
          return { text: '🧮 △ + □ = ' + (a+2) + '，△ - □ = ' + (a-2) + '，那么 △ 是多少？', type: 'input', answer: String(a), solution: '两式相加：(△+□)+(△-□) = 2△ = ' + (a+2) + ' + ' + (a-2) + ' = ' + (2*a) + '，所以 △ = ' + a + '。' };
        },
        function() {
          var n = rand(10,30);
          return { text: '🔢 斐波那契数列：1,1,2,3,5,8... 请问第 ' + n + ' 个数是多少？', type: 'input', answer: String(fib(n)), solution: '斐波那契数列的规律是后一个数等于前两个数之和。计算到第 ' + n + ' 个数为 ' + fib(n) + '。' };
        }
      ];
      generators.logic[5] = [
        function() {
          var a = rand(2,9), b = rand(2,9);
          return { text: '⚖️ 如果 x + ' + b + ' = ' + (a+b) + '，那么 x 是多少？', type: 'input', answer: String(a), solution: '方程两边同时减去 ' + b + '：x = ' + (a+b) + ' - ' + b + ' = ' + a + '。' };
        },
        function() {
          var a = rand(2,9);
          return { text: '📐 2x = ' + (a*2) + '，请你解出 x 的值。', type: 'input', answer: String(a), solution: '两边同时除以2：x = ' + (a*2) + ' ÷ 2 = ' + a + '。' };
        }
      ];
      generators.logic[6] = [
        function() {
          var a = rand(2,5);
          return { text: '|x| = ' + a + '，x 的正数可能是多少？', type: 'input', answer: String(a), solution: '绝对值表示到原点的距离，所以 x 可能是 ' + a + ' 或 ' + (-a) + '。题目要求正数，所以答案是 ' + a + '。' };
        },
        function() {
          var a = rand(2,9);
          return { text: '√x = ' + a + '，那么 x 是多少？', type: 'input', answer: String(a*a), solution: '一个数的平方根是 ' + a + '，说明这个数就是 ' + a + '² = ' + (a*a) + '。' };
        }
      ];

      // 度量工坊
      generators.measure = [];
      generators.measure[0] = [
        function() {
          var a = rand(3,10);
          return { text: '📏 一支铅笔长 ' + a + ' 厘米，这等于多少毫米呢？', type: 'input', answer: String(a*10), solution: '1厘米 = 10毫米，所以 ' + a + ' 厘米 = ' + a + ' × 10 = ' + (a*10) + ' 毫米。' };
        },
        function() {
          return { text: '📏 1米等于多少厘米？', type: 'choice', answer: '100', solution: '1米 = 100厘米，这是长度单位换算的基础。', options: ['10', '100', '1000'] };
        }
      ];
      generators.measure[1] = [
        function() {
          return { text: '⚖️ 1千克等于多少克？', type: 'choice', answer: '1000', solution: '1千克 = 1000克，这是质量单位换算的基础。', options: ['100', '1000', '10000'] };
        },
        function() {
          var a = rand(2,8);
          return { text: '🍎 妈妈买了 ' + a + ' 千克苹果，合多少克？', type: 'input', answer: String(a*1000), solution: '1千克 = 1000克，所以 ' + a + ' 千克 = ' + a + ' × 1000 = ' + (a*1000) + ' 克。' };
        }
      ];
      generators.measure[2] = [
        function() {
          return { text: '🥛 1升等于多少毫升？', type: 'choice', answer: '1000', solution: '1升 = 1000毫升，这是容量单位换算的基础。', options: ['10', '100', '1000'] };
        },
        function() {
          var a = rand(2,6);
          return { text: '🫖 一个水壶的容量是 ' + a + ' 升，合多少毫升？', type: 'input', answer: String(a*1000), solution: '1升 = 1000毫升，' + a + ' 升 = ' + a + ' × 1000 = ' + (a*1000) + ' 毫升。' };
        }
      ];
      generators.measure[3] = [
        function() {
          var a = rand(10,60);
          return { text: '⏰ ' + a + ' 分钟是多少小时多少分钟？', type: 'input', answer: Math.floor(a/60) + '小时' + (a%60) + '分钟', solution: a + ' ÷ 60 = ' + Math.floor(a/60) + ' 小时余 ' + (a%60) + ' 分钟。' };
        },
        function() {
          var a = rand(1,3);
          return { text: '⏱️ ' + a + ' 小时是多少分钟？', type: 'input', answer: String(a*60), solution: '1小时 = 60分钟，' + a + ' 小时 = ' + a + ' × 60 = ' + (a*60) + ' 分钟。' };
        }
      ];
      generators.measure[4] = [
        function() {
          var a = rand(2,10);
          return { text: '🏟️ 一个正方形操场边长 ' + a + ' 米，周长是多少厘米？', type: 'input', answer: String(a*4*100), solution: '正方形周长 = 边长×4 = ' + a + '×4 = ' + (a*4) + ' 米，换算成厘米：' + (a*4) + ' × 100 = ' + (a*4*100) + ' 厘米。' };
        },
        function() {
          var a = rand(2,8), b = rand(2,6);
          return { text: '📏 一块长方形地毯长 ' + a + ' 米，宽 ' + b + ' 米，面积是多少平方分米？', type: 'input', answer: String(a*b*100), solution: '面积 = 长×宽 = ' + a + '×' + b + ' = ' + (a*b) + ' 平方米。1平方米 = 100平方分米，所以 ' + (a*b) + ' × 100 = ' + (a*b*100) + ' 平方分米。' };
        }
      ];
      generators.measure[5] = [
        function() {
          var a = rand(2,8);
          return { text: '🏃 小明跑步的速度是 ' + a + ' 米/秒，10秒能跑多少米？', type: 'input', answer: String(a*10), solution: '路程 = 速度 × 时间 = ' + a + ' × 10 = ' + (a*10) + ' 米。' };
        },
        function() {
          var a = rand(10,50);
          return { text: '🗺️ ' + a + ' 平方千米等于多少公顷？', type: 'input', answer: String(a*100), solution: '1平方千米 = 100公顷，所以 ' + a + ' 平方千米 = ' + a + ' × 100 = ' + (a*100) + ' 公顷。' };
        }
      ];
      generators.measure[6] = [
        function() {
          return { text: '📦 1立方米等于多少立方分米？', type: 'choice', answer: '1000', solution: '1立方米 = 1000立方分米。', options: ['100', '1000', '10000'] };
        },
        function() {
          var a = rand(2,6), b = rand(3,6), c = rand(2,4);
          return { text: '🏗️ 一个长方体木块长 ' + a + ' 米、宽 ' + b + ' 米、高 ' + c + ' 米，体积是多少立方厘米？', type: 'input', answer: String(a*b*c*1000000), solution: '体积 = ' + a + '×' + b + '×' + c + ' = ' + (a*b*c) + ' 立方米。1立方米 = 1000000立方厘米，所以等于 ' + (a*b*c*1000000) + ' 立方厘米。' };
        }
      ];

      function generateExamQuestions(grade) {
        var categories = ['arithmetic', 'geometry', 'fraction', 'word', 'logic', 'measure'];
        var questions = [];
        var perCat = 1;
        var remaining = 10 - categories.length;
        if (remaining < 0) remaining = 0;
        for (var i = 0; i < categories.length; i++) {
          var cat = categories[i];
          var num = perCat + (remaining > 0 ? Math.floor(Math.random() * (remaining + 1)) : 0);
          if (num > 0) {
            var list = generators[cat];
            if (list && list[grade]) {
              var funcs = list[grade];
              for (var j = 0; j < num; j++) {
                var q = funcs[rand(0, funcs.length-1)]();
                if (!q.solution) q.solution = '本题考察基础知识，细心计算即可。';
                questions.push(q);
              }
              remaining -= (num - 1);
            }
          }
        }
        while (questions.length < 10) {
          var cat2 = categories[rand(0, categories.length-1)];
          var list2 = generators[cat2];
          if (list2 && list2[grade]) {
            var funcs2 = list2[grade];
            var q2 = funcs2[rand(0, funcs2.length-1)]();
            if (!q2.solution) q2.solution = '本题考察基础知识，细心计算即可。';
            questions.push(q2);
          }
        }
        return shuffle(questions);
      }

      function beginExam() {
        examStarted.value = true;
        examQuestions.value = generateExamQuestions(currentGrade.value);
        examAnswers.value = new Array(examQuestions.value.length).fill('');
        examSubmitted.value = false;
      }

      function submitExam() {
        var correctCount = 0;
        var results = [];
        for (var i = 0; i < examQuestions.value.length; i++) {
          var q = examQuestions.value[i];
          var userAns = examAnswers.value[i] || '';
          var isCorrect = isAnswerCorrect(userAns, q.answer);
          results.push(isCorrect);
          if (isCorrect) correctCount++;
        }
        examResults.value = results;
        examCorrect.value = correctCount;
        examScore.value = Math.round(correctCount * 100 / examQuestions.value.length);
        examSubmitted.value = true;
        stars.value += correctCount * 2;
        showToast('考试完成！获得 ' + (correctCount * 2) + ' 颗星星！');
      }

      function printExam() {
        var grade = currentGrade.value;
        var questions = generateExamQuestions(grade);
        var printWindow = window.open('', '_blank', 'width=800,height=600');
        if (!printWindow) {
          showToast('请允许弹出窗口以打印试卷');
          return;
        }
        var examHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>啾啾数学试卷</title>';
        examHtml += '<style>';
        examHtml += 'body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 20px; }';
        examHtml += 'h1 { text-align: center; font-size: 24px; margin-bottom: 10px; }';
        examHtml += '.info { text-align: center; margin-bottom: 20px; font-size: 16px; }';
        examHtml += '.question { margin-bottom: 18px; page-break-inside: avoid; }';
        examHtml += '.q-text { font-size: 16px; font-weight: bold; margin-bottom: 6px; }';
        examHtml += '.q-image { font-size: 40px; text-align: center; margin: 6px 0; }';
        examHtml += '.options { margin-left: 20px; font-size: 16px; }';
        examHtml += '.options span { margin-right: 20px; }';
        examHtml += '.answer-line { border-bottom: 1px solid #000; width: 120px; display: inline-block; margin-left: 10px; }';
        examHtml += '@media print { body { margin: 0; } .page-break { page-break-after: always; } }';
        examHtml += '</style></head><body>';
        examHtml += '<h1>🌻 啾啾数学花园 试卷</h1>';
        examHtml += '<div class="info">年级：' + gradeNames[grade] + ' | 姓名：________ 日期：________</div>';
        for (var i = 0; i < questions.length; i++) {
          var q = questions[i];
          examHtml += '<div class="question">';
          examHtml += '<div class="q-text">' + (i+1) + '. ' + q.text + '</div>';
          if (q.image) examHtml += '<div class="q-image">' + q.image + '</div>';
          if (q.type === 'choice') {
            examHtml += '<div class="options">';
            for (var j = 0; j < q.options.length; j++) {
              examHtml += '<span>○ ' + q.options[j] + '</span>';
            }
            examHtml += '</div>';
          } else {
            examHtml += '<div>答案：<span class="answer-line">&nbsp;</span></div>';
          }
          examHtml += '</div>';
        }
        examHtml += '<div class="page-break"></div>';
        examHtml += '<h1>🧠 答案与解题思路</h1>';
        for (var k = 0; k < questions.length; k++) {
          var aq = questions[k];
          examHtml += '<div class="question">';
          examHtml += '<div class="q-text">' + (k+1) + '. 答案：<strong>' + aq.answer + '</strong></div>';
          examHtml += '<div style="font-size:14px; color:#555;">' + aq.solution + '</div>';
          examHtml += '</div>';
        }
        examHtml += '</body></html>';
        printWindow.document.write(examHtml);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(function() { printWindow.print(); }, 500);
      }

      function genQuestion(category, grade) {
        var list = generators[category];
        if (!list || !list[grade]) return null;
        var funcs = list[grade];
        return funcs[rand(0, funcs.length-1)]();
      }

      function generateQuestion() {
        feedback.value = '';
        userInput.value = '';
        var grade = currentGrade.value;
        var game = currentGame.value;
        var q = genQuestion(game, grade);
        if (!q) {
          q = { text: '题目准备中，请稍后再试~', type: 'choice', answer: '好的', solution: '暂无题目，请切换年级或游戏。', options: ['好的', '知道了'] };
        }
        if (!q.solution) q.solution = '这道题考察了基本的数学知识，细心计算就能得出答案。';
        if (q.type === 'choice' && q.options) {
          if (q.options.indexOf(q.answer) === -1) q.options.push(q.answer);
          q.options = shuffleUnique(q.options).slice(0,4);
        }
        question.value = q;
      }

      function answer(userAnswer) {
        if (!question.value || showCorrectModal.value) return;
        var isCorrect = isAnswerCorrect(userAnswer, question.value.answer);
        if (isCorrect) {
          feedback.value = '';
          encourageText.value = pick(['太厉害了！🌟', '你真是数学小天才！', '完全正确，棒棒哒！', '哇，答对了！继续加油！', '好聪明！✨']);
          currentSolution.value = question.value.solution || '仔细读题，用学过的知识就能解决啦。';
          showCorrectModal.value = true;
          stars.value += 1 + Math.floor(currentGrade.value / 2);
          var game = currentGame.value;
          plantProgress[game] += PROGRESS_PER_CORRECT;
          if (plantProgress[game] >= MAX_PROGRESS) {
            plantProgress[game] = 0;
            showToast('🌱 植物升级了！获得额外星星！');
            stars.value += LEVEL_UP_BONUS;
          }
        } else {
          feedback.value = '❌ 再想想吧，试试看！';
          showToast('不对哦，再试一次～');
        }
      }

      function closeCorrectModal() {
        if (modalClosing.value) return;
        modalClosing.value = true;
        showCorrectModal.value = false;
        setTimeout(function() {
          modalClosing.value = false;
          generateQuestion();
        }, 300);
      }

      watch(currentGrade, function() {
        if (view.value === 'game' && currentGame.value) {
          generateQuestion();
        }
      });

      return {
        vueReady,
        gradeNames, currentGrade, prevGrade, nextGrade,
        stars, gardenLevel, toast, showToast,
        plantProgress,
        view, currentGame, gameTitle,
        openGame, generateQuestion, question, feedback, userInput, answer,
        showCorrectModal, encourageText, currentSolution, closeCorrectModal,
        modalClosing,
        examStarted, examQuestions, examAnswers, examSubmitted, examResults, examCorrect, examScore, examGrade,
        startExam, beginExam, submitExam, resetExam,
        printExam
      };
    }
  }).mount('#app');
})();
</script>
</body>
</html>

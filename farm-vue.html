<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>啾啾数学花园 · 分级数学启蒙</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #fef9e7;
      --gold: #f1c40f;
      --jade: #6b8e4e;
      --red: #e74c3c;
      --wood: #8b5a2b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "STKaiti", sans-serif;
      background: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    #app {
      width: 420px;
      max-width: 100%;
      background: var(--bg);
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      height: 95vh;
      max-height: 850px;
      position: relative;
    }
    .top-bar {
      background: linear-gradient(180deg, #ffd700 0%, #f0b800 100%);
      color: #3e2723;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      border-bottom: 3px solid #e6a800;
      font-weight: bold;
    }
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #fef9e7;
    }
    .btn {
      background: linear-gradient(180deg, #f1c40f, #d4ac0d);
      border: none;
      color: #2c3e50;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 17px;
      cursor: pointer;
      margin: 6px 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.1s;
      display: inline-block;
    }
    .btn:active { transform: translateY(2px); box-shadow: none; }
    .btn.red { background: linear-gradient(180deg, #e74c3c, #c0392b); color: white; }
    .btn.jade { background: linear-gradient(180deg, #8fbc8f, #5a7d5a); color: white; }
    .card {
      background: rgba(255,255,250,0.95);
      border: 2px solid #f1c40f;
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }
    .modal-content {
      width: 90%;
      max-width: 380px;
      background: #fffef5;
      border-radius: 30px;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .option-btn {
      background: #fdebd0;
      border: 2px solid #f1c40f;
      border-radius: 15px;
      padding: 12px;
      font-size: 22px;
      margin: 5px;
      cursor: pointer;
      transition: 0.1s;
      display: block;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
    }
    .option-btn:active { background: #f1c40f; color: white; }
    .toast {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #f1c40f;
      padding: 8px 20px;
      border-radius: 20px;
      z-index: 300;
      animation: fadeInOut 2s ease;
    }
    @keyframes fadeInOut {
      0%{opacity:0;transform:translateX(-50%) translateY(-10px);}
      10%{opacity:1;transform:translateX(-50%) translateY(0);}
      90%{opacity:1;}
      100%{opacity:0;}
    }
    .grade-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px 0;
    }
    .grade-selector button {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 18px;
      cursor: pointer;
    }
    .garden-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .garden-item {
      background: #e8f5e9;
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid #a5d6a7;
    }
    .garden-item:active { background: #c8e6c9; }
    .plant-icon { font-size: 45px; }
    .progress-bar {
      height: 8px;
      background: #ddd;
      border-radius: 4px;
      margin: 5px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #66bb6a;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
<div id="app">
  <div v-if="toast.show" class="toast">{{ toast.message }}</div>

  <!-- 顶部状态栏 -->
  <div class="top-bar">
    <span>🌟 {{ stars }}</span>
    <span style="font-weight: bold; font-size: 18px;">{{ gradeNames[currentGrade] }}</span>
    <span>🌱 {{ gardenLevel }}</span>
  </div>

  <!-- 主界面 -->
  <div class="main">
    <!-- 年级选择器 -->
    <div class="grade-selector">
      <button @click="prevGrade" :disabled="currentGrade <= 0">◀</button>
      <span style="font-size: 16px;">{{ gradeNames[currentGrade] }}</span>
      <button @click="nextGrade" :disabled="currentGrade >= gradeNames.length-1">▶</button>
    </div>

    <!-- 花园主页 -->
    <div v-if="view === 'garden'">
      <div class="garden-grid">
        <div class="garden-item" @click="openGame('arithmetic')">
          <div class="plant-icon">🌻</div>
          <strong>算术花田</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.arithmetic + '%'}"></div></div>
        </div>
        <div class="garden-item" @click="openGame('geometry')">
          <div class="plant-icon">🌳</div>
          <strong>图形树屋</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.geometry + '%'}"></div></div>
        </div>
        <div class="garden-item" @click="openGame('fraction')">
          <div class="plant-icon">🍕</div>
          <strong>分数厨房</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.fraction + '%'}"></div></div>
        </div>
        <div class="garden-item" @click="openGame('word')">
          <div class="plant-icon">📚</div>
          <strong>应用小岛</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.word + '%'}"></div></div>
        </div>
      </div>
    </div>

    <!-- 游戏界面（通用） -->
    <div v-if="view === 'game'">
      <button class="btn" @click="view='garden'">← 回花园</button>
      <h3 style="text-align: center;">{{ gameTitle }}</h3>
      <div v-if="!question" style="text-align: center; padding: 20px;">
        <p>点击下方按钮开始挑战吧！</p>
        <button class="btn" @click="generateQuestion">出题！</button>
      </div>
      <div v-else class="card" style="text-align: center;">
        <div style="font-size: 24px; margin-bottom: 15px;">{{ question.text }}</div>
        <div v-if="question.image" style="font-size: 50px; margin: 10px;">{{ question.image }}</div>
        <!-- 选择题选项 -->
        <div v-if="question.type === 'choice'">
          <button class="option-btn" v-for="opt in question.options" :key="opt" @click="answer(opt)">{{ opt }}</button>
        </div>
        <!-- 输入题 -->
        <div v-if="question.type === 'input'">
          <input v-model="userInput" type="number" style="font-size: 24px; width: 100px; text-align: center; padding: 8px;"
                 @keyup.enter="answer(parseFloat(userInput))" placeholder="?">
          <button class="btn" @click="answer(parseFloat(userInput))">确定</button>
        </div>
        <p v-if="feedback" style="margin-top: 12px; font-weight: bold;">{{ feedback }}</p>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div style="display: flex; background: #fff8e7; border-top: 3px solid #f1c40f;">
    <button @click="view='garden'" style="flex:1; padding:14px; border:none; background:transparent; font-size:20px; cursor:pointer;">🏡 花园</button>
  </div>
</div>

<script>
  const { createApp, ref, reactive, computed } = Vue;

  createApp({
    setup() {
      // ---------- 年级系统 ----------
      const gradeNames = ['幼儿园', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级'];
      const currentGrade = ref(0); // 0=幼儿园, 1=一年级, ... ,6=六年级
      function prevGrade() { if (currentGrade.value > 0) currentGrade.value--; }
      function nextGrade() { if (currentGrade.value < gradeNames.length-1) currentGrade.value++; }

      // ---------- 全局状态 ----------
      const stars = ref(0);
      const gardenLevel = computed(() => Math.floor(stars.value / 20) + 1);
      const toast = reactive({ show: false, message: '' });
      function showToast(msg) {
        toast.message = msg;
        toast.show = true;
        setTimeout(() => { toast.show = false; }, 2000);
      }

      // 植物成长进度 (每答对一题+25%, 满100%重置并奖励星星)
      const plantProgress = reactive({
        arithmetic: 0,
        geometry: 0,
        fraction: 0,
        word: 0
      });

      // ---------- 视图 ----------
      const view = ref('garden');
      const currentGame = ref('');

      function openGame(gameType) {
        currentGame.value = gameType;
        view.value = 'game';
        // 重置题目状态
        question.value = null;
        feedback.value = '';
        userInput.value = '';
        // 自动出题
        generateQuestion();
      }

      const gameTitle = computed(() => {
        const map = { arithmetic: '算术花田', geometry: '图形树屋', fraction: '分数厨房', word: '应用小岛' };
        return map[currentGame.value] || '';
      });

      // ---------- 题库系统 ----------
      const question = ref(null); // {text, image, type:'choice'|'input', options, answer}
      const feedback = ref('');
      const userInput = ref('');

      // 生成随机整数 [min,max]
      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      // 生成题目主函数
      function generateQuestion() {
        feedback.value = '';
        userInput.value = '';
        const grade = currentGrade.value;
        const game = currentGame.value;

        let q = null;

        // 根据游戏类型和年级调用对应的生成器
        if (game === 'arithmetic') {
          q = genArithmetic(grade);
        } else if (game === 'geometry') {
          q = genGeometry(grade);
        } else if (game === 'fraction') {
          q = genFraction(grade);
        } else if (game === 'word') {
          q = genWordProblem(grade);
        }

        if (q) {
          // 如果是选择题，确保选项包含正确答案且不重复
          if (q.type === 'choice' && q.options && q.options.indexOf(q.answer) === -1) {
            q.options.push(q.answer);
          }
          question.value = q;
        }
      }

      // 回答处理
      function answer(userAnswer) {
        if (!question.value) return;
        const correct = question.value.answer;
        // 字符串比较处理（选择题选项可能是字符串）
        const isCorrect = (typeof correct === 'string' && typeof userAnswer === 'string')
          ? correct.trim().toLowerCase() === userAnswer.trim().toLowerCase()
          : Math.abs(Number(userAnswer) - Number(correct)) < 0.001;

        if (isCorrect) {
          feedback.value = '✅ 太棒了！回答正确！';
          stars.value += 1 + Math.floor(currentGrade.value / 2); // 高年级奖励略多
          // 植物成长
          plantProgress[currentGame.value] += 25;
          if (plantProgress[currentGame.value] >= 100) {
            plantProgress[currentGame.value] = 0;
            showToast('🌱 植物升级了！获得额外星星！');
            stars.value += 3;
          }
          showToast('答对了！');
          // 延迟出下一题
          setTimeout(() => {
            generateQuestion();
          }, 800);
        } else {
          feedback.value = '❌ 再想想吧，试试看！';
          showToast('不对哦，再试一次～');
        }
      }

      // ========== 具体题目生成器 ==========

      // 1. 算术题 (覆盖K-6)
      function genArithmetic(grade) {
        let a, b, op, answer, text, type='choice', options=[];
        // 根据年级选择运算类型
        if (grade === 0) { // 幼儿园：数数
          const count = rand(1, 10);
          const emojis = ['🐶','🐱','🐰','🐸','🐼','🐨','🐯','🦁','🐮','🐷'];
          text = `数一数有多少只小动物？`;
          const image = emojis.slice(0, count).join(' ');
          answer = count;
          options = [count, count+1, count-1].filter(n=>n>0).sort(()=>Math.random()-0.5);
          return { text, image, type:'choice', answer, options };
        } else if (grade === 1) { // 一年级：20以内加减
          op = Math.random()<0.5 ? '+' : '-';
          if (op === '+') {
            a = rand(1, 10); b = rand(1, 10);
            answer = a + b;
          } else {
            a = rand(5, 20); b = rand(1, a);
            answer = a - b;
          }
          text = `${a} ${op} ${b} = ?`;
        } else if (grade === 2) { // 二年级：表内乘除
          op = Math.random()<0.5 ? '×' : '÷';
          if (op === '×') {
            a = rand(1, 9); b = rand(1, 9);
            answer = a * b;
          } else {
            b = rand(1, 9); answer = rand(1, 9);
            a = b * answer;
          }
          text = `${a} ${op} ${b} = ?`;
        } else if (grade === 3) { // 三年级：三位数加减，多位数乘一位数
          const r = Math.random();
          if (r < 0.5) {
            op = Math.random()<0.5 ? '+' : '-';
            a = rand(100, 999); b = rand(10, 999);
            if (op === '-') answer = a - b;
            else answer = a + b;
            text = `${a} ${op} ${b} = ?`;
          } else {
            a = rand(10, 99); b = rand(2, 9);
            answer = a * b;
            text = `${a} × ${b} = ?`;
          }
        } else if (grade === 4) { // 四年级：大数加减，乘除
          const r = Math.random();
          if (r < 0.4) {
            a = rand(1000, 9999); b = rand(100, 9999);
            op = Math.random()<0.5 ? '+' : '-';
            answer = op === '+' ? a+b : a-b;
            text = `${a} ${op} ${b} = ?`;
          } else {
            a = rand(10, 99); b = rand(10, 99);
            answer = a * b;
            text = `${a} × ${b} = ?`;
          }
        } else if (grade >= 5) { // 五六年级：小数、分数运算（简单分数已进fraction）
          const r = Math.random();
          if (r < 0.5) {
            // 小数加减乘
            a = (rand(10, 99) / 10).toFixed(1);
            b = (rand(10, 99) / 10).toFixed(1);
            const ops = ['+', '-', '×'];
            op = ops[rand(0,2)];
            if (op === '+') answer = (parseFloat(a) + parseFloat(b)).toFixed(2);
            else if (op === '-') answer = (parseFloat(a) - parseFloat(b)).toFixed(2);
            else answer = (parseFloat(a) * parseFloat(b)).toFixed(2);
            text = `${a} ${op} ${b} = ?`;
          } else {
            // 整数混合运算
            a = rand(2, 9); b = rand(2, 9); const c = rand(2, 5);
            answer = a * b + c;
            text = `${a} × ${b} + ${c} = ?`;
          }
        }
        // 生成干扰项
        if (!options.length) {
          const ansNum = Number(answer);
          options = [ansNum, ansNum+1, ansNum-1, ansNum+2].filter((n,i,a)=> n>=0 && a.indexOf(n)===i).sort(()=>Math.random()-0.5);
        }
        return { text, type:'choice', answer, options };
      }

      // 2. 几何题
      function genGeometry(grade) {
        let text, answer, options, type='choice';
        if (grade === 0) {
          // 幼儿园：认识形状
          const shapes = ['圆形', '正方形', '三角形'];
          const shape = shapes[rand(0,2)];
          text = `下面哪个是${shape}？`;
          answer = shape;
          options = [shape, shapes.filter(s=>s!==shape)[0], shapes.filter(s=>s!==shape)[1]].sort(()=>Math.random()-0.5);
          return { text, type:'choice', answer, options };
        } else if (grade === 1 || grade === 2) {
          // 认识图形、长度比较
          text = `铅笔长 10 厘米，橡皮长 3 厘米，铅笔比橡皮长多少厘米？`;
          answer = 7;
        } else if (grade === 3) {
          // 周长面积
          const w = rand(3, 10), h = rand(3, 10);
          if (Math.random()<0.5) {
            text = `长方形长 ${w} 厘米，宽 ${h} 厘米，周长是多少？`;
            answer = (w + h) * 2;
          } else {
            text = `正方形边长 ${w} 厘米，面积是多少？`;
            answer = w * w;
          }
        } else if (grade === 4) {
          // 角度
          const angle = rand(1, 8) * 10;
          text = `一个角是 ${angle}°，它的补角是多少度？`;
          answer = 180 - angle;
        } else if (grade >= 5) {
          // 圆、体积
          if (Math.random()<0.5) {
            const r = rand(2, 10);
            text = `圆的半径是 ${r} cm，周长是多少？(π取3.14)`;
            answer = (2 * 3.14 * r).toFixed(2);
          } else {
            const l = rand(2, 5), w = rand(2, 5), h = rand(2, 5);
            text = `长方体长${l}宽${w}高${h}，体积是多少？`;
            answer = l * w * h;
          }
        }
        const ansNum = Number(answer);
        options = [ansNum, ansNum+1, ansNum-1, ansNum+2].filter((n,i,a)=> n>=0 && a.indexOf(n)===i).sort(()=>Math.random()-0.5);
        return { text, type:'choice', answer, options };
      }

      // 3. 分数
      function genFraction(grade) {
        let text, answer, options, type='choice';
        if (grade < 3) {
          // 三年级以下不做分数，转为简单比较
          return genArithmetic(grade);
        }
        if (grade === 3) {
          // 分数初步：看图写分数
          const den = rand(2, 4);
          const num = rand(1, den-1);
          text = `阴影部分占整体的几分之几？ (提示：分母${den})`;
          answer = `${num}/${den}`;
          options = [`${num}/${den}`, `${den-num}/${den}`, `${num+1}/${den}`].filter((v,i,a)=>a.indexOf(v)===i);
        } else if (grade === 4) {
          // 同分母加减
          const den = rand(3, 8);
          const a = rand(1, den-1), b = rand(1, den-1);
          const op = Math.random()<0.5 ? '+' : '-';
          if (op === '+') {
            answer = `${a+b}/${den}`;
          } else {
            if (a >= b) answer = `${a-b}/${den}`;
            else answer = `${b-a}/${den}`;
          }
          text = `(${a}/${den}) ${op} (${b}/${den}) = ? (化简前)`;
          options = [answer, `${a+b+1}/${den}`, `${Math.abs(a-b)+1}/${den}`];
        } else {
          // 五六年级：分数乘除、小数分数转换
          const r = Math.random();
          if (r < 0.5) {
            const a = rand(1, 5), b = rand(2, 6);
            const c = rand(1, 5), d = rand(2, 6);
            answer = `${a*c}/${b*d}`;
            text = `(${a}/${b}) × (${c}/${d}) = ? (无需化简)`;
          } else {
            const decimal = (rand(1, 99) / 100).toFixed(2);
            answer = `${Math.round(parseFloat(decimal)*100)}/100`;
            text = `将小数 ${decimal} 化为分数 (分母100)`;
          }
          options = [answer, `${parseInt(answer)+1}/100`, `${parseInt(answer)-1}/100`];
        }
        return { text, type:'choice', answer, options };
      }

      // 4. 应用题
      function genWordProblem(grade) {
        let text, answer, options, type='choice';
        if (grade === 0) {
          const count = rand(2, 5);
          text = `树上有 ${count} 只小鸟，又飞来 1 只，现在有几只？`;
          answer = count + 1;
        } else if (grade === 1) {
          const a = rand(5, 15), b = rand(2, 10);
          text = `小明有 ${a} 颗糖，吃了 ${b} 颗，还剩几颗？`;
          answer = a - b;
        } else if (grade === 2) {
          const a = rand(3, 9), b = rand(2, 5);
          text = `每排 ${a} 棵树，种了 ${b} 排，一共有多少棵树？`;
          answer = a * b;
        } else if (grade === 3) {
          const total = rand(20, 50), days = rand(2, 5);
          answer = Math.floor(total / days);
          text = `一本书共 ${total} 页，小明 ${days} 天看完，平均每天看多少页？`;
        } else if (grade === 4) {
          const price = rand(5, 20), amount = rand(3, 10);
          answer = price * amount;
          text = `钢笔每支 ${price} 元，买了 ${amount} 支，一共花了多少钱？`;
        } else if (grade >= 5) {
          // 比例、百分数
          const r = Math.random();
          if (r < 0.5) {
            const total = rand(100, 500), percent = rand(10, 90);
            answer = Math.round(total * percent / 100);
            text = `${total} 的 ${percent}% 是多少？`;
          } else {
            const speed = rand(30, 80), time = rand(2, 5);
            answer = speed * time;
            text = `汽车每小时行 ${speed} 千米，${time} 小时行多少千米？`;
          }
        }
        const ansNum = Number(answer);
        options = [ansNum, ansNum+1, ansNum-1, ansNum+2].filter((n,i,a)=> n>=0 && a.indexOf(n)===i).sort(()=>Math.random()-0.5);
        return { text, type:'choice', answer, options };
      }

      // 页面初始化时预热
      // 无

      return {
        gradeNames, currentGrade, prevGrade, nextGrade,
        stars, gardenLevel, toast, showToast,
        plantProgress,
        view, currentGame, gameTitle,
        openGame, generateQuestion, question, feedback, userInput, answer
      };
    }
  }).mount('#app');
</script>

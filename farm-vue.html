<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>啾啾数学花园 · 巨型题库版</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #fef9e7; --gold: #f1c40f; --jade: #6b8e4e; --red: #e74c3c; --wood: #8b5a2b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "STKaiti", sans-serif;
      background: #2c3e50;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
    }
    #app {
      width: 420px; max-width: 100%; background: var(--bg); border-radius: 30px; overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; height: 95vh; max-height: 850px; position: relative;
    }
    .top-bar {
      background: linear-gradient(180deg, #ffd700 0%, #f0b800 100%); color: #3e2723;
      padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; border-bottom: 3px solid #e6a800; font-weight: bold;
    }
    .main { flex: 1; overflow-y: auto; padding: 12px; background: #fef9e7; }
    .btn {
      background: linear-gradient(180deg, #f1c40f, #d4ac0d); border: none; color: #2c3e50;
      padding: 10px 18px; border-radius: 25px; font-weight: bold; font-size: 17px; cursor: pointer;
      margin: 6px 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.1s; display: inline-block;
    }
    .btn:active { transform: translateY(2px); box-shadow: none; }
    .btn.red { background: linear-gradient(180deg, #e74c3c, #c0392b); color: white; }
    .btn.jade { background: linear-gradient(180deg, #8fbc8f, #5a7d5a); color: white; }
    .card {
      background: rgba(255,255,250,0.95); border: 2px solid #f1c40f; border-radius: 20px;
      padding: 14px; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center; z-index: 200;
    }
    .modal-content {
      width: 90%; max-width: 380px; background: #fffef5; border-radius: 30px; padding: 20px;
      max-height: 80vh; overflow-y: auto;
    }
    .option-btn {
      background: #fdebd0; border: 2px solid #f1c40f; border-radius: 15px; padding: 12px;
      font-size: 22px; margin: 5px; cursor: pointer; transition: 0.1s; display: block; width: 80%;
      margin-left: auto; margin-right: auto;
    }
    .option-btn:active { background: #f1c40f; color: white; }
    .toast {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #f1c40f; padding: 8px 20px; border-radius: 20px;
      z-index: 300; animation: fadeInOut 2s ease;
    }
    @keyframes fadeInOut {
      0%{opacity:0;transform:translateX(-50%) translateY(-10px);}
      10%{opacity:1;transform:translateX(-50%) translateY(0);}
      90%{opacity:1;} 100%{opacity:0;}
    }
    .grade-selector {
      display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0;
    }
    .grade-selector button {
      background: #fff; border: 1px solid #ccc; border-radius: 50%; width: 30px; height: 30px;
      font-size: 18px; cursor: pointer;
    }
    .garden-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .garden-item {
      background: #e8f5e9; border-radius: 20px; padding: 15px; text-align: center;
      cursor: pointer; transition: 0.2s; border: 2px solid #a5d6a7;
    }
    .garden-item:active { background: #c8e6c9; }
    .plant-icon { font-size: 45px; }
    .progress-bar { height: 8px; background: #ddd; border-radius: 4px; margin: 5px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #66bb6a; transition: width 0.3s; }
  </style>
</head>
<body>
<div id="app">
  <div v-if="toast.show" class="toast">{{ toast.message }}</div>
  <div class="top-bar">
    <span>🌟 {{ stars }}</span>
    <span style="font-weight: bold; font-size: 18px;">{{ gradeNames[currentGrade] }}</span>
    <span>🌱 Lv.{{ gardenLevel }}</span>
  </div>
  <div class="main">
    <div class="grade-selector">
      <button @click="prevGrade" :disabled="currentGrade <= 0">◀</button>
      <span style="font-size: 16px;">{{ gradeNames[currentGrade] }}</span>
      <button @click="nextGrade" :disabled="currentGrade >= gradeNames.length-1">▶</button>
    </div>
    <div v-if="view === 'garden'">
      <div class="garden-grid">
        <div class="garden-item" @click="openGame('arithmetic')">
          <div class="plant-icon">🌻</div><strong>算术花田</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.arithmetic+'%'}"></div></div>
        </div>
        <div class="garden-item" @click="openGame('geometry')">
          <div class="plant-icon">🌳</div><strong>图形树屋</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.geometry+'%'}"></div></div>
        </div>
        <div class="garden-item" @click="openGame('fraction')">
          <div class="plant-icon">🍕</div><strong>分数厨房</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.fraction+'%'}"></div></div>
        </div>
        <div class="garden-item" @click="openGame('word')">
          <div class="plant-icon">📚</div><strong>应用小岛</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.word+'%'}"></div></div>
        </div>
        <div class="garden-item" @click="openGame('logic')">
          <div class="plant-icon">🧩</div><strong>逻辑密室</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.logic+'%'}"></div></div>
        </div>
        <div class="garden-item" @click="openGame('measure')">
          <div class="plant-icon">📏</div><strong>度量工坊</strong>
          <div class="progress-bar"><div class="progress-fill" :style="{width: plantProgress.measure+'%'}"></div></div>
        </div>
      </div>
    </div>
    <div v-if="view === 'game'">
      <button class="btn" @click="view='garden'">← 回花园</button>
      <h3 style="text-align: center;">{{ gameTitle }}</h3>
      <div v-if="!question" style="text-align: center; padding: 20px;">
        <p>点击下方按钮开始挑战！</p>
        <button class="btn" @click="generateQuestion">出题！</button>
      </div>
      <div v-else class="card" style="text-align: center;">
        <div style="font-size: 24px; margin-bottom: 15px;">{{ question.text }}</div>
        <div v-if="question.image" style="font-size: 50px; margin: 10px;">{{ question.image }}</div>
        <div v-if="question.type === 'choice'">
          <button class="option-btn" v-for="opt in question.options" :key="opt" @click="answer(opt)">{{ opt }}</button>
        </div>
        <div v-if="question.type === 'input'">
          <input v-model="userInput" type="text" style="font-size:24px;width:120px;text-align:center;padding:8px;"
                 @keyup.enter="answer(userInput)" placeholder="?">
          <button class="btn" @click="answer(userInput)">确定</button>
        </div>
        <p v-if="feedback" style="margin-top:12px;font-weight:bold;">{{ feedback }}</p>
      </div>
    </div>
  </div>
  <div style="display:flex;background:#fff8e7;border-top:3px solid #f1c40f;">
    <button @click="view='garden'" style="flex:1;padding:14px;border:none;background:transparent;font-size:20px;cursor:pointer;">🏡 花园</button>
  </div>
</div>

<script>
  const { createApp, ref, reactive, computed } = Vue;
  createApp({
    setup() {
      // ---------- 年级 ----------
      const gradeNames = ['幼儿园', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级'];
      const currentGrade = ref(0);
      function prevGrade() { if (currentGrade.value > 0) currentGrade.value--; }
      function nextGrade() { if (currentGrade.value < gradeNames.length-1) currentGrade.value++; }

      const stars = ref(0);
      const gardenLevel = computed(() => Math.floor(stars.value / 30) + 1);
      const toast = reactive({ show: false, message: '' });
      function showToast(msg) { toast.message = msg; toast.show = true; setTimeout(() => { toast.show = false; }, 2000); }

      const plantProgress = reactive({ arithmetic:0, geometry:0, fraction:0, word:0, logic:0, measure:0 });

      const view = ref('garden');
      const currentGame = ref('');
      const gameTitle = computed(() => {
        const map = { arithmetic:'算术花田', geometry:'图形树屋', fraction:'分数厨房', word:'应用小岛', logic:'逻辑密室', measure:'度量工坊' };
        return map[currentGame.value] || '';
      });

      function openGame(gameType) {
        currentGame.value = gameType;
        view.value = 'game';
        question.value = null;
        feedback.value = '';
        userInput.value = '';
        generateQuestion();
      }

      const question = ref(null);
      const feedback = ref('');
      const userInput = ref('');

      function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function pick(arr) { return arr[rand(0, arr.length-1)]; }

      // ----- 题型生成器池 -----
      const generators = {
        arithmetic: [
          // 0: 幼儿园
          [ () => { let c=rand(1,10); let e=['🐶','🐱','🐰','🐸','🐼']; return { text:'数一数有几只小动物？', image:e.slice(0,c).join(' '), type:'choice', answer:c, options:shuffleUnique([c,c+1,c-1].filter(n=>n>0)) }; },
            () => { let a=rand(2,5),b=rand(2,5); return { text:`${'🍎'.repeat(a)} 和 ${'🍊'.repeat(b)} 谁更多？`, type:'choice', answer:a>b?'苹果':'橘子', options:['苹果','橘子','一样多'] }; },
            () => { let a=rand(2,6); return { text:`数字 ${a} 的下一个数是？`, type:'choice', answer:a+1, options:shuffleUnique([a-1,a+1,a+2].filter(n=>n>0)) }; },
          ],
          // 1: 一年级
          [ () => { let a=rand(1,10),b=rand(1,10),op='+'; return { text:`${a} + ${b} = ?`, type:'choice', answer:a+b, options:shuffleUnique([a+b, a+b+1, a+b-1].filter(n=>n>=0)) }; },
            () => { let a=rand(5,20),b=rand(1,a); return { text:`${a} - ${b} = ?`, type:'choice', answer:a-b, options:shuffleUnique([a-b, a-b+1, a-b-1].filter(n=>n>=0)) }; },
            () => { let a=rand(1,9),b=rand(1,9); return { text:`比较大小：${a} ○ ${b}`, type:'choice', answer:a>b?'>':(a<b?'<':'='), options:['>','<','='] }; },
            () => { let a=rand(2,9),b=rand(2,5); return { text:`${a} 是由几个十和几个一组成？`, type:'choice', answer:`${Math.floor(a/10)}个十${a%10}个一`, options:[`${Math.floor(a/10)}个十${a%10}个一`,`${Math.floor(a/10)+1}个十${a%10}个一`,`${Math.floor(a/10)}个十${a%10+1}个一`] }; },
          ],
          // 2: 二年级
          [ () => { let a=rand(1,9),b=rand(1,9); return { text:`${a} × ${b} = ?`, type:'choice', answer:a*b, options:shuffleUnique([a*b, a*b+a, a*b-a].filter(n=>n>=0)) }; },
            () => { let b=rand(1,9),ans=rand(1,9),a=b*ans; return { text:`${a} ÷ ${b} = ?`, type:'choice', answer:ans, options:shuffleUnique([ans,ans+1,ans-1].filter(n=>n>0)) }; },
            () => { let a=rand(100,999),b=rand(10,99); return { text:`${a} + ${b} = ?`, type:'input', answer:a+b }; },
            () => { let a=rand(100,999),b=rand(10,a); return { text:`${a} - ${b} = ?`, type:'input', answer:a-b }; },
          ],
          // 3: 三年级
          [ () => { let a=rand(10,99),b=rand(2,9); return { text:`${a} × ${b} = ?`, type:'input', answer:a*b }; },
            () => { let a=rand(100,999),b=rand(10,99); return { text:`${a} + ${b} = ?`, type:'input', answer:a+b }; },
            () => { let a=rand(100,999),b=rand(10,99); return { text:`${a} - ${b} = ?`, type:'input', answer:a-b }; },
            () => { let a=rand(10,99),b=rand(2,9); return { text:`${a} ÷ ${b} 商几余几？`, type:'input', answer:Math.floor(a/b)+'余'+a%b }; },
          ],
          // 4: 四年级
          [ () => { let a=rand(1000,9999),b=rand(100,9999); let op=pick(['+','-']); let ans=op=='+'?a+b:a-b; return { text:`${a} ${op} ${b} = ?`, type:'input', answer:ans }; },
            () => { let a=rand(10,99),b=rand(10,99); return { text:`${a} × ${b} = ?`, type:'input', answer:a*b }; },
            () => { let a=rand(10,99),b=rand(2,9); return { text:`${a} ÷ ${b} = ? (保留两位小数)`, type:'input', answer:(a/b).toFixed(2) }; },
            () => { let a=rand(2,9),b=rand(2,9),c=rand(2,5); return { text:`${a} × ${b} + ${c} = ?`, type:'input', answer:a*b+c }; },
          ],
          // 5: 五年级
          [ () => { let a=(rand(10,99)/10).toFixed(1),b=(rand(10,99)/10).toFixed(1); let op=pick(['+','-','×']); let ans; if(op=='+')ans=(parseFloat(a)+parseFloat(b)).toFixed(2); else if(op=='-')ans=(parseFloat(a)-parseFloat(b)).toFixed(2); else ans=(parseFloat(a)*parseFloat(b)).toFixed(2); return { text:`${a} ${op} ${b} = ?`, type:'input', answer:ans }; },
            () => { let a=rand(2,9),b=rand(2,9),c=rand(2,9); return { text:`${a} × (${b} + ${c}) = ?`, type:'input', answer:a*(b+c) }; },
            () => { let a=rand(2,9),b=rand(2,9),c=rand(2,5); return { text:`${a} × ${b} - ${c} = ?`, type:'input', answer:a*b-c }; },
            () => { let n=rand(10,99); return { text:`${n} 是质数还是合数？`, type:'choice', answer:isPrime(n)?'质数':'合数', options:['质数','合数'] }; },
          ],
          // 6: 六年级
          [ () => { let a=rand(2,9),b=rand(2,9); return { text:`${a}² = ?`, type:'input', answer:a*a }; },
            () => { let a=rand(2,9),b=rand(2,9); return { text:`${a}³ = ?`, type:'input', answer:a*a*a }; },
            () => { let a=rand(10,99),b=rand(1,9); return { text:`${a} ÷ ${b} = ? (保留三位小数)`, type:'input', answer:(a/b).toFixed(3) }; },
            () => { let a=rand(2,9),b=rand(2,9),c=rand(2,9); return { text:`${a} × ${b} ÷ ${c} = ? (保留两位小数)`, type:'input', answer:(a*b/c).toFixed(2) }; },
          ]
        ],
        geometry: [
          [ () => { let s=pick(['圆形','正方形','三角形']); return { text:`下面哪个是${s}？`, type:'choice', answer:s, options:[s,'长方形','梯形'] }; },
            () => { let a=rand(5,15),b=rand(1,5); return { text:`铅笔长${a}厘米，橡皮长${b}厘米，一共多长？`, type:'choice', answer:a+b, options:shuffleUnique([a+b,a+b+1,a+b-1]) }; },
          ],
          [ () => { let a=rand(3,8),b=rand(3,8); return { text:`长方形长${a}宽${b}，周长？`, type:'input', answer:(a+b)*2 }; },
            () => { let a=rand(3,8); return { text:`正方形边长${a}，周长？`, type:'input', answer:a*4 }; },
          ],
          [ () => { let a=rand(3,8),b=rand(3,8); return { text:`长方形长${a}宽${b}，面积？`, type:'input', answer:a*b }; },
            () => { let a=rand(3,8); return { text:`正方形边长${a}，面积？`, type:'input', answer:a*a }; },
          ],
          [ () => { let a=rand(3,8); return { text:`正方体棱长${a}，体积？`, type:'input', answer:a*a*a }; },
            () => { let a=rand(3,8),b=rand(3,8),c=rand(3,8); return { text:`长方体${a}×${b}×${c}，体积？`, type:'input', answer:a*b*c }; },
            () => { let a=rand(1,8)*10; return { text:`角${a}°的补角是？`, type:'input', answer:180-a }; },
          ],
          [ () => { let r=rand(2,5); return { text:`圆半径${r}，周长(π≈3.14)`, type:'input', answer:(2*3.14*r).toFixed(2) }; },
            () => { let r=rand(2,5); return { text:`圆半径${r}，面积(π≈3.14)`, type:'input', answer:(3.14*r*r).toFixed(2) }; },
          ],
          [ () => { let a=rand(3,8),b=rand(3,8); return { text:`三角形底${a}高${b}，面积？`, type:'input', answer:(a*b/2).toFixed(1) }; },
            () => { let a=rand(3,8),b=rand(3,8); return { text:`梯形上底${a}下底${b}高${rand(3,6)}，面积？`, type:'input', answer:((a+b)*rand(3,6)/2).toFixed(1) }; },
          ],
          [ () => { let r=rand(2,5); return { text:`圆柱半径${r}高${rand(5,10)}，体积(π≈3.14)`, type:'input', answer:(3.14*r*r*rand(5,10)).toFixed(2) }; },
            () => { let r=rand(2,5); return { text:`圆锥半径${r}高${rand(5,10)}，体积(π≈3.14)`, type:'input', answer:(3.14*r*r*rand(5,10)/3).toFixed(2) }; },
          ]
        ],
        fraction: [
          [ () => genArith(0) ],
          [ () => genArith(1) ],
          [ () => genArith(2) ],
          [ () => { let d=rand(2,6),n=rand(1,d-1); return { text:`阴影占整体的几分之几？`, image: '⬛'.repeat(n)+'⬜'.repeat(d-n), type:'choice', answer:`${n}/${d}`, options:[`${n}/${d}`,`${d-n}/${d}`,`${n+1}/${d}`] }; },
            () => { let d=rand(2,6),n1=rand(1,d-1),n2=rand(1,d-1); return { text:`${n1}/${d} + ${n2}/${d} = ?`, type:'choice', answer:`${n1+n2}/${d}`, options:[`${n1+n2}/${d}`,`${n1+n2+1}/${d}`,`${n1+n2-1}/${d}`] }; },
          ],
          [ () => { let d=rand(3,8),n1=rand(1,d-1),n2=rand(1,n1); return { text:`${n1}/${d} - ${n2}/${d} = ?`, type:'choice', answer:`${n1-n2}/${d}`, options:[`${n1-n2}/${d}`,`${n1-n2+1}/${d}`,`${n1-n2-1}/${d}`] }; },
            () => { let a=rand(1,3),b=rand(2,4),c=rand(1,3),d=rand(2,4); return { text:`${a}/${b} + ${c}/${d} = ? (通分)`, type:'input', answer:((a*d + c*b)/(b*d)).toFixed(2) }; },
          ],
          [ () => { let a=rand(1,5),b=rand(2,6),c=rand(1,5),d=rand(2,6); return { text:`${a}/${b} × ${c}/${d} = ?`, type:'input', answer:`${a*c}/${b*d}` }; },
            () => { let a=rand(1,5),b=rand(2,6),c=rand(1,5),d=rand(2,6); return { text:`${a}/${b} ÷ ${c}/${d} = ?`, type:'input', answer:`${a*d}/${b*c}` }; },
          ],
          [ () => { let dec=(rand(1,99)/100).toFixed(2); return { text:`小数${dec}化为分数(分母100)`, type:'input', answer:`${Math.round(dec*100)}/100` }; },
            () => { let num=rand(1,99),den=100; return { text:`${num}/${den} 化为小数`, type:'input', answer:(num/den).toFixed(2) }; },
          ]
        ],
        word: [
          [ () => { let a=rand(2,5),b=rand(1,3); return { text:`树上有${a}只鸟，飞走${b}只，还剩几只？`, type:'choice', answer:a-b, options:shuffleUnique([a-b,a-b+1,a-b-1].filter(n=>n>=0)) }; },
            () => { let a=rand(2,6),b=rand(2,5); return { text:`桌上有${a}个苹果，吃了一些还剩${b}个，吃了几个？`, type:'choice', answer:a-b, options:shuffleUnique([a-b,a-b+1,a-b-1]) }; },
          ],
          [ () => { let a=rand(3,9),b=rand(2,5); return { text:`每排${a}棵树，种${b}排，共几棵？`, type:'input', answer:a*b }; },
            () => { let a=rand(2,8),b=rand(2,6); return { text:`小明有${a}元，铅笔${b}元一支，能买几支？`, type:'input', answer:Math.floor(a/b) }; },
          ],
          [ () => { let total=rand(20,50),days=rand(2,5); return { text:`一本书${total}页，${days}天看完，平均每天？`, type:'input', answer:Math.floor(total/days) }; },
            () => { let p=rand(5,15),n=rand(2,8); return { text:`钢笔${p}元，买${n}支付100元，找回？`, type:'input', answer:100-p*n }; },
          ],
          [ () => { let v=rand(30,80),t=rand(2,5); return { text:`汽车速度${v}千米/时，${t}小时行？`, type:'input', answer:v*t }; },
            () => { let total=rand(50,200),p=rand(10,40); return { text:`总价${total}元，单价${p}元，数量？`, type:'input', answer:Math.floor(total/p) }; },
          ],
          [ () => { let a=rand(10,30),b=rand(2,8); return { text:`甲有${a}个，乙比甲多${b}个，乙有几个？`, type:'input', answer:a+b }; },
            () => { let a=rand(20,50),b=rand(10,20); return { text:`苹果${a}个，梨比苹果少${b}个，梨几个？`, type:'input', answer:a-b }; },
          ],
          [ () => { let total=rand(100,500),p=rand(10,90); return { text:`${total}的${p}%是多少？`, type:'input', answer:Math.round(total*p/100) }; },
            () => { let part=rand(20,80),total=rand(100,200); return { text:`${part}是${total}的百分之几？`, type:'input', answer:(part/total*100).toFixed(0)+'%' }; },
          ],
          [ () => { let a=rand(2,6),b=rand(2,6); return { text:`比例 3:4 = ${a}:?`, type:'input', answer:(a*4/3).toFixed(1) }; },
            () => { let a=rand(10,50),b=rand(2,5); return { text:`按${a}:${b}分配${a+b*10}元，大份多少？`, type:'input', answer:Math.round((a+b*10)*a/(a+b)) }; },
          ]
        ],
        logic: [
          [ () => { let a=rand(2,5),b=rand(2,5),c=rand(2,5); return { text:`找规律：${a}, ${a+b}, ${a+b+c}, ?`, type:'input', answer:a+b+c+c }; },
            () => { let a=rand(2,5); return { text:`△ + △ = ${a*2}，△ = ?`, type:'input', answer:a }; },
          ],
          [ () => { let a=rand(2,9),b=rand(2,9); return { text:`如果 ☆ = ${a}，那么 ☆ + ${b} = ?`, type:'input', answer:a+b }; },
            () => { let a=rand(2,9),b=rand(2,9); return { text:`□ + □ = ${a*2}，□ = ?`, type:'input', answer:a }; },
          ],
          [ () => { let a=rand(2,9),b=rand(2,9); return { text:`○ × ○ = ${a*a}，○ = ?`, type:'input', answer:a }; },
            () => { let a=rand(2,6),b=rand(2,6); return { text:`如果 A=${a}, B=${b}, A+B=?`, type:'input', answer:a+b }; },
          ],
          [ () => { let a=rand(2,5),b=rand(2,5); return { text:`鸡兔同笼，头${a+b}个，脚${a*2+b*4}只，兔几只？`, type:'input', answer:b }; },
            () => { let age=rand(5,12); return { text:`小明今年${age}岁，爸爸年龄是小明的3倍多5岁，爸爸几岁？`, type:'input', answer:age*3+5 }; },
          ],
          [ () => { let n=rand(10,30); return { text:`数列 1,1,2,3,5,8...第${n}项？(斐波那契)`, type:'input', answer:fib(n) }; },
            () => { let a=rand(2,6); return { text:`△ + □ = ${a+2}，△ - □ = ${a-2}，△=?`, type:'input', answer:a }; },
          ],
          [ () => { let a=rand(2,9),b=rand(2,9); return { text:`如果 x + ${b} = ${a+b}，x=?`, type:'input', answer:a }; },
            () => { let a=rand(2,9); return { text:`2x = ${a*2}，x=?`, type:'input', answer:a }; },
          ],
          [ () => { let a=rand(2,5); return { text:`|x| = ${a}，x 可能为？(填正数)`, type:'input', answer:a }; },
            () => { let a=rand(2,9); return { text:`√x = ${a}，x=?`, type:'input', answer:a*a }; },
          ]
        ],
        measure: [
          [ () => { let a=rand(3,10); return { text:`铅笔长 ${a} 厘米，合多少毫米？`, type:'input', answer:a*10 }; },
            () => { let a=rand(1,5); return { text:`1米 = ? 厘米`, type:'choice', answer:100, options:[10,100,1000] }; },
          ],
          [ () => { let a=rand(1,5); return { text:`1千克 = ? 克`, type:'choice', answer:1000, options:[100,1000,10000] }; },
            () => { let a=rand(2,8); return { text:`妈妈买了${a}千克苹果，合多少克？`, type:'input', answer:a*1000 }; },
          ],
          [ () => { let a=rand(1,5); return { text:`1升 = ? 毫升`, type:'choice', answer:1000, options:[10,100,1000] }; },
            () => { let a=rand(2,6); return { text:`水壶容量${a}升，合多少毫升？`, type:'input', answer:a*1000 }; },
          ],
          [ () => { let a=rand(10,60); return { text:`${a}分钟 = ? 小时?分钟`, type:'input', answer:Math.floor(a/60)+'小时'+a%60+'分钟' }; },
            () => { let a=rand(1,3); return { text:`${a}小时 = ? 分钟`, type:'input', answer:a*60 }; },
          ],
          [ () => { let a=rand(2,10); return { text:`正方形边长${a}米，周长多少厘米？`, type:'input', answer:a*4*100 }; },
            () => { let a=rand(2,8); return { text:`长方形长${a}米宽${rand(2,6)}米，面积多少平方分米？`, type:'input', answer:a*rand(2,6)*100 }; },
          ],
          [ () => { let a=rand(2,8); return { text:`速度${a}米/秒，10秒跑多少米？`, type:'input', answer:a*10 }; },
            () => { let a=rand(10,50); return { text:`${a}平方千米 = ? 公顷`, type:'input', answer:a*100 }; },
          ],
          [ () => { let a=rand(2,9); return { text:`1立方米 = ? 立方分米`, type:'choice', answer:1000, options:[100,1000,10000] }; },
            () => { let a=rand(2,6); return { text:`长方体${a}×${rand(3,6)}×${rand(2,4)}米，体积多少立方厘米？`, type:'input', answer:a*rand(3,6)*rand(2,4)*1000000 }; },
          ]
        ]
      };

      function genArith(g) { return generators.arithmetic[g][rand(0, generators.arithmetic[g].length-1)](); }
      function genGeom(g) { return generators.geometry[g][rand(0, generators.geometry[g].length-1)](); }
      function genFrac(g) { return generators.fraction[g][rand(0, generators.fraction[g].length-1)](); }
      function genWord(g) { return generators.word[g][rand(0, generators.word[g].length-1)](); }
      function genLogic(g) { return generators.logic[g][rand(0, generators.logic[g].length-1)](); }
      function genMeasure(g) { return generators.measure[g][rand(0, generators.measure[g].length-1)](); }

      const genMap = {
        arithmetic: genArith,
        geometry: genGeom,
        fraction: genFrac,
        word: genWord,
        logic: genLogic,
        measure: genMeasure
      };

      function generateQuestion() {
        feedback.value = '';
        userInput.value = '';
        const grade = currentGrade.value;
        const game = currentGame.value;
        let q = genMap[game](grade);
        if (q.type === 'choice' && q.options) {
          // 确保选项包含答案
          if (!q.options.includes(q.answer)) {
            q.options.push(q.answer);
          }
          q.options = shuffleUnique(q.options).slice(0,4);
        }
        question.value = q;
      }

      function answer(userAnswer) {
        if (!question.value) return;
        const correct = question.value.answer;
        let isCorrect = false;
        if (typeof correct === 'string' && typeof userAnswer === 'string') {
          isCorrect = correct.trim().toLowerCase() === userAnswer.trim().toLowerCase();
        } else {
          isCorrect = Math.abs(Number(userAnswer) - Number(correct)) < 0.001;
        }
        if (isCorrect) {
          feedback.value = '✅ 太棒了！回答正确！';
          stars.value += 1 + Math.floor(currentGrade.value / 2);
          plantProgress[currentGame.value] += 25;
          if (plantProgress[currentGame.value] >= 100) {
            plantProgress[currentGame.value] = 0;
            showToast('🌱 植物升级了！获得额外星星！');
            stars.value += 3;
          }
          showToast('答对了！');
          setTimeout(() => { generateQuestion(); }, 800);
        } else {
          feedback.value = '❌ 再想想吧，试试看！';
          showToast('不对哦，再试一次～');
        }
      }

      function shuffleUnique(arr) {
        let set = [...new Set(arr)];
        return set.sort(() => Math.random() - 0.5);
      }

      function isPrime(n) {
        if (n <= 1) return false;
        for (let i = 2; i <= Math.sqrt(n); i++) if (n % i === 0) return false;
        return true;
      }

      function fib(n) {
        let a = 1, b = 1;
        for (let i = 3; i <= n; i++) { let c = a + b; a = b; b = c; }
        return b;
      }

      return {
        gradeNames, currentGrade, prevGrade, nextGrade,
        stars, gardenLevel, toast, showToast,
        plantProgress,
        view, currentGame, gameTitle,
        openGame, generateQuestion, question, feedback, userInput, answer
      };
    }
  }).mount('#app');
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>拾光驿站 · 详情</title>
    <style>
        /* 样式与之前极简风格相同，可复用 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1e1e2f;
            padding: 2rem 1rem;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #1e1e2f;
            text-decoration: none;
            border-bottom: 1px dotted #e0e4e8;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .daily-summary {
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .date {
            font-size: 0.85rem;
            color: #8e8e9e;
        }
        .easter-egg {
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-top: 0.5rem;
        }
        .section {
            margin: 2rem 0;
            border-top: 1px solid #f0f2f5;
            padding-top: 1rem;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: inline-block;
            border-bottom: 1px solid #e0e4e8;
            padding-bottom: 0.2rem;
        }
        .song-item, .zaobao-item, .one-article, .one-photo, .one-qa, .novel-item {
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #f0f2f5;
        }
        .song-name {
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .song-artist, .song-album, .zaobao-source, .one-author {
            font-size: 0.85rem;
            color: #5b5b6e;
        }
        .song-recommendation, .zaobao-summary-text, .one-content-text, .one-desc, .one-answer {
            font-size: 0.9rem;
            color: #7a7a8c;
            font-style: italic;
            margin-top: 0.2rem;
        }
        .fun-item {
            display: flex;
            gap: 0.8rem;
            margin: 0.8rem 0;
        }
        .fun-icon { font-size: 1.2rem; }
        .fun-text { flex:1; font-size:0.9rem; color:#5b5b6e; }
        .novel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .novel-title {
            font-size: 1.2rem;
            font-weight: 500;
        }
        .speak-btn, .immerse-btn, .audio-play-btn {
            background: none;
            border: 1px solid #e0e4e8;
            border-radius: 30px;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #b0b0c0;
            border-top: 1px solid #f0f2f5;
            padding-top: 1.5rem;
        }
        .loader {
            text-align: center;
            padding: 2rem;
            color: #b0b0c0;
        }
        .error-message {
            text-align: center;
            color: #e74c3c;
            margin: 2rem 0;
        }
        @media (max-width: 600px) {
            .daily-summary { font-size: 1.3rem; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← 返回主页</a>
    <div class="hero">
        <div class="daily-summary" id="daily-summary"></div>
        <div class="date" id="date"></div>
        <div class="easter-egg" id="easter-egg"></div>
    </div>
    <div id="loader" class="loader">⏳ 加载中...</div>
    <div id="content" style="display:none;"></div>
    <div class="footer">
        <a href="/history.html" style="color:#1e1e2f; text-decoration:none; border-bottom:1px dotted #e0e4e8;">📜 历史回顾</a>
        <span style="margin:0 0.5rem">·</span>
        <a href="/" style="color:#1e1e2f; text-decoration:none; border-bottom:1px dotted #e0e4e8;">🏠 首页</a>
    </div>
</div>

<script>
    // 辅助函数（与之前相同）
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
    function countWords(text) { return (text.match(/[\u4e00-\u9fa5]/g)||[]).length + (text.match(/[a-zA-Z]+/g)||[]).length; }
    function formatStats(words) { return `${words} 字 · 约 ${Math.ceil(words/250)} 分钟阅读`; }
    function getEasterEgg(dateStr) { const eggs=['✨ 今日彩蛋：再读一遍，或许会发现隐藏的温柔。','🍂 今日彩蛋：时光不语，静待花开。','📖 今日彩蛋：每一篇小说都是平行宇宙的你。','🎵 今日彩蛋：未知旋律里藏着昨天的故事。','💭 今日彩蛋：散落的诗行，是某人的心事。','🌟 今日彩蛋：你正在阅读的，是宇宙送给你的礼物。','🌙 今日彩蛋：此刻的宁静，胜过万语千言。','☕ 今日彩蛋：读一段文字，饮一杯暖茶。']; let hash=0; let seed=dateStr||new Date().toDateString(); for(let i=0;i<seed.length;i++) hash=((hash<<5)-hash)+seed.charCodeAt(i); return eggs[Math.abs(hash)%eggs.length]; }
    function copyToClipboard(text) { navigator.clipboard.writeText(text).then(()=>alert('已复制')).catch(()=>alert('复制失败')); }
    function captureCard(element, filename) { if(typeof html2canvas==='undefined'){alert('截图库未加载');return;} html2canvas(element,{scale:2}).then(canvas=>{let a=document.createElement('a');a.download=filename;a.href=canvas.toDataURL();a.click();}).catch(err=>alert('截图失败')); }
    let currentUtterance=null;
    function speakText(text){ if(!window.speechSynthesis){alert('不支持语音朗读');return;} if(currentUtterance)window.speechSynthesis.cancel(); let utterance=new SpeechSynthesisUtterance(text); utterance.lang='zh-CN'; currentUtterance=utterance; window.speechSynthesis.speak(utterance); }
    function openImmerse(html){ let modal=document.getElementById('immerse-modal'); if(modal){ document.getElementById('immerse-content').innerHTML=html; modal.classList.add('active'); } }
    function closeImmerse(){ document.getElementById('immerse-modal').classList.remove('active'); }

    // 解析URL参数
    const urlParams = new URLSearchParams(window.location.search);
    const dateParam = urlParams.get('date');   // 用于历史回顾
    const typeParam = urlParams.get('type');   // 用于模块过滤：songs, zaobao, one, novels
    let dataUrl;
    if (dateParam) {
        const [y,m,d] = dateParam.split('-');
        dataUrl = `/data/history/${y}/${m}/${d}.json`;
    } else {
        dataUrl = '/data/daily.json';
    }

    fetch(dataUrl + '?t=' + Date.now())
        .then(res => {
            if (!res.ok) throw new Error('数据不存在');
            return res.json();
        })
        .then(data => {
            document.getElementById('loader').style.display = 'none';
            const contentDiv = document.getElementById('content');
            contentDiv.style.display = 'block';
            const displayDate = dateParam || data.date;
            document.getElementById('date').innerHTML = displayDate;
            document.getElementById('daily-summary').innerHTML = data.summary || '';
            document.getElementById('easter-egg').innerHTML = getEasterEgg(displayDate);

            // 根据 type 决定显示哪些模块
            let modules = [];
            if (typeParam === 'songs') modules = ['songs'];
            else if (typeParam === 'zaobao') modules = ['zaobao'];
            else if (typeParam === 'one') modules = ['one'];
            else if (typeParam === 'novels') modules = ['novels'];
            else modules = ['songs', 'sentence', 'article', 'zaobao', 'fun', 'one', 'novels']; // 全部

            let html = '';
            // 歌曲模块
            if (modules.includes('songs') && data.songs && data.songs.length) {
                html += `<div class="section" id="song-section"><div class="section-title">🎵 未知旋律</div><div id="songs-list"></div></div>`;
            }
            // 散落诗行
            if (modules.includes('sentence') && data.sentence) {
                html += `<div class="section" id="sentence-section"><div class="section-title">💭 散落诗行</div><div class="sentence-content" id="sentence-content"></div><div class="sentence-from" id="sentence-from"></div><div class="meaning" id="sentence-meaning"></div><div style="display:flex; gap:0.5rem; margin-top:0.5rem;"><button class="speak-btn" id="copy-sentence-btn">📋 复制</button><button class="speak-btn" id="share-sentence-btn">📸 截图</button></div></div>`;
            }
            // 墨香盲盒
            if (modules.includes('article') && data.article) {
                html += `<div class="section" id="article-section"><div class="section-title">📖 墨香盲盒</div><div class="article-title" id="article-title"></div><div class="article-desc" id="article-desc"></div><div class="article-author" id="article-author"></div><a id="article-link" href="#" target="_blank" style="display:inline-block; margin-top:0.5rem;">🔗 阅读全文</a><div class="meaning" id="article-meaning"></div><div class="stats" id="article-stats"></div></div>`;
            }
            // 早报
            if (modules.includes('zaobao') && data.zaobao && data.zaobao.news && data.zaobao.news.length) {
                html += `<div class="section" id="zaobao-section"><div class="section-title">📰 每日早报</div><div id="zaobao-weiyu" class="zaobao-summary-text"></div><div><button id="zaobao-play-btn" class="audio-play-btn" style="display:none;">🔊 语音播报</button><audio id="zaobao-audio-player"></audio></div><div id="zaobao-list"></div><div id="zaobao-date" class="stats"></div></div>`;
            }
            // 笑话毒鸡汤
            if (modules.includes('fun') && (data.soul || data.joke)) {
                html += `<div class="section" id="fun-section"><div class="section-title">😄 每日一笑 · 🥀 心灵毒鸡汤</div><div id="joke-content"></div><div id="soul-content"></div></div>`;
            }
            // ONE
            if (modules.includes('one') && data.one) {
                html += `<div class="section" id="one-section"><div class="section-title">📖 ONE · 一个</div><div id="one-content"></div></div>`;
            }
            // 小说
            if (modules.includes('novels') && data.novels && data.novels.length) {
                html += `<div class="section" id="novel-section"><div class="section-title">📚 虚构抽屉</div><div id="novels-container"></div></div>`;
            }

            contentDiv.innerHTML = html;

            // 填充各个模块（略，可复用之前代码）
            // 由于代码量较大，这里仅示意，实际需要完整填充函数
            // 此处我们提供完整的填充逻辑（基于之前代码精简）
            // 为节省篇幅，建议将填充逻辑封装成函数，按需调用

            // 歌曲模块填充
            if (modules.includes('songs') && data.songs && data.songs.length) {
                const listDiv = document.getElementById('songs-list');
                listDiv.innerHTML = '';
                data.songs.forEach(s => {
                    const playLink = s.id ? `https://music.163.com/#/song?id=${s.id}` : (s.name && s.artist ? `https://music.163.com/#/search/m/?s=${encodeURIComponent(s.name+' '+s.artist)}` : null);
                    listDiv.innerHTML += `<div class="song-item"><div class="song-name">${escapeHtml(s.name)}${playLink?`<a href="${playLink}" target="_blank" class="play-icon" style="text-decoration:none;">🎧</a>`:''}</div><div class="song-artist">${escapeHtml(s.artist)}</div><div class="song-album">${escapeHtml(s.album||'')}</div><div class="song-recommendation">${escapeHtml(s.recommendation||'')}</div></div>`;
                });
            }
            // 散落诗行
            if (modules.includes('sentence') && data.sentence) {
                document.getElementById('sentence-content').innerHTML = `「${escapeHtml(data.sentence.content)}」`;
                document.getElementById('sentence-from').innerHTML = data.sentence.from ? `—— ${escapeHtml(data.sentence.from)}` : '';
                if(data.sentence.meaning) document.getElementById('sentence-meaning').innerHTML = escapeHtml(data.sentence.meaning);
                document.getElementById('copy-sentence-btn').onclick = () => copyToClipboard(data.sentence.content);
                document.getElementById('share-sentence-btn').onclick = () => captureCard(document.getElementById('sentence-section'), `拾光驿站_${displayDate}.png`);
            }
            // 墨香盲盒
            if (modules.includes('article') && data.article) {
                document.getElementById('article-title').innerHTML = escapeHtml(data.article.title);
                const articleText = data.article.description || data.article.content || '';
                document.getElementById('article-desc').innerHTML = escapeHtml(articleText);
                document.getElementById('article-author').innerHTML = data.article.author ? `—— ${escapeHtml(data.article.author)}` : '';
                if(data.article.url) document.getElementById('article-link').href = data.article.url;
                else document.getElementById('article-link').style.display = 'none';
                if(data.article.meaning) document.getElementById('article-meaning').innerHTML = escapeHtml(data.article.meaning);
                document.getElementById('article-stats').innerHTML = formatStats(countWords(articleText));
            }
            // 早报
            if (modules.includes('zaobao') && data.zaobao && data.zaobao.news && data.zaobao.news.length) {
                document.getElementById('zaobao-weiyu').innerHTML = data.zaobao.weiyu ? escapeHtml(data.zaobao.weiyu) : (data.zaobao.summary ? escapeHtml(data.zaobao.summary) : '');
                const audio = data.zaobao.audio, btn = document.getElementById('zaobao-play-btn'), player = document.getElementById('zaobao-audio-player');
                if(audio && btn && player){
                    player.src = audio; btn.style.display = 'inline-block';
                    btn.onclick = () => { if(player.paused){ player.play(); btn.textContent = '⏸️ 暂停'; } else { player.pause(); btn.textContent = '🔊 语音播报'; } };
                    player.onended = () => btn.textContent = '🔊 语音播报';
                }
                const listDiv = document.getElementById('zaobao-list');
                const uniqueNews = [], seen = new Set();
                for(let item of data.zaobao.news) if(!seen.has(item.title)){ seen.add(item.title); uniqueNews.push(item); }
                listDiv.innerHTML = '';
                uniqueNews.slice(0,15).forEach(item => {
                    listDiv.innerHTML += `<div class="zaobao-item"><div><span class="zaobao-title">${escapeHtml(item.title)}</span><span class="zaobao-source">${escapeHtml(item.source||'')}</span></div><div class="zaobao-summary-text">${escapeHtml(item.summary||'')}</div></div>`;
                });
                if(data.zaobao.date) document.getElementById('zaobao-date').innerHTML = data.zaobao.date;
            }
            // 笑话毒鸡汤
            if (modules.includes('fun') && (data.soul || data.joke)) {
                if(data.joke) document.getElementById('joke-content').innerHTML = `<div class="fun-item"><div class="fun-icon">😂</div><div class="fun-text">${escapeHtml(data.joke)}</div></div>`;
                if(data.soul) document.getElementById('soul-content').innerHTML = `<div class="fun-item"><div class="fun-icon">🥀</div><div class="fun-text">${escapeHtml(data.soul)}</div></div>`;
            }
            // ONE
            if (modules.includes('one') && data.one) {
                let oneHtml = '';
                if(data.one.article && data.one.article.content) oneHtml += `<div class="one-article"><h3>📝 文章</h3><div class="one-title">${escapeHtml(data.one.article.title)}</div><div class="one-author">${escapeHtml(data.one.article.author||'')}</div><div class="one-content-text">${escapeHtml(data.one.article.content).replace(/\n/g,'<br>')}</div></div>`;
                if(data.one.photo && data.one.photo.image) oneHtml += `<div class="one-photo"><h3>📷 摄影</h3><img src="${data.one.photo.image}" alt="${escapeHtml(data.one.photo.title||'')}" style="max-width:100%; border-radius:8px;"><div class="one-title">${escapeHtml(data.one.photo.title||'')}</div><div class="one-author">${escapeHtml(data.one.photo.author||'')}</div><div class="one-desc">${escapeHtml(data.one.photo.description||'').replace(/\n/g,'<br>')}</div></div>`;
                if(data.one.question && data.one.question.question) oneHtml += `<div class="one-qa"><h3>💬 问答</h3><div class="one-question">${escapeHtml(data.one.question.question)}</div><div class="one-answer">${escapeHtml(data.one.question.answer||'').replace(/\n/g,'<br>')}</div>${data.one.question.author?`<div class="one-author">—— ${escapeHtml(data.one.question.author)}</div>`:''}</div>`;
                document.getElementById('one-content').innerHTML = oneHtml;
            }
            // 小说
            if (modules.includes('novels') && data.novels && data.novels.length) {
                let novelsHtml = '';
                const fallbackReviews = ['这篇小说像一杯温茶，慢慢品出人生滋味。','虚构的世界里，藏着真实的情感。','每一段文字都是时光的琥珀。','读完后，心里某个角落被轻轻触动。','故事虽短，余韵悠长。','适合在夜深人静时再读一遍。','像风一样轻，却留下痕迹。'];
                data.novels.forEach(n => {
                    const title = n.title || '无题', content = (n.content||'').replace(/\\n/g,'\n'), paragraphs = content.split(/\n\s*\n/).filter(p=>p.trim());
                    const stats = formatStats(countWords(paragraphs.join('\n\n')));
                    novelsHtml += `<div class="novel-item"><div class="novel-header"><div class="novel-title">${escapeHtml(title)}</div><div><button class="speak-btn" onclick="speakText(\`${escapeHtml(paragraphs.join('\n\n'))}\`)">🔊 朗读</button><button class="immerse-btn" onclick="openImmerse('<div style=\'font-size:1.2rem; margin-bottom:1rem;\'>${escapeHtml(title)}</div><div>${paragraphs.map(p=>`<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('')}</div><div>${stats}</div>')">🔍 沉浸</button></div></div><div class="novel-content">${paragraphs.map(p=>`<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('')}</div><div class="novel-stats">${stats}</div><div class="ai-review">${escapeHtml(n.review||fallbackReviews[Math.floor(Math.random()*fallbackReviews.length)])}</div></div>`;
                });
                document.getElementById('novels-container').innerHTML = novelsHtml;
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('loader').innerHTML = `<div class="error-message">❌ 加载失败: ${err.message}<br>请检查网络或稍后重试</div>`;
        });
</script>

<!-- 沉浸模态框 -->
<div id="immerse-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; visibility:hidden; opacity:0; transition:0.2s; display:flex; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:16px; max-width:90%; max-height:90%; overflow:auto; padding:1.5rem; color:#1e1e2f;">
        <button onclick="closeImmerse()" style="float:right; background:none; border:none; font-size:1.2rem;">✕</button>
        <div id="immerse-content"></div>
    </div>
</div>
</body>
</html>

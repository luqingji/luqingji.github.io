<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾光驿站 · 历史详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=LXGW+WenKai&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* 样式与主页完全相同，此处复用 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(145deg, #f9f3e8 0%, #d9e2f0 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #2c3e50;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            color: #e0e0e0;
        }
        body.dark-mode .card {
            background: rgba(30,40,50,0.85);
            border-color: rgba(255,255,255,0.1);
            color: #e0e0e0;
        }
        body.dark-mode .card h2 { color: #b0c4de; border-left-color: #4f9da6; }
        body.dark-mode .song-comment { background: rgba(100,80,70,0.5); color: #f0b27a; }
        body.dark-mode .sentence-content { color: #f0f0f0; }
        body.dark-mode .sentence-from { color: #a0b0c0; }
        body.dark-mode .article-title, body.dark-mode .novel-title { color: #d0e0f0; }
        body.dark-mode .article-desc, body.dark-mode .novel-content { color: #ccc; }
        body.dark-mode .meaning { background: rgba(50,70,90,0.7); color: #e0e0e0; border-left-color: #4f9da6; }
        body.dark-mode .footer { background: rgba(20,30,40,0.5); color: #aaa; }
        body.dark-mode .back-link { color: #4f9da6; }
        body.dark-mode .day-card { background: rgba(40,50,60,0.7); color: #e0e0e0; border-color: rgba(255,255,255,0.1); }
        body.dark-mode .day-card:hover { background: rgba(60,80,100,0.9); }
        body.dark-mode .stats { color: #9aaebf; border-top-color: rgba(255,255,255,0.1); }
        body.dark-mode .theme-toggle { background: rgba(0,0,0,0.5); color: #eee; }
        body.dark-mode .speak-btn { background: rgba(255,255,255,0.2); color: #ddd; border-color: rgba(255,255,255,0.3); }
        body.dark-mode .speak-btn:hover { background: rgba(255,255,255,0.3); }
        body.dark-mode .immerse-btn { background: rgba(255,255,255,0.2); color: #ddd; border-color: rgba(255,255,255,0.3); }
        body.dark-mode .immerse-btn:hover { background: rgba(255,255,255,0.3); }
        body.dark-mode .close-immerse { background: rgba(0,0,0,0.7); color: white; }

        .container { max-width: 750px; margin: 0 auto; position: relative; }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #4f9da6;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .hero .date {
            display: inline-block;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            font-size: 0.95rem;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .daily-summary {
            margin-top: 0.8rem;
            font-size: 1rem;
            color: #7f8c8d;
            font-style: italic;
            background: rgba(255,255,255,0.3);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            display: inline-block;
        }
        body.dark-mode .daily-summary {
            color: #c0d0e0;
            background: rgba(0,0,0,0.3);
        }
        .card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 20px 35px -8px rgba(0,20,30,0.15);
            border: 1px solid rgba(255,255,255,0.5);
            transition: transform 0.25s ease, background 0.3s;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .card:hover { transform: translateY(-5px); }
        .card h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            border-left: 5px solid #4f9da6;
            padding-left: 0.5rem;
            color: #1e3c43;
        }
        .song-container {
            display: flex;
            gap: 1.8rem;
            align-items: center;
        }
        .song-cover {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 12px 25px -8px rgba(0,0,0,0.2);
        }
        .song-info h3 { font-size: 1.8rem; font-weight: 600; }
        .song-info .artist { font-size: 1.2rem; color: #4f5e6b; }
        .song-info .album { font-size: 1rem; color: #6b7c8b; }
        .song-comment {
            font-style: italic;
            color: #bf6f5a;
            background: rgba(255,235,220,0.7);
            padding: 0.8rem 1rem;
            border-radius: 20px;
            margin-top: 1rem;
        }
        .sentence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .sentence-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            transition: background 0.2s;
            color: inherit;
        }
        .action-btn:hover {
            background: rgba(0,0,0,0.1);
        }
        body.dark-mode .action-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .sentence-content {
            font-size: 1.7rem;
            font-family: "LXGW WenKai", cursive;
            text-align: center;
            margin-bottom: 0.8rem;
        }
        .sentence-from {
            text-align: right;
            color: #6f8a9c;
            font-size: 1.1rem;
        }
        .article-title { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
        .article-desc { color: #2c3e50; line-height: 1.8; }
        .article-author { text-align: right; color: #6b7c8b; }

        /* 小说卡片样式（多篇） */
        .novels-container {
            margin-top: 1rem;
        }
        .novel-item {
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 1.5rem;
        }
        .novel-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .novel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .novel-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e3c43;
            border-left: 4px solid #bf6f5a;
            padding-left: 1rem;
            margin: 0;
        }
        .immerse-btn, .speak-btn {
            background: rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 0.3rem 0.8rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: inherit;
            margin-left: 0.5rem;
        }
        .immerse-btn:hover, .speak-btn:hover {
            background: rgba(0,0,0,0.2);
            transform: scale(0.98);
        }
        .novel-content {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #2c3e50;
            text-align: justify;
        }
        .novel-content p {
            margin-bottom: 1.2em;
            text-indent: 2em;
        }
        .novel-content p:last-child {
            margin-bottom: 0;
        }
        .novel-stats {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: right;
        }
        body.dark-mode .novel-stats {
            color: #9aaebf;
        }
        body.dark-mode .novel-item {
            border-bottom-color: rgba(255,255,255,0.1);
        }

        /* AI 一句话书评 */
        .ai-review {
            margin-top: 0.8rem;
            font-size: 0.95rem;
            color: #9b6b43;
            background: rgba(255,245,235,0.5);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border-left: 3px solid #bf6f5a;
            font-style: italic;
        }
        body.dark-mode .ai-review {
            background: rgba(80,60,50,0.5);
            color: #e0c0a0;
            border-left-color: #e0a070;
        }

        .stats {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: right;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 0.8rem;
        }

        .meaning {
            display: none;
            margin-top: 1.5rem;
            background: rgba(225,240,250,0.7);
            padding: 1.2rem 1.5rem;
            border-radius: 24px;
            font-style: italic;
            color: #1e3c43;
            border-left: 4px solid #4f9da6;
        }
        .footer {
            text-align: center;
            color: #5d737e;
            font-size: 0.9rem;
            margin-top: 2.5rem;
            padding: 1rem;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border-radius: 50px;
        }
        .loader {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #4f9da6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .go-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
            color: white;
            font-size: 1.5rem;
            border: none;
        }
        .go-top.visible { opacity: 1; }
        .go-top:hover { background: rgba(0,0,0,0.7); }
        body.dark-mode .go-top { background: rgba(255,255,255,0.2); color: #ccc; }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.8); }

        /* 沉浸式模态框 */
        .immerse-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .immerse-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .immerse-content {
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            background: rgba(30,30,30,0.95);
            border-radius: 32px;
            padding: 2rem;
            color: #eee;
            font-family: "Inter", sans-serif;
            line-height: 1.6;
        }
        .immerse-content .novel-title {
            color: #f0c0a0;
            border-left-color: #e0a070;
        }
        .immerse-content .novel-content {
            color: #ddd;
        }
        .immerse-content .novel-content p {
            text-indent: 2em;
        }
        .close-immerse {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1rem;
            color: white;
            z-index: 10001;
        }

        /* 彩蛋 */
        .easter-egg {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            color: #b87333;
            background: rgba(255,255,255,0.3);
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        body.dark-mode .easter-egg {
            color: #e0b080;
            background: rgba(0,0,0,0.3);
        }

        /* 歌单列表样式 */
        .songs-list {
            margin-top: 1rem;
        }
        .song-item {
            margin-bottom: 1rem;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            padding-bottom: 0.8rem;
        }
        .song-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .song-name {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .song-artist {
            font-size: 0.9rem;
            color: #4f5e6b;
        }
        .song-album {
            font-size: 0.85rem;
            color: #6b7c8b;
        }
        .song-recommendation {
            margin-top: 0.4rem;
            font-style: italic;
            color: #bf6f5a;
            font-size: 0.9rem;
        }
        body.dark-mode .song-artist,
        body.dark-mode .song-album {
            color: #aaa;
        }
        body.dark-mode .song-recommendation {
            color: #f0b27a;
        }
        body.dark-mode .song-item {
            border-bottom-color: rgba(255,255,255,0.1);
        }

        @media (max-width: 600px) {
            .song-container { flex-direction: column; text-align: center; }
            .song-cover { width: 150px; height: 150px; }
            .sentence-content { font-size: 1.4rem; }
            .novel-title { font-size: 1.6rem; }
            .novel-content { font-size: 1rem; }
            .theme-toggle { top: 10px; right: 10px; padding: 5px 12px; font-size: 0.8rem; }
            .speak-btn, .immerse-btn { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
            .daily-summary { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle">🌙 暗色模式</button>
    <div class="go-top" id="go-top">↑</div>
    <div class="toast" id="toast">已复制</div>

    <div class="container">
        <a href="/history.html" class="back-link">← 返回历史回顾</a>
        <div class="hero">
            <div class="date" id="date"></div>
            <div id="daily-summary" class="daily-summary"></div>
            <div id="easter-egg" class="easter-egg"></div>
        </div>
        <div id="loader" class="loader"></div>
        <div id="content" style="display: none;">
            <!-- 未知旋律卡片（歌单列表） -->
            <div class="card" id="song-card" style="display: none;">
                <h2>🎵 未知旋律</h2>
                <div id="songs-list" class="songs-list"></div>
            </div>

            <!-- 散落诗行卡片 -->
            <div class="card" id="sentence-card" style="display: none;">
                <div class="sentence-header">
                    <h2>💭 散落诗行</h2>
                    <div class="sentence-actions">
                        <button class="action-btn" id="copy-sentence-btn" title="复制句子">📋</button>
                        <button class="action-btn" id="share-sentence-btn" title="生成图片">📸</button>
                    </div>
                </div>
                <div class="sentence-content" id="sentence-content"></div>
                <div class="sentence-from" id="sentence-from"></div>
                <div class="meaning" id="sentence-meaning"></div>
            </div>

            <!-- 墨香盲盒卡片 -->
            <div class="card" id="article-card" style="display: none;">
                <h2>📖 墨香盲盒</h2>
                <div class="article-title" id="article-title"></div>
                <div class="article-desc" id="article-desc"></div>
                <div class="article-author" id="article-author"></div>
                <a id="article-link" href="#" target="_blank" style="display: inline-block; margin-top: 1rem; color: #4f9da6; text-decoration: none;">🔗 阅读全文</a>
                <div class="meaning" id="article-meaning"></div>
                <div class="stats" id="article-stats"></div>
            </div>

            <!-- 虚构抽屉卡片 -->
            <div class="card" id="novel-card" style="display: none;">
                <h2>📚 虚构抽屉</h2>
                <div id="novels-container" class="novels-container"></div>
            </div>
        </div>
        <div class="footer">
            <div id="update-time"></div>
            <div id="today-in-history"></div>
            <a href="/history.html" style="color: #4f9da6; text-decoration: none; margin-top: 0.5rem; display: inline-block;">📜 查看历史时间轴</a>
        </div>
    </div>

    <div id="immerse-modal" class="immerse-modal">
        <button class="close-immerse" id="close-immerse">✕ 退出沉浸</button>
        <div id="immerse-content" class="immerse-content"></div>
    </div>

    <script>
        (function() {
            // ==================== 全局语音控制 ====================
            let currentUtterance = null;
            function stopSpeaking() {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                if (currentUtterance) {
                    currentUtterance = null;
                }
            }
            function speakText(text) {
                if (!window.speechSynthesis) {
                    alert("您的浏览器不支持语音朗读");
                    return;
                }
                stopSpeaking();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                currentUtterance = utterance;
                utterance.onend = () => { currentUtterance = null; };
                utterance.onerror = () => { currentUtterance = null; };
                window.speechSynthesis.speak(utterance);
            }

            // ==================== 沉浸模式 ====================
            const modal = document.getElementById('immerse-modal');
            const immerseContent = document.getElementById('immerse-content');
            const closeImmerse = document.getElementById('close-immerse');
            function openImmerse(htmlContent) {
                immerseContent.innerHTML = htmlContent;
                modal.classList.add('active');
            }
            closeImmerse.addEventListener('click', () => {
                modal.classList.remove('active');
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });

            // ==================== 今日份彩蛋 ====================
            function getEasterEgg() {
                const date = new Date();
                const seed = date.toDateString();
                const eggs = [
                    "✨ 今日彩蛋：再读一遍，或许会发现隐藏的温柔。",
                    "🍂 今日彩蛋：时光不语，静待花开。",
                    "📖 今日彩蛋：每一篇小说都是平行宇宙的你。",
                    "🎵 今日彩蛋：未知旋律里藏着昨天的故事。",
                    "💭 今日彩蛋：散落的诗行，是某人的心事。",
                    "🌟 今日彩蛋：你正在阅读的，是宇宙送给你的礼物。",
                    "🌙 今日彩蛋：此刻的宁静，胜过万语千言。",
                    "☕ 今日彩蛋：读一段文字，饮一杯暖茶。"
                ];
                let hash = 0;
                for (let i = 0; i < seed.length; i++) {
                    hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                    hash |= 0;
                }
                const index = Math.abs(hash) % eggs.length;
                return eggs[index];
            }

            // ==================== 历史上的今天 ====================
            const historyEvents = [
                "1883年3月21日，安徒生逝世。",
                "1955年3月21日，中国第一座大型水库——官厅水库建成。",
                "1990年3月21日，纳米比亚独立。",
                "1992年3月21日，中国正式加入《不扩散核武器条约》。",
                "2012年3月21日，著名作家莫言获得诺贝尔文学奖。",
                "1960年3月21日，南非沙佩维尔惨案发生，后成为“国际消除种族歧视日”。",
                "1985年3月21日，中国宣布实行夏令时。",
                "2006年3月21日，中国首个微博网站“微博客”上线。",
                "1927年3月21日，上海工人第三次武装起义胜利。",
                "2019年3月21日，中国科学家发现人类新基因。"
            ];
            function getTodayInHistory() {
                const date = new Date();
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const matched = historyEvents.filter(e => e.includes(`${month}月${day}日`));
                if (matched.length > 0) return matched[0];
                const randomIndex = (date.getDate() + date.getMonth() * 31) % historyEvents.length;
                return historyEvents[randomIndex];
            }

            // ==================== AI 一句话书评 ====================
            const aiReviews = [
                "📖 这篇小说像一杯温茶，慢慢品出人生滋味。",
                "🎭 虚构的世界里，藏着真实的情感。",
                "🌟 每一段文字都是时光的琥珀。",
                "💫 读完后，心里某个角落被轻轻触动。",
                "📜 故事虽短，余韵悠长。",
                "🌙 适合在夜深人静时再读一遍。",
                "🍃 像风一样轻，却留下痕迹。"
            ];
            function getRandomAIReview() {
                return aiReviews[Math.floor(Math.random() * aiReviews.length)];
            }

            // ==================== 随机渐变背景 ====================
            const gradients = [
                "linear-gradient(145deg, #f9f3e8 0%, #d9e2f0 100%)",
                "linear-gradient(135deg, #e8f0f5 0%, #d0e0e8 100%)",
                "linear-gradient(145deg, #f5efe9 0%, #e0d8cf 100%)",
                "linear-gradient(135deg, #fdf8ed 0%, #eae3d5 100%)",
                "linear-gradient(145deg, #f2e9e1 0%, #dcd3c6 100%)",
                "linear-gradient(135deg, #ebf0f5 0%, #cbdbe0 100%)"
            ];
            const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];
            document.body.style.background = randomGradient;

            // ==================== 暗色模式 ====================
            const themeToggle = document.getElementById('theme-toggle');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '☀️ 亮色模式';
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeToggle.innerHTML = isDark ? '☀️ 亮色模式' : '🌙 暗色模式';
            });

            // ==================== 回到顶部 ====================
            const goTopBtn = document.getElementById('go-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) goTopBtn.classList.add('visible');
                else goTopBtn.classList.remove('visible');
            });
            goTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            // ==================== 复制功能 ====================
            function copyToClipboard(text) {
                navigator.clipboard.writeText(text).then(() => {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                }).catch(() => alert('复制失败'));
            }

            // ==================== 生成图片功能 ====================
            function captureCard(element, filename = '拾光驿站.png') {
                if (!element) {
                    alert('无法截取内容');
                    return;
                }
                html2canvas(element, {
                    scale: 2,
                    backgroundColor: null,
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    console.error(err);
                    alert('生成图片失败，请重试');
                });
            }

            // ==================== 字数统计 ====================
            function countWords(text) {
                const chinese = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
                const english = (text.match(/[a-zA-Z]+/g) || []).length;
                return chinese + english;
            }
            function formatStats(words) {
                return `${words} 字 · 约 ${Math.ceil(words / 250)} 分钟阅读`;
            }

            // ==================== 渲染多篇小说 ====================
            function renderNovels(novels) {
                const container = document.getElementById('novels-container');
                container.innerHTML = '';
                if (!novels || novels.length === 0) {
                    container.innerHTML = '<p>暂无小说，请稍后再来。</p>';
                    return;
                }
                novels.forEach((novel, idx) => {
                    const novelDiv = document.createElement('div');
                    novelDiv.className = 'novel-item';
                    const title = novel.title || '无题';
                    let content = novel.content || '';

                    // 清理可能残留的 JSON 键名和转义字符
                    content = content.replace(/^\s*"content":\s*/, '');
                    content = content.replace(/"content":\s*/g, '');
                    content = content.replace(/\\n/g, '\n');
                    content = content.replace(/^["']|["']$/g, '');
                    
                    // 段落去重
                    let paragraphs = content.split(/\n\s*\n/);
                    const uniqueParagraphs = [];
                    for (let i = 0; i < paragraphs.length; i++) {
                        let p = paragraphs[i].trim();
                        if (p === '') continue;
                        if (uniqueParagraphs.length > 0 && uniqueParagraphs[uniqueParagraphs.length-1] === p) {
                            continue;
                        }
                        uniqueParagraphs.push(p);
                    }
                    const finalContent = uniqueParagraphs.join('\n\n');
                    
                    const wordCount = countWords(finalContent);
                    const stats = formatStats(wordCount);
                    
                    // 头部：标题 + 按钮组
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'novel-header';
                    headerDiv.innerHTML = `<div class="novel-title">${title}</div>`;
                    const btnGroup = document.createElement('div');
                    // 朗读按钮
                    const speakBtn = document.createElement('button');
                    speakBtn.className = 'speak-btn';
                    speakBtn.textContent = '🔊 朗读';
                    speakBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        speakText(finalContent);
                    });
                    // 沉浸按钮
                    const immerseBtn = document.createElement('button');
                    immerseBtn.className = 'immerse-btn';
                    immerseBtn.textContent = '🔍 沉浸';
                    immerseBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const html = `
                            <div class="novel-title" style="font-size:2rem; margin-bottom:1rem;">${title}</div>
                            <div class="novel-content">${finalContent.split(/\n\s*\n/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')}</div>
                            <div class="novel-stats">${stats}</div>
                        `;
                        openImmerse(html);
                    });
                    btnGroup.appendChild(speakBtn);
                    btnGroup.appendChild(immerseBtn);
                    headerDiv.appendChild(btnGroup);
                    novelDiv.appendChild(headerDiv);
                    
                    // 正文
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'novel-content';
                    const finalParagraphs = finalContent.split(/\n\s*\n/);
                    contentDiv.innerHTML = finalParagraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
                    novelDiv.appendChild(contentDiv);
                    
                    // 统计
                    const statsDiv = document.createElement('div');
                    statsDiv.className = 'novel-stats';
                    statsDiv.textContent = stats;
                    novelDiv.appendChild(statsDiv);
                    
                    // AI 一句话书评
                    const reviewDiv = document.createElement('div');
                    reviewDiv.className = 'ai-review';
                    reviewDiv.textContent = getRandomAIReview();
                    novelDiv.appendChild(reviewDiv);
                    
                    container.appendChild(novelDiv);
                });
            }

            // ==================== 加载数据（历史） ====================
            const urlParams = new URLSearchParams(window.location.search);
            const date = urlParams.get('date');
            if (!date) {
                document.getElementById('loader').style.display = 'none';
                document.body.innerHTML += '<p style="text-align:center; color:#bf6f5a;">未指定日期</p>';
                return;
            }
            const [year, month, day] = date.split('-');
            const dataUrl = `/data/history/${year}/${month}/${day}.json?t=${Date.now()}`;

            fetch(dataUrl)
                .then(res => {
                    if (!res.ok) throw new Error('文件不存在');
                    return res.json();
                })
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('date').textContent = date;
                    if (data.updated_at) {
                        document.getElementById('update-time').textContent = `更新于 ${new Date(data.updated_at).toLocaleString('zh-CN')}`;
                    }

                    // 每日总结
                    if (data.summary) {
                        document.getElementById('daily-summary').textContent = data.summary;
                    }

                    // 今日份彩蛋（基于当前日期）
                    document.getElementById('easter-egg').textContent = getEasterEgg();
                    // 历史上的今天
                    document.getElementById('today-in-history').innerHTML = `📜 历史上的今天：${getTodayInHistory()}`;

                    // 歌单展示
                    if (data.songs && data.songs.length > 0) {
                        document.getElementById('song-card').style.display = 'block';
                        const container = document.getElementById('songs-list');
                        container.innerHTML = '';
                        data.songs.forEach(song => {
                            const div = document.createElement('div');
                            div.className = 'song-item';
                            div.innerHTML = `
                                <div class="song-name">${song.name}</div>
                                <div class="song-artist">${song.artist}</div>
                                <div class="song-album">${song.album || '未知专辑'}</div>
                                <div class="song-recommendation">${song.recommendation || '暂无推荐语'}</div>
                            `;
                            container.appendChild(div);
                        });
                    } else if (data.song) {
                        // 兼容旧版单曲数据
                        document.getElementById('song-card').style.display = 'block';
                        const container = document.getElementById('songs-list');
                        container.innerHTML = '';
                        const div = document.createElement('div');
                        div.className = 'song-item';
                        div.innerHTML = `
                            <div class="song-name">${data.song.name}</div>
                            <div class="song-artist">${data.song.artist}</div>
                            <div class="song-album">${data.song.album || '未知专辑'}</div>
                            <div class="song-recommendation">${data.song.comment?.content || '暂无推荐语'}</div>
                        `;
                        container.appendChild(div);
                    }

                    // 散落诗行
                    if (data.sentence) {
                        document.getElementById('sentence-card').style.display = 'block';
                        const sentenceText = data.sentence.content || '';
                        document.getElementById('sentence-content').textContent = sentenceText;
                        document.getElementById('sentence-from').textContent = data.sentence.from ? `—— ${data.sentence.from}` : '';
                        if (data.sentence.meaning) {
                            document.getElementById('sentence-meaning').textContent = data.sentence.meaning;
                            document.getElementById('sentence-meaning').style.display = 'block';
                        }
                        const copyBtn = document.getElementById('copy-sentence-btn');
                        copyBtn.onclick = () => copyToClipboard(sentenceText);
                        const shareBtn = document.getElementById('share-sentence-btn');
                        const cardElement = document.getElementById('sentence-card');
                        shareBtn.onclick = () => captureCard(cardElement, `拾光驿站_${date}.png`);
                    }

                    // 墨香盲盒
                    if (data.article) {
                        document.getElementById('article-card').style.display = 'block';
                        document.getElementById('article-title').textContent = data.article.title || '';
                        let articleText = data.article.description || data.article.content || '';
                        document.getElementById('article-desc').textContent = articleText;
                        document.getElementById('article-author').textContent = data.article.author ? `—— ${data.article.author}` : '';
                        if (data.article.url) {
                            document.getElementById('article-link').href = data.article.url;
                        } else {
                            document.getElementById('article-link').style.display = 'none';
                        }
                        if (data.article.meaning) {
                            document.getElementById('article-meaning').textContent = data.article.meaning;
                            document.getElementById('article-meaning').style.display = 'block';
                        }
                        const articleWords = countWords(articleText);
                        document.getElementById('article-stats').textContent = formatStats(articleWords);
                    }

                    // 虚构抽屉（兼容新旧数据结构）
                    if (data.novels && Array.isArray(data.novels)) {
                        document.getElementById('novel-card').style.display = 'block';
                        renderNovels(data.novels);
                    } else if (data.novel) {
                        document.getElementById('novel-card').style.display = 'block';
                        renderNovels([data.novel]);
                    }

                    document.getElementById('content').style.display = 'block';
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loader').style.display = 'none';
                    document.body.innerHTML += '<p style="text-align:center; color:#bf6f5a;">加载失败，可能该日期无数据</p>';
                });
        })();
    </script>
</body>
</html>

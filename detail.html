<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日拾光 · 历史详情</title>
    <!-- 复用主页的样式 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=LXGW+WenKai&display=swap" rel="stylesheet">
    <style>
        /* 直接复制你主页的样式，确保完全一致 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(145deg, #f9f3e8 0%, #d9e2f0 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #2c3e50;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #4f9da6;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 20px 35px -8px rgba(0,20,30,0.15);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .card h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            border-left: 5px solid #4f9da6;
            padding-left: 0.5rem;
            color: #1e3c43;
        }
        .song-container {
            display: flex;
            gap: 1.8rem;
            align-items: center;
        }
        .song-cover {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            object-fit: cover;
        }
        .song-info h3 { font-size: 1.8rem; font-weight: 600; }
        .song-info .artist { font-size: 1.2rem; color: #4f5e6b; }
        .song-info .album { font-size: 1rem; color: #6b7c8b; }
        .song-comment {
            font-style: italic;
            color: #bf6f5a;
            background: rgba(255,235,220,0.7);
            padding: 0.8rem 1rem;
            border-radius: 20px;
            margin-top: 1rem;
        }
        .sentence-content {
            font-size: 1.7rem;
            font-family: "LXGW WenKai", cursive;
            text-align: center;
            margin-bottom: 0.8rem;
        }
        .sentence-from { text-align: right; color: #6f8a9c; }
        .article-title { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
        .article-desc { color: #2c3e50; line-height: 1.8; }
        .article-author { text-align: right; color: #6b7c8b; }
        .word { font-size: 4rem; font-weight: 600; color: #bf6f5a; text-align: center; }
        .word-desc { text-align: center; color: #4f5e6b; font-size: 1.3rem; }
        .meaning {
            display: none;
            margin-top: 1.5rem;
            background: rgba(225,240,250,0.7);
            padding: 1.2rem 1.5rem;
            border-radius: 24px;
            font-style: italic;
            color: #1e3c43;
            border-left: 4px solid #4f9da6;
        }
        .loader {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #4f9da6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 600px) {
            .song-container { flex-direction: column; text-align: center; }
            .song-cover { width: 150px; height: 150px; }
            .sentence-content { font-size: 1.4rem; }
            .word { font-size: 3.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/history.html" class="back-link">← 返回历史回顾</a>
        <div id="loader" class="loader"></div>
        <div id="content" style="display: none;">
            <!-- 每日一曲卡片 -->
            <div class="card" id="song-card" style="display: none;">
                <h2>🎵 每日一曲</h2>
                <div class="song-container">
                    <img class="song-cover" id="song-cover" src="" alt="封面" onerror="this.src='https://via.placeholder.com/300x300?text=🎵'">
                    <div class="song-info">
                        <h3 id="song-title"></h3>
                        <div class="artist" id="song-artist"></div>
                        <div class="album" id="song-album"></div>
                        <div class="song-comment" id="song-comment"></div>
                    </div>
                </div>
                <div class="meaning" id="song-meaning"></div>
            </div>
            <!-- 每日一句卡片 -->
            <div class="card" id="sentence-card" style="display: none;">
                <h2>💭 每日一句</h2>
                <div class="sentence-content" id="sentence-content"></div>
                <div class="sentence-from" id="sentence-from"></div>
                <div class="meaning" id="sentence-meaning"></div>
            </div>
            <!-- 每日一文卡片 -->
            <div class="card" id="article-card" style="display: none;">
                <h2>📖 每日一文</h2>
                <div class="article-title" id="article-title"></div>
                <div class="article-desc" id="article-desc"></div>
                <div class="article-author" id="article-author"></div>
                <div class="meaning" id="article-meaning"></div>
            </div>
            <!-- 每日一词卡片 -->
            <div class="card" id="word-card" style="display: none;">
                <h2>🔖 每日一词</h2>
                <div class="word" id="word"></div>
                <div class="word-desc" id="word-desc"></div>
                <div class="meaning" id="word-meaning"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // 获取 URL 参数中的日期
            const urlParams = new URLSearchParams(window.location.search);
            const date = urlParams.get('date');
            if (!date) {
                document.getElementById('loader').style.display = 'none';
                document.body.innerHTML += '<p style="text-align:center; color:#bf6f5a;">未指定日期，请返回历史回顾重新选择。</p>';
                return;
            }

            // 构建历史 JSON 文件路径，例如 /data/history/2026/03/19.json
            const [year, month, day] = date.split('-');
            const dataUrl = `/data/history/${year}/${month}/${day}.json?t=${Date.now()}`;

            fetch(dataUrl)
                .then(res => {
                    if (!res.ok) throw new Error('文件不存在');
                    return res.json();
                })
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('content').style.display = 'block';

                    // 以下渲染逻辑与主页完全一致
                    if (data.song) {
                        document.getElementById('song-card').style.display = 'block';
                        document.getElementById('song-cover').src = data.song.cover || 'https://via.placeholder.com/300x300?text=🎵';
                        document.getElementById('song-title').textContent = data.song.name || '';
                        document.getElementById('song-artist').textContent = data.song.artist ? `歌手 · ${data.song.artist}` : '';
                        document.getElementById('song-album').textContent = data.song.album ? `专辑 · ${data.song.album}` : '';
                        if (data.song.comment?.content) {
                            document.getElementById('song-comment').textContent = `“${data.song.comment.content}” —— ${data.song.comment.user || ''}`;
                        }
                        if (data.song.meaning) {
                            document.getElementById('song-meaning').textContent = data.song.meaning;
                            document.getElementById('song-meaning').style.display = 'block';
                        }
                    }
                    if (data.sentence) {
                        document.getElementById('sentence-card').style.display = 'block';
                        document.getElementById('sentence-content').textContent = data.sentence.content || '';
                        document.getElementById('sentence-from').textContent = data.sentence.from ? `—— ${data.sentence.from}` : '';
                        if (data.sentence.meaning) {
                            document.getElementById('sentence-meaning').textContent = data.sentence.meaning;
                            document.getElementById('sentence-meaning').style.display = 'block';
                        }
                    }
                    if (data.article) {
                        document.getElementById('article-card').style.display = 'block';
                        document.getElementById('article-title').textContent = data.article.title || '';
                        document.getElementById('article-desc').textContent = data.article.description || '';
                        document.getElementById('article-author').textContent = data.article.author ? `—— ${data.article.author}` : '';
                        if (data.article.meaning) {
                            document.getElementById('article-meaning').textContent = data.article.meaning;
                            document.getElementById('article-meaning').style.display = 'block';
                        }
                    }
                    if (data.word) {
                        document.getElementById('word-card').style.display = 'block';
                        document.getElementById('word').textContent = data.word.word || '';
                        document.getElementById('word-desc').textContent = data.word.description || '';
                        if (data.word.meaning) {
                            document.getElementById('word-meaning').textContent = data.word.meaning;
                            document.getElementById('word-meaning').style.display = 'block';
                        }
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loader').style.display = 'none';
                    document.body.innerHTML += '<p style="text-align:center; color:#bf6f5a;">加载失败，可能该日期无数据。</p>';
                });
        })();
    </script>
</body>
</html>

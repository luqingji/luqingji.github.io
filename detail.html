<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾光驿站 · 历史详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=LXGW+WenKai&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* 样式与主页完全一致，此处省略（实际应包含完整样式） */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(145deg, #f9f3e8 0%, #d9e2f0 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #2c3e50;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            color: #e0e0e0;
        }
        body.dark-mode .card {
            background: rgba(30,40,50,0.85);
            border-color: rgba(255,255,255,0.1);
            color: #e0e0e0;
        }
        body.dark-mode .card h2 { color: #b0c4de; border-left-color: #4f9da6; }
        body.dark-mode .song-comment { background: rgba(100,80,70,0.5); color: #f0b27a; }
        body.dark-mode .sentence-content { color: #f0f0f0; }
        body.dark-mode .sentence-from { color: #a0b0c0; }
        body.dark-mode .article-title, body.dark-mode .novel-title { color: #d0e0f0; }
        body.dark-mode .article-desc, body.dark-mode .novel-content { color: #ccc; }
        body.dark-mode .meaning { background: rgba(50,70,90,0.7); color: #e0e0e0; border-left-color: #4f9da6; }
        body.dark-mode .stats { color: #9aaebf; border-top-color: rgba(255,255,255,0.1); }
        body.dark-mode .back-link { color: #4f9da6; }
        body.dark-mode .theme-toggle { background: rgba(0,0,0,0.5); color: #eee; }
        body.dark-mode .speak-btn { background: rgba(255,255,255,0.2); color: #ddd; border-color: rgba(255,255,255,0.3); }
        body.dark-mode .speak-btn:hover { background: rgba(255,255,255,0.3); }

        .container { max-width: 750px; margin: 0 auto; position: relative; }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #4f9da6;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 20px 35px -8px rgba(0,20,30,0.15);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .card h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            border-left: 5px solid #4f9da6;
            padding-left: 0.5rem;
            color: #1e3c43;
        }
        .song-container {
            display: flex;
            gap: 1.8rem;
            align-items: center;
        }
        .song-cover {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            object-fit: cover;
        }
        .song-info h3 { font-size: 1.8rem; font-weight: 600; }
        .song-info .artist { font-size: 1.2rem; color: #4f5e6b; }
        .song-info .album { font-size: 1rem; color: #6b7c8b; }
        .song-comment {
            font-style: italic;
            color: #bf6f5a;
            background: rgba(255,235,220,0.7);
            padding: 0.8rem 1rem;
            border-radius: 20px;
            margin-top: 1rem;
        }
        .sentence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .sentence-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            transition: background 0.2s;
            color: inherit;
        }
        .action-btn:hover {
            background: rgba(0,0,0,0.1);
        }
        body.dark-mode .action-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .sentence-content {
            font-size: 1.7rem;
            font-family: "LXGW WenKai", cursive;
            text-align: center;
            margin-bottom: 0.8rem;
        }
        .sentence-from { text-align: right; color: #6f8a9c; font-size: 1.1rem; }
        .article-title { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
        .article-desc { color: #2c3e50; line-height: 1.8; }
        .article-author { text-align: right; color: #6b7c8b; }

        .novels-container {
            margin-top: 1rem;
        }
        .novel-item {
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 1.5rem;
        }
        .novel-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .novel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .novel-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e3c43;
            border-left: 4px solid #bf6f5a;
            padding-left: 1rem;
            margin: 0;
        }
        .speak-btn {
            background: rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 30px;
            padding: 0.3rem 0.8rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: inherit;
        }
        .speak-btn:hover {
            background: rgba(0,0,0,0.2);
            transform: scale(0.98);
        }
        .novel-content {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #2c3e50;
            text-align: justify;
        }
        .novel-content p {
            margin-bottom: 1.2em;
            text-indent: 2em;
        }
        .novel-content p:last-child {
            margin-bottom: 0;
        }
        .novel-stats {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: right;
        }
        body.dark-mode .novel-stats {
            color: #9aaebf;
        }
        body.dark-mode .novel-item {
            border-bottom-color: rgba(255,255,255,0.1);
        }

        .stats {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: right;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 0.8rem;
        }
        .meaning {
            display: none;
            margin-top: 1.5rem;
            background: rgba(225,240,250,0.7);
            padding: 1.2rem 1.5rem;
            border-radius: 24px;
            font-style: italic;
            color: #1e3c43;
            border-left: 4px solid #4f9da6;
        }
        .loader {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #4f9da6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .go-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
            color: white;
            font-size: 1.5rem;
            border: none;
        }
        .go-top.visible { opacity: 1; }
        .go-top:hover { background: rgba(0,0,0,0.7); }
        body.dark-mode .go-top { background: rgba(255,255,255,0.2); color: #ccc; }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.8); }

        @media (max-width: 600px) {
            .song-container { flex-direction: column; text-align: center; }
            .song-cover { width: 150px; height: 150px; }
            .sentence-content { font-size: 1.4rem; }
            .novel-title { font-size: 1.6rem; }
            .novel-content { font-size: 1rem; }
            .theme-toggle { top: 10px; right: 10px; padding: 5px 12px; font-size: 0.8rem; }
            .speak-btn { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle">🌙 暗色模式</button>
    <div class="go-top" id="go-top">↑</div>
    <div class="toast" id="toast">已复制</div>

    <div class="container">
        <a href="/history.html" class="back-link">← 返回历史回顾</a>
        <div id="loader" class="loader"></div>
        <div id="content" style="display: none;">
            <!-- 未知旋律 -->
            <div class="card" id="song-card" style="display: none;">
                <h2>🎵 未知旋律</h2>
                <div class="song-container">
                    <img class="song-cover" id="song-cover" src="" alt="封面" onerror="this.src='https://via.placeholder.com/300x300?text=🎵'">
                    <div class="song-info">
                        <h3 id="song-title"></h3>
                        <div class="artist" id="song-artist"></div>
                        <div class="album" id="song-album"></div>
                        <div class="song-comment" id="song-comment"></div>
                    </div>
                </div>
                <div class="meaning" id="song-meaning"></div>
            </div>
            <!-- 散落诗行 -->
            <div class="card" id="sentence-card" style="display: none;">
                <div class="sentence-header">
                    <h2>💭 散落诗行</h2>
                    <div class="sentence-actions">
                        <button class="action-btn" id="copy-sentence-btn" title="复制句子">📋</button>
                        <button class="action-btn" id="share-sentence-btn" title="生成图片">📸</button>
                    </div>
                </div>
                <div class="sentence-content" id="sentence-content"></div>
                <div class="sentence-from" id="sentence-from"></div>
                <div class="meaning" id="sentence-meaning"></div>
            </div>
            <!-- 墨香盲盒 -->
            <div class="card" id="article-card" style="display: none;">
                <h2>📖 墨香盲盒</h2>
                <div class="article-title" id="article-title"></div>
                <div class="article-desc" id="article-desc"></div>
                <div class="article-author" id="article-author"></div>
                <a id="article-link" href="#" target="_blank" style="display: inline-block; margin-top: 1rem; color: #4f9da6; text-decoration: none;">🔗 阅读全文</a>
                <div class="meaning" id="article-meaning"></div>
                <div class="stats" id="article-stats"></div>
            </div>
            <!-- 虚构抽屉（多篇小说，支持朗读） -->
            <div class="card" id="novel-card" style="display: none;">
                <h2>📚 虚构抽屉</h2>
                <div id="novels-container" class="novels-container"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // 全局语音控制
            let currentUtterance = null;
            function stopSpeaking() {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                if (currentUtterance) {
                    currentUtterance = null;
                }
            }
            function speakText(text) {
                if (!window.speechSynthesis) {
                    alert("您的浏览器不支持语音朗读");
                    return;
                }
                stopSpeaking();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                currentUtterance = utterance;
                utterance.onend = () => { currentUtterance = null; };
                utterance.onerror = () => { currentUtterance = null; };
                window.speechSynthesis.speak(utterance);
            }

            // 随机背景
            const gradients = [
                "linear-gradient(145deg, #f9f3e8 0%, #d9e2f0 100%)",
                "linear-gradient(135deg, #e8f0f5 0%, #d0e0e8 100%)",
                "linear-gradient(145deg, #f5efe9 0%, #e0d8cf 100%)",
                "linear-gradient(135deg, #fdf8ed 0%, #eae3d5 100%)",
                "linear-gradient(145deg, #f2e9e1 0%, #dcd3c6 100%)",
                "linear-gradient(135deg, #ebf0f5 0%, #cbdbe0 100%)"
            ];
            document.body.style.background = gradients[Math.floor(Math.random() * gradients.length)];

            // 暗色模式
            const themeToggle = document.getElementById('theme-toggle');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '☀️ 亮色模式';
            }
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeToggle.innerHTML = isDark ? '☀️ 亮色模式' : '🌙 暗色模式';
            });

            // 回到顶部
            const goTopBtn = document.getElementById('go-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) goTopBtn.classList.add('visible');
                else goTopBtn.classList.remove('visible');
            });
            goTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            // 复制功能
            function copyToClipboard(text) {
                navigator.clipboard.writeText(text).then(() => {
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                }).catch(() => alert('复制失败'));
            }

            // 生成图片功能
            function captureCard(element, filename = '拾光驿站.png') {
                if (!element) {
                    alert('无法截取内容');
                    return;
                }
                html2canvas(element, {
                    scale: 2,
                    backgroundColor: null,
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    console.error(err);
                    alert('生成图片失败，请重试');
                });
            }

            // 字数统计
            function countWords(text) {
                const chinese = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
                const english = (text.match(/[a-zA-Z]+/g) || []).length;
                return chinese + english;
            }
            function formatStats(words) {
                return `${words} 字 · 约 ${Math.ceil(words / 250)} 分钟阅读`;
            }

            // 渲染多篇小说（增加朗读按钮）
            function renderNovels(novels) {
                const container = document.getElementById('novels-container');
                container.innerHTML = '';
                if (!novels || novels.length === 0) {
                    container.innerHTML = '<p>暂无小说，请稍后再来。</p>';
                    return;
                }
                novels.forEach((novel, idx) => {
                    const novelDiv = document.createElement('div');
                    novelDiv.className = 'novel-item';
                    const title = novel.title || '无题';
                    const content = novel.content || '';
                    const wordCount = countWords(content);
                    const stats = formatStats(wordCount);
                    const speakBtn = document.createElement('button');
                    speakBtn.className = 'speak-btn';
                    speakBtn.textContent = '🔊 朗读';
                    speakBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        speakText(content);
                    });
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'novel-header';
                    headerDiv.innerHTML = `<div class="novel-title">${title}</div>`;
                    headerDiv.appendChild(speakBtn);
                    novelDiv.appendChild(headerDiv);
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'novel-content';
                    const paragraphs = content.split(/\n\s*\n/);
                    contentDiv.innerHTML = paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
                    novelDiv.appendChild(contentDiv);
                    const statsDiv = document.createElement('div');
                    statsDiv.className = 'novel-stats';
                    statsDiv.textContent = stats;
                    novelDiv.appendChild(statsDiv);
                    container.appendChild(novelDiv);
                });
            }

            // 获取日期参数并加载数据
            const urlParams = new URLSearchParams(window.location.search);
            const date = urlParams.get('date');
            if (!date) {
                document.getElementById('loader').style.display = 'none';
                document.body.innerHTML += '<p style="text-align:center; color:#bf6f5a;">未指定日期</p>';
                return;
            }
            const [y, m, d] = date.split('-');
            const dataUrl = `/data/history/${y}/${m}/${d}.json?t=${Date.now()}`;

            fetch(dataUrl)
                .then(res => {
                    if (!res.ok) throw new Error('文件不存在');
                    return res.json();
                })
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('content').style.display = 'block';

                    if (data.song) {
                        document.getElementById('song-card').style.display = 'block';
                        document.getElementById('song-cover').src = data.song.cover || 'https://via.placeholder.com/300x300?text=🎵';
                        document.getElementById('song-title').textContent = data.song.name || '';
                        document.getElementById('song-artist').textContent = data.song.artist ? `歌手 · ${data.song.artist}` : '';
                        document.getElementById('song-album').textContent = data.song.album ? `专辑 · ${data.song.album}` : '';
                        if (data.song.comment?.content) {
                            document.getElementById('song-comment').textContent = `“${data.song.comment.content}” —— ${data.song.comment.user || ''}`;
                        }
                        if (data.song.meaning) {
                            document.getElementById('song-meaning').textContent = data.song.meaning;
                            document.getElementById('song-meaning').style.display = 'block';
                        }
                    }
                    if (data.sentence) {
                        document.getElementById('sentence-card').style.display = 'block';
                        const sentenceText = data.sentence.content || '';
                        document.getElementById('sentence-content').textContent = sentenceText;
                        document.getElementById('sentence-from').textContent = data.sentence.from ? `—— ${data.sentence.from}` : '';
                        if (data.sentence.meaning) {
                            document.getElementById('sentence-meaning').textContent = data.sentence.meaning;
                            document.getElementById('sentence-meaning').style.display = 'block';
                        }
                        const copyBtn = document.getElementById('copy-sentence-btn');
                        copyBtn.onclick = () => copyToClipboard(sentenceText);
                        const shareBtn = document.getElementById('share-sentence-btn');
                        const cardElement = document.getElementById('sentence-card');
                        shareBtn.onclick = () => captureCard(cardElement, `拾光驿站_${date}.png`);
                    }
                    if (data.article) {
                        document.getElementById('article-card').style.display = 'block';
                        document.getElementById('article-title').textContent = data.article.title || '';
                        let articleText = data.article.description || data.article.content || '';
                        document.getElementById('article-desc').textContent = articleText;
                        document.getElementById('article-author').textContent = data.article.author ? `—— ${data.article.author}` : '';
                        if (data.article.url) {
                            document.getElementById('article-link').href = data.article.url;
                        } else {
                            document.getElementById('article-link').style.display = 'none';
                        }
                        if (data.article.meaning) {
                            document.getElementById('article-meaning').textContent = data.article.meaning;
                            document.getElementById('article-meaning').style.display = 'block';
                        }
                        document.getElementById('article-stats').textContent = formatStats(countWords(articleText));
                    }
                    if (data.novels && Array.isArray(data.novels)) {
                        document.getElementById('novel-card').style.display = 'block';
                        renderNovels(data.novels);
                    } else if (data.novel) {
                        document.getElementById('novel-card').style.display = 'block';
                        renderNovels([data.novel]);
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loader').style.display = 'none';
                    document.body.innerHTML += '<p style="text-align:center; color:#bf6f5a;">加载失败，可能该日期无数据</p>';
                });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 · 隅</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f6f8fa;
            background-image: radial-gradient(circle at 10% 20%, rgba(30, 30, 47, 0.03) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #1e1e2f;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        h1 span {
            background: linear-gradient(135deg, #e67e22, #f1c40f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* 卡片风格 */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
        }

        /* 表单元素 */
        input, textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            background: #fafbfc;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #1e1e2f;
            box-shadow: 0 0 0 3px rgba(30, 30, 47, 0.1);
            background: #ffffff;
        }
        textarea { resize: vertical; min-height: 80px; }
        button {
            width: 100%;
            padding: 0.8rem;
            background: #1e1e2f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        button:hover { 
            transform: scale(1.02); 
            background: #2d2d45;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: scale(1); }

        /* 登录/注册切换 */
        .toggle-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.8rem;
            color: #64748b;
            font-size: 0.9rem;
        }
        .toggle-row a {
            color: #1e1e2f;
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .toggle-row a:hover { color: #3b3b5c; }
        .hidden { display: none !important; }
        #authError { color: #e53e3e; font-size: 0.9rem; margin-top: 0.5rem; text-align: center; }

        /* 消息列表 */
        #msgList { position: relative; }
        .msg-item {
            padding: 1rem 0;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .msg-item:last-child { border-bottom: none; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .msg-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .msg-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .msg-name {
            font-weight: 600;
            color: #1e1e2f;
            font-size: 0.95rem;
        }
        .msg-time {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .msg-content {
            color: #334155;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .msg-actions {
            display: flex;
            gap: 0.5rem;
        }
        .admin-badge {
            background: #fbbf24;
            color: #1e1e2f;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 20px;
            font-weight: 600;
        }
        .delete-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #fee2e2;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            width: auto;
            cursor: pointer;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background: #fee2e2;
            transform: scale(1.05);
        }

        /* 空状态 & 加载 */
        .empty-state { text-align: center; color: #94a3b8; padding: 2rem 0; }
        .empty-state span { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

        /* 退出 & 欢迎 */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        #welcomeMsg { font-weight: 500; color: #1e1e2f; }
        #logoutBtn {
            width: auto;
            padding: 0.4rem 1.2rem;
            background: #e2e8f0;
            color: #1e1e2f;
            font-size: 0.85rem;
        }
        #logoutBtn:hover { background: #cbd5e1; }

        /* 忘记密码链接 */
        .forgot-link {
            display: block;
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #64748b;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .forgot-link:hover { color: #1e1e2f; }

        @media (max-width: 480px) {
            .card { padding: 1.2rem; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💬 隅 · <span>留言板</span></h1>

    <!-- ===== 登录/注册卡片 ===== -->
    <div id="authBox" class="card">
        <h2 id="formTitle" style="font-weight:400; margin-bottom:1.2rem;">登录</h2>
        <form id="authForm">
            <input type="email" id="email" placeholder="邮箱" required>
            <input type="password" id="password" placeholder="密码（至少6位）" required>
            <div id="nameField" class="hidden">
                <input type="text" id="userName" placeholder="你的昵称（必填）" required>
            </div>
            <a id="forgotLink" class="forgot-link">忘记密码？</a>
            <button type="submit" id="authBtn">登录</button>
            <div id="authError"></div>
        </form>
        <div class="toggle-row">
            <span id="toggleText">没有账号？</span>
            <a id="toggleLink">去注册</a>
        </div>
    </div>

    <!-- ===== 留言板应用 ===== -->
    <div id="appBox" class="hidden">
        <div class="header-actions">
            <span id="welcomeMsg">👋 你好</span>
            <button id="logoutBtn">退出</button>
        </div>

        <div class="card">
            <form id="guestForm">
                <textarea id="msgContent" rows="2" placeholder="写下你想说的话…" required></textarea>
                <button type="submit">📨 发送留言</button>
            </form>
        </div>

        <div class="card" id="msgListContainer">
            <div id="msgList">
                <div class="empty-state"><span>📭</span> 暂无留言，抢个沙发吧</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== 1. 初始化 Supabase ====================
    const SUPABASE_URL = 'https://gjcxcexgendndemnuole.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gAX7qZRxBDgsos4usm6Y4g_qdC3KZQ0';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==================== 2. DOM 引用 ====================
    const authBox = document.getElementById('authBox');
    const appBox = document.getElementById('appBox');
    const authForm = document.getElementById('authForm');
    const authBtn = document.getElementById('authBtn');
    const formTitle = document.getElementById('formTitle');
    const toggleLink = document.getElementById('toggleLink');
    const toggleText = document.getElementById('toggleText');
    const nameField = document.getElementById('nameField');
    const userNameInput = document.getElementById('userName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authError = document.getElementById('authError');
    const msgList = document.getElementById('msgList');
    const welcomeMsg = document.getElementById('welcomeMsg');
    const logoutBtn = document.getElementById('logoutBtn');
    const guestForm = document.getElementById('guestForm');
    const msgContent = document.getElementById('msgContent');
    const forgotLink = document.getElementById('forgotLink');

    let isLoginMode = true;
    const adminEmail = 'yesluki@qq.com';  // ⚠️ 务必改成你的管理员邮箱

    // ==================== 3. 切换登录/注册 ====================
    toggleLink.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            formTitle.textContent = '登录';
            toggleText.textContent = '没有账号？';
            toggleLink.textContent = '去注册';
            nameField.classList.add('hidden');
            userNameInput.required = false;
            authBtn.textContent = '登录';
        } else {
            formTitle.textContent = '注册';
            toggleText.textContent = '已有账号？';
            toggleLink.textContent = '去登录';
            nameField.classList.remove('hidden');
            userNameInput.required = true;
            authBtn.textContent = '注册';
        }
        authError.textContent = '';
    });

    // ==================== 4. 忘记密码 ====================
    forgotLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) {
            alert('请先在邮箱输入框中填写你的邮箱地址');
            return;
        }
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/guestbook.html',
        });
        if (error) {
            alert('发送失败：' + error.message);
        } else {
            alert('✅ 重置密码邮件已发送，请检查邮箱（注意垃圾箱）');
        }
    });

    // ==================== 5. 登录 / 注册（加加载状态） ====================
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authError.textContent = '';
        authBtn.disabled = true;
        authBtn.textContent = '⏳ 处理中...';

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const name = userNameInput.value.trim();

        try {
            if (isLoginMode) {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
            } else {
                if (!name) throw new Error('请填写昵称');
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: { data: { name } }
                });
                if (error) throw error;
                if (!data.user?.identities?.length) {
                    authError.textContent = '请检查邮箱进行验证，验证后重新登录';
                    authBtn.disabled = false;
                    authBtn.textContent = isLoginMode ? '登录' : '注册';
                    return;
                }
            }
        } catch (err) {
            authError.textContent = err.message || '操作失败，请重试';
        } finally {
            authBtn.disabled = false;
            authBtn.textContent = isLoginMode ? '登录' : '注册';
        }
    });

    // ==================== 6. 监听登录状态（优化版） ====================
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
            // 已登录
            authBox.classList.add('hidden');
            appBox.classList.remove('hidden');
            const user = session.user;
            const name = user.user_metadata?.name || user.email;
            welcomeMsg.textContent = `👋 你好，${name}`;
            if (user.email === adminEmail) {
                welcomeMsg.innerHTML += ' <span class="admin-badge">⭐ 管理员</span>';
            }
            // 加载留言（同时传递当前用户邮箱用于判断管理员）
            loadMessages(user.email);
        } else {
            // 未登录
            authBox.classList.remove('hidden');
            appBox.classList.add('hidden');
            msgList.innerHTML = `<div class="empty-state"><span>📭</span> 暂无留言</div>`;
        }
    });

    // ==================== 7. 退出 ====================
    logoutBtn.addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
    });

    // ==================== 8. 渲染单条留言 ====================
    function renderMsg(msg, currentUserEmail) {
        const div = document.createElement('div');
        div.className = 'msg-item';
        const time = new Date(msg.created_at).toLocaleString('zh-CN', { hour12: false });
        const isAdmin = msg.email === adminEmail;

        let deleteBtnHtml = '';
        // 如果当前登录用户是管理员，显示删除按钮
        if (currentUserEmail === adminEmail) {
            deleteBtnHtml = `<button class="delete-btn" data-id="${msg.id}">🗑️ 删除</button>`;
        }

        div.innerHTML = `
            <div class="msg-header">
                <div class="msg-user">
                    <span class="msg-name">${escapeHtml(msg.user_name)}</span>
                    ${isAdmin ? '<span class="admin-badge">⭐</span>' : ''}
                </div>
                <div class="msg-actions">
                    <span class="msg-time">${time}</span>
                </div>
            </div>
            <div class="msg-content">${escapeHtml(msg.content)}</div>
            <div class="msg-actions" style="justify-content:flex-end; margin-top:0.3rem;">
                ${deleteBtnHtml}
            </div>
        `;

        // 绑定删除事件（如果有删除按钮）
        if (deleteBtnHtml) {
            const delBtn = div.querySelector('.delete-btn');
            delBtn.addEventListener('click', () => {
                if (confirm('确定要删除这条留言吗？')) {
                    deleteMessage(msg.id);
                }
            });
        }
        return div;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ==================== 9. 加载留言（传入当前用户邮箱） ====================
    async function loadMessages(currentUserEmail = null) {
        msgList.innerHTML = `<div class="empty-state"><span>⏳</span> 加载中...</div>`;
        const { data, error } = await supabaseClient
            .from('guestbook')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            msgList.innerHTML = `<div class="empty-state" style="color:red;">加载失败：${error.message}</div>`;
            return;
        }

        msgList.innerHTML = '';
        if (data.length === 0) {
            msgList.innerHTML = `<div class="empty-state"><span>📭</span> 还没有留言，快来抢沙发吧！</div>`;
            return;
        }

        // 如果没有传入邮箱，尝试从 session 获取（保险）
        if (!currentUserEmail) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            currentUserEmail = session?.user?.email || null;
        }

        data.forEach(msg => {
            const msgEl = renderMsg(msg, currentUserEmail);
            msgList.appendChild(msgEl);
        });
    }

    async function deleteMessage(id) {
        const { error } = await supabaseClient.from('guestbook').delete().eq('id', id);
        if (error) {
            alert('删除失败：' + error.message);
        } else {
            const btn = document.querySelector(`.delete-btn[data-id="${id}"]`);
            if (btn) btn.closest('.msg-item').remove();
        }
    }

    // ==================== 10. 提交留言（防重复锁 + 提交后刷新页面） ====================
    let isSubmitting = false;
    guestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;

        const content = msgContent.value.trim();
        if (!content) {
            alert('留言内容不能为空');
            return;
        }

        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) {
            alert('请先登录');
            return;
        }

        const name = user.user_metadata?.name || user.email;
        const btn = guestForm.querySelector('button');

        isSubmitting = true;
        btn.disabled = true;
        msgContent.disabled = true;
        btn.textContent = '⏳ 发送中...';

        const { error } = await supabaseClient.from('guestbook').insert({
            user_id: user.id,
            user_name: name,
            email: user.email,
            content: content
        });

        // 无论成功失败，都解锁（但成功后要刷新）
        isSubmitting = false;
        btn.disabled = false;
        msgContent.disabled = false;
        btn.textContent = '📨 发送留言';

        if (error) {
            alert('发送失败：' + error.message);
        } else {
            // ✅ 发送成功，刷新页面，让所有用户看到新留言
            window.location.reload();
        }
    });

    // ==================== 11. 实时订阅（作为辅助，但刷新后会重新加载） ====================
    supabaseClient
        .channel('guestbook-public')
        .on('postgres_changes', 
            { event: 'INSERT', schema: 'public', table: 'guestbook' },
            (payload) => {
                // 如果页面没有被刷新，这个回调依然会触发，但我们可以忽略或处理
                // 这里保留以兼容实时更新，但用户主要依靠刷新，所以可以保留
                const empty = msgList.querySelector('.empty-state');
                if (empty) empty.remove();

                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    const currentUserEmail = session?.user?.email || null;
                    const msgEl = renderMsg(payload.new, currentUserEmail);
                    msgList.prepend(msgEl);
                });
            }
        )
        .subscribe();

    // ==================== 12. 初始检查 ====================
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) {
            authBox.classList.add('hidden');
            appBox.classList.remove('hidden');
            const user = session.user;
            const name = user.user_metadata?.name || user.email;
            welcomeMsg.textContent = `👋 你好，${name}`;
            if (user.email === adminEmail) {
                welcomeMsg.innerHTML += ' <span class="admin-badge">⭐ 管理员</span>';
            }
            loadMessages(user.email);
        }
    });
</script>
</body>
</html>

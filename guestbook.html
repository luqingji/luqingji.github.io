<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 留言板 - 隅 · 安静角落 · 此心安处</title>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        :root {
            --bg: #f5f0eb;
            --card-bg: #ffffff;
            --text: #3d3929;
            --text-secondary: #7a7365;
            --accent: #c0844e;
            --accent-hover: #a06b3a;
            --border: #e5ded5;
            --shadow-sm: 0 1px 3px rgba(61, 57, 41, 0.06);
            --shadow-md: 0 4px 16px rgba(61, 57, 41, 0.1);
            --shadow-lg: 0 12px 40px rgba(61, 57, 41, 0.12);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-serif: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', 'KaiTi', serif;
            --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(192, 132, 78, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 90%, rgba(192, 132, 78, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(180, 160, 130, 0.03) 0%, transparent 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px 60px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* 主容器 */
        .guestbook-wrapper {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* 头部 */
        .guestbook-header {
            text-align: center;
            padding: 10px 0 6px;
            position: relative;
        }

        /* 返回主页按钮 */
        .btn-home {
            position: absolute;
            left: 0;
            top: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--border);
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: 0.02em;
            backdrop-filter: blur(4px);
        }

        .btn-home:hover {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.95);
            border-color: #d4b896;
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }

        .btn-home .home-icon {
            font-size: 1.1rem;
        }

        .guestbook-header .icon-row {
            font-size: 42px;
            margin-bottom: 6px;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .guestbook-header h1 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #4a3f32;
            margin: 0;
            line-height: 1.3;
        }

        .guestbook-header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 0.02em;
        }

        .guestbook-header .divider {
            width: 50px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin: 12px auto 0;
            opacity: 0.6;
        }

        /* 留言表单卡片 */
        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 26px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4a373, #c0844e, #b0783a);
            border-radius: 3px 3px 0 0;
            opacity: 0.7;
        }

        .form-card:focus-within {
            box-shadow: var(--shadow-lg);
            border-color: #d4b896;
        }

        .form-card .form-title {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: #4a3f32;
            letter-spacing: 0.02em;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
            transition: var(--transition);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: var(--font-sans);
            background: #fdfcf9;
            color: var(--text);
            transition: var(--transition);
            resize: vertical;
            outline: none;
            line-height: 1.5;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(192, 132, 78, 0.08);
            background: #fff;
        }

        .form-group textarea {
            min-height: 100px;
            max-height: 260px;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .char-count {
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .char-count.warn {
            color: #c97a3b;
            font-weight: 500;
        }

        .btn-submit {
            padding: 11px 26px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font-sans);
            box-shadow: 0 2px 8px rgba(192, 132, 78, 0.3);
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(192, 132, 78, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: scale(0.97);
            transition: 0.1s;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 留言列表 */
        .messages-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .messages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .messages-header .count {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .messages-header .count strong {
            color: var(--accent);
            font-weight: 700;
        }

        .btn-clear-all {
            font-size: 0.78rem;
            color: #b0a090;
            background: none;
            border: none;
            cursor: pointer;
            letter-spacing: 0.02em;
            padding: 4px 10px;
            border-radius: 20px;
            transition: var(--transition);
            font-family: var(--font-sans);
        }

        .btn-clear-all:hover {
            color: #c0392b;
            background: rgba(192, 57, 43, 0.06);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px dashed var(--border);
            color: var(--text-secondary);
            letter-spacing: 0.03em;
        }

        .empty-state .empty-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .empty-state p {
            font-size: 0.95rem;
            margin: 0;
        }

        /* 单条留言卡片 */
        .message-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            position: relative;
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        .message-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #d4b896;
            transform: translateY(-2px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-card .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message-card .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .message-card .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
            letter-spacing: 0.03em;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .message-card .author-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #4a3f32;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-card .msg-time {
            font-size: 0.75rem;
            color: #b0a590;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .message-card .msg-body {
            font-size: 0.93rem;
            line-height: 1.7;
            color: #4d4637;
            padding: 4px 0 2px;
            word-break: break-word;
            letter-spacing: 0.02em;
        }

        .message-card .msg-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: flex-end;
        }

        .btn-reply,
        .btn-delete {
            font-size: 0.78rem;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fdfcf9;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.02em;
            font-family: var(--font-sans);
            color: var(--text-secondary);
        }

        .btn-reply:hover {
            background: #f5efe5;
            border-color: #c4b89e;
            color: #4a3f32;
        }

        .btn-delete {
            color: #c0a8a0;
        }

        .btn-delete:hover {
            background: #fef5f3;
            border-color: #e0c0b8;
            color: #c0392b;
        }

        /* 回复区域（内嵌在留言卡片中） */
        .reply-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            display: none;
        }

        .reply-section.open {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        .reply-section textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: var(--font-sans);
            background: #fdfcf9;
            color: var(--text);
            resize: vertical;
            min-height: 56px;
            max-height: 120px;
            outline: none;
            transition: var(--transition);
            line-height: 1.5;
        }

        .reply-section textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(192, 132, 78, 0.06);
        }

        .reply-section .reply-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }

        .btn-reply-submit {
            padding: 7px 18px;
            background: #8b9e7b;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: var(--transition);
            font-family: var(--font-sans);
            font-weight: 500;
        }

        .btn-reply-submit:hover {
            background: #6f825f;
            box-shadow: 0 2px 8px rgba(107, 130, 95, 0.3);
        }

        .btn-reply-cancel {
            padding: 7px 16px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
            transition: var(--transition);
            font-family: var(--font-sans);
        }

        .btn-reply-cancel:hover {
            background: #f5f0eb;
        }

        .reply-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reply-item {
            background: #faf7f2;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.84rem;
            line-height: 1.55;
            color: #5a5245;
            position: relative;
            letter-spacing: 0.02em;
            animation: fadeInUp 0.25s ease;
        }

        .reply-item .reply-author {
            font-weight: 600;
            color: #8b9e7b;
            font-size: 0.78rem;
            margin-bottom: 2px;
        }

        .reply-item .reply-time {
            font-size: 0.7rem;
            color: #b0a590;
            float: right;
        }

        .reply-item .reply-delete {
            font-size: 0.68rem;
            color: #c0a8a0;
            cursor: pointer;
            background: none;
            border: none;
            margin-left: 8px;
            transition: var(--transition);
            font-family: var(--font-sans);
        }

        .reply-item .reply-delete:hover {
            color: #c0392b;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #3d3929;
            color: #f5f0eb;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.88rem;
            letter-spacing: 0.03em;
            z-index: 999;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            font-family: var(--font-sans);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #5a7d5a;
        }

        .toast.warning {
            background: #c97a3b;
        }

        /* 响应式 */
        @media (max-width: 500px) {
            .guestbook-wrapper {
                gap: 20px;
            }
            .guestbook-header h1 {
                font-size: 1.5rem;
            }
            .form-card {
                padding: 18px 16px;
                border-radius: var(--radius);
            }
            .message-card {
                padding: 14px 15px;
            }
            .message-card .avatar {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
            }
            .btn-submit {
                padding: 10px 20px;
                font-size: 0.88rem;
            }
            .form-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .form-footer .btn-submit {
                width: 100%;
                text-align: center;
            }
            .char-count {
                text-align: right;
            }
            /* 移动端返回按钮位置调整 */
            .btn-home {
                position: static;
                margin-bottom: 12px;
                justify-content: center;
                width: fit-content;
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>
<body>

    <div class="guestbook-wrapper">
        <!-- 头部 -->
        <div class="guestbook-header">
            <!-- 返回主页按钮 -->
            <a href="https://luqingji.github.io/" class="btn-home" title="返回主页">
                <span class="home-icon">🏠</span> 返回主页
            </a>
            <span class="icon-row">📝</span>
            <h1>留言板</h1>
            <p class="subtitle">留下足迹，说点什么吧 ✨</p>
            <div class="divider"></div>
        </div>

        <!-- 留言表单 -->
        <div class="form-card">
            <div class="form-title">💭 写下你的留言</div>
            <form id="messageForm" autocomplete="off">
                <div class="form-group">
                    <label for="nickname">昵称</label>
                    <input type="text" id="nickname" placeholder="请输入你的昵称..." maxlength="20" required>
                </div>
                <div class="form-group">
                    <label for="content">留言内容</label>
                    <textarea id="content" placeholder="在这里写下你想说的话..." maxlength="500" required></textarea>
                </div>
                <div class="form-footer">
                    <span class="char-count" id="charCount">0 / 500</span>
                    <button type="submit" class="btn-submit" id="submitBtn">
                        ✉️ 发布留言
                    </button>
                </div>
            </form>
        </div>

        <!-- 留言列表 -->
        <div class="messages-section" id="messagesSection">
            <div class="messages-header">
                <span class="count" id="messageCount">共 <strong>0</strong> 条留言</span>
                <button class="btn-clear-all" id="btnClearAll" title="清空所有留言">
                    🗑️ 清空全部
                </button>
            </div>
            <div id="messagesContainer">
                <!-- 动态渲染留言 -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ========== 配置 Supabase（已填入您的项目信息） ==========
            const SUPABASE_URL = 'https://siwacsnuminepetpxljh.supabase.co';
            const SUPABASE_ANON_KEY =
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpd2Fjc251bWluZXBldHB4bGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTcyMDAsImV4cCI6MjA5NDIzMzIwMH0.U4hMYHQiQr_LDLNbIR4yePDiJSIB1GNMb08InDasR9s';

            // 初始化 Supabase 客户端
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // ========== DOM 元素 ==========
            const form = document.getElementById('messageForm');
            const nicknameInput = document.getElementById('nickname');
            const contentInput = document.getElementById('content');
            const charCountEl = document.getElementById('charCount');
            const submitBtn = document.getElementById('submitBtn');
            const messagesContainer = document.getElementById('messagesContainer');
            const messageCountEl = document.getElementById('messageCount');
            const btnClearAll = document.getElementById('btnClearAll');
            const toastEl = document.getElementById('toast');
            const emptyStateHTML = `
                <div class="empty-state">
                    <span class="empty-icon">📭</span>
                    <p>还没有留言，来做第一个留言的人吧！</p>
                </div>
            `;

            // ========== 工具函数 ==========
            function getAvatarColor(str) {
                const palette = [
                    '#d4a373', '#c0844e', '#b08968', '#a98467',
                    '#8b9e7b', '#7a9e7e', '#6b8f71', '#5a7d5a',
                    '#c08b7c', '#b8786e', '#d4958a', '#e0a899',
                    '#9b8ec4', '#8b7db8', '#a094c9', '#b5a8d4',
                    '#7ba4b8', '#6b93a8', '#8aafc4', '#9dbccf',
                    '#c49b6c', '#b8895a', '#d4aa7c', '#e0bc90',
                ];
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = str.charCodeAt(i) + ((hash << 5) - hash);
                    hash = hash & hash;
                }
                return palette[Math.abs(hash) % palette.length];
            }

            function formatTime(isoString) {
                const date = new Date(isoString);
                const now = new Date();
                const diffMs = now - date;
                const diffMin = Math.floor(diffMs / 60000);
                const diffHour = Math.floor(diffMs / 3600000);
                const diffDay = Math.floor(diffMs / 86400000);

                if (diffMin < 1) return '刚刚';
                if (diffMin < 60) return `${diffMin} 分钟前`;
                if (diffHour < 24) return `${diffHour} 小时前`;
                if (diffDay < 7) return `${diffDay} 天前`;

                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                const hh = String(date.getHours()).padStart(2, '0');
                const mm = String(date.getMinutes()).padStart(2, '0');
                return `${y}-${m}-${d} ${hh}:${mm}`;
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ========== Toast 提示 ==========
            let toastTimer;

            function showToast(msg, type = '') {
                clearTimeout(toastTimer);
                toastEl.textContent = msg;
                toastEl.className = 'toast ' + type + ' show';
                toastTimer = setTimeout(() => {
                    toastEl.className = 'toast';
                }, 2200);
            }

            // ========== 从 Supabase 加载留言（含回复） ==========
            async function loadMessages() {
                try {
                    // 查询所有留言，按创建时间降序
                    const { data: messagesData, error: msgError } = await supabase
                        .from('messages')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (msgError) throw msgError;

                    // 查询所有回复
                    const { data: repliesData, error: repError } = await supabase
                        .from('replies')
                        .select('*')
                        .order('created_at', { ascending: true });

                    if (repError) throw repError;

                    // 将回复按 message_id 分组
                    const repliesMap = {};
                    if (repliesData) {
                        repliesData.forEach(rep => {
                            if (!repliesMap[rep.message_id]) repliesMap[rep.message_id] = [];
                            repliesMap[rep.message_id].push(rep);
                        });
                    }

                    // 组装成前端使用的数据结构
                    const messages = messagesData.map(msg => ({
                        ...msg,
                        replies: repliesMap[msg.id] || []
                    }));

                    renderMessages(messages);
                } catch (error) {
                    console.error('加载留言失败:', error);
                    showToast('加载留言失败，请检查网络', 'warning');
                    messagesContainer.innerHTML =
                        '<div class="empty-state"><span class="empty-icon">⚠️</span><p>无法连接数据库，请稍后再试</p></div>';
                }
            }

            // ========== 渲染留言列表 ==========
            function renderMessages(messages) {
                if (!messages || messages.length === 0) {
                    messagesContainer.innerHTML = emptyStateHTML;
                    messageCountEl.innerHTML = '共 <strong>0</strong> 条留言';
                    btnClearAll.style.display = 'none';
                } else {
                    messageCountEl.innerHTML = `共 <strong>${messages.length}</strong> 条留言`;
                    btnClearAll.style.display = 'inline-block';
                    messagesContainer.innerHTML = messages.map((msg, index) => {
                        const replyCount = msg.replies.length;
                        const replyHTML = msg.replies.map(reply => `
                            <div class="reply-item" data-reply-id="${reply.id}">
                                <span class="reply-author" style="color:${getAvatarColor(reply.nickname || '匿')}">
                                    ${escapeHTML(reply.nickname || '匿名')}
                                </span>
                                <span class="reply-time">${formatTime(reply.created_at)}</span>
                                <button class="reply-delete" data-reply-id="${reply.id}" data-msg-id="${msg.id}" title="删除回复">×</button>
                                <div style="clear:both;"></div>
                                <div>${escapeHTML(reply.content)}</div>
                            </div>
                        `).join('');

                        return `
                            <div class="message-card" style="animation-delay:${index * 0.03}s" data-msg-id="${msg.id}">
                                <div class="msg-header">
                                    <div class="author-info">
                                        <div class="avatar" style="background:${getAvatarColor(msg.nickname || '匿')}">
                                            ${escapeHTML((msg.nickname || '匿')[0])}
                                        </div>
                                        <span class="author-name">${escapeHTML(msg.nickname || '匿名')}</span>
                                    </div>
                                    <span class="msg-time">${formatTime(msg.created_at)}</span>
                                </div>
                                <div class="msg-body">${escapeHTML(msg.content)}</div>
                                <div class="msg-actions">
                                    <button class="btn-reply" data-msg-id="${msg.id}">
                                        💬 回复${replyCount > 0 ? ` (${replyCount})` : ''}
                                    </button>
                                    <button class="btn-delete" data-msg-id="${msg.id}">🗑️ 删除</button>
                                </div>
                                <div class="reply-section" id="replySection-${msg.id}">
                                    <div class="reply-list" id="replyList-${msg.id}">${replyHTML}</div>
                                    <textarea placeholder="写下回复..." id="replyInput-${msg.id}" maxlength="300" rows="2"></textarea>
                                    <div class="reply-actions">
                                        <button class="btn-reply-cancel" data-msg-id="${msg.id}">取消</button>
                                        <button class="btn-reply-submit" data-msg-id="${msg.id}">回复</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // 绑定事件
                bindMessageEvents();
                updateCharCount();
            }

            // ========== 发布新留言 ==========
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const nickname = nicknameInput.value.trim();
                const content = contentInput.value.trim();

                if (!nickname || !content) {
                    showToast('请填写昵称和内容', 'warning');
                    return;
                }
                if (nickname.length > 20 || content.length > 500) {
                    showToast('昵称或内容超长', 'warning');
                    return;
                }

                try {
                    const { error } = await supabase
                        .from('messages')
                        .insert([{ nickname, content }]);

                    if (error) throw error;

                    contentInput.value = '';
                    updateCharCount();
                    // 重新加载所有留言
                    await loadMessages();
                    showToast('留言发布成功！', 'success');

                    // 记住昵称（仍用 localStorage）
                    localStorage.setItem('guestbook_nickname', nickname);

                    // 滚动到最新留言
                    setTimeout(() => {
                        const firstCard = messagesContainer.querySelector('.message-card');
                        if (firstCard) {
                            firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 200);
                } catch (error) {
                    console.error('发布留言失败:', error);
                    showToast('发布失败，请重试', 'warning');
                }
            });

            // ========== 发布回复 ==========
            async function submitReply(messageId, content) {
                try {
                    const { error } = await supabase
                        .from('replies')
                        .insert([{
                            message_id: messageId,
                            nickname: '博主回复', // 可自行修改
                            content: content
                        }]);

                    if (error) throw error;

                    // 重新加载留言数据，然后自动展开对应回复区
                    await loadMessages();
                    setTimeout(() => {
                        const section = document.getElementById('replySection-' + messageId);
                        if (section) section.classList.add('open');
                    }, 200);
                    showToast('回复成功！', 'success');
                } catch (error) {
                    console.error('回复失败:', error);
                    showToast('回复失败，请重试', 'warning');
                }
            }

            // ========== 删除留言 ==========
            async function deleteMessage(messageId) {
                if (!confirm('确定要删除这条留言吗？此操作不可恢复。')) return;
                try {
                    // 先删除关联的回复（如果外键未设置级联删除）
                    const { error: repError } = await supabase
                        .from('replies')
                        .delete()
                        .eq('message_id', messageId);
                    if (repError) throw repError;

                    const { error: msgError } = await supabase
                        .from('messages')
                        .delete()
                        .eq('id', messageId);
                    if (msgError) throw msgError;

                    await loadMessages();
                    showToast('留言已删除', '');
                } catch (error) {
                    console.error('删除失败:', error);
                    showToast('删除失败，请重试', 'warning');
                }
            }

            // ========== 删除回复 ==========
            async function deleteReply(replyId, messageId) {
                if (!confirm('确定要删除这条回复吗？')) return;
                try {
                    const { error } = await supabase
                        .from('replies')
                        .delete()
                        .eq('id', replyId);
                    if (error) throw error;

                    await loadMessages();
                    // 保持回复区域展开
                    setTimeout(() => {
                        const section = document.getElementById('replySection-' + messageId);
                        if (section) section.classList.add('open');
                    }, 200);
                    showToast('回复已删除', '');
                } catch (error) {
                    console.error('删除回复失败:', error);
                    showToast('删除失败，请重试', 'warning');
                }
            }

            // ========== 清空全部留言 ==========
            btnClearAll.addEventListener('click', async function() {
                if (!confirm('确定要清空全部留言吗？此操作不可恢复！')) return;
                try {
                    // 先删除所有回复，再删除所有留言
                    await supabase.from('replies').delete().neq('id', 0);
                    await supabase.from('messages').delete().neq('id', 0);
                    await loadMessages();
                    showToast('所有留言已清空', '');
                } catch (error) {
                    console.error('清空失败:', error);
                    showToast('清空失败，请重试', 'warning');
                }
            });

            // ========== 绑定事件（按钮等） ==========
            function bindMessageEvents() {
                // 回复按钮：切换展开
                document.querySelectorAll('.btn-reply').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const msgId = this.getAttribute('data-msg-id');
                        const section = document.getElementById('replySection-' + msgId);
                        if (section) {
                            section.classList.toggle('open');
                            if (section.classList.contains('open')) {
                                const input = document.getElementById('replyInput-' + msgId);
                                if (input) setTimeout(() => input.focus(), 150);
                            }
                        }
                    });
                });

                // 取消回复按钮
                document.querySelectorAll('.btn-reply-cancel').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const msgId = this.getAttribute('data-msg-id');
                        const section = document.getElementById('replySection-' + msgId);
                        if (section) {
                            section.classList.remove('open');
                            const input = document.getElementById('replyInput-' + msgId);
                            if (input) input.value = '';
                        }
                    });
                });

                // 提交回复按钮
                document.querySelectorAll('.btn-reply-submit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const msgId = this.getAttribute('data-msg-id');
                        const input = document.getElementById('replyInput-' + msgId);
                        const content = input.value.trim();
                        if (!content) {
                            showToast('请输入回复内容', 'warning');
                            return;
                        }
                        submitReply(msgId, content);
                        input.value = '';
                    });
                });

                // 删除留言按钮
                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const msgId = this.getAttribute('data-msg-id');
                        deleteMessage(msgId);
                    });
                });

                // 删除回复按钮
                document.querySelectorAll('.reply-delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const replyId = this.getAttribute('data-reply-id');
                        const msgId = this.getAttribute('data-msg-id');
                        deleteReply(replyId, msgId);
                    });
                });
            }

            // ========== 字符计数 ==========
            function updateCharCount() {
                const len = contentInput.value.length;
                const max = 500;
                charCountEl.textContent = `${len} / ${max}`;
                if (len >= max * 0.9) {
                    charCountEl.classList.add('warn');
                } else {
                    charCountEl.classList.remove('warn');
                }
            }
            contentInput.addEventListener('input', updateCharCount);

            // ========== 昵称记忆（仍用 localStorage） ==========
            const savedNickname = localStorage.getItem('guestbook_nickname');
            if (savedNickname) {
                nicknameInput.value = savedNickname;
            }
            nicknameInput.addEventListener('change', function() {
                const val = nicknameInput.value.trim();
                if (val) {
                    localStorage.setItem('guestbook_nickname', val);
                }
            });

            // ========== 初始加载 ==========
            updateCharCount();
            loadMessages();

            console.log('💬 留言板已就绪 | 数据存储于 Supabase');
        })();
    </script>
</body>
</html>

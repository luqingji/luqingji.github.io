<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾光驿站 · 今日歌单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=LXGW+WenKai&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(145deg, #f9f3e8 0%, #d9e2f0 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #2c3e50;
        }
        body.dark-mode {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            color: #e0e0e0;
        }
        body.dark-mode .song-card {
            background: rgba(30,40,50,0.85);
            border-color: rgba(255,255,255,0.1);
            color: #e0e0e0;
        }
        body.dark-mode .song-card .artist,
        body.dark-mode .song-card .album {
            color: #aaa;
        }
        body.dark-mode .recommendation {
            background: rgba(100,80,70,0.5);
            color: #f0b27a;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #4f9da6;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        h1 {
            font-family: "LXGW WenKai", cursive;
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #1e2f3f;
        }
        body.dark-mode h1 {
            color: #d0e0f0;
        }
        .song-card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .song-card h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: #1e3c43;
        }
        body.dark-mode .song-card h3 {
            color: #d0e0f0;
        }
        .artist {
            font-size: 1rem;
            color: #4f5e6b;
            margin-bottom: 0.2rem;
        }
        .album {
            font-size: 0.9rem;
            color: #6b7c8b;
            margin-bottom: 0.8rem;
        }
        .recommendation {
            font-style: italic;
            color: #bf6f5a;
            background: rgba(255,235,220,0.5);
            padding: 0.5rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .loader {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #4f9da6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            .song-card h3 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← 返回主页</a>
        <h1>🎵 今日歌单</h1>
        <div id="loader" class="loader"></div>
        <div id="songs-container" style="display: none;"></div>
    </div>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const date = urlParams.get('date');
            let dataUrl = '/data/daily.json';
            if (date) {
                const [y, m, d] = date.split('-');
                dataUrl = `/data/history/${y}/${m}/${d}.json`;
            }
            fetch(dataUrl + '?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    const container = document.getElementById('songs-container');
                    container.style.display = 'block';
                    let songs = data.songs;
                    // 兼容旧数据：如果 songs 不存在但有 song，则包装成数组
                    if (!songs && data.song) {
                        songs = [data.song];
                    }
                    if (!songs || songs.length === 0) {
                        container.innerHTML = '<p>暂无歌单数据</p>';
                        return;
                    }
                    songs.forEach(song => {
                        const card = document.createElement('div');
                        card.className = 'song-card';
                        card.innerHTML = `
                            <h3>${song.name}</h3>
                            <div class="artist">${song.artist}</div>
                            <div class="album">${song.album || '未知专辑'}</div>
                            <div class="recommendation">${song.recommendation || '暂无推荐语'}</div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('songs-container').innerHTML = '<p style="color:#bf6f5a;">加载失败</p>';
                });
        })();
    </script>
</body>
</html>
